 stretch is the first four to six weeks, and knowing that in advance changes what a bad week means.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>46%<\/b><span>of the deciders had succeeded. Among those who merely wanted it, 4%.<\/span><\/div><div class=\"bx-body\"><p><strong>Deciding is different from wanting.<\/strong> Researchers followed one group who made an explicit commitment to change, and another group who wanted exactly the same change but never formalised it. Six months later: <strong>46% of the deciders had succeeded. Among those who merely wanted it, 4%.<\/strong><sup class=\"fn\">³<\/sup><\/p><\/div><\/aside><p>More than a tenfold difference — between choosing something and hoping for it.<\/p><p><strong>And say what you’ll do, not what you’ll stop.<\/strong> People whose goals were framed as <em>adding<\/em> something — eat more vegetables, walk each morning — succeeded <strong class=\"num\">59%<\/strong> of the time. People whose goals were framed as <em>stopping<\/em> something succeeded <strong class=\"num\">47%<\/strong>.<sup class=\"fn\">⁴<\/sup> Twelve points, from wording alone.<\/p>"}, {"t": "Finding your roots", "g": "", "k": "", "w": 172, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Before choosing anything, work out where your own loop is strongest.<\/p><\/aside><p>Before choosing anything, work out where your own loop is strongest. Sit with these:<\/p><div class=\"points\"><div class=\"point\"><h4>Your history.<\/h4><p>Do the patterns in Chapter 3 sound like your childhood — becoming small, becoming useful, needing nothing? Do you recognise yourself in shutdown more than in anxiety?<\/p><\/div><div class=\"point\"><h4>Your gut.<\/h4><p>Digestive trouble, bloating, food that doesn’t sit right? Do certain foods reliably precede a bad mental day?<\/p><\/div><div class=\"point\"><h4>Your labs and hormones.<\/h4><p>Have you actually been tested properly — full thyroid panel, B12 with functional markers, vitamin D, ferritin with an inflammatory marker? Do your symptoms track with your cycle, or did they arrive in your forties?<\/p><\/div><div class=\"point\"><h4>Your blood sugar.<\/h4><p>Do you get anxious, shaky, or irrationally irritable a few hours after eating? Does it lift when you eat?<\/p><\/div><div class=\"point\"><h4>Your sleep.<\/h4><p>Are you getting genuine deep sleep, or six broken hours you’ve stopped questioning?<\/p><\/div><div class=\"point\"><h4>Your connection.<\/h4><p>How many people actually know how you’re doing? When did you last do something with other people that you enjoyed?<\/p><\/div><\/div><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Whichever two or three of those produced the strongest reaction — that’s where your work is. Go back to those chapters. Ignore the rest for now.<\/p><\/div><\/aside>"}, {"t": "An order that works", "g": "", "k": "", "w": 173, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>The sequence matters more than most people are told, and it’s the reason so many attempts stall.<\/p><\/aside><p>The sequence matters more than most people are told, and it’s the reason so many attempts stall.<\/p><div class=\"points\"><div class=\"point\"><h4>Start with your nervous system.<\/h4><p>Not because it’s the deepest issue, but because a system stuck in survival can’t sustain anything else. It’s hard to change how you eat, keep a new routine, or face old memories while your body believes it’s in danger. One regulation practice, daily, small — that’s the foundation everything else rests on.<\/p><\/div><div class=\"point\"><h4>Then the physical basics.<\/h4><p>Sleep and blood sugar first, because they’re fast and they change how everything else feels. Then food. Then movement, at whatever size you can actually repeat.<\/p><\/div><div class=\"point\"><h4>Then the deeper work.<\/h4><p>Trauma, old patterns, the beliefs underneath. This comes later on purpose — it goes better from a steadier baseline, and attempting it while completely dysregulated is how people get flooded and stop.<\/p><\/div><\/div><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>And connection and meaning run through all of it.<\/strong> Not a final step. The thing that makes the rest survivable.<\/p><\/div><\/aside><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>If that still feels like too much: pick one thing from the first section. Do it for two weeks. Add nothing.<\/p><\/div><\/aside>"}, {"t": "You’ll do better with someone", "g": "", "k": "", "w": 296, "h": "<p>There’s a finding here worth taking seriously, and it isn’t the one that sells programmes.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>155 trials<\/b><span>compared how people did across every format of psychological support<\/span><\/div><div class=\"bx-body\"><p>Researchers compared how people did across every format of psychological support — one-to-one, group, telephone, and guided self-help — across 155 trials and roughly eleven thousand people. <strong>There was no meaningful difference between them.<\/strong> What separated all of those from going it entirely alone wasn’t the format. It was the presence of another human being.<sup class=\"fn\">⁵<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>It’s to make sure someone is in it with you.<\/p><\/aside><p>Doing this by yourself still works. Self-directed change produces real, measurable effects — just consistently smaller ones.<sup class=\"fn\">⁶<\/sup> But the honest recommendation isn’t to buy the most expensive help available. It’s to make sure someone is in it with you.<\/p><figure class=\"ph\" data-slot=\"ch12-l06\"><\/figure><p>There are three reasons that helps, and only one of them is accountability.<\/p><p>The first is straightforward: someone expecting you to show up changes what you do. Even a single monthly check-in raised year-end success rates in one study.<sup class=\"fn\">⁴<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>The second is physiological, and we covered it in the last chapter. Your nervous system reads other people for safety. Doing this alongside someone calm is not just encouragement — it’s regulation.<\/p><\/div><\/aside><p>The third is the one nobody names. Working this out by yourself is genuinely hard. Deciding what to try, in what order, tracking whether it’s helping, second-guessing every result — that’s a real cognitive load, and it falls hardest on the person with the least capacity to carry it. Having someone say <em>start here, we’ll look at that in six weeks<\/em> removes a weight that has nothing to do with willpower.<\/p><p>That someone might be a friend doing it alongside you, a group, a good practitioner, or one person who checks in on Sundays. It matters far less than you’d think.<\/p>"}, {"t": "What healing actually looks like", "g": "", "k": "", "w": 207, "h": "<p>It won’t feel like the movie version.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The trend is what matters, and trends are only visible looking backwards — which is a good reason to write down where you’re starting from.<\/p><\/aside><p>It isn’t linear. You’ll have a good fortnight and then a bad week, and the bad week will feel like proof that nothing worked. It won’t be. The trend is what matters, and trends are only visible looking backwards — which is a good reason to write down where you’re starting from.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>It’s rarely dramatic. Almost nobody wakes up transformed. What actually happens is quieter: something knocks you sideways and you notice you recovered in two days instead of two weeks. Your window widened while you weren’t watching.<\/p><\/div><\/aside><p>And it takes longer than you want. Your nervous system spent years learning that the world isn’t safe, and it doesn’t unlearn that in a fortnight of deep breathing.<\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img class=\"bx-av\" alt=\"\"><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>Two years ago I was still in it. Today I love my life. I still have pain and fatigue and patterns I’m working on — I’m not cured, and I’m not going to pretend otherwise. But the distance between that woman gripping the steering wheel and the one writing this is not small, and it wasn’t one miraculous thing. It was a great many small things, done imperfectly, for a long time.<\/p><\/div><\/aside>"}, {"t": "When to get help now", "g": "", "k": "", "w": 141, "h": "<p>Some things shouldn’t wait for a plan.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>If you’re having thoughts of ending your life, tell someone today — a doctor, a crisis line, someone who loves you. That is not a failure of this approach; it’s an emergency, and it deserves emergency care.<\/p><\/div><\/aside><p>If you can’t function — not struggling, but genuinely unable to work or care for yourself or your children — you need more support than a book.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>If you’re on medication and want to change anything about it, that’s a conversation with your prescriber, never a decision you make alone.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>It usually means there’s a root you haven’t found yet, and finding it may need someone with testing and training.<\/p><\/aside><p>And if you’ve worked steadily at this for a few months with nothing shifting, that’s not a verdict on you. It usually means there’s a root you haven’t found yet, and finding it may need someone with testing and training.<\/p>"}, {"t": "The last thing", "g": "", "k": "", "w": 188, "h": "<p>You picked up this book because something was wrong and nobody could tell you what.<\/p><p>You now know that your exhaustion has a mechanism. That anxiety and shutdown are the same system doing the same job. That your gut, your hormones, your blood sugar, your history, and your loneliness are all feeding into how your mind feels. That the standard answers failed a great many people, and that wasn’t your fault either.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Most of all, I hope you know this: <strong>you were never broken.<\/strong><\/p><\/div><\/aside><p>You were shaped — by what happened to you, by what you had to become to belong, by a body doing its best with what it was given. Every symptom you’ve been carrying was your system protecting you as well as it knew how.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>And what was learned can be unlearned.<\/p><\/aside><p>That protection served its purpose. And what was learned can be unlearned. What was shaped can be reshaped. Your brain will keep changing for the rest of your life, in whichever direction you keep walking.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You do not have to earn your way back. You just have to start — small, imperfectly, and preferably not alone.<\/p><\/div><\/aside><p class=\"closing\">From survival, to safety.<\/p>"}, {"t": "The research", "g": "", "k": "refs", "w": 396, "h": "<ul class='refs'><li>Lally, P., van Jaarsveld, C. H. M., Potts, H. W. W., &amp; Wardle, J. (2010). How are habits formed: modelling habit formation in the real world. <em>European Journal of Social Psychology, 40<\/em>(6), 998–1009. <em>(96 participants forming new daily behaviours; median 66 days to reach automaticity, range 18–254 days. Missing a single day reduced automaticity by less than half a point, with rapid recovery. Roughly half of participants had not reached automaticity by day 84.)<\/em> See also Singh, B., et al. (2024), systematic review of 20 studies and 2,601 participants, finding durable habits typically consolidate over two to five months.<\/li><li>Norcross, J. C., &amp; Vangarelli, D. J. (1988–89), and subsequent follow-up work summarised in Oscarsson et al. (2020). <em>(Maintenance rates: 77% at one week, 55% at one month, 43% at three months, 40% at six months, 19% at two years.)<\/em><\/li><li>Norcross, J. C., Mrykalo, M. S., &amp; Blagys, M. D. (2002). Auld lang syne: success predictors, change processes, and self-reported outcomes of New Year’s resolvers and nonresolvers. <em>Journal of Clinical Psychology, 58<\/em>(4), 397–405. <em>(At six months, 46% success among those who made an explicit commitment versus 4% among comparable people who wanted the same change without formalising it.)<\/em><\/li><li>Oscarsson, M., Carlbring, P., Andersson, G., &amp; Rozental, A. (2020). A large-scale experiment on New Year’s resolutions: approach-oriented goals are more successful than avoidance-oriented goals. <em>PLOS ONE, 15<\/em>(12), e0234097. <em>(N = 1,066. Approach-oriented goals 58.9% success at one year versus 47.1% for avoidance-oriented. Participants receiving some support outperformed both unsupported and extensively supported groups; a monthly check-in raised year-end success from 56% to 62%.)<\/em><\/li><li>Cuijpers, P., Noma, H., Karyotaki, E., Cipriani, A., &amp; Furukawa, T. A. (2019). Effectiveness and acceptability of cognitive behavior therapy delivery formats in adults with depression: a network meta-analysis. <em>JAMA Psychiatry, 76<\/em>(7), 700–707. <em>(155 trials, approximately 11,000 participants; no significant differences between individual, group, telephone-delivered, and guided self-help formats.)<\/em><\/li><li>Cuijpers, P., Donker, T., Johansson, R., Mohr, D. C., van Straten, A., &amp; Andersson, G. (2011). Self-guided psychological treatment for depressive symptoms: a meta-analysis. <em>PLOS ONE, 6<\/em>(6), e21274. <em>(Overall effect size d = 0.28 for self-guided treatment versus control — small but genuine.)<\/em> See also Karyotaki, E., et al. (2017, 2021), finding unguided interventions effective but consistently less so than guided ones.<\/li><\/ul>"}]}, {"n": 15, "t": "Why It Still Feels Like Now", "s": "Trauma, the many forms it takes, and how it is actually treated", "p": 3, "l": [{"t": "Opening", "g": "", "k": "", "w": 88, "h": "<p>You may have worked through the last two chapters and got partway.<\/p><p>Some of it helped. The blood sugar, the sleep, the walking. You even tried the harder things — you went where you’d been avoiding, you found out the prediction was wrong, and it worked, for that one situation. But something underneath didn’t move. There’s a floor you keep hitting, and no amount of good habits gets you below it.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>If that’s you, the target may not have been anxiety or depression at all.<\/p><\/aside><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>If that’s you, the target may not have been anxiety or depression at all.<\/p><\/div><\/aside>"}, {"t": "The same root, three different jobs", "g": "", "k": "", "w": 271, "h": "<p>Here’s something that should have been said earlier in this book and gets said now.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Anxiety, depression and trauma are not three separate illnesses that happen to co-occur. They grow from the same root — a nervous system that concluded, at some point, that the world is not safe and never fully updated. What differs is the job each one is doing.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>Anxiety points forward.<\/h4><p>It predicts a threat that hasn’t happened. The work, as Chapter 14 described, is finding out the prediction is wrong.<\/p><\/div><div class=\"point\"><h4>Trauma points backward.<\/h4><p>It replays a threat that already happened as though it were happening now. There’s nothing to predict — it’s already true, somewhere in your system.<\/p><\/div><\/div><p><strong>Depression’s shut-down face is often what comes next<\/strong>, when the alarm has run so long, with so little relief, that the system finally powers down. Chapter 13’s freeze state and this chapter’s material are frequently the same story at different stages.<\/p><p>So, before you read any further: <strong>treatments designed for trauma also improve depression and anxiety.<\/strong> That isn’t a side effect. Meta-analyses of trauma-focused therapies consistently find reductions not only in trauma symptoms but in depression, anxiety and dissociation alongside.<sup class=\"fn\">¹<\/sup> EMDR trials show the same pattern — meaningful drops in depression and anxiety scores, not just trauma scores.<sup class=\"fn\">²<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Because for a large number of people who don’t respond to the standard approaches, this is the piece nobody checked.<\/p><\/aside><p>So if you’ve treated the anxiety and treated the low mood and there’s still a floor you can’t get under, this chapter is where to look. Not because everything is trauma. Because for a large number of people who don’t respond to the standard approaches, this is the piece nobody checked.<\/p>"}, {"t": "It isn’t a memory problem. It’s a filing problem.", "g": "", "k": "", "w": 195, "h": "<p>Here’s what makes trauma different from a bad memory.<\/p><p>When something overwhelming happens, the part of your brain that timestamps and contextualises experience — that files it as <em>this happened, then, there, and it ended<\/em> — largely stops working, while the alarm system runs at full volume. So the experience gets stored without its labels. Raw. Undated.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Which means it doesn’t come back the way memories come back.<\/p><\/aside><p>Which means it doesn’t come back the way memories come back. It comes back as <strong>now<\/strong>.<\/p><p>That single fact explains almost everything you’ve been unable to explain to anyone:<\/p><p>Why a smell or a tone of voice can drop you straight into it. Why your body reacts before you’ve consciously thought anything. Why knowing intellectually that it’s over changes precisely nothing. And why “that was a long time ago” is the most useless sentence anyone has ever said to you — because the past tense is exactly the part that’s missing.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You’re not failing to move on. The file never got the date on it.<\/p><\/div><\/aside><p>And that’s also why the treatments that work don’t work by talking about what happened. They work by getting the memory open and getting it filed properly.<\/p>"}, {"t": "It doesn’t have to have been one terrible day", "g": "", "k": "", "w": 493, "h": "<p>Most people read the word “trauma” and picture a war, an assault, a crash. They conclude it isn’t them, and they skip the chapter that would have helped them most.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Trauma is not defined by what happened.<\/p><\/aside><p><strong>Trauma is not defined by what happened. It’s defined by what happened in your nervous system.<\/strong> Two people can go through the same event and one is marked by it. The same event at seven lands differently from the same event at forty. And some of the deepest imprints come from things that never made it into a story at all.<\/p><figure class=\"ph\" data-slot=\"ch15-l04\"><\/figure><p>The forms it takes:<\/p><aside class=\"bx bx-define\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"><\/path><path d=\"M4 21V5M8 7h7\"><\/path><\/svg><span>What it means<\/span><\/div><h4 class=\"bx-term\">Complex trauma<\/h4><div class=\"bx-body\"><p><strong>Complex trauma<\/strong> — sometimes called Type II — is what happens when the threat is repeated and inescapable, rather than a single event. Ongoing abuse, a violent household, captivity, prolonged medical trauma. The nervous system doesn’t get to reset between episodes, so it stops trying. This produces a different picture from single-event trauma: not just flashbacks but a persistent difficulty regulating emotion, a damaged sense of self, and trouble in relationships.<\/p><\/div><\/aside><aside class=\"bx bx-define\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"><\/path><path d=\"M4 21V5M8 7h7\"><\/path><\/svg><span>What it means<\/span><\/div><h4 class=\"bx-term\">Cumulative “little-t” trauma<\/h4><div class=\"bx-body\"><p><strong>Cumulative “little-t” trauma<\/strong> is the one people most often dismiss. No single event on the list would strike anyone as traumatic. But hundreds of small ones — being humiliated, dismissed, unchosen, left out, corrected, made small — stack up into the same physiological load. There’s no story to tell, which is precisely why it goes unrecognised. You can’t point at anything, so you assume there’s nothing there.<\/p><\/div><\/aside><p><strong>Developmental trauma<\/strong> happens when the imprint lands while the system is still being built. A child shaped by chronic fear or neglect isn’t reacting to an event — the event is their whole architecture. This is Chapter 3, and the reason it’s here too is that the same adaptations we called “how you learned to belong” are, at the more severe end, trauma responses.<\/p><p><strong>Relational trauma<\/strong> is done by a person you depended on. That’s a specific injury, because the same person was both the danger and the source of safety — and a nervous system cannot resolve that. It’s why so many people who were hurt by someone close find that closeness itself now triggers alarm.<\/p><p><strong>Insidious trauma<\/strong> comes from a world that treats you as less. Ongoing discrimination, prejudice, being unsafe or unwelcome as a standing condition rather than an incident. No single event rises to a diagnosis. The cumulative effect on the nervous system is the same.<\/p><p><strong>Chronic low-grade stress and allostatic load<\/strong> is the physiological version underneath all of these. Chapter 3 introduced McEwen’s work: a system held on alert doesn’t just feel bad, it wears out organs. Years of pressure with no safety produce measurable physical cost, whether or not anything you’d call an event ever occurred.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>If you’ve spent years thinking <em>other people had it worse, I don’t get to call it that<\/em> — that’s not humility. It’s the reason you haven’t been treated for the thing you actually have.<\/p><\/div><\/aside>"}, {"t": "What actually helps", "g": "What actually helps", "k": "", "w": 45, "h": "<p>The same rules as the last two chapters. You are not meant to do all of it, and where evidence is stronger or weaker I’ll say so.<\/p><p>But one thing needs saying before anything else, because it’s the reason many people never start.<\/p>"}, {"t": "You do not have to relive it", "g": "What actually helps", "k": "", "w": 172, "h": "<p>The fear that keeps people out of trauma treatment is a specific one: <em>I will have to go back into the worst thing that ever happened to me and describe it in detail, and it will destroy me.<\/em><\/p><p>That is one form of treatment. It is not the only one, and it isn’t even the best-evidenced one.<\/p><p>The trauma-focused therapies split into two families. Some — prolonged exposure most notably — do rely on repeatedly reliving the event in detail. Others, including imagery rescripting and EMDR, <strong>deliberately limit how much you contact the memory.<\/strong><sup class=\"fn\">³<\/sup> They aim at the same target through a different door.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The treatment can’t be event-focused, because the injury wasn’t an event.<\/p><\/aside><p>And for complex, developmental or cumulative trauma there often isn’t a single event to go back into. The treatment can’t be event-focused, because the injury wasn’t an event. It was a climate.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So if you’ve been avoiding this because of what you assumed it would involve: that assumption is out of date, and there are routes that don’t require it.<\/p><\/div><\/aside>"}, {"t": "The therapies, strongest evidence first", "g": "What actually helps", "k": "", "w": 590, "h": "<p><strong class=\"steplead\">1. Imagery rescripting.<\/strong> This is the one most people have never heard of, and its evidence is excellent.<\/p><p>You bring up a memory from your child self’s perspective, then step into it as the adult you now are — and give that child what they needed and didn’t get. Protection. Someone taking their side. Someone removing them from the room. You’re not pretending it didn’t happen; you’re supplying the response that should have come and never did.<\/p><figure class=\"ph\" data-slot=\"ch15-l07\"><\/figure><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>70%<\/b><span>no longer meeting criteria for PTSD afterwards<\/span><\/div><div class=\"bx-body\"><p>In a multicentre randomised trial, 155 adults with PTSD from childhood trauma received either imagery rescripting or EMDR. <strong>Both produced large improvements, held at one-year follow-up, with a dropout rate of only 7.7%<\/strong><sup class=\"fn\">⁴<\/sup> — remarkably low for trauma treatment. A separate trial of imagery rescripting for childhood-abuse PTSD found effect sizes of <strong class=\"num\">1.40 to 1.63<\/strong>, with <strong>70% no longer meeting criteria for PTSD<\/strong> afterwards.<sup class=\"fn\">⁵<\/sup><\/p><\/div><\/aside><p>It suits complex and childhood trauma particularly well, because it works on the meaning and the unmet need rather than requiring a single catastrophic event to process.<\/p><p><strong class=\"steplead\">2. EMDR.<\/strong> You hold the memory in mind while following a moving stimulus — usually the therapist’s fingers — in sets, returning to what surfaces between them.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>76 trials<\/b><span>EMDR outperformed control conditions with a large effect<\/span><\/div><div class=\"bx-body\"><p>Across 76 trials, EMDR outperformed control conditions with a large effect (<strong class=\"num\">g = 0.93<\/strong>), and improved depression and anxiety alongside trauma symptoms.<sup class=\"fn\">⁶<\/sup> It’s recommended in international guidelines and it has helped an enormous number of people.<\/p><\/div><\/aside><p>One thing about it, more interesting than damning: <strong>the eye movements may not be the active ingredient.<\/strong> Ten dismantling studies compared full EMDR against the identical procedure with the eye movements removed, and found essentially no difference between them.<sup class=\"fn\">⁶<\/sup> Other analyses disagree.<sup class=\"fn\">⁷<\/sup> The debate is unresolved.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>That doesn’t mean EMDR doesn’t work — the outcome data is solid. It means a treatment can work while the story about why it works turns out to be wrong. If EMDR was only mildly useful for you, that’s useful information: you haven’t failed at the treatment, you’ve found that one of several equally-evidenced routes wasn’t your route.<\/p><\/div><\/aside><p><strong class=\"steplead\">3. Cognitive processing therapy.<\/strong> This one targets the beliefs the trauma installed rather than the memory itself — <em>it was my fault, I should have stopped it, I can’t trust anyone, I’m permanently damaged.<\/em> You write about the event once, then spend most of the work examining what you concluded from it. Well-evidenced and guideline-recommended, and a good fit for people whose main injury is to their sense of themselves.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>If the thought of it is what’s kept you away from treatment for a decade, the alternatives above are not a consolation prize.<\/p><\/aside><p><strong class=\"steplead\">4. Prolonged exposure.<\/strong> Repeated, structured revisiting of the memory alongside approaching avoided situations in real life. Effective and strongly evidenced — and it has consistently higher dropout rates than the therapies above, which is exactly what you’d predict from what it asks of people. If you have the capacity for it, it works. If the thought of it is what’s kept you away from treatment for a decade, the alternatives above are not a consolation prize.<\/p><p><strong class=\"steplead\">5. Body-based and parts-based approaches<\/strong> — somatic experiencing, sensorimotor psychotherapy, internal family systems, trauma-sensitive yoga. These are widely used, and many people find them the only thing that reached what talking couldn’t. Their formal evidence base is thinner and of lower quality than the four above — smaller trials, fewer of them. That’s a statement about the research, not a verdict on the practice. Reasonable position: worth doing, particularly alongside one of the above, and not yet in the same evidential tier.<\/p>"}, {"t": "How fast to go", "g": "What actually helps", "k": "", "w": 266, "h": "<p>The standard advice is to stabilise first: learn to regulate before you touch the material. Your Chapter 12 says the same thing, and for good reason — attempting deep work while completely dysregulated is how people get flooded and stop, sometimes for years.<\/p><p>But the evidence complicates it, and you should have both halves.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>eight sessions<\/b><span>of skills training before imagery rescripting produced no additional benefit over going straight in<\/span><\/div><div class=\"bx-body\"><p>A meta-analysis of treatments for childhood-trauma PTSD concluded that <strong>symptom complexity is probably not a contraindication for trauma-focused therapy<\/strong> — despite widespread reluctance among therapists to use it first-line.<sup class=\"fn\">¹<\/sup> And in the trial mentioned above, adding eight sessions of skills training <em>before<\/em> imagery rescripting produced <strong>no additional benefit<\/strong> over going straight in.<sup class=\"fn\">⁵<\/sup><\/p><\/div><\/aside><p>So the honest position is two-sided. Flooding is real, and going too fast with severe trauma can set someone back badly. It’s also true that a great many people are held in preparation for years by clinicians being careful on their behalf, and never get to the part that would help.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>What should decide it isn’t how bad the trauma was.<\/p><\/aside><p>What should decide it isn’t how bad the trauma was. It’s whether you dissociate under pressure, whether you’re currently safe, and whether you have support. Those are questions for a clinician who knows you — and they’re the right questions to ask, rather than accepting “you’re not ready” indefinitely.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p><strong>Signs you’re going too fast:<\/strong> losing time, feeling unreal for hours afterwards, escalating nightmares that don’t settle, using more alcohol, or a sharp rise in self-harm urges. Any of those means slow down and tell whoever you’re working with — not that you’ve failed at it.<\/p><\/div><\/aside>"}, {"t": "Nightmares need their own treatment", "g": "What actually helps", "k": "", "w": 133, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>If your nights are the worst part, treat them directly rather than waiting for the main work to trickle down.<\/p><\/aside><p>If your nights are the worst part, treat them directly rather than waiting for the main work to trickle down.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>13 studies<\/b><span>large effects on nightmare frequency, sleep quality and PTSD symptoms<\/span><\/div><div class=\"bx-body\"><p><strong>Imagery rehearsal therapy<\/strong> is the first-line approach and it’s simple in structure: while awake, you rewrite the nightmare — change the ending, change what you do in it — and rehearse the new version daily. A meta-analysis of 13 studies found <strong>large effects on nightmare frequency, sleep quality and PTSD symptoms, sustained at six to twelve month follow-up.<\/strong><sup class=\"fn\">⁸<\/sup> Effect sizes were smaller in the one study using an active comparison, so treat the exact size loosely and the direction as solid.<\/p><\/div><\/aside><p>It’s free, it’s done at home, and it targets the thing that’s stopping you sleeping — which, per Chapter 14, is upstream of a great deal else.<\/p>"}, {"t": "Why you’ve heard opposite stories about mushrooms", "g": "What actually helps", "k": "", "w": 248, "h": "<p>You will have heard that psilocybin transformed someone’s trauma, and you will have heard that it made someone much worse. Both are accurate, and the data explains why.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>0.3%<\/b><span>of participants with a pre-existing psychiatric condition experienced a serious adverse event<\/span><\/div><div class=\"bx-body\"><p>Across 214 studies with safety monitoring, <strong>0.3% of participants with a pre-existing psychiatric condition experienced a serious adverse event within 48 hours — rising to 4% over longer follow-up<\/strong>, including suicidal ideation, self-injury and worsening depression. <strong>Among participants without a psychiatric condition, there were none.<\/strong><sup class=\"fn\">⁹<\/sup> The risk lands almost entirely on the people most likely to be seeking it out.<\/p><\/div><\/aside><p>The scale of difficult experiences is larger than the headlines suggest: a national survey found <strong>52% of users had experienced a challenging trip<\/strong>, and in another study <strong>39% rated theirs among the most difficult experiences of their lives<\/strong>, with 7.6% seeking professional help afterwards.<sup class=\"fn\">¹⁰<\/sup> There’s a published case of prolonged harm in which the reaction was described as a trauma response in its own right — intrusive flashbacks of the experience itself, avoidance, hyperarousal, requiring hospitalisation.<sup class=\"fn\">¹¹<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The mechanism is interesting, the adjacent evidence in depression is real, and the trauma evidence doesn’t exist yet.<\/p><\/aside><p>And for PTSD specifically, <strong>formal trials are still underway rather than completed.<\/strong> The mechanism is interesting, the adjacent evidence in depression is real, and the trauma evidence doesn’t exist yet.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>Which is the summary: real promise, real risk, concentrated in exactly this population — and an experience that goes badly can itself become something you need to recover from. If you pursue this, it should be in a supervised setting, not a retreat, and not alone.<\/p><\/div><\/aside>"}, {"t": "Medication and therapy", "g": "What actually helps", "k": "", "w": 163, "h": "<p>Medication helps a great many people with this, and nothing in this chapter is an argument against it. If something is working for you, keep taking it.<\/p><p>Two things nobody mentions.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Trauma-focused therapy is what has the strongest evidence here — stronger than anything in a bottle.<\/p><\/aside><p><strong>Trauma-focused therapy is what has the strongest evidence here<\/strong> — stronger than anything in a bottle. If you’re choosing where to spend limited money, energy or appointments, that’s where it goes. And ask specifically whether the therapist does trauma-focused work, because a great deal of talking therapy doesn’t.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p><strong>Benzodiazepines are not recommended for PTSD<\/strong>, and they are still frequently prescribed for it. There’s no good evidence they help this condition, and there is evidence they reduce both the short- and long-term effectiveness of the therapy that does.<sup class=\"fn\">¹²<\/sup> If you’re on them, that isn’t a reason to stop — stopping abruptly after regular use is dangerous. It’s a reason to have the conversation with your prescriber rather than assume it was the right fit.<\/p><\/div><\/aside>"}, {"t": "Your body is carrying this too", "g": "What actually helps", "k": "", "w": 392, "h": "<p>Everything in Chapters 6, 7 and 9 applies here. Four things apply with particular force, and they are not the soft option — for many people they’re what makes the harder work possible.<\/p><p><strong>Sleep, and specifically deep sleep.<\/strong> Chapter 14 covered the mechanism: after a bad night, the regulatory part of your brain goes offline and the emotional centres run unchecked — which is the same state trauma produces. So poor sleep doesn’t just accompany this. It reproduces it, nightly.<\/p><figure class=\"ph\" data-slot=\"ch15-l12\"><\/figure><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Treating the nightmares directly (above) is often the fastest way in. Beyond that: a consistent wake time, morning light within an hour of getting up, and a cool dark room. Alcohol is the specific thing to look at, because it suppresses exactly the deep sleep that’s protective.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>Inflammation.<\/h4><p>PTSD is associated with raised inflammatory markers, which closes a loop this book has been drawing since Chapter 6 — chronic threat inflames the body, and an inflamed body sends danger signals the brain reads as threat. If you have unexplained fatigue, pain or gut symptoms alongside this, that isn’t a separate problem for later. It’s the same loop, and the Chapter 6 tools apply.<\/p><\/div><div class=\"point\"><h4>Blood sugar.<\/h4><p>A glucose crash releases adrenaline, and adrenaline in a system already primed for threat doesn’t feel like hunger — it feels like danger arriving. If your worst hours are mid-afternoon or the small hours, that’s worth testing before assuming it’s psychological. Protein at breakfast, protein and fat at each meal, and don’t go long stretches without eating.<\/p><\/div><\/div><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>52%<\/b><span>no longer meeting criteria for PTSD, against 21% of the control group<\/span><\/div><div class=\"bx-body\"><p><strong>Movement — and yoga in particular.<\/strong> In a randomised trial of 64 women with chronic, treatment-resistant PTSD, ten weekly hour-long classes of trauma-informed yoga left <strong>52% no longer meeting criteria for PTSD, against 21% of the control group.<\/strong><sup class=\"fn\">¹³<\/sup> Note that the control group — a supportive women’s health class — also improved substantially, so some of this is the room and the hour and the other people rather than the yoga itself. That’s not a criticism. It’s a reason to weight <em>any<\/em> regular, gentle, embodied group activity more highly than you might.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Why movement specifically suits this condition: trauma lives in a body that learned to brace and never got to finish the response.<\/p><\/aside><p>Why movement specifically suits this condition: trauma lives in a body that learned to brace and never got to finish the response. Movement is one of the few things that speaks to that directly, without requiring you to talk about anything.<\/p>"}, {"t": "Supplements", "g": "What actually helps", "k": "", "w": 346, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Nothing below is a treatment for trauma.<\/p><\/aside><p>Thinner evidence here than in the depression and anxiety chapters — this is an under-researched area, and I’d rather say that than dress it up. Nothing below is a treatment for trauma. What they do is support a body under sustained load, which is what yours has been under.<\/p><p>Ranked by how much there is behind them.<\/p><figure class=\"ph\" data-slot=\"ch15-l13\"><\/figure><p><strong class=\"steplead\">1. Omega-3, EPA-dominant.<\/strong> The best rationale of anything on this list, if not the best trial evidence. Chronic stress depletes the fats your cell membranes are built from, and omega-3s are being actively studied in trauma — including as a preventive after serious injury.<sup class=\"fn\">¹⁴<\/sup> Check the label and make sure EPA is the larger number, as in Chapter 13. Around 1–2 g of EPA daily.<\/p><p><strong class=\"steplead\">2. Magnesium.<\/strong> The clearest fit for what this condition does to a body. It dampens the brain’s main excitatory system, it’s depleted by prolonged stress, and it reliably helps sleep — which by everything above is doing real work here. Around 250–500 mg of glycinate in the evening.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>35 veterans<\/b><span>the NAC group showed significantly greater reduction in PTSD symptoms<\/span><\/div><div class=\"bx-body\"><p><strong class=\"steplead\">3. N-acetylcysteine (NAC).<\/strong> The most interesting signal in this space. In a pilot trial, 35 veterans with PTSD received NAC 2,400 mg daily or placebo alongside therapy for eight weeks, and the NAC group showed significantly greater reduction in PTSD symptoms.<sup class=\"fn\">¹⁵<\/sup> Small, in a population that also had substance use disorders, and a larger trial is underway. The rationale is oxidative stress, which is elevated in PTSD. Cheap, well tolerated, worth a conversation.<\/p><\/div><\/aside><p><strong class=\"steplead\">4. Vitamin D.<\/strong> Not a trauma treatment. But deficiency is extremely common, it makes everything harder, and it’s a cheap test. Correct it if you’re low.<\/p><p><strong class=\"steplead\">5. Probiotics and gut support.<\/strong> Follows from Chapter 6 rather than from trauma-specific trials. Most worth trying if you have digestive symptoms alongside — and a lot of people with this do, for the reasons that chapter explains.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>What I’d skip:<\/strong> anything sold specifically as a “trauma supplement” or “cortisol balancer.” The evidence isn’t there, and the money is better spent on therapy.<\/p><\/div><\/aside>"}, {"t": "What makes it worse", "g": "What actually helps", "k": "worse", "w": 220, "h": "<p>Short list, and read it as what your system is currently sensitive to rather than as things you’re doing wrong.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>If you drink to sleep, that’s not a character problem — it’s the most available tool you had.<\/p><\/aside><p><strong>Alcohol.<\/strong> The most common self-medication for this, and it works for about four hours. It suppresses deep sleep, it worsens next-day arousal, and the rebound is often mistaken for the trauma getting worse. If you drink to sleep, that’s not a character problem — it’s the most available tool you had. It’s also the one most worth reconsidering.<\/p><p><strong>Sleep debt<\/strong>, for the reasons above. Upstream of most of the rest.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>Isolation.<\/strong> Chapter 11 has the numbers. Trauma is frequently relational — done by a person, in a relationship — which makes withdrawal both understandable and the thing that keeps it going. This is the cruellest loop in the chapter.<\/p><\/div><\/aside><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"/><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p><strong>News and social media, if your trauma has a public form.<\/strong> Assault, disaster, war, medical trauma — the feed will keep serving you the thing your system is trying to file. This isn’t fragility, and limiting it isn’t avoidance in the sense Chapter 14 warns against. Avoidance is not going to the supermarket. This is not scrolling footage of the thing that happened to you.<\/p><\/div><\/aside><p><strong>Avoidance of everyday life.<\/strong> That one <em>is<\/em> the Chapter 14 kind, and it shrinks the world one sensible decision at a time.<\/p>"}, {"t": "Relapsing", "g": "What actually helps", "k": "", "w": 961, "h": "<p>You will have good months and then a bad one. Almost everyone does, and if you’ve worked with a decent therapist they’ll have told you so.<\/p><p>What tends not to get said is what actually to do about it — because the conversation usually stays inside the therapy room, and most of what determines whether progress holds happens outside it.<\/p><figure class=\"ph\" data-slot=\"ch15-l15\"><\/figure><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So, first, the part that matters most: <strong>a bad week is not a return to the start.<\/strong><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Your brain doesn’t hold a single score that resets.<\/p><\/aside><p>Chapter 4 explained why. Your brain doesn’t hold a single score that resets. Every hour of every day you are either running an old pathway or laying down a new one — and the good months were real. They laid down real pathway. They didn’t evaporate because a hard week arrived. If anything, those months proved the most important thing there is to prove: <strong>your brain is capable of a different pattern.<\/strong> That’s not a small finding to have made about yourself. It’s the whole premise, and you demonstrated it.<\/p><p>So what happened?<\/p><div class=\"points\"><div class=\"point\"><h4>Often, your system met something it hadn’t been challenged with in that particular way before.<\/h4><p>You’d handled the crowded shop, the difficult colleague, the visit home. Then something arrived at a new angle — a different relationship, a particular anniversary, a specific kind of criticism — and the alarm fired because that route had never been tested. That isn’t the old pattern returning intact. It’s an untested corner of it, and it’s now visible, which means it can be worked on.<\/p><\/div><div class=\"point\"><h4>And often something underneath has changed.<\/h4><p>This is the part that rarely gets discussed, and it may be the most useful thing in this chapter.<\/p><\/div><\/div><p>Everything in this book is a physical process. Rewiring a pattern, learning to think differently, tolerating discomfort without flooding — all of it requires a brain with the resources to do it. <strong>An inflamed brain struggles to rewire.<\/strong> A brain running on unstable blood sugar, broken sleep or depleted raw materials struggles to hold a new thought pattern against an old one, because the old one is cheaper to run.<\/p><aside class=\"bx bx-checklist\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><rect height=\"16\" rx=\"3\" width=\"16\" x=\"4\" y=\"4\"><\/rect><path d=\"M8 12l3 3 5-6\"><\/path><\/svg><span>Ask what changed physically<\/span><\/div><div class=\"bx-body\"><p>Which means a relapse is often not psychological at all. It’s a resource problem. Ask what changed physically:<\/p><ul>\n<li>Have you been ill, or had a course of antibiotics? Gut disruption is a real and underestimated driver, and even antibiotic exposure has been associated with later depression in large observational studies, with the risk rising with the number of courses.<sup class=\"fn\">¹⁶<\/sup><\/li>\n<li>Has your sleep quietly degraded over the past two months?<\/li>\n<li>Has your eating gone back to what it was under pressure?<\/li>\n<li>Are you drinking more than you were?<\/li>\n<li>Any new exposure — a new home, mould, a new medication, a new job with different air, water or hours?<\/li>\n<li>Has a hormonal shift arrived? Perimenopause, postpartum, thyroid, a change in contraception?<\/li>\n<li>Anything new in your surroundings — a move, a renovation, a change of job, new water, a new supplement or binder protocol? Chapter 7 covers what’s worth chasing there. One specific thing: binders taken close to medication reduce how much of it you absorb, which can look exactly like the illness returning.<\/li>\n<li>Are you more inflamed than you were — new pain, new gut symptoms, a recent infection that never quite cleared?<\/li>\n<\/ul><\/div><\/aside><p>The antibiotic one deserves a moment, because it’s the least intuitive and the most commonly missed. In a large primary-care study, a single course of penicillin was associated with a modestly raised risk of later depression — and the risk climbed with each additional course, reaching around 56% higher in people who’d had more than five.<sup class=\"fn\">¹⁶<\/sup> The suspected mechanism is the one from Chapter 6: antibiotics disrupt the gut microbiome, and that disruption can outlast the course by a long way. This is observational data and people who need many antibiotics differ from people who don’t. But if you had a rough winter of infections and your mood slid afterwards, that sequence is worth taking seriously rather than treating as coincidence.<\/p><p>Any one of those can pull the floor down without a single thing changing in your psychology. And each of them is addressable, which is a far better position to be in than “the therapy stopped working.”<\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>Then the third possibility: nothing changed, and that’s the problem.<\/p><\/aside><p>If you processed the past and returned to the same relationships, the same job, the same internal voice and the same people who benefited from the old version of you, then a few hours of new experience each week are competing with a hundred and sixty hours of the original lesson. That isn’t a fair contest, and losing it isn’t a failure of will.<\/p><p>What holds progress is daily and unglamorous:<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>One regulation practice, every day — including the good ones.<\/strong> The point isn’t the session. It’s the accumulated repetition telling your body that this state is the normal one now.<\/p><p><strong>Catch the pattern live rather than analysing it afterwards.<\/strong> <em>That’s the flinch. That’s me apologising. That’s me going quiet.<\/em> Noticing it as it happens is what interrupts the groove.<\/p><p><strong>Keep the physical foundation in place<\/strong>, because it’s what your brain is rewiring with. Sleep, food, light, movement — not as self-care, as raw material.<\/p><\/div><\/aside><p><strong>Change something in the environment.<\/strong> A boundary. A conversation. A relationship that gets less of you. If your circumstances can’t change yet, that isn’t failure — but you’ll need more daily support to hold ground inside them, and it’s better to know that going in.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>And give it much longer than feels reasonable.<\/strong> Chapter 12’s numbers: a median of 66 days for something to feel automatic, with a range up to 254, and missing a single day does almost nothing measurable. The damage isn’t done by the bad week. It’s done by what you conclude about yourself during it.<\/p><\/div><\/aside>"}, {"t": "You were never carrying this because you were weak", "g": "What actually helps", "k": "", "w": 193, "h": "<p>If you’ve recognised yourself here, hear this properly.<\/p><p>What happened to you registered in a part of your nervous system that doesn’t take instruction and doesn’t respond to reason. It filed an experience without a date on it, and then did exactly what it was built to do — protect you from anything resembling that experience ever again. Every symptom that followed is that protection running.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>It’s a system that did its job and never got the signal that the job was over.<\/p><\/aside><p>The vigilance. The flinch. The numbness. The way closeness sets off an alarm. The years of thinking it wasn’t bad enough to count. None of that is character. It’s a system that did its job and never got the signal that the job was over.<\/p><p>And it can get that signal. Not by being told. By being shown, repeatedly, in the ordinary daily texture of a life that is actually different from the one that shaped it.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>That’s the whole book, and it’s the title. Processing what happened is the survival part.<\/p><p class=\"closing\">Building something your nervous system can finally stand down inside — that’s the safety part. It’s slower, it’s less dramatic, and it’s the half that lasts.<\/p><\/div><\/aside>"}, {"t": "The research", "g": "What actually helps", "k": "refs", "w": 1280, "h": "<ul class='refs'><li><p>Ehring, T., Welboren, R., Morina, N., Wicherts, J. M., Freitag, J., &amp; Emmelkamp, P. M. G. (2014). Meta-analysis of psychological treatments for posttraumatic stress disorder in adult survivors of childhood abuse. <em>Clinical Psychology Review, 34<\/em>(8), 645–657. <em>(Trauma-focused treatments produced moderate to high effect sizes for PTSD symptoms and also reduced depression, anxiety and dissociation. The authors found that symptom complexity was probably not a contraindication for trauma-focused treatment, despite clinician reluctance to use it first-line.)<\/em><\/p><\/li><li><p>Chen, Y.-R., Hung, K.-W., Tsai, J.-C., et al. (2014). Efficacy of eye-movement desensitization and reprocessing for patients with posttraumatic-stress disorder: a meta-analysis of randomized controlled trials. <em>PLOS ONE, 9<\/em>(8), e103676. <em>(26 RCTs; significant reductions in PTSD (g = −0.66), depression (−0.64), anxiety (−0.64) and subjective distress (−0.96).)<\/em><\/p><\/li><li><p>Boterhoven de Haan, K. L., Lee, C. W., Fassbinder, E., et al. (2020), and the wider treatment literature, distinguish trauma-focused treatments that rely on prolonged reliving (e.g. prolonged exposure) from those that deliberately limit contact with the trauma memory (imagery rescripting, EMDR).<\/p><\/li><li><p>Boterhoven de Haan, K. L., Lee, C. W., Fassbinder, E., et al. (2020). Imagery rescripting and eye movement desensitisation and reprocessing as treatment for adults with post-traumatic stress disorder from childhood trauma: randomised clinical trial. <em>British Journal of Psychiatry, 217<\/em>(5), 609–615. <em>(International multicentre trial, 155 participants, up to 12 sessions of either treatment. Large effect sizes in both conditions, maintained to one-year follow-up; dropout 7.7%.)<\/em><\/p><\/li><li><p>Raabe, S., Ehring, T., Marquenie, L., Arntz, A., &amp; Kindt, M. (2022). Imagery rescripting as a stand-alone treatment for posttraumatic stress disorder related to childhood abuse: a randomized controlled trial. <em>Behaviour Research and Therapy.<\/em> <em>(N = 61. ImRs effect sizes 1.40–1.63 versus waitlist; 70% lost their PTSD diagnosis with ImRs alone and 86% with skills training plus ImRs, with no significant difference between conditions — the preparatory phase produced no additive benefit. Small sample.)<\/em><\/p><\/li><li><p>Cuijpers, P., van Veen, S. C., Sijbrandij, M., Yoder, W., &amp; Cristea, I. A. (2020). Eye movement desensitization and reprocessing for mental health problems: a systematic review and meta-analysis. <em>Cognitive Behaviour Therapy, 49<\/em>(3), 165–180. <em>(76 trials; EMDR versus control g = 0.93, with high heterogeneity (I² = 72%). Only four of 27 studies were at low risk of bias and there were indications of publication bias; EMDR outperformed other therapies overall but not in the low-risk-of-bias studies. Across ten dismantling studies, full EMDR versus the same procedure without eye movements gave a non-significant pooled effect of g = −0.04.)<\/em><\/p><\/li><li><p>Lee, C. W., &amp; Cuijpers, P. (2013). A meta-analysis of the contribution of eye movements in processing emotional memories. <em>Journal of Behavior Therapy and Experimental Psychiatry, 44<\/em>(2), 231–239. <em>(Reports a significant additive effect of eye movements — d = 0.41 in treatment studies and d = 0.74 in laboratory studies — contradicting the dismantling findings above. The question remains unresolved; both are presented here.)<\/em> See also Davidson, P. R., &amp; Parker, K. C. H. (2001), <em>Journal of Consulting and Clinical Psychology, 69<\/em>(2), 305–316, which found no incremental effect of eye movements.<\/p><\/li><li><p>Casement, M. D., &amp; Swanson, L. M. (2012). A meta-analysis of imagery rehearsal for post-trauma nightmares: effects on nightmare frequency, sleep quality, and posttraumatic stress. <em>Clinical Psychology Review, 32<\/em>(6), 566–574. <em>(13 studies; large effects on nightmare frequency, sleep quality and PTSD symptoms, sustained through 6–12 month follow-up. Effect sizes were small in the single study using an active-treatment control.)<\/em><\/p><\/li><li><p>Meta-analysis of 214 studies of classic psychedelics with safety monitoring. <em>(0.3% of participants with a pre-existing psychiatric disorder experienced a serious adverse event within 48 hours, rising to 4% during long-term follow-up, including suicidal ideation, suicidal behaviour, self-injury, adjustment disorder and worsening depression. No serious adverse events were identified among participants without psychiatric disorders.)<\/em><\/p><\/li><li><p>Survey and cohort data on challenging psychedelic experiences. <em>(A 2023 Canadian national survey found 52% of respondents had experienced a challenging trip; a 2016 study of psilocybin users found 39% rated their difficult experience among the most challenging of their lives, with 7.6% seeking professional treatment for subsequent psychological symptoms.)<\/em><\/p><\/li><li><p>Perna, J., Trop, J., Palitsky, R., et al. (2025). Prolonged adverse effects from repeated psilocybin use in an underground psychedelic therapy training program: a case report. <em>BMC Psychiatry, 25,<\/em> 184. <em>(Severe sleep impairment, anhedonia and suicidal ideation requiring hospitalisation; the authors note the presentation could be conceptualised as a trauma response to the drug experience itself. A single case report.)<\/em><\/p><\/li><li><p>PTSD psychopharmacology algorithm update (2024–2025) and the 2023 VA/DoD Clinical Practice Guideline for PTSD. <em>(Benzodiazepines have no evidence of effectiveness for PTSD, and evidence indicates they reduce the short- and long-term effectiveness of exposure-based psychotherapies for this condition. Note that abrupt discontinuation after regular use can cause seizures — any change requires a supervised taper.)<\/em><\/p><\/li><li><p>van der Kolk, B. A., Stone, L., West, J., Rhodes, A., Emerson, D., Suvak, M., &amp; Spinazzola, J. (2014). Yoga as an adjunctive treatment for posttraumatic stress disorder: a randomized controlled trial. <em>Journal of Clinical Psychiatry, 75<\/em>(6), e559–e565. <em>(64 women with chronic, treatment-resistant PTSD randomised to ten weekly hours of trauma-informed yoga or a supportive women’s health class. 52% of the yoga group no longer met PTSD criteria versus 21% of controls; effect size d = 1.07 for yoga and d = 0.66 for the control condition — note that the control group also improved substantially. Small sample, single site, and it remains the main randomised trial of trauma-sensitive yoga.)<\/em><\/p><\/li><li><p>Matsuoka, Y., et al. Tachikawa Project for Prevention of Posttraumatic Stress Disorder with Polyunsaturated Fatty Acid (TPOP), and related open-label work. <em>(Omega-3 supplementation after accidental injury as secondary prevention of PTSD. The rationale is that omega-3s support hippocampal neurogenesis and that chronic stress depletes membrane fatty acids. Note that this trial used a DHA-dominant formulation, unlike the EPA-dominant formulations favoured in the depression literature — the evidence base in trauma is early and does not yet establish a treatment effect.)<\/em><\/p><\/li><li><p>Back, S. E., McCauley, J. L., Korte, K. J., et al. (2016). A double-blind randomized controlled pilot trial of N-acetylcysteine in veterans with PTSD and substance use disorders. <em>Journal of Clinical Psychiatry, 77<\/em>(11), e1439–e1446. <em>(35 veterans; NAC 2,400 mg/day or placebo alongside group cognitive-behavioural therapy for eight weeks. Significant treatment effect on PTSD symptoms and craving. A pilot: small, in a population with co-occurring substance use disorder, and everyone received therapy as well. A larger multicentre trial of adjunctive NAC in treatment-resistant PTSD is underway.)<\/em><\/p><\/li><li><p>Lurie, I., Yang, Y.-X., Haynes, K., Mamtani, R., &amp; Boursi, B. (2015). Antibiotic exposure and the risk for depression, anxiety, or psychosis: a nested case-control study. <em>Journal of Clinical Psychiatry, 76<\/em>(11), 1522–1528. <em>(UK primary-care database. A single course of penicillin carried an adjusted odds ratio of 1.23 for depression, rising to 1.40 for two to five courses and 1.56 for more than five; anxiety followed a similar dose-response. No increased risk of psychosis with any antibiotic class, and no dose-response for antifungals — both of which argue against the association being purely an artefact of being unwell. Adjusted for obesity, smoking, alcohol, socioeconomic status and number of prior infections. Observational: people prescribed more antibiotics differ from those prescribed fewer in ways no adjustment fully captures. A 2022 systematic review in the Journal of Psychosomatic Research pooled nine such studies, finding risk raised by at least 20% with a dose-response pattern persisting for years, while describing the underlying studies as relatively low quality.)<\/em><\/p><\/li><\/ul>"}]}, {"n": 19, "t": "You Were Solving Something", "s": "Addiction, what it was for, and how the loop actually runs", "p": 3, "l": [{"t": "Opening", "g": "", "k": "", "w": 123, "h": "<p>You know the shape of it by now.<\/p><p>Maybe it started as a glass in the evening and it’s three, and the third one isn’t a decision anymore. Maybe it’s the pills that were prescribed and then weren’t, or the pipe, or the scrolling, or the thing you don’t say out loud even here. Maybe you’ve stopped for six months twice and gone back both times, and the second time was worse because you knew better.<\/p><p>And somewhere underneath, a question you’ve asked yourself a thousand times and never answered: <em>why can’t I just stop?<\/em><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>I want to offer you a different question, because that one has never got anyone anywhere.<\/p><\/aside><p>I want to offer you a different question, because that one has never got anyone anywhere.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>What was it solving?<\/strong><\/p><\/div><\/aside>"}, {"t": "Nobody gets addicted to a substance", "g": "", "k": "", "w": 98, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>They get addicted to relief.<\/p><\/aside><p>They get addicted to relief.<\/p><p>Something hurt. Something was unbearable, or wouldn’t switch off, or had been running for so long you’d stopped noticing it was there. And then you found a thing that made it stop — reliably, within minutes, every single time.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>That’s not a character flaw. That’s learning. Your brain is built to notice what works and repeat it, and by any measure available to it, this worked.<\/p><\/div><\/aside><p>Which reframes the whole thing. If the substance is an answer, then the question is what it was answering. And that question has answers.<\/p>"}, {"t": "What needed relieving", "g": "", "k": "", "w": 312, "h": "<p>For most people it’s one of a few things, and every one of them has a chapter earlier in this book.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>seven times<\/b><span>more likely to struggle with alcoholism<\/span><\/div><div class=\"bx-body\"><p><strong>What happened to you as a child.<\/strong> The study in Chapter 3 followed more than 17,000 adults, and the finding here is stark: people who had lived through four or more categories of childhood adversity were roughly <strong>seven times more likely to struggle with alcoholism<\/strong> and <strong>ten times more likely to have used injected drugs<\/strong> than people who had none.<sup class=\"fn\">¹<\/sup> The risk climbed step by step with each layer.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Read that as a measure of how much relief someone needed, and how young they were when they first needed it.<\/p><\/aside><p>Read that as a measure of how much relief someone needed, and how young they were when they first needed it.<\/p><figure class=\"ph\" data-slot=\"ch19-l03\"><\/figure><div class=\"points\"><div class=\"point\"><h4>Trauma.<\/h4><p>Chapter 15 described a nervous system that can’t stop replaying something. A substance that reliably turns the volume down on that is the most effective tool most people will ever find. It works. That’s the problem — and it means the substance and the trauma have to be dealt with together, because treating one leaves the other running.<\/p><\/div><div class=\"point\"><h4>Never feeling quite valued.<\/h4><p>Chapter 3 asked what you learned you needed to be in order to belong. Some people concluded early that they were a burden, or that they were only acceptable while performing. That leaves a background ache with no particular cause and no particular day attached to it. Substances answer it faster than anything else available. Not metaphorically. Chemically, immediately, every time.<\/p><\/div><div class=\"point\"><h4>Nothing much to get up for.<\/h4><p>Chapter 11 covered what purpose does for a person. I’ll be careful here: I could find plenty of confident claims that finding purpose predicts staying sober, and almost all of them came from places selling treatment rather than from research. So take this as reasoning rather than evidence — an empty life is easier to fill with a substance than a full one, and everyone who has been in early recovery knows what four unstructured hours feel like.<\/p><\/div><\/div>"}, {"t": "What your drug of choice is telling you", "g": "", "k": "", "w": 144, "h": "<p>This is worth a minute, because it’s information most people never think to read.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The substance people land on tends to fit the problem they had.<\/p><\/aside><p>The substance people land on tends to fit the problem they had.<\/p><p><strong>Alcohol for anxiety<\/strong> — it acts on the same calming system as the medications in Chapter 14, which is exactly why it works for an hour and rebounds by morning.<\/p><p><strong>Stimulants for undiagnosed ADHD<\/strong> — Chapter 16 explained a brain that runs on interest and urgency and can’t use importance as fuel. Amphetamine supplies what’s missing. A great many people with untreated ADHD discover this by accident and describe finally feeling normal.<\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>Cannabis for a nervous system that won’t switch off.<\/p><\/aside>
