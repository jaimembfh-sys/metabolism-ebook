<p><strong>Opioids for trauma and for pain<\/strong>, which are frequently the same story.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>If one of those landed, you didn’t stumble into a random vice. You found something that treated a condition nobody had diagnosed.<\/p><\/div><\/aside>"}, {"t": "Wanting is not liking", "g": "", "k": "", "w": 212, "h": "<p>Now the mechanism, because it explains something you’ve probably decided is proof there’s something wrong with you.<\/p><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"/><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p>You’ll have heard that addiction “hijacks the reward system.” That’s not quite right, and the accurate version is more useful.<\/p><\/div><\/aside><p>Deep in your brain, two different systems handle two different things. One generates <strong>wanting<\/strong> — the pull, the urge, the motivation to go and get something. It runs on dopamine and it is large and powerful. The other generates <strong>liking<\/strong> — the actual pleasure when you have the thing. It runs on smaller, more fragile machinery, and <strong>it doesn’t depend on dopamine at all.<\/strong><sup class=\"fn\">²<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Those two can come apart.<\/p><\/aside><p>Those two can come apart. And in addiction, they do.<\/p><p>What happens is that <strong>the wanting gets amplified — enormously, and especially by cues — while the liking doesn’t.<\/strong><sup class=\"fn\">²<\/sup><\/p><p>Which means the sentence you may have said to yourself, and probably concluded was proof of your own madness —<\/p><p><em>I don’t even enjoy it anymore, and I still can’t stop.<\/em><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>— is not madness, and not a contradiction. It’s a precise description of what’s happening in your brain. The wanting system has been turned up. The liking system hasn’t. You can be pulled hard toward something that has stopped giving you anything at all.<\/p><\/div><\/aside>"}, {"t": "Why it gets worse rather than settling", "g": "", "k": "", "w": 220, "h": "<p>The other half of the mechanism explains why this doesn’t reach a stable level and stay there.<\/p><p>Researchers describe three stages that cycle.<sup class=\"fn\">³<\/sup> First the use itself, with the dopamine and opioid changes that build the wanting and lay down the habit. Then withdrawal — and this is where the trap closes. <strong>The reward system loses function, and at the same time the brain’s stress systems get recruited.<\/strong><sup class=\"fn\">³<\/sup> Less pleasure available from anything, plus more baseline distress. The researchers call it a reward deficit and a stress surfeit. Then anticipation, with the thinking brain compromised, tipping every choice further toward the substance.<\/p><p>Here is what that means for you, in plain terms.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>Your baseline doesn’t return to neutral between uses. It drops below it.<\/strong><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>You’re using to get back to zero — and zero keeps moving away from you.<\/p><\/aside><p>So you stopped using to feel good a long time ago. You’re using to get back to zero — and zero keeps moving away from you. Everything that used to be enjoyable goes flat at the same time, because it’s the same machinery.<\/p><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"/><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p>That’s why “just find other things you enjoy” is useless advice at this stage. It isn’t that you won’t. It’s that the equipment for enjoying them is temporarily down. Chapter 13 described the same circuitry going quiet in depression — same problem, different route in.<\/p><\/div><\/aside>"}, {"t": "The trigger isn’t the substance", "g": "", "k": "", "w": 183, "h": "<p>Because wanting is driven by cues, the thing that fires it stops being the drug and becomes everything that predicts the drug. The pub. Six o’clock. That one friend. A particular song. An argument. Payday.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>The dopamine fires before the substance is anywhere near you<\/strong>, and it fires whether or not you asked it to.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Changing where you go and who you’re with isn’t weakness or avoidance.<\/p><\/aside><p>This is what makes Chapter 15’s point about environment concrete rather than vague. Changing where you go and who you’re with isn’t weakness or avoidance. It’s removing the things that pull the trigger before you’re involved in the decision.<\/p><p>One honest complication, since I’d rather you had it: people with lower dopamine receptor availability do use more, and report liking drugs more when they first try them.<sup class=\"fn\">⁴<\/sup> But it is very difficult to tell whether the low dopamine came first or whether use produced it.<sup class=\"fn\">⁴<\/sup> Nobody can tell you which happened to you — and the difference matters, because one version says your brain was always going to do this and the other says this is what the using did.<\/p>"}, {"t": "Shame is the fuel", "g": "", "k": "", "w": 270, "h": "<p>This is the most important research in the chapter, and it inverts almost everything our culture does with addiction.<\/p><p>Researchers followed people recovering from alcohol dependence and coded how much <strong>shame<\/strong> they displayed when talking about their drinking. Shame strongly predicted <strong>future relapse<\/strong>, and predicted declining health.<sup class=\"fn\">⁵<\/sup><\/p><p><strong>And guilt predicted nothing at all.<\/strong><sup class=\"fn\">⁵<\/sup><\/p><p>That distinction is the hinge of this whole chapter, so let me be exact about it:<\/p><aside class=\"bx bx-define\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 21V5M8 7h7\"/><\/svg><span>What it means<\/span><\/div><h4 class=\"bx-term\">Shame<\/h4><div class=\"bx-body\"><p><strong>Guilt is about what you did.<\/strong> It points at a behaviour. It can be repaired, apologised for, made good.<\/p><p><strong>Shame is about what you are.<\/strong> It points at your whole self. And what shame produces isn’t repair — it’s hiding.<\/p><\/div><\/aside><p>Hiding is precisely what this condition needs in order to continue. A person who believes they are fundamentally bad has every reason to conceal, to withdraw, and to numb. And the numbing produces more of the exact behaviour they’re ashamed of.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So the loop runs like this: something hurt, the substance relieved it, using it caused damage, the damage produced shame — <strong>and shame is itself a state that needs relieving.<\/strong> The fastest available relief is the substance.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Shame doesn’t produce recovery.<\/p><\/aside><p>Notice what that says about how people in your position are usually treated. Public shaming. Moral language. Being told you should be ashamed of yourself. The researchers pointed out their findings matter precisely because policymakers keep proposing shame as a corrective.<sup class=\"fn\">⁵<\/sup> The evidence runs the other way. Shame doesn’t produce recovery. It produces relapse.<\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>Which means the thing I’m going to say at the end of this chapter isn’t a kindness. It’s a clinical instruction.<\/p><\/aside>"}, {"t": "Before anything else", "g": "", "k": "start", "w": 78, "h": "<aside class=\"callout safety\"><span class=\"callout-label\">Safety first<\/span><p>If you drink heavily every day, do not stop suddenly.<\/p><\/aside><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>Alcohol withdrawal can cause seizures and it can kill you. So can withdrawal from benzodiazepines — the sedatives sold as diazepam, lorazepam, alprazolam and similar. These are among the very few withdrawals where stopping is more dangerous than continuing.<\/p><\/div><\/aside><p>If that’s you, the next step is a doctor, not willpower. Medically supervised withdrawal exists, it’s routine, and it is not a sign of failure to need it.<\/p>"}, {"t": "What actually helps", "g": "What actually helps", "k": "", "w": 13, "h": "<p>You are not meant to do all of this. Pick what looks possible.<\/p>"}, {"t": "Your gut is in this too", "g": "What actually helps", "k": "", "w": 250, "h": "<p>This is new to almost everyone, and it connects to a chapter you’ve already read.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Craving specifically, which is the strongest single predictor of whether someone relapses after detox.<\/p><\/aside><p>Researchers measured intestinal permeability — the leaky-gut problem from Chapter 6 — in people with alcohol dependence, and found it tracked with <strong>depression, anxiety and craving.<\/strong><sup class=\"fn\">⁶<\/sup> Craving specifically, which is the strongest single predictor of whether someone relapses after detox.<\/p><p>The loop is a closed one. Alcohol damages the gut barrier. Bacterial components cross into the bloodstream and drive inflammation. Separately, the disrupted microbiome pushes the stress axis into sustained overdrive, raising cortisol — and raised cortisol further disrupts the microbiome.<sup class=\"fn\">⁷<\/sup> Alcohol also strips out the anti-inflammatory bacteria and lets the inflammatory ones expand.<sup class=\"fn\">⁷<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So the drinking damages your gut. The damaged gut generates the anxiety and low mood you were drinking to relieve. And it independently turns the craving up.<\/p><\/div><\/aside><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>What can be done about it is everything in Chapter 6 — barrier repair, fibre, fermented food, multi-strain probiotics, removing what’s irritating it. The evidence that fixing the gut reduces drinking is mostly from animals so far: in rodents, probiotics improved dopamine signalling and <strong>reduced alcohol intake<\/strong>, and restoring the microbiome in germ-free mice normalised the stress axis and lowered alcohol preference.<sup class=\"fn\">⁷<\/sup><\/p><\/div><\/aside><p>That’s a reason to do it, not a promise. It’s safe, it’s cheap, and it treats the depression and anxiety underneath whatever it does for craving. Start early, because early recovery is when the barrier is most damaged and the craving is highest.<\/p>"}, {"t": "Moving", "g": "What actually helps", "k": "", "w": 187, "h": "<p>The evidence here is better than in most chapters of this book, and it acts on exactly the machinery described above.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>−0.71<\/b><span>exercise reduced craving with an effect size of<\/span><\/div><div class=\"bx-body\"><p>Pooling randomised trials across light, moderate and high intensity, exercise reduced craving with an effect size of <strong class=\"num\">−0.71<\/strong>.<sup class=\"fn\">⁸<\/sup> A network analysis of 30 trials and 1,717 people found aerobic exercise at <strong class=\"num\">−0.73<\/strong>, aerobic plus resistance at <strong class=\"num\">−1.96<\/strong>, and interval training at <strong class=\"num\">−2.19<\/strong> — though the intervals on those last two are wide.<sup class=\"fn\">⁹<\/sup> <strong>Tai chi came in at −0.47.<\/strong><sup class=\"fn\">⁹<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>A brisk twenty-minute walk most days is inside the effective range.<\/p><\/aside><p>The dose finding is the useful part: benefit appeared across a range starting at roughly <strong class=\"num\">20 MET-minutes per week<\/strong>.<sup class=\"fn\">⁹<\/sup> That is a very small amount. A brisk twenty-minute walk most days is inside the effective range.<\/p><p>Exercise also reduced depression, best at moderate intensity, and anxiety at light and moderate intensity.<sup class=\"fn\">⁸<\/sup> The overall quality rating on this literature was low, so hold the exact numbers loosely and the direction firmly.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Use it as a replacement source of relief rather than as fitness. Ten minutes when the craving arrives does more than an hour scheduled for Thursday.<\/p><\/div><\/aside>"}, {"t": "Sleep", "g": "What actually helps", "k": "", "w": 72, "h": "<p>Disrupted for weeks or months in early recovery, and one of the strongest predictors of going back.<\/p><p>Chapter 9 has the tools. Two points specific to this: alcohol suppresses deep sleep, so stopping often means your sleep gets <em>worse<\/em> before it gets better — expect that rather than reading it as failure. And the sleep debt itself raises craving, so the first fortnight is a period to protect rather than test yourself in.<\/p>"}, {"t": "Blood sugar and cravings", "g": "What actually helps", "k": "", "w": 74, "h": "<p>A crash in blood sugar releases adrenaline, and adrenaline in a system that’s already primed doesn’t read as hunger. It reads as craving.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Sugar intake tends to rise sharply in early recovery, which sets this up several times a day. Protein at every meal, fat alongside it, and don’t leave long gaps. This is the cheapest intervention on the page and one of the fastest to notice — often within a week.<\/p><\/div><\/aside>"}, {"t": "If you have a cycle", "g": "What actually helps", "k": "", "w": 241, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>This appears nowhere in mainstream recovery material and it should.<\/p><\/aside><p>This appears nowhere in mainstream recovery material and it should.<\/p><p>Craving and the subjective effect of substances are <strong>higher during the first half of the cycle<\/strong>, when oestrogen is rising and progesterone is low — and also in the week before a period, when progesterone is falling.<sup class=\"fn\">¹⁰<\/sup> In women with alcohol use disorder, the <strong>lowest<\/strong> drinking, craving and loss of control occurred in the late luteal phase, when the progesterone-to-oestrogen ratio peaked.<sup class=\"fn\">¹¹<\/sup><\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>37%<\/b><span>increase in the odds of staying abstinent over a four-week attempt<\/span><\/div><div class=\"bx-body\"><p>And it appears to matter for quitting. Female smokers randomly assigned to quit in the luteal phase relapsed <strong>less<\/strong> than those assigned to the follicular phase, and rising progesterone was associated with a <strong>37% increase in the odds of staying abstinent<\/strong> over a four-week attempt.<sup class=\"fn\">¹²<\/sup><\/p><\/div><\/aside><p>Two things pull against this. Nicotine withdrawal symptoms appear to be <em>worst<\/em> in the luteal phase, and studies have reported better cessation results starting in both halves of the cycle.<sup class=\"fn\">¹³<\/sup> So this isn’t settled.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">track it<\/h4><div class=\"bx-body\"><p>What you can use it for now: track it. If your cravings spike at the same point every month, that’s a pattern rather than a personal failing — and knowing it’s coming is most of what makes it survivable. If you’re planning a quit date, it may be worth choosing the second half of your cycle. Chapter 7’s hormone material applies here, and Chapter 16 described the same hormonal swing changing how well ADHD medication works. Same story, third appearance.<\/p><\/div><\/aside>"}, {"t": "Other people", "g": "What actually helps", "k": "", "w": 79, "h": "<p>Chapter 11 has the numbers and they’re among the largest in this book. This is the single biggest lever available to you and the one most often missing from a plan.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Isolation is where this condition lives, and the condition produces isolation, which is the cruellest part of it. You don’t have to like people, or talk about your feelings, or find the right group. You have to be around someone regularly. That’s the whole requirement.<\/p><\/div><\/aside>"}, {"t": "Structure", "g": "What actually helps", "k": "", "w": 37, "h": "<p>Unstructured time is where relapse happens. Not because idleness is a moral problem — because an empty afternoon is where the cue-driven wanting has room to expand.<\/p><p>Anchors, not schedules. Something at the same time most days.<\/p>"}, {"t": "Supplements", "g": "What actually helps", "k": "", "w": 298, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Apply the test from Module 3 — who profits if you believe this.<\/p><\/aside><p>Ranked strongest first. And a warning about the landscape: search this subject and you’ll find page after page of confident supplement advice, almost all of it published by places selling treatment. Apply the test from Module 3 — who profits if you believe this.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 3l9.5 17h-19z\"><\/path><path d=\"M12 10v4M12 17.5v.5\"><\/path><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p><strong class=\"steplead\">1. Thiamine (vitamin B1).<\/strong> The most important item here and the least glamorous. Heavy drinking depletes it, and severe deficiency causes permanent memory damage, so it’s given routinely in medical detox. There’s also a finding that goes beyond deficiency: <strong>animals made thiamine-deficient drink more alcohol, and restoring their thiamine reverses it.<\/strong> If you drink heavily, this one isn’t optional and it’s worth raising with a doctor rather than self-managing.<\/p><\/div><\/aside><p><strong class=\"steplead\">2. The rest of the B vitamins.<\/strong> Folate, B6 and B12 are all depleted by sustained drinking, and all three affect mood directly (Chapter 7). A B-complex covers it.<\/p><figure class=\"ph\" data-slot=\"ch19-l18\"><\/figure><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong class=\"steplead\">3. Magnesium.<\/strong> Depleted by alcohol, calms an over-excited nervous system, and helps sleep — which by everything above is doing real work here. 250–500 mg of the glycinate form in the evening.<\/p><\/div><\/aside><p><strong class=\"steplead\">4. NAC (N-acetylcysteine).<\/strong> Trials in cocaine, cannabis and nicotine have shown reduced craving, though results are inconsistent and smaller than the marketing suggests. 1,200–2,400 mg daily. Cheap, well tolerated, and reasonable as a defined two-to-three month trial.<\/p><p><strong class=\"steplead\">5. Zinc, vitamin D and omega-3.<\/strong> Commonly low in anyone who has been drinking or using heavily and eating badly. Test, then correct what’s low.<\/p><p><strong>What to skip:<\/strong> high-dose amino acid protocols sold as rebalancing your neurotransmitters — there are no controlled trials behind them. Proprietary detox blends, where the doses are usually too small to do anything. And oral GABA, which mostly doesn’t get into your brain (Chapter 14).<\/p>"}, {"t": "What exists that nobody offered you", "g": "What actually helps", "k": "", "w": 239, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>There are medications for this.<\/p><\/aside><p>There are medications for this. Most people are never told.<\/p><p><strong>For alcohol<\/strong>, two have real evidence behind them. Across 135 studies, <strong>acamprosate<\/strong> prevented one additional person in twelve from returning to drinking, and <strong>naltrexone<\/strong> one in twenty — with naltrexone doing better at preventing a return to <em>heavy<\/em> drinking, one in twelve.<sup class=\"fn\">¹⁴<\/sup> Acamprosate suits people aiming for abstinence; naltrexone suits people trying to cut down.<sup class=\"fn\">¹⁵<\/sup> Neither is dramatic. Both are real, and both are more than nothing, which is what most people are given.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>fivefold<\/b><span>difference in dying — from a treatment that is still described as a crutch<\/span><\/div><div class=\"bx-body\"><p><strong>For opioids<\/strong>, the numbers are the starkest in this chapter. Pooling cohorts covering more than 120,000 people on methadone: <strong>overdose deaths ran at 2.6 per thousand person-years during treatment and 12.7 out of it.<\/strong> All-cause deaths, 11.3 in treatment against 36.1 out.<sup class=\"fn\">¹⁶<\/sup> Buprenorphine showed the same direction. That is roughly a fivefold difference in dying — from a treatment that is still described as a crutch.<\/p><\/div><\/aside><p><strong>For stimulants<\/strong>, where no medication works, there’s something that does: <strong>contingency management<\/strong>, meaning small guaranteed rewards for verified abstinence. Effect sizes around 0.66 for stimulant use.<sup class=\"fn\">¹⁷<\/sup> <strong>Fewer than one in ten treatment programmes in the US offers it.<\/strong><sup class=\"fn\">¹⁸<\/sup> Its limit is that the benefit fades after the rewards stop.<sup class=\"fn\">¹⁹<\/sup><\/p><p>None of this is a recommendation — it’s a list of things that exist so you can ask. Any of it is a conversation with a prescriber.<\/p>"}, {"t": "Meetings", "g": "What actually helps", "k": "", "w": 120, "h": "<p>The evidence on twelve-step programmes is better than critics assume and smaller than advocates claim, and the Cochrane review settles it about as well as it can be settled: <strong>42% of people in AA or twelve-step facilitation were completely abstinent a year later, against 35% of people receiving other treatments including CBT.<\/strong><sup class=\"fn\">²⁰<\/sup> The advantage came largely from keeping people involved after the programme ended.<sup class=\"fn\">²⁰<\/sup> It also reduced healthcare costs.<sup class=\"fn\">²¹<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Seven percentage points isn’t a miracle and it isn’t nothing.<\/p><\/aside><p>Seven percentage points isn’t a miracle and it isn’t nothing. And if the God language is a barrier for you, secular alternatives exist and the mechanism that seems to matter — regular contact with people doing the same thing — doesn’t depend on the theology.<\/p>"}, {"t": "What makes it worse", "g": "What actually helps", "k": "worse", "w": 117, "h": "<p>Read this as what your system is sensitive to.<\/p><div class=\"points\"><div class=\"point\"><h4>Being alone.<\/h4><p>First, and by a distance.<\/p><\/div><div class=\"point\"><h4>The untreated thing underneath.<\/h4><p>If the anxiety, the ADHD, the trauma or the pain is still untreated, the substance is still doing a job, and something doing a job is hard to put down.<\/p><\/div><\/div><aside class=\"margin-quote\"><span>Key idea<\/span><p>This is the one that’s actually optional, and it’s the one a book can reach.<\/p><\/aside><p><strong>Shame<\/strong>, per the research above. This is the one that’s actually optional, and it’s the one a book can reach.<\/p><p><strong>Sleep debt.<\/strong> <strong>Empty time.<\/strong> <strong>Blood sugar swings.<\/strong><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>And the loop to watch for:<\/strong> withdrawal produces anxiety, agitation and terrible sleep — which are the same symptoms the substance was treating. So the first few days feel like evidence that you need it. They aren’t. They’re the withdrawal, and they pass.<\/p><\/div><\/aside>"}, {"t": "What to ask to be tested for", "g": "What actually helps", "k": "tests", "w": 53, "h": "<p>The panel in Chapter 13 applies. Add:<\/p><aside class=\"bx bx-steps\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6h11M9 12h11M9 18h11\"/><circle cx=\"4.5\" cy=\"6\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"12\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"18\" r=\"1.2\"/><\/svg><span>Your checklist<\/span><\/div><div class=\"bx-body\"><ul>\n<li><strong>Thiamine<\/strong>, plus folate and B12 with functional markers<\/li>\n<li><strong>Magnesium<\/strong> and <strong>zinc<\/strong><\/li>\n<li><strong>Vitamin D<\/strong><\/li>\n<li><strong>Liver function tests<\/strong><\/li>\n<li><strong>Ferritin<\/strong>, with an inflammatory marker alongside it<\/li>\n<\/ul><\/div><\/aside><p>And if your work or history involves exposure to solvents or metals, Chapter 7 covers what to ask and who does that testing.<\/p>"}, {"t": "Relapsing", "g": "What actually helps", "k": "", "w": 261, "h": "<p>This deserves more room here than in any other chapter, because it’s the part that decides everything.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>A lapse is not a relapse.<\/p><\/aside><p><strong>A lapse is not a relapse.<\/strong> One drink, one use, one night is an event. What turns it into a return is almost always what you conclude about yourself in the following forty-eight hours — and per the shame research, that conclusion is the most dangerous part of the whole episode.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>If it happens, the question is not <em>what does this say about me.<\/em> The question is <em>what changed?<\/em><\/p><\/div><\/aside><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Check the physical things first.<\/h4><div class=\"bx-body\"><p><strong>Check the physical things first.<\/strong> Sleep in the last fortnight. Whether you’d been eating. Blood sugar. Whether you’d been alone more than usual. Whether something in your routine collapsed. Whether you’re at the same point in your cycle as last time. These are boring and they are usually the answer.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>Then look at the environment.<\/h4><p>Chapter 15 made the point that processing something doesn’t hold if you return to the conditions that produced it, and that’s more true here than anywhere else in this book. Same house, same people, same job, same Friday. Four hours a week of new behaviour against a hundred and sixty of the old pattern is not a fair contest, and losing it isn’t a verdict on your character.<\/p><\/div><div class=\"point\"><h4>And what you did before was real.<\/h4><p>The six months happened. Your brain laid down that pathway and it did not vanish because a bad week arrived. You have already proved the thing that needed proving, which is that you can do it. What’s left is working out what took it down and closing that gap.<\/p><\/div><\/div>"}, {"t": "You were never weak", "g": "What actually helps", "k": "", "w": 233, "h": "<p>Here’s the thing I’ve been building to, and per the research above, it isn’t a comfort — it’s the intervention.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>You were solving something.<\/p><\/aside><p><strong>You were solving something.<\/strong> Something hurt badly enough, for long enough, that when you found the thing that made it stop, you kept doing it. That’s not weakness of will. That’s a nervous system doing exactly what it was built to do: notice what works, and go back for more.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>And it worked. That’s the part nobody says out loud, and it’s the reason this has been so hard to put down. If it hadn’t worked, you’d have stopped years ago without help.<\/p><\/div><\/aside><p>What followed — the damage, the promises, the mornings — came from a thing that was originally a solution. Not from a flaw in who you are. There is a difference between <em>I did something that hurt people<\/em> and <em>I am something that hurts people<\/em>, and the research is clear that the first one can be repaired while the second one only makes you hide.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So put the second one down. It has never once helped you, and the evidence says it has made this worse.<\/p><\/div><\/aside><p class=\"closing\">The substance was answering a real question. That question still has an answer — several, most of them in this book — and none of them require you to be ashamed of having needed one in the first place.<\/p>"}, {"t": "The research", "g": "What actually helps", "k": "refs", "w": 1537, "h": "<ul class='refs'><li><p>Felitti, V. J., Anda, R. F., Nordenberg, D., et al. (1998). Relationship of childhood abuse and household dysfunction to many of the leading causes of death in adults: the Adverse Childhood Experiences (ACE) Study. <em>American Journal of Preventive Medicine, 14<\/em>(4), 245–258. <em>(More than 17,000 adults. Those reporting four or more categories of adverse childhood experience had approximately seven times the odds of alcoholism and ten times the odds of injected drug use compared with those reporting none, in a stepwise dose-response pattern. Retrospective self-report of childhood events, which is its main limitation.)<\/em><\/p><\/li><li><p>Berridge, K. C., &amp; Robinson, T. E. (2016). Liking, wanting, and the incentive-sensitization theory of addiction. <em>American Psychologist, 71<\/em>(8), 670–679; and Robinson &amp; Berridge (1993), <em>Brain Research Reviews, 18,<\/em> 247–291. <em>(Incentive salience or “wanting” is generated by large, robust systems including mesolimbic dopamine, while “liking” — the hedonic impact of a reward when consumed — is mediated by smaller, fragile systems that are not dopamine-dependent. The theory holds that addiction involves excessive amplification of cue-triggered wanting without amplification of liking. Thirty years of accumulated support, largely from animal work with converging human evidence; competing accounts exist, including habit and prefrontal-dysfunction theories.)<\/em><\/p><\/li><li><p>Koob, G. F., &amp; Le Moal, M. (2001). Drug addiction, dysregulation of reward, and allostasis. <em>Neuropsychopharmacology, 24,<\/em> 97–129. <em>(The three-stage model: binge/intoxication, withdrawal/negative affect, and preoccupation/anticipation. During withdrawal the dopamine component of the reward system loses function while brain stress neurotransmitters including CRF and dynorphin are recruited in the extended amygdala — a “reward deficit and stress surfeit.” A theoretical framework built on animal work; the human mapping is well argued rather than directly measured.)<\/em><\/p><\/li><li><p>Volkow, N. D., et al. on D2 receptor availability and drug-liking; with the interpretive caution set out in Berridge, K. C. (2007), <em>Psychopharmacology, 191,<\/em> 391–431. <em>(Low baseline D2 receptor availability is associated with higher rates of self-administration in animals and higher initial drug-liking in humans. Berridge notes it is often difficult to be certain whether low dopamine markers caused the clinical condition or resulted from it — a genuine and unresolved ambiguity.)<\/em><\/p><\/li><li><p>Randles, D., &amp; Tracy, J. L. (2013). Structured shame displays relate to psychological symptom severity; and the associated finding that behavioural shame displays predict relapse and declining health in recovering alcoholics. <em>Clinical Psychological Science.<\/em> <em>(Behavioural displays of shame when describing past problem drinking strongly predicted subsequent relapse and health decline. Self-reported guilt was not associated with any measured outcome. Modest sample, and shame was coded from behaviour rather than self-report — which the authors argue is a strength, since self-reported shame is unreliable. Verify sample size before publication.)<\/em><\/p><\/li><li><p>Leclercq, S., Matamoros, S., Cani, P. D., et al. (2014). Intestinal permeability, gut-bacterial dysbiosis, and behavioral markers of alcohol-dependence severity. <em>PNAS, 111<\/em>(42), E4485–E4493. <em>(Intestinal permeability was associated with depression, anxiety and craving in alcohol-dependent subjects. Craving is an established predictor of relapse after detoxification. Observational, and the direction of causation is not established by this design.)<\/em><\/p><\/li><li><p>Reviews of the gut microbiome in alcohol use disorder, including <em>BJPsych Bulletin<\/em> (2025) and <em>Antonie van Leeuwenhoek<\/em> (2025). <em>(Alcohol induces dysbiosis, compromises barrier integrity and permits lipopolysaccharide translocation; dysbiosis also alters CRH production, driving sustained HPA-axis activation and elevated cortisol, which further disrupts the microbiome. Alcohol reduces anti-inflammatory taxa including Faecalibacterium prausnitzii and Bifidobacterium. In rodents, probiotics enhanced dopamine signalling and reduced alcohol intake; in germ-free mice, restoring microbiota normalised HPA activity and reduced alcohol preference. The interventional evidence in humans is not yet there — this is mechanism plus animal work.)<\/em><\/p><\/li><li><p>Systematic review and meta-analysis of exercise intensity and withdrawal symptoms in substance use disorder (2023), <em>Frontiers in Physiology.<\/em> <em>(Light, moderate and high-intensity exercise all reduced craving, SMD −0.71 (95% CI −0.90 to −0.52), with no significant differences between intensity subgroups. Depression reduced across intensities with moderate best (−0.64); anxiety reduced only with light and moderate intensity.)<\/em><\/p><\/li><li><p>Network meta-analysis and dose-response modelling of exercise types and craving in substance use disorder (2025), <em>Addiction Science &amp; Clinical Practice.<\/em> <em>(30 RCTs, 1,717 participants. Aerobic −0.73, HIIT −2.19, aerobic plus resistance −1.96, tai chi −0.47. Effective total exercise range approximately 20–320 MET-minutes per week. GRADE rated low, so treat the point estimates as indicative.)<\/em><\/p><\/li><li><p>Reviews of menstrual cycle effects on substance use and craving. <em>(Craving and subjective drug effects are reported as higher during the follicular phase, when estradiol is rising and progesterone low, and during phases in which progesterone is declining. Largely observational, with variation across substances.)<\/em><\/p><\/li><li><p>Longitudinal analysis from the German TRR265 cohort. <em>(In women with alcohol use disorder, the lowest levels of problem drinking, craving and loss of control occurred during the late luteal phase, when progesterone-to-estradiol ratios peaked; higher ratios were associated with lower problem drinking in men as well. Some effects were moderated by severity. Smartphone self-report combined with blood hormone ratios.)<\/em><\/p><\/li><li><p>Allen, S. S., et al. (2008), and Saladin, M. E., et al. (2015). <em>(Female smokers randomly assigned to quit during the luteal phase had lower relapse rates than those assigned to the follicular phase; increasing endogenous progesterone was associated with a 37% increase in the odds of smoking abstinence during a four-week course of nicotine replacement therapy.)<\/em><\/p><\/li><li><p>Comprehensive review of psychiatric symptoms across the menstrual cycle (2022). <em>(Notes that reduced craving in the luteal phase may relate to increased allopregnanolone, a progesterone-derived neurosteroid — but also that nicotine withdrawal symptoms appear highest during the luteal phase, and that studies have reported superior smoking cessation outcomes initiated during both luteal and follicular phases. Presented here as unresolved.)<\/em><\/p><\/li><li><p>Jonas, D. E., Amick, H. R., Feltner, C., et al. (2014). Pharmacotherapy for adults with alcohol use disorders in outpatient settings: a systematic review and meta-analysis. <em>JAMA, 311<\/em>(18), 1889–1900. <em>(135 studies. Numbers needed to treat to prevent one person returning to any drinking: 12 for acamprosate, 20 for oral naltrexone (moderate strength of evidence). NNT 12 for oral naltrexone to prevent return to heavy drinking. No significant difference between the two in head-to-head trials. Injectable naltrexone showed no significant benefit for return to any or heavy drinking; disulfiram was not supported except possibly with excellent adherence. Note that most trials included psychosocial co-interventions, so these figures represent the added benefit of medication.)<\/em><\/p><\/li><li><p>Maisel, N. C., Blodgett, J. C., Wilbourne, P. L., Humphreys, K., &amp; Finney, J. W. (2013). Meta-analysis of naltrexone and acamprosate for treating alcohol use disorders: when are these medications most helpful? <em>Addiction, 108<\/em>(2), 275–293. <em>(Acamprosate had a larger effect on maintenance of abstinence; naltrexone a larger effect on reducing heavy drinking and craving. Substantial heterogeneity for acamprosate (I² = 74.8%), and the reviewers noted limitations that make firm conclusions about who benefits most unreliable.)<\/em><\/p><\/li><li><p>Sordo, L., Barrio, G., Bravo, M. J., et al. (2017). Mortality risk during and after opioid substitution treatment: systematic review and meta-analysis of cohort studies. <em>BMJ, 357,<\/em> j1550. <em>(19 cohorts; 122,885 people treated with methadone and 15,831 with buprenorphine. All-cause mortality 11.3 per 1,000 person-years in methadone treatment versus 36.1 out; overdose mortality 2.6 versus 12.7. Buprenorphine: all-cause 4.3 versus 9.5, overdose 1.4 versus 4.6. All-cause mortality dropped sharply over the first four weeks of methadone treatment. Observational cohort data — people in and out of treatment differ in ways this design cannot fully adjust for.)<\/em><\/p><\/li><li><p>Meta-analyses of contingency management for substance use disorders. <em>(Overall effect size approximately d = 0.42 across 47 studies, with stimulant use around d = 0.66 and opioid use in methadone treatment d = 0.65.)<\/em><\/p><\/li><li><p>Reporting on contingency management implementation in US treatment programmes. <em>(Fewer than 10% of programmes incorporate it, attributed to funding constraints, staff training requirements and reward-management logistics rather than to evidence.)<\/em><\/p><\/li><li><p>Benishek, L. A., et al. (2014). Prize-based contingency management for the treatment of substance abusers: a meta-analysis. <em>Addiction, 109<\/em>(9), 1426–1436. <em>(Adding prize-based contingency management to behavioural support increased short-term abstinence, but the effect did not appear to persist to six months. The honest limit on this intervention.)<\/em><\/p><\/li><li><p>Kelly, J. F., Humphreys, K., &amp; Ferri, M. (2020). Alcoholics Anonymous and other 12-step programs for alcohol use disorder. <em>Cochrane Database of Systematic Reviews,<\/em> Issue 3, CD012880. <em>(Evidence suggests 42% of participants in AA or twelve-step facilitation would remain completely abstinent one year later, compared with 35% receiving other treatments including CBT, with the effect achieved largely by fostering continued AA participation beyond the end of the programme. Note that by Cochrane convention non-randomised studies included in such reviews are automatically rated low certainty.)<\/em><\/p><\/li><li><p>Kelly, J. F., Humphreys, K., &amp; Ferri, M. (2020). Alcoholics Anonymous and 12-step facilitation treatments for alcohol use disorder: a distillation of a 2020 Cochrane review for clinicians and policy makers. <em>Alcohol and Alcoholism, 55<\/em>(6), 641–651. <em>(AA/TSF was better than other well-established treatments for continuous abstinence and remission, and at least as effective for reducing drinking intensity, alcohol-related consequences and addiction severity. Healthcare cost savings were identified, with greater savings among participants with poorer prognostic characteristics.)<\/em><\/p><\/li><\/ul>"}]}, {"n": 22, "t": "One Answer to a Question With Several", "s": "What all of this has been pointing at", "p": 4, "l": [{"t": "Opening", "g": "", "k": "", "w": 99, "h": "<p>If you have read straight through, you have just been given a great deal.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>And underneath all of it, a quiet suggestion that what you were told about your own mind may have been incomplete.<\/p><\/aside><p>Nine conditions. Blood tests you had never heard of. Interventions ranging from a lamp to a diet to a conversation you have been avoiding for eleven years. And underneath all of it, a quiet suggestion that what you were told about your own mind may have been incomplete.<\/p><p>So before you close the book, I want to draw one line through everything, because there is a single finding sitting underneath all nine chapters — and I did not go looking for it. It kept turning up.<\/p>"}, {"t": "The same shape, over and over", "g": "", "k": "", "w": 276, "h": "<p>This is what happened as I worked through the research for each condition.<\/p><p><strong>In depression<\/strong>, a powerful anti-inflammatory drug failed. Across everyone in the trial, it did nothing. But split the group by a cheap blood test measuring inflammation, and the picture reversed: it worked in the inflamed group and did <em>worse than placebo<\/em> in the rest.<\/p><p><strong>In depression again<\/strong>, zinc added to an antidepressant looked modest across the board — and large, specifically, in the people whose antidepressant hadn’t worked.<\/p><p><strong>In ADHD<\/strong>, high-dose EPA improved attention. Mostly in the children who had low EPA to begin with.<\/p><p><strong>In autism<\/strong>, high-dose folinic acid improved language and attention — concentrated in the children carrying a particular antibody, which a blood test can find.<\/p><p><strong>In Alzheimer’s<\/strong>, ketogenic approaches helped cognition. Look closer and the benefit clusters in people who don’t carry the APOE4 gene.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>around 63%<\/b><span>Adding the imaging raised the accuracy of predicting response from around 36%<\/span><\/div><div class=\"bx-body\"><p><strong class=\"num\">And in 2024<\/strong>, researchers at Stanford scanned 801 people with depression and anxiety, sorted them into six groups by brain circuit activity, then randomly assigned them to medication or therapy. The groups predicted who responded to what. Adding the imaging raised the accuracy of predicting response from around 36% to around 63%.<sup class=\"fn\">¹<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>One shape: the average result hides two opposite results, and something measurable tells you in advance which one you are.<\/p><\/aside><p>Different conditions. Different interventions. Different research teams, countries and decades. <strong>One shape: the average result hides two opposite results, and something measurable tells you in advance which one you are.<\/strong><\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img class=\"bx-av\" alt=\"\"><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>It is the finding of this book, and it wasn’t my idea. I assembled it chapter by chapter and watched it appear again and again, until it stopped looking like a series of interesting subgroup analyses and started looking like the actual structure of the thing.<\/p><\/div><\/aside>"}, {"t": "Which means “it didn’t work” was never the whole sentence", "g": "", "k": "", "w": 140, "h": "<p>Sit with what that implies for you personally.<\/p><p>When a treatment fails in a trial, what usually happened is that it helped one group, did nothing for another, and the two cancelled out into a disappointing average. Then that average becomes the guideline, and the guideline becomes what you are offered.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>It was an average, applied to a person, in a system that had no way of knowing which side of the average you were on.<\/p><\/aside><p>So when you were told a medication was your best option and it did little — that was not a verdict on you. It was an average, applied to a person, in a system that had no way of knowing which side of the average you were on.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>And when you concluded, somewhere around the third or fourth attempt, that you were the problem — you drew a reasonable conclusion from the evidence you had. It was simply the wrong conclusion, and there was no way for you to know that.<\/p><\/div><\/aside>"}, {"t": "The man who said this thirty years ago", "g": "", "k": "", "w": 329, "h": "<p>Long before any of those studies, one psychiatrist was making this argument out loud, and taking a great deal of professional heat for it.<\/p><p><strong>Dr. Daniel Amen<\/strong> founded his first clinic in 1989. His starting objection was simple, and it is the one this whole book rests on: <strong>psychiatry is very nearly the only medical specialty that treats an organ without ever looking at it.<\/strong> A cardiologist images the heart. An endocrinologist tests before prescribing. A psychiatrist listens to a description of symptoms, matches it to a category in a manual, and prescribes — for a brain nobody has examined.<\/p><figure class=\"ph\" data-slot=\"ch22-l04\"><\/figure><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>over 250,000 brain scans<\/b><span>the largest database of its kind in the world<\/span><\/div><div class=\"bx-body\"><p>So he started looking. Using SPECT imaging, which measures blood flow and activity rather than structure, he built what is now the largest database of its kind in the world: <strong>over 250,000 brain scans, and by his clinics’ current count approaching 300,000<\/strong>, from patients in 155 countries, accumulated across more than thirty-five years.<sup class=\"fn\">²<\/sup> <sup class=\"fn\">³<\/sup><\/p><\/div><\/aside><p>What makes it a research database rather than a filing cabinet is that a great many of those patients were scanned <strong>before and after treatment.<\/strong> Which allows a question most psychiatric practice cannot ask: <em>when this person got better, what changed in the brain — and what did we do that changed it?<\/em><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>People carrying one diagnosis did not share one brain pattern.<\/p><\/aside><p><strong>What he found is the thesis of this book.<\/strong> People carrying one diagnosis did not share one brain pattern. They fell into groups. In some, a region was working too hard; in others, the same region was underactive. Two people, same label, same prescription, opposite problems — which explains something otherwise baffling, that a treatment helping one person can make another person worse.<\/p><p>Working from those patterns, he described <strong>seven types of ADD, and seven types of anxiety and depression<\/strong>, each with its own combination of symptoms and its own pattern of over- or under-activity in specific brain regions.<sup class=\"fn\">²<\/sup> <sup class=\"fn\">⁴<\/sup> And crucially, each with its own approach — because if the underlying problem is opposite, the response should be too.<\/p>"}, {"t": "The part I find most worth respecting", "g": "", "k": "", "w": 273, "h": "<p>A brain scan costs money that most people do not have.<\/p><p>Rather than leave his findings available only to people who could pay for imaging, he did something more useful: he worked backwards. Having spent decades matching symptom patterns to activity patterns across hundreds of thousands of scans, <strong>he built questionnaires that let a person identify their likely type from their symptoms alone<\/strong> — no scan required.<sup class=\"fn\">⁵<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Whatever anyone thinks of the imaging, the instinct behind that is the right one.<\/p><\/aside><p>I don’t think that’s a small thing. It takes a finding that would otherwise belong to a small number of well-off patients and makes it available to anyone with ten minutes. Whatever anyone thinks of the imaging, the instinct behind that is the right one.<\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img class=\"bx-av\" alt=\"\"><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>And his framework does not stop at description. For each type he teaches specific, targeted approaches — nutritional, supplemental and behavioural — matched to whether a given brain region needs calming or activating. <strong>That material is taught in his certification programme, which I completed<\/strong>, and it is his to teach rather than mine to reprint here. What I will say is that working through it is what convinced me of the argument I have made throughout this book: that the question was never <em>which antidepressant next<\/em>, but <em>what is actually happening, and in whom<\/em>.<\/p><\/div><\/aside><p>His methods have been argued about in his profession for as long as he has been using them. What has not been argued about, in the end, is the argument. Stanford’s biotype work, the inflammation findings, the genes that predict who responds to what — all of it points where he was pointing in the 1990s, when it was a far less comfortable thing to say.<\/p>"}, {"t": "What to do with all of this", "g": "", "k": "", "w": 222, "h": "<p>You cannot act on twenty-two chapters. So here is what I would take, if I were you and I were tired.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>A single sheet of paper handed to a doctor is the highest-yield ten minutes in this book.<\/p><\/aside><p><strong>Get the blood tests.<\/strong> Whichever chapter was yours, it listed them. They are ordinary, they are cheap, and almost nobody is offered them. A single sheet of paper handed to a doctor is the highest-yield ten minutes in this book.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Pick three things, not thirty.<\/h4><div class=\"bx-body\"><p><strong>Pick three things, not thirty.<\/strong> From the chapter that sounded like you, take the three that ask least of you. In most chapters those are the same three: <strong>get outside in the morning, protect your sleep, and eat protein before you eat anything else.<\/strong> Give them six weeks before you judge them.<\/p><\/div><\/aside><p><strong>Work out which sub-group you are.<\/strong> Not with certainty — nobody has that. But the questions run through every chapter: does fatigue dominate more than sadness? Do you sleep more or less? Did this start after an illness? Is it worse in the week before your period? Did it begin when the light changed? Those answers point somewhere, and pointing somewhere is the whole game.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Then tell someone.<\/h4><div class=\"bx-body\"><p><strong>Then tell someone.<\/strong> A doctor, a partner, a friend who will ask you about it in a month. This book cannot do the part where a person is known by another person, and Chapter 11 explained why that part is not optional.<\/p><\/div><\/aside>"}, {"t": "What I hope you take", "g": "", "k": "", "w": 154, "h": "<p>You picked this up because something was not working, and because you had begun to suspect the problem was you.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>What I hope you have instead is a different sentence: you were given one answer to a question that has several.<\/p><\/aside><p>What I hope you have instead is a different sentence: <strong>you were given one answer to a question that has several.<\/strong><\/p><p>Which is not the same as being told there is nothing wrong. There may be a great deal wrong, and some of it may take years. It is the difference between a locked door and a door where nobody has tried the other keys — and every chapter of this book is a key that exists, that is cheap, and that most people are never handed.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You are not treatment-resistant. You are not lazy, or weak, or too much, or beyond help.<\/p><p>You were averaged.<\/p><\/div><\/aside><p class=\"closing\">And you are not an average. You are a specific person, with a specific body, carrying a specific history — and the research, finally, is catching up to that.<\/p>"}, {"t": "The research", "g": "", "k": "refs", "w": 312, "h": "<ul class='refs'><li><p>Tozzi, L., Zhang, X., Pines, A., et al. (2024). Personalized brain circuit scores identify clinically distinct biotypes in depression and anxiety. <em>Nature Medicine, 30,<\/em> 2076–2087. <em>(801 treatment-free patients scanned; 250 randomised to pharmacotherapy or behavioural therapy. Six biotypes identified, differing in treatment response, with imaging raising predictive accuracy from approximately 36% to 63%. The authors have a commercial interest in the imaging system used, and independent commentators regard the findings as promising but requiring replication before clinical use.)<\/em><\/p><\/li><li><p>Amen Clinics reporting on the SPECT database and the seven-type frameworks. <em>(Over 30 years of brain-imaging work; the clinics’ published figures range from over 250,000 scans in earlier materials to approaching 300,000 currently, from patients in 155 countries. The seven types of ADD/ADHD were first outlined by Amen in a 1998 paper and developed in his subsequent books; seven types of anxiety and depression are described in parallel. Note that these are clinic-reported figures.)<\/em><\/p><\/li><li><p>Amen, D. G., et al. (2017). Classification of depression, cognitive disorders, and co-morbid depression and cognitive disorders with perfusion SPECT neuroimaging. <em>Journal of Alzheimer’s Disease, 57<\/em>(1), 253–269. <em>(Peer-reviewed study of 4,541 patients; SPECT distinguished depression from cognitive disorders with 86% accuracy. Context for readers: the use of SPECT to diagnose psychiatric conditions is not endorsed by the American Psychiatric Association, the National Institute of Mental Health, or the Society of Nuclear Medicine and Molecular Imaging, and the approach remains contested within the profession.)<\/em><\/p><\/li><li><p>Amen Clinics descriptions of the seven types of anxiety and depression, each associated with distinct symptom clusters and patterns of activity in specific brain regions — for example heightened basal ganglia activity in the pure anxiety type.<\/p><\/li><li><p>Amen Clinics and Amen University symptom questionnaires. <em>(Developed from the symptom-to-activity patterns observed across the scan database, allowing type identification without imaging. Available without cost.)<\/em><\/p><\/li><\/ul>"}]}], "key": "s2s-trauma", "course": {"title": "Survival to Safety: Trauma & Addiction", "hero": "Survival to Safety<span>Trauma &amp; Addiction<\/span>", "kicker": "A root-cause guide to understanding and changing your mental health"}}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const CH = D.chapters;
const WPM = 230;
const LOGO = document.querySelector('.brand img').src;
/* Picture spots: add a picture by putting its address next to the spot's name, e.g. "ch06-cover": "https://…/gut.jpg" */
const IMAGES = {
  "home-banner": "images/home-banner.jpg",
  "ch01-cover": "images/ch01-cover.jpg", "ch01-l04": "images/ch01-l04.jpg",
  "ch02-cover": "images/ch02-cover.jpg", "ch02-l04": "images/ch02-l04.jpg", "ch02-l07": "images/ch02-l07.jpg",
  "ch03-cover": "images/ch03-cover.jpg",
  "ch04-cover": "images/ch04-cover.jpg", "ch04-l02": "images/ch04-l02.jpg", "ch04-l05": "images/ch04-l05.jpg",
  "ch05-cover": "images/ch05-cover.jpg", "ch05-l02": "images/ch05-l02.jpg", "ch05-l03": "images/ch05-l03.jpg", "ch05-l04": "images/ch05-l04.jpg",
  "ch06-cover": "images/ch06-cover.jpg", "ch06-l03": "images/ch06-l03.jpg", "ch06-l04": "images/ch06-l04.jpg", "ch06-l07": "images/ch06-l07.jpg", "ch06-l08": "images/ch06-l08.jpg", "ch06-l09": "images/ch06-l09.jpg", "ch06-l11": "images/ch06-l11.jpg",
  "ch07-cover": "images/ch07-cover.jpg", "ch07-l02": "images/ch07-l02.jpg", "ch07-l03": "images/ch07-l03.jpg", "ch07-l04": "images/ch07-l04.jpg", "ch07-l05": "images/ch07-l05.jpg", "ch07-l06": "images/ch07-l06.jpg", "ch07-l07": "images/ch07-l07.jpg",
  "ch08-cover": "images/ch08-cover.jpg", "ch08-l08": "images/ch08-l08.jpg", "ch08-l13": "images/ch08-l13.jpg",
  "ch09-cover": "images/ch09-cover.jpg", "ch09-l06": "images/ch09-l06.jpg", "ch09-l09": "images/ch09-l09.jpg",
  "ch10-cover": "images/ch10-cover.jpg", "ch10-l03": "images/ch10-l03.jpg", "ch10-l04": "images/ch10-l04.jpg", "ch10-l08": "images/ch10-l08.jpg",
  "ch11-cover": "images/ch11-cover.jpg", "ch11-l08": "images/ch11-l08.jpg",
  "ch12-cover": "images/ch12-cover.jpg", "ch12-l03": "images/ch12-l03.jpg", "ch12-l06": "images/ch12-l06.jpg",
  "ch13-cover": "images/ch13-cover.jpg", "ch13-l03": "images/ch13-l03.jpg", "ch13-l04": "images/ch13-l04.jpg", "ch13-l06": "images/ch13-l06.jpg", "ch13-l07": "images/ch13-l07.jpg", "ch13-l08": "images/ch13-l08.jpg", "ch13-l09": "images/ch13-l09.jpg", "ch13-l10": "images/ch13-l10.jpg", "ch13-l12": "images/ch13-l12.jpg",
  "ch14-cover": "images/ch14-cover.jpg", "ch14-l04": "images/ch14-l04.jpg", "ch14-l05": "images/ch14-l05.jpg", "ch14-l08": "images/ch14-l08.jpg", "ch14-l16": "images/ch14-l16.jpg", "ch14-l18": "images/ch14-l18.jpg",
  "ch15-cover": "images/ch15-cover.jpg", "ch15-l04": "images/ch15-l04.jpg", "ch15-l07": "images/ch15-l07.jpg", "ch15-l12": "images/ch15-l12.jpg", "ch15-l13": "images/ch15-l13.jpg", "ch15-l15": "images/ch15-l15.jpg",
  "ch16-cover": "images/ch16-cover.jpg", "ch16-l03": "images/ch16-l03.jpg", "ch16-l05": "images/ch16-l05.jpg", "ch16-l06": "images/ch16-l06.jpg", "ch16-l08": "images/ch16-l08.jpg", "ch16-l09": "images/ch16-l09.jpg", "ch16-l12": "images/ch16-l12.jpg",
  "ch17-cover": "images/ch17-cover.jpg", "ch17-l09": "images/ch17-l09.jpg",
  "ch18-cover": "images/ch18-cover.jpg", "ch18-l08": "images/ch18-l08.jpg", "ch18-l11": "images/ch18-l11.jpg", "ch18-l18": "images/ch18-l18.jpg",
  "ch19-cover": "images/ch19-cover.jpg", "ch19-l03": "images/ch19-l03.jpg", "ch19-l18": "images/ch19-l18.jpg",
  "ch20-cover": "images/ch20-cover.jpg", "ch20-l04": "images/ch20-l04.jpg",
  "ch21-cover": "images/ch21-cover.jpg", "ch21-l02": "images/ch21-l02.jpg", "ch21-l05": "images/ch21-l05.jpg", "ch21-l06": "images/ch21-l06.jpg", "ch21-l07": "images/ch21-l07.jpg",
  "ch22-cover": "images/ch22-cover.jpg", "ch22-l04": "images/ch22-l04.jpg"
};
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>';
const cov = c => 'ch' + String(c.n).padStart(2,'0') + '-cover';
function fig(slot, label, cls){
  if (IMAGES[slot]) return `<figure class="ph ${cls||''}"><img src="${IMAGES[slot]}" alt="${esc(label)}"></figure>`;
  return `<figure class="ph empty ${cls||''}" data-filled="1"><div class="ph-in">${ICON}<b>${esc(label)}</b><small>Image spot · ${slot}</small></div></figure>`;
}
function fillSpots(c){
  document.querySelectorAll('#prose img.bx-av').forEach(i => i.src = LOGO);
  document.querySelectorAll('#prose figure.ph[data-slot]').forEach(f => {
    const s = f.dataset.slot, m = s.match(/l(\d+)$/);
    f.outerHTML = fig(s, 'Lesson ' + (+m[1]) + ' picture');
  });
}

const mins = w => Math.max(1, Math.round(w / WPM));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let done = new Set(store.get(D.key+'-done', []));
let open = new Set(store.get(D.key+'-open', []));
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id = (c, i) => c.n + '-' + i;
const total = CH.reduce((a, c) => a + c.l.length, 0);
const chDone = c => c.l.filter((_, i) => done.has(id(c, i))).length;
const findCh = n => CH.find(c => c.n === n);
const flat = []; CH.forEach(c => c.l.forEach((l, i) => flat.push([c, i])));
const KIND = {tests:'Take to your appointment', worse:'Watch for'};

function saveDone(){ store.set(D.key+'-done', [...done]); }
function progress(){
  const n = done.size;
  document.getElementById('fill').style.width = (n / total * 100) + '%';
  document.getElementById('count').textContent = n + ' of ' + total + ' lessons complete';
}

/* ---------- navigation rail ---------- */
let route = {v:'home'};
function renderNav(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let h = '';
  D.parts.forEach((p, pi) => {
    const chs = CH.filter(c => c.p === pi);
    let block = '';
    chs.forEach(c => {
      const matches = c.l.map((l, i) => i).filter(i => !q || c.l[i].t.toLowerCase().includes(q) || c.t.toLowerCase().includes(q));
      if (q && !matches.length) return;
      const isOpen = q ? true : open.has(c.n) || route.c === c.n;
      const cd = chDone(c);
      block += `<button class="nav-ch ${route.c===c.n?'on':''} ${cd===c.l.length?'done':''}" data-ch="${c.n}" aria-expanded="${isOpen}">
        <span class="no">${String(c.n).padStart(2,'0')}</span><span>${esc(c.t)}</span><span class="chev">▶</span></button>`;
      if (isOpen){
        block += '<ul class="nav-lessons">';
        let g = '';
        matches.forEach(i => {
          const l = c.l[i];
          if (l.g && l.g !== g){ g = l.g; block += `<li class="nav-group">${esc(g)}</li>`; }
          const on = route.c === c.n && route.i === i;
          block += `<li><button class="nav-l ${on?'on':''} ${done.has(id(c,i))?'done':''}" data-go="${c.n}-${i}"><span class="dot"></span><span>${esc(l.t)}</span></button></li>`;
        });
        block += '</ul>';
      }
    });
    if (block) h += `<div class="nav-part">${p[0]}<em>${esc(p[1])}</em></div>` + block;
  });
  document.getElementById('nav').innerHTML = h || '<p class="empty">No lessons match that search.</p>';
}

/* ---------- views ---------- */
function home(){
  const words = flat.reduce((a, [c, i]) => a + c.l[i].w, 0);
  const last = store.get(D.key+'-last', null);
  const hrs = Math.max(0.5, Math.round(words/WPM/30)/2);
  let resume = '';
  if (last){ const [cn, li] = last.split('-').map(Number); const c = findCh(cn); if (c && c.l[li]) resume = `<button class="btn" data-go="${last}">Continue: ${esc(c.l[li].t)} →</button>`; }
  if (!resume) resume = `<button class="btn" data-go="${CH[0].n}-0">Begin with Chapter ${CH[0].n} →</button>`;
  let h = `<div class="col home"><section class="home-hero">
    <div class="home-brand"><img class="home-mark" src="${LOGO}" alt="Mind Body Functional Health logo"><span>Mind Body<i>Functional Health</i></span></div>
    <div class="eyebrow"><span>${D.course.kicker}</span></div>
    <h1 class="home-title">${D.course.hero}</h1>
    <div class="stats"><span><b>${CH.length}</b>chapters</span><span><b>${total}</b>lessons</span><span><b>${hrs}</b>${hrs===1?"hour":"hours"} of reading</span><span><b>${done.size}</b>lessons done</span></div>
    <div class="ch-actions" style="margin:6px 0 0">${resume}</div>
    <p class="meta">Go at your own pace. Your progress is saved in this browser.</p>
    ${fig('home-banner', 'Course banner', 'home')}
  </section>`;
  return h + '</div>';
}

function chapter(c){
  const w = c.l.reduce((a, l) => a + l.w, 0);
  const firstOpen = c.l.findIndex((_, i) => !done.has(id(c, i)));
  const start = firstOpen < 0 ? 0 : firstOpen;
  let h = `<div class="col"><div class="eyebrow"><b>${D.parts[c.p][0]}</b><span>${esc(D.parts[c.p][1])}</span></div>
    <div class="ch-hero"><div class="ch-num">${String(c.n).padStart(2,'0')}</div><h1 class="ch-title">${esc(c.t)}</h1>${c.s?`<p class="ch-sub">${esc(c.s)}</p>`:'<span></span>'}</div>
    ${fig(cov(c), 'Chapter ' + c.n + ' cover', 'cover wide')}
    <div class="ch-actions"><button class="btn" data-go="${c.n}-${start}">${firstOpen > 0 ? 'Continue chapter' : 'Begin chapter'} →</button>
    <span class="meta">${c.l.length} lessons · about ${mins(w)} minutes · ${chDone(c)} complete</span></div><ul class="lesson-list">`;
  let g = '';
  c.l.forEach((l, i) => {
    if (l.g && l.g !== g){ g = l.g; h += `<li class="grp">${esc(g)}</li>`; }
    h += `<li><button data-go="${c.n}-${i}" class="${done.has(id(c,i))?'done':''}"><span class="ln">${done.has(id(c,i))?'✓':String(i+1).padStart(2,'0')}</span>
      <span class="lt">${esc(l.t)}${KIND[l.k]?`<span class="tag ${l.k}">${KIND[l.k]}</span>`:''}</span><span class="lm">${mins(l.w)} min</span></button></li>`;
  });
  return h + '</ul></div>';
}

function lesson(c, i){
  const l = c.l[i];
  const k = flat.findIndex(([cc, ii]) => cc === c && ii === i);
  const nx = flat[k + 1], pv = flat[k - 1];
  let banner = '';
  if (l.k === 'tests') banner = `<div class="banner tests"><div><b>Take this to your appointment</b>Copy the list below to share with your doctor</div><button class="btn small" id="copyBtn" type="button">Copy list</button></div>`;
  if (l.k === 'worse') banner = `<div class="banner worse"><div><b>Watch for</b>What makes it worse</div></div>`;
  const isDone = done.has(id(c, i));
  let h = `<div class="col lesson-${l.k||'std'}"><div class="eyebrow"><b>Chapter ${c.n}</b><span>${esc(c.t)}</span>${l.g?`<span>· ${esc(l.g)}</span>`:''}</div>
    <h1 class="lesson-title">${esc(l.t)}</h1>
    <div class="meta">Lesson ${i+1} of ${c.l.length} · ${mins(l.w)} min read</div>${banner}
    <article class="prose ${i===0?'opening':''}" id="prose">${l.h}</article>
    <div class="foot"><div class="foot-row">
      <button class="check" id="doneBtn" type="button" aria-pressed="${isDone}"><span class="box"></span>${isDone?'Completed':'Mark lesson complete'}</button>
      ${pv?`<button class="btn ghost small" data-go="${pv[0].n}-${pv[1]}">← Previous</button>`:''}</div>
      ${nx?`<button class="next" data-go="${nx[0].n}-${nx[1]}" data-complete="1"><small>${nx[0]===c?'Up next':'Next chapter · Chapter '+nx[0].n}</small><span>${esc(nx[0]===c?nx[0].l[nx[1]].t:nx[0].t)} →</span></button>`
         :`<button class="next" data-home="1" data-complete="1"><small>You've reached the end</small><span>Back to the course overview →</span></button>`}
    </div></div>`;
  return h;
}

function render(){
  const v = document.getElementById('view');
  let title = D.course.title;
  if (route.v === 'home') v.innerHTML = home();
  else if (route.v === 'ch'){ const c = findCh(route.c); v.innerHTML = chapter(c); title = 'Ch ' + c.n + ' · ' + c.t; }
  else { const c = findCh(route.c); v.innerHTML = lesson(c, route.i); fillSpots(c); title = c.l[route.i].t; store.set(D.key+'-last', id(c, route.i)); }
  document.getElementById('topTitle').textContent = title;
  renderNav(); progress();
  const cur = document.querySelector('.nav-l.on, .nav-ch.on');
  if (cur) cur.scrollIntoView({block:'nearest'});
  bindLesson();
}

function bindLesson(){
  const b = document.getElementById('doneBtn');
  if (b) b.onclick = () => {
    const k = id(findCh(route.c), route.i);
    done.has(k) ? done.delete(k) : done.add(k); saveDone();
    b.setAttribute('aria-pressed', done.has(k)); b.lastChild.textContent = done.has(k) ? 'Completed' : 'Mark lesson complete';
    renderNav(); progress();
  };
  const cp = document.getElementById('copyBtn');
  if (cp) cp.onclick = () => {
    const c = findCh(route.c), text = c.l[route.i].t + '\n\n' + document.getElementById('prose').innerText;
    const ok = () => { cp.textContent = 'Copied'; setTimeout(() => cp.textContent = 'Copy list', 1800); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('prose')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent = 'Selected — press copy'; };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch(e){ fallback(); }
  };
}

function go(r, push){
  route = r;
  const hash = r.v === 'home' ? 'home' : r.v === 'ch' ? 'c' + r.c : 'c' + r.c + '-' + r.i;
  if (push !== false && location.hash.slice(1) !== hash){ try{ history.pushState(null, '', '#' + hash); }catch(e){} }
  document.body.classList.remove('menu');
  render(); window.scrollTo(0, 0);
}
function parse(){
  const h = location.hash.slice(1); let m;
  if ((m = h.match(/^c(\d+)-(\d+)$/)) && findCh(+m[1]) && findCh(+m[1]).l[+m[2]]) return {v:'l', c:+m[1], i:+m[2]};
  if ((m = h.match(/^c(\d+)$/)) && findCh(+m[1])) return {v:'ch', c:+m[1]};
  return {v:'home'};
}
window.addEventListener('popstate', () => go(parse(), false));

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-ch],[data-home],#brand');
  if (!t) return;
  if (t.id === 'brand' || t.dataset.home){ if (t.dataset.complete) markCurrent(); return go({v:'home'}); }
  if (t.dataset.go){
    if (t.dataset.complete) markCurrent();
    const [c, i] = t.dataset.go.split('-').map(Number); return go({v:'l', c, i});
  }
  if (t.dataset.ch){
    const n = +t.dataset.ch;
    if (t.classList.contains('nav-ch')){
      if (open.has(n) && route.c !== n) open.delete(n); else open.add(n);
      store.set(D.key+'-open', [...open]);
      if (route.c !== n) return go({v:'ch', c:n});
      return renderNav();
    }
    return go({v:'ch', c:n});
  }
});
function markCurrent(){ if (route.v === 'l'){ done.add(id(findCh(route.c), route.i)); saveDone(); } }
document.getElementById('search').addEventListener('input', renderNav);
document.getElementById('menuBtn').onclick = () => document.body.classList.toggle('menu');
document.getElementById('scrim').onclick = () => document.body.classList.remove('menu');

go(parse(), false);
})();
</script>

</body>
