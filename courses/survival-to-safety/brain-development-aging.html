large effect; DHA-dominant formulations show essentially none.<sup class=\"fn\">⁶<\/sup> In one trial of people with depression <em>and<\/em> elevated inflammation, four grams of EPA daily produced a <strong>64% response rate versus 40% on placebo.<\/strong><sup class=\"fn\">⁷<\/sup> If you buy fish oil without checking the EPA-to-DHA ratio, you may be taking the version that doesn’t work.<\/p><\/div><\/aside><p><strong class=\"num\">B vitamins — B12, folate, B6.<\/strong> Central to building neurotransmitters. Low levels are consistently associated with depression and with poorer response to antidepressants.<\/p><div class=\"points\"><div class=\"point\"><h4>Vitamin D.<\/h4><p>Deficiency is extraordinarily common, especially in northern latitudes and for anyone who works indoors, and it’s associated with depression. Your skin makes it from sunlight, which most of us no longer get.<\/p><\/div><div class=\"point\"><h4>Iron, zinc, and magnesium.<\/h4><p>Iron deficiency causes fatigue and low mood long before it becomes anemia — and standard testing often misses it, because ferritin (the usual marker) rises with inflammation and can look falsely reassuring in someone who’s inflamed.<\/p><\/div><\/div><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Correcting a genuine deficiency helps the person who is genuinely deficient. Piling nutrients into someone who has plenty does much less. This is an argument for testing — including the functional markers that reveal what standard panels miss — not for buying everything on the shelf.<\/p><\/div><\/aside>"}, {"t": "What you’re carrying", "g": "", "k": "", "w": 1589, "h": "<p>The other half of the equation is what your body is trying to handle.<\/p><p>Start with the fact that reframes this whole subject. <strong>Lead, mercury, cadmium and arsenic have no known use in the human body.<\/strong> There is no amount your physiology requires, no level at which they do something helpful. That is why public health language has moved: the \"level of concern\" for children’s blood lead was abandoned precisely because no safe threshold has ever been identified. Lead and mercury are documented neurotoxins with well-described effects on mood, cognition and behaviour, and there is no serious scientific dispute about that.<\/p><figure class=\"ph\" data-slot=\"ch07-l05\"><\/figure><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img alt=\"\" class=\"bx-av\"/><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>This one is personal for me. Heavy metal toxicity turned out to be part of my own picture, and it was years before anyone thought to look. I am not going to tell you it is probably yours — most of this chapter matters to more people than this section does. But nobody was ever going to check, and that part is worth understanding.<\/p><\/div><\/aside><h3 id=\"why-your-levels-came-back-fine-doesnt-close-it\">Why \"your levels came back fine\" doesn’t close it<\/h3><p>If you have had a blood test for metals, it told you something narrower than you were probably led to believe. <strong>Blood levels largely reflect recent exposure.<\/strong> Lead’s half-life in blood is roughly a month — but in bone it runs to decades, and the large majority of an adult’s burden sits in bone rather than blood. Mercury moves into kidney and brain tissue. Cadmium concentrates in the kidney.<\/p><p>So \"your levels came back fine\" can be entirely true and still uninformative about what you accumulated twenty years ago. Most doctors ordering a blood lead never explain this, not out of carelessness, but because the test is designed to catch current poisoning rather than to reconstruct a history.<\/p><h3 id=\"the-part-you-can-actually-act-on\">The part you can actually act on<\/h3><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Here is the most useful mechanism in this section, and it connects directly to everything earlier in the chapter: <strong>a depleted body absorbs more of what it meets, and is damaged more by it.<\/strong><\/p><\/div><\/aside><p>The biochemistry is specific. <strong>Low iron increases lead absorption<\/strong>, because the intestinal transporter that carries iron also carries lead — and when you are short of iron, your body increases that transporter. <strong>Lead is stored in bone because it behaves chemically like calcium.<\/strong> <strong>Cadmium gets bound by metallothionein in zinc’s place<\/strong> when zinc is scarce. And zinc and selenium status change how much damage a given mercury exposure actually does.<\/p><p>Which means the nutrient work in this chapter is not a separate topic from this one. Correcting iron, zinc and selenium changes how much comes in and how much harm it does on the way through. That is upstream, it is safe, and it is something you can start on.<\/p><h3 id=\"your-history-matters-more-than-your-labs\">Your history matters more than your labs<\/h3><aside class=\"margin-quote\"><span>Key idea<\/span><p>The strongest evidence that you carry a burden is not a test result.<\/p><\/aside><p>The strongest evidence that you carry a burden is not a test result. It is what you have done and where you have lived.<\/p><div class=\"points\"><div class=\"point\"><h4>Occupational:<\/h4><p>welding, smelting, foundry work, battery manufacture, radiator repair, auto body, firing ranges and ammunition reloading, jewellery making, stained glass, ceramics and glazing, and construction or renovation of housing built before 1978.<\/p><\/div><div class=\"point\"><h4>Domestic and dietary:<\/h4><p>well water, old plumbing, imported cosmetics, ayurvedic or traditional remedies, imported spices, glazed pottery and certain cookware, high intake of large predatory fish, retained bullet fragments, home-distilled spirits.<\/p><\/div><\/div><p>There is a reason I am giving you an exposure list rather than a symptom list. The symptoms of metal toxicity — fatigue, irritability, brain fog, poor memory, low mood, trouble concentrating — overlap with almost every condition in this book, and with simply being exhausted. <strong>Written symptom-first, every reader concludes they are poisoned.<\/strong> Written exposure-first, the readers who should pursue this can tell that they should.<\/p><p><strong>And one pattern worth pushing on.<\/strong> Psychiatric symptoms <em>plus<\/em> new neurological signs — tremor, a change in your walk, slurred speech, unusual movements, numbness or tingling in hands or feet — <em>plus<\/em> poor response to standard treatment. That combination deserves a proper look.<\/p><h3 id=\"who-actually-does-this-work\">Who actually does this work<\/h3><p>A standard psychiatric workup is a blood count, a metabolic panel, thyroid, B12, folate and vitamin D. Metals are not on it. They are not in the guidelines, and they are not in most psychiatrists’ training. A person can spend fifteen years cycling through medications with an untouched exposure in their daily life and never once be asked what they do for a living.<\/p><p>That is a real gap, and it is worth naming. But the more useful thing is that a specialty exists for exactly this, and almost nobody has heard of it: <strong>occupational and environmental medicine physicians, and medical toxicologists.<\/strong> Regional poison control centres take referrals and give advice. In the US there is a clinic network run by the Association of Occupational and Environmental Clinics, and the Pediatric Environmental Health Specialty Units for children.<\/p><p>If your exposure history is genuinely concerning, that is who to ask for — not a functional-medicine panel and not a general practitioner who will order a single blood lead and reassure you.<\/p><h3 id=\"chelation-provoked-testing-and-the-industry-around-them\">Chelation, provoked testing, and the industry around them<\/h3><p>Two things get conflated here, and separating them matters.<\/p><p><strong>Chelation is established medicine.<\/strong> Succimer and calcium EDTA for lead, penicillamine and trientine for Wilson’s disease, deferoxamine for iron overload. Real protocols, real monitoring, done by physicians and medical toxicologists for demonstrated toxicity.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>780 children<\/b><span>with genuinely elevated blood lead to succimer or placebo<\/span><\/div><div class=\"bx-body\"><p>What has <em>not<\/em> been shown is that it improves psychiatric symptoms in someone whose metal burden has not been established. The landmark trial randomised 780 children with genuinely elevated blood lead to succimer or placebo. It lowered their blood lead substantially — and produced <strong>no improvement in cognition, behaviour or neuropsychological function<\/strong> at three years, and none again at ages seven and seven and a half.<sup class=\"fn\">¹²<\/sup> The investigators’ own conclusion was that what matters is finding and stopping the exposure. And done outside a proper framework, chelation has killed people: three children died of cardiac arrest from calcium depletion between 2003 and 2005, at least one from the wrong drug being used.<sup class=\"fn\">¹³<\/sup><\/p><\/div><\/aside><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>The line is: establish the burden first, then treat it with someone qualified to monitor you.<\/p><\/aside><p>Then there is <strong>provoked or challenge testing<\/strong> — you are given a chelating agent and your urine is collected afterwards. You should know both halves of this, because they are both true. The physiology behind it is sound: stored burden is real and blood does not show it. The objection is a measurement problem. Chelating agents mobilise metals from people with entirely unremarkable body burdens as well as high ones, and the results are then compared against reference ranges built from <em>unprovoked<\/em> samples. So nearly everyone tests high — which means a positive result cannot distinguish the person whose symptoms are metal-driven from the person whose are not. The American College of Medical Toxicology states plainly that the practice has not been validated, has no demonstrated benefit, and may be harmful — partly because some agents can <em>redistribute<\/em> mercury toward organs rather than removing it.<sup class=\"fn\">¹⁴<\/sup><\/p><p>If someone offers you this route, you are entitled to know it comes back high in nearly everybody. Being told both things is what makes the decision yours.<\/p><h3 id=\"what-doesnt-work\">What doesn’t work<\/h3><p><strong>Detox protocols and cleanses.<\/strong> There is no evidence that herbal detox regimens, cleanses or binder protocols improve mental health. The cost is not only money — it is the months or years spent on them while whatever is actually driving your symptoms goes untouched.<\/p><p><strong>Hair analysis<\/strong> is unreliable for most metals.<\/p><p><strong>Supplements as excretion agents.<\/strong> No human evidence shows that any supplement meaningfully improves clinical outcomes by increasing metal excretion. I will come back to what supplements <em>are<\/em> good for in a moment, because it is not nothing — it is just a different claim.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 3l9.5 17h-19z\"><\/path><path d=\"M12 10v4M12 17.5v.5\"><\/path><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p><strong>And one specific, checkable harm.<\/strong> Binders taken close to a medication reduce how much of that medication you absorb. If you take lithium, lamotrigine, an antipsychotic, thyroid hormone or an antidepressant, a binder protocol can quietly drop your blood levels — and when you destabilise, it gets blamed on the illness rather than the supplement. If you are on anything, separate it by hours and tell your prescriber.<\/p><\/div><\/aside><h3 id=\"what-is-worth-doing\">What is worth doing<\/h3><p>You cannot force metals out. What you can do is stop what is coming in, and make sure your body has the raw materials it uses to handle what is already there.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Test, replete, retest<\/h4><div class=\"bx-body\"><p>Reduce the intake: water filtration, food quality, what you put on your skin, what you store and cook food in, and addressing any occupational or hobby exposure you identified above. <strong>Then replete what is low<\/strong> — iron, zinc, selenium, magnesium, B12, folate, adequate protein, and the glycine and NAC your body uses to make glutathione. Test, replete, retest.<\/p><\/div><\/aside><p>Real cautions, and only these: long-term zinc without copper causes copper deficiency; selenium has a narrow safe window; and do not supplement iron without knowing you are low, because iron overload is its own disease.<\/p><p>Notice that this is the same list the rest of the chapter already gave you, and it is well evidenced for mood in its own right. Which means you do the same things either way — the difference is that I am not going to tell you they are pulling metal out of your tissue, because that has not been shown.<\/p><p><strong>Endocrine-disrupting chemicals<\/strong> — BPA, phthalates and certain pesticides — are a recognised category of compounds that interfere with hormone signalling. Given how much hormones shape mood, and given the section coming up shortly, that matters here. The response is the same: reduce what comes in rather than attempt to purge what is already there.<\/p>"}, {"t": "The barrier around your brain", "g": "", "k": "", "w": 288, "h": "<p>Your brain has its own security perimeter, called the blood-brain barrier. It’s a tightly sealed lining of blood vessels that decides what may pass from your bloodstream into brain tissue, keeping toxins, pathogens, and inflammatory molecules out while letting nutrients through.<\/p><p>That barrier is built from <strong>the same family of proteins as your gut lining<\/strong> — which connects this chapter directly to the last one. The tight junctions that seal the gut — claudins, occludin, ZO-1 — are the same machinery sealing the brain. Which is why the same forces damage both. In animals subjected to psychological stress alone, researchers found these proteins reduced in the intestinal barrier <em>and<\/em> the blood-brain barrier simultaneously.<sup class=\"fn\">⁸<\/sup><\/p><figure class=\"ph\" data-slot=\"ch07-l06\"><\/figure><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>277,000<\/b><span>interacted with recent life stress to predict depressive symptoms<\/span><\/div><div class=\"bx-body\"><p>And when the brain’s barrier loosens, inflammatory molecules from the body cross into brain tissue. In stressed animals with reduced levels of claudin-5, the key sealing protein, inflammatory signals infiltrated brain regions governing mood and reward — and depression-like behavior followed.<sup class=\"fn\">⁹<\/sup> In humans, post-mortem examination has found claudin-5 substantially reduced in the brains of people who had untreated depression.<sup class=\"fn\">¹⁰<\/sup> A study drawing on more than 277,000 people found that variations in the genes for this barrier protein and for a key inflammatory molecule interacted with recent life stress to predict depressive symptoms.<sup class=\"fn\">¹¹<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Leaky gut, leaky brain — not a slogan, but the same proteins failing in two places for the same reasons.<\/p><\/aside><p>This is what “your gut affects your brain” actually means at the level of plumbing. A compromised gut lets bacterial components and inflammatory signals into the bloodstream. Those signals, plus chronic stress, degrade the brain’s barrier. And what crosses that barrier drives inflammation in brain tissue itself, disrupting the signaling that governs mood. Leaky gut, leaky brain — not a slogan, but the same proteins failing in two places for the same reasons.<\/p>"}, {"t": "Hormones: the ones nobody checked", "g": "", "k": "", "w": 946, "h": "<p>This section matters especially if you’re a woman who has been told her symptoms are stress.<\/p><h3 id=\"thyroid\">Thyroid<\/h3><p>Your thyroid sets the metabolic pace of every cell in your body, brain included. When it runs low, the result looks like depression: exhaustion, heaviness, slowed thinking, low mood, weight gain, cold intolerance. This connection is not disputed.<\/p><figure class=\"ph\" data-slot=\"ch07-l07\"><\/figure><p>What’s worth knowing is the gray zone. Standard practice checks a marker called TSH and calls anything inside the reference range normal — but that range is wide, and where you sit within it appears to matter. In depression that hasn’t responded to treatment, a TSH in the <em>high-normal<\/em> range is specifically associated with poorer antidepressant response.<sup class=\"fn\">¹²<\/sup> And adding thyroid hormone to standard treatment has real evidence behind it for depression that hasn’t responded — enough that it’s an established option in psychiatry, not an alternative one.<sup class=\"fn\">¹³<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The people looking at symptoms and the people looking at numbers reach different conclusions.<\/p><\/aside><p>And here’s a finding that speaks directly to this whole chapter: when researchers surveyed clinicians, psychiatrists and general practitioners agreed there is a frequent discrepancy between thyroid lab results and how patients actually feel — while endocrinologists disagreed.<sup class=\"fn\">¹⁴<\/sup> The people looking at symptoms and the people looking at numbers reach different conclusions. If you’ve felt caught between those two views, you weren’t imagining it.<\/p><p>There’s a bigger question underneath all of this, and almost nobody asks it: <em>why<\/em> is your thyroid struggling in the first place?<\/p><p>Standard treatment replaces the hormone. It does not ask what went wrong. And that matters, because plenty of people take thyroid medication, watch their lab numbers normalize, and still feel terrible. That’s especially common with Hashimoto’s, the autoimmune condition behind most low thyroid function in this country — where the immune system is attacking the thyroid gland itself. Replacing the hormone does nothing about the immune attack that’s destroying the gland, or about whatever set that attack in motion. The number on the page improves. The underlying process continues.<\/p><p>And sometimes a thyroid slows down on purpose. When your body is under sustained stress, fighting illness, inflamed, or short on the raw materials it needs, it deliberately dials down thyroid activity — converting less of the storage form of the hormone into the active form your cells actually use. This is a well-documented response, and it is not a malfunction. It’s your body deciding that now is not the time to run the engine at full speed.<\/p><p>If that’s what’s happening, adding more thyroid hormone is answering the wrong question. Your body isn’t failing to produce enough — it’s choosing to produce less, because at the cellular level it can’t handle more. That’s a signal about the state of your cells, your nutrient status, your inflammation, and your stress load, and it’s pointing at something more widespread than one gland. Your thyroid also needs specific raw materials to do its job and to convert the hormone into its usable form — selenium, zinc, iron, iodine, tyrosine. If those are missing, no prescription fills the gap.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>None of this means thyroid medication is wrong. For many people it’s necessary and genuinely helps. But if you’re taking it and still don’t feel well, that is information — not a sign that you’re beyond help.<\/p><\/div><\/aside><h3 id=\"the-hormones-that-rise-and-fall\">The hormones that rise and fall<\/h3><p>For women, there’s a driver that gets missed with remarkable consistency, and it explains a great deal of suffering.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>one and a half to three times<\/b><span>to experience a first episode or a recurrence of depression than premenopausal women<\/span><\/div><div class=\"bx-body\"><p>Depression risk rises sharply during perimenopause — the transition that typically begins in the early-to-mid forties and lasts several years before periods stop. Population studies find women in this window are roughly <strong>one and a half to three times more likely<\/strong> to experience a first episode or a recurrence of depression than premenopausal women,<sup class=\"fn\">¹⁵<\/sup> and a meta-analysis found perimenopausal women about twice as likely to be diagnosed with depression or to report symptoms.<sup class=\"fn\">¹⁶<\/sup><\/p><\/div><\/aside><p>And the mechanism is why so many women get dismissed. The problem is not that estrogen is low. It’s that estrogen becomes <strong>erratic<\/strong> — during perimenopause, women experience far more rapid and extreme swings, with higher peaks and lower troughs, than in a normal menstrual cycle.<sup class=\"fn\">¹⁸<\/sup> It’s the volatility that destabilizes mood, and researchers have linked greater week-to-week fluctuation to more depression, anxiety, sadness, and anger.<sup class=\"fn\">¹⁹<\/sup><\/p><p>Now connect that back to where this chapter started. If the problem is fluctuation, what does a single blood test on a single day tell you? Almost nothing. You can catch a woman mid-swing and pronounce her hormones normal, and be entirely accurate about that one moment while completely missing the pattern making her ill. This is the “your labs are normal” problem in its purest form — and it’s why so many women in their forties are handed an antidepressant and a suggestion to reduce stress when the actual driver is a hormonal transition nobody measured properly.<\/p><p>Progesterone matters here too — it supports the brain’s main calming system, and as it declines and destabilizes, anxiety and insomnia often arrive together. That combination — newly anxious, sleeping badly, more emotionally reactive than you’ve ever been, in your forties — is one of the most commonly misread patterns in medicine.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>If you recognize yourself: you are not losing your mind, and you are not weak. Your brain is operating in an endocrine environment that has genuinely changed.<\/p><\/div><\/aside><h3 id=\"cortisol-and-testosterone\">Cortisol and testosterone<\/h3><p>Cortisol, the main stress hormone, follows a daily rhythm that chronic stress disrupts, affecting sleep, energy, and mood. And testosterone — relevant to men and women both — is tied to motivation, drive, and mood, and declines with age, chronic stress, and illness.<\/p>"}, {"t": "Blood sugar: the driver hiding in plain sight", "g": "", "k": "", "w": 168, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Some anxiety is manufactured in the kitchen.<\/p><\/aside><p>Some anxiety is manufactured in the kitchen.<\/p><p>When you eat refined carbohydrates or sugar, blood glucose spikes, insulin surges, and glucose then drops — sometimes below where it started. Your body treats a falling blood sugar as an emergency and releases adrenaline and cortisol to correct it. The result feels like anxiety, because physiologically it <em>is<\/em> the same event: racing heart, shakiness, irritability, sudden dread, difficulty concentrating. Ride that rollercoaster several times a day and you get a nervous system that never settles, with mood swings that seem to come from nowhere.<\/p><p>Longer term, insulin resistance impairs the brain’s ability to use fuel efficiently and is associated with depression and cognitive decline. Your brain runs on glucose; when the delivery system stops working properly, the organ that needs it most is affected.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>This one is worth checking specifically, because standard fasting glucose is a late signal — insulin resistance can be developing for years before it shows up there. Fasting insulin and hemoglobin A1c give a much earlier picture.<\/p><\/div><\/aside>"}, {"t": "The hit nobody connects", "g": "", "k": "", "w": 122, "h": "<p>One more, because it’s remarkably easy to miss: head injuries.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>If you’ve had one, it belongs in your picture.<\/p><\/aside><p>A concussion from a car accident, a fall, a sport, or an assault — even one that seemed minor and was never formally diagnosed — substantially raises the risk of depression afterward. In one study following people through the year after a traumatic brain injury, <strong>roughly one in three developed major depression<\/strong> — several times the rate among comparable people who hadn’t been injured.<sup class=\"fn\">¹¹⁰<\/sup> Anxiety and impulsivity often travel with it, and symptoms can emerge long after the injury. Because the injury may have been years or decades ago and seemed to resolve, almost nobody connects it to how they feel now. If you’ve had one, it belongs in your picture.<\/p>"}, {"t": "What to actually ask for", "g": "", "k": "tests", "w": 415, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>You need to leave it with better questions than “am I depressed.”<\/p><\/aside><p>You don’t need to memorize this chapter. You need to leave it with better questions than “am I depressed.”<\/p><p>Worth asking your doctor about: a full thyroid panel rather than TSH alone; vitamin B12 with functional markers like methylmalonic acid or homocysteine, which reveal deficiency that a normal serum B12 can hide; vitamin D; ferritin <em>along with<\/em> an inflammatory marker like CRP, so a falsely reassuring number gets caught; magnesium (ideally red-blood-cell magnesium rather than serum); fasting insulin and hemoglobin A1c; and, if relevant to your age and symptoms, hormone testing that accounts for cycle timing rather than a single random draw.<\/p><p><strong>And one question that isn’t a lab test at all.<\/strong> If anything in the exposure list earlier in this chapter applied to you — your work, your water, your housing, your hobbies — say it out loud at the appointment. <em>I work in a foundry. My house was built in 1950 and we renovated it ourselves. We’re on a well.<\/em> That sentence does more than any panel, because it is the thing nobody thinks to ask and the thing that decides whether looking further is worth it.<\/p><p>And if it is worth pursuing, ask to be referred to <strong>occupational and environmental medicine<\/strong> or a <strong>medical toxicologist<\/strong>. Your regional poison control centre will also take a call and advise. Most people have never heard of any of these, which is precisely why they go unused.<\/p><p>And when you get results, the question to ask isn’t just “is it normal.” It’s “where in the range is it, and is that optimal for someone with my symptoms?” A number at the very bottom of normal is still normal. It may not be adequate for you.<\/p><p>If you are dismissed, that isn’t proof there’s nothing to find. It may mean you need someone willing to look further.<\/p><p>We’ve now walked the roots: the patterns you learned, the emotional weight your nervous system still carries, your gut and immune system, and the physical drivers in this chapter. You know what’s happening and why.<\/p><p class=\"closing\">Which brings us to the part you actually came for. Everything from here is about what to do — how to calm a nervous system stuck in survival, how to feed and move and sleep in a way that restores rather than depletes, how to think honestly about treatment, and how connection and purpose rebuild what depletion took. Understanding was never the destination. It was the map.<\/p>"}, {"t": "The research", "g": "", "k": "refs", "w": 1237, "h": "<ul class='refs'><li>Costello, R. B., Elin, R. J., Rosanoff, A., et al. (2016). Perspective: the case for an evidence-based reference interval for serum magnesium. <em>Advances in Nutrition, 7<\/em>(6), 977–993. <em>(Serum magnesium reflects roughly 1% of total body magnesium and is tightly regulated, making it a poor indicator of tissue status.)<\/em><\/li><li>Allen, J., Romay-Tallon, R., Brymer, K. J., Caruncho, H. J., &amp; Kalynchuk, L. E. (2018). Mitochondria and mood: mitochondrial dysfunction as a key player in the manifestation of depression. <em>Frontiers in Neuroscience, 12,<\/em> 386. <em>(Impaired cellular energy production as a factor in depression.)<\/em><\/li><li>Vitamin B12 deficiency presenting as psychotic symptoms in a psychiatry department: a case report. <em>(2024).<\/em> PMC10787274. <em>(34-year-old man diagnosed with major depression, unresponsive to antidepressants, who developed psychosis; serum B12 measured 10 pmol/L against a reference range of 133–675.)<\/em><\/li><li>Dogan, M., Ariyuca, S., Peker, E., et al. (2012). Psychotic disorder, hypertension and seizures associated with vitamin B12 deficiency: a case report. <em>Human &amp; Experimental Toxicology, 31<\/em>(4), 410–413. <em>(16-year-old treated with B12 injections alone — no antipsychotics, antihypertensives, or anticonvulsants — with full resolution of psychosis, seizures, hypertension, and depressed mood within seven days.)<\/em><\/li><li>Vitamin B12 and psychiatric illness. <em>Annals of Long-Term Care.<\/em> <em>(Review: B12 deficiency associated with depression, mania, psychosis, delirium and dementia, frequently in the absence of the anemia or neurological signs that would suggest the diagnosis.)<\/em><\/li><li>Liao, Y., Xie, B., Zhang, H., et al. (2019). Efficacy of omega-3 PUFAs in depression: a meta-analysis. <em>Translational Psychiatry, 9<\/em>(1), 190. <em>(26 trials; modest overall benefit, but formulations of ≥60% EPA showed a large effect while DHA-dominant formulations showed none.)<\/em> See also Sublette, M. E., et al. (2011), <em>Journal of Clinical Psychiatry.<\/em><\/li><li>Mischoulon, D., et al. (2022). Omega-3 fatty acids for major depressive disorder with high inflammation: a randomized dose-finding clinical trial. <em>Journal of Clinical Psychiatry.<\/em> <em>(In adults with depression and elevated CRP, EPA 4 g/day produced a 64% response rate versus 40% on placebo.)<\/em><\/li><li>Gut microbiota are associated with psychological stress-induced defections in intestinal and blood–brain barriers. <em>Frontiers in Microbiology<\/em> (2020). PMID 32010111. <em>(Psychological stress reduced tight junction proteins — claudin-5, occludin, ZO-1 — in the intestinal barrier and the blood–brain barrier simultaneously.)<\/em><\/li><li>Menard, C., Pfau, M. L., Hodes, G. E., et al. (2017). Social stress induces neurovascular pathology promoting depression. <em>Nature Neuroscience, 20<\/em>(12), 1752–1760. <em>(Stress-induced loss of claudin-5 allowed peripheral inflammatory signals into mood-regulating brain regions, producing depression-like behavior.)<\/em><\/li><li>Post-mortem findings of reduced claudin-5 expression in the nucleus accumbens of untreated depressed individuals and the ventromedial prefrontal cortex of women with depression, reported in Menard et al. (2017) and Dudek et al. (2020), <em>PNAS.<\/em><\/li><li>Inflammation and blood-brain barrier in depression: interaction of CLDN5 and IL6 gene variants in stress-induced depression. <em>(2023).<\/em> PMC10032304. <em>(UK Biobank, n = 277,501; gene variants for the barrier protein and for interleukin-6 interacted with recent stressful life events to predict depressive symptoms — first human evidence for the mechanism.)<\/em><\/li><li>Antidepressant-resistant depression in patients with comorbid subclinical hypothyroidism or high-normal TSH levels. <em>American Journal of Psychiatry<\/em> (2018). <em>(High-normal TSH specifically associated with poorer antidepressant response.)<\/em><\/li><li>Lorentzen, R., Kjaer, J. N., Ostergaard, S. D., &amp; Madsen, M. M. (2020). Thyroid hormone treatment in the management of treatment-resistant unipolar depression: a systematic review and meta-analysis. <em>Acta Psychiatrica Scandinavica, 141<\/em>(4), 316–326.<\/li><li>Treating subclinical hypothyroidism in individuals with or without mental health problems — a Delphi-based expert consensus study in two countries. <em>(2023).<\/em> PMC10369346. <em>(Psychiatrists and general practitioners agreed there is frequent discrepancy between thyroid laboratory results and clinical symptoms; endocrinologists disagreed.)<\/em><\/li><li>Community-based epidemiological studies document a 1.5–3-fold greater risk of first-onset and recurrent depression during perimenopause compared with premenopausal or later postmenopausal women. See Cohen, L. S., et al. (2006), <em>Archives of General Psychiatry, 63<\/em>(4), 385–390; Freeman, E. W., et al. (2006), <em>Archives of General Psychiatry, 63<\/em>(4), 375–382.<\/li><li>Weber, M. T., Maki, P. M., &amp; McDermott, M. P. (2014). Cognition and mood in perimenopause: a systematic review and meta-analysis. <em>Journal of Steroid Biochemistry and Molecular Biology, 142,<\/em> 90–98. <em>(Perimenopausal women roughly twice as likely to experience depression diagnosis or symptoms.)<\/em><\/li><li>Estradiol modulates resting-state connectivity in perimenopausal depression (2024). <em>(During perimenopause, day-to-day estradiol changes are more rapid and of greater magnitude — higher peaks and lower troughs — than in premenopausal cycles.)<\/em><\/li><li>Gordon, J. L., Peltier, A., Grummisch, J. A., &amp; Sykes Tottenham, L. (2019). Estradiol fluctuation, sensitivity to stress, and depressive symptoms in the menopause transition: a pilot study. <em>Frontiers in Psychology, 10,<\/em> 1319. <em>(Greater week-to-week estradiol change predicted increases in depressive symptoms, sadness, hopelessness, anxiety, and anger.)<\/em><\/li><li>Jorge, R. E., Robinson, R. G., Moser, D., et al. (2004). Major depression following traumatic brain injury. <em>Archives of General Psychiatry, 61<\/em>(1), 42–50. <em>(Substantially elevated rates of depression following traumatic brain injury, including milder injuries.)<\/em><\/li><li>Rogan, W. J., Dietrich, K. N., Ware, J. H., et al. (2001). The effect of chelation therapy with succimer on neuropsychological development in children exposed to lead. <em>New England Journal of Medicine, 344<\/em>, 1421–1426, with long-term follow-up. <em>(780 children with blood lead 20–44 µg/dL randomised to succimer or placebo. Succimer lowered blood lead substantially faster than placebo but produced no benefit on cognition, behaviour or neuropsychological function at three years, and none again at ages 7 and 7½. Powered to detect less than a 3-point IQ change; blood lead was indistinguishable between groups at one year. The investigators concluded the important strategy is identifying and terminating the source of exposure. A solid negative finding — cite it whenever reversal is claimed. See also Stangle et al. (2007), Environmental Health Perspectives 115:201–209, in which succimer given to rats never exposed to lead produced lasting cognitive and affective dysfunction comparable to high lead exposure — rodent evidence, but the strongest available argument against chelating without established burden.)<\/em><\/li><li>CDC MMWR (2006) 55:204–207; Brown, M. J., et al. (2006), <em>Pediatrics<\/em> 118:e534–536; Baxter, A. J., &amp; Krenzelok, E. P. (2008), <em>Clinical Toxicology<\/em> 46:1083–1084. <em>(Three deaths from hypocalcaemia-induced cardiac arrest during chelation between 2003 and 2005, including a five-year-old given edetate disodium instead of edetate calcium disodium — the exact substitution the CDC had warned against since 1991. These are medication errors and inappropriate-indication cases, not evidence against properly indicated chelation, and should not be used to imply all chelation is dangerous.)<\/em><\/li><li>American College of Medical Toxicology (2010). Position statement on post-chelator challenge urinary metal testing. <em>Journal of Medical Toxicology, 6<\/em>(1). <em>(States that post-chelator-challenge urinary metal testing has not been scientifically validated, has no demonstrated benefit, and may be harmful. The objection is a measurement problem: chelating agents mobilise metals in people with normal reference-population body burdens as well as high ones, including essential elements such as zinc, and results are compared against non-provoked reference ranges. Also notes DMSA and DMPS may promote redistribution of mercury to target organs. Endorsed in the same direction by the Pediatric Environmental Health Specialty Units and the American Academy of Clinical Toxicology. This is a professional position statement rather than a trial. For balance: the same body endorses chelation for documented toxicity, and it has no commercial interest to protect — the revenue in provoked testing flows to the labs and clinics selling the panels.)<\/em><\/li><\/ul>"}]}, {"n": 8, "t": "Calming Your Nervous System", "s": "Where the work actually begins", "p": 2, "l": [{"t": "Opening", "g": "", "k": "", "w": 80, "h": "<p>Everything up to now has been about understanding. This is where we start doing.<\/p><p>And we start here, before food or sleep or anything else, for a specific reason: a nervous system stuck in survival mode makes every other change harder. You can’t make good decisions about what to eat while your body thinks it’s in danger. You can’t rest. You can’t sustain much of anything. Settle the alarm first, and everything after it gets easier.<\/p>"}, {"t": "Why you can’t think your way out of this", "g": "", "k": "", "w": 115, "h": "<p>Remember what happens when the alarm goes off: your thinking brain gets turned down. Not metaphorically — the region responsible for reasoning and perspective becomes less active precisely when you need it most, because in a real emergency your body wants reflexes, not reflection.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>You’re trying to reason with a system that has temporarily taken reasoning offline.<\/p><\/aside><p>This is why “just calm down” has never worked. Why knowing your fear is irrational doesn’t dissolve it. Why you can understand your entire history and still feel the same panic at three in the morning. You’re trying to reason with a system that has temporarily taken reasoning offline.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So we go in a different door. We start with the body, because the body is the door that stays open.<\/p><\/div><\/aside>"}, {"t": "Your nervous system doesn’t speak English", "g": "", "k": "", "w": 92, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Your nervous system doesn’t respond to arguments.<\/p><\/aside><p>Your nervous system doesn’t respond to arguments. It responds to <em>evidence<\/em>. It’s constantly reading your body for signals about whether you’re safe — how you’re breathing, what your face is doing, whether you’re moving, what you’re hearing, whether other people are near. It draws its conclusions from that data, not from what you tell yourself.<\/p><p>Which means you can’t convince your body it’s safe. But you can <em>show<\/em> it. Every tool below is a way of feeding your nervous system evidence it will actually accept.<\/p>"}, {"t": "Start here: the exhale", "g": "", "k": "start", "w": 234, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Slow breathing with a long exhale tells it the threat has passed.<\/p><\/aside><p>Your breath is the only part of your autonomic nervous system you can operate on purpose, and it works in both directions. Quick, shallow, high-chested breathing tells your body you’re under threat. Slow breathing with a long exhale tells it the threat has passed.<\/p><p>This isn’t a relaxation technique in the vague sense. It’s mechanical. When you inhale, your heart rate rises slightly; when you exhale, it falls. Make your exhale longer than your inhale and you are directly, physically slowing your heart and shifting your body toward its rest state. Your body reads that shift as <em>the danger is over.<\/em><\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">The practice<\/h4><div class=\"bx-body\"><p><strong>The practice:<\/strong> breathe in through your nose for about four counts. Breathe out slowly through your mouth for about eight — longer than the inhale, that’s the only rule that matters. Repeat five or six times. That’s it. That’s a minute.<\/p><\/div><\/aside><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>five minutes a day<\/b><span>produced the greatest improvement in mood and the largest drop in breathing rate<\/span><\/div><div class=\"bx-body\"><p>There’s a variation with particularly good research behind it, sometimes called the physiological sigh: a normal inhale through the nose, then a second short sip of air on top of it, then a long slow exhale. In a study comparing breathing practices to mindfulness meditation, just five minutes a day of this pattern produced the greatest improvement in mood and the largest drop in breathing rate.<sup class=\"fn\">¹<\/sup> Five minutes. It outperformed meditation.<\/p><\/div><\/aside><p>Three times a day, and any time you notice you’re winding up.<\/p>"}, {"t": "Other ways in", "g": "", "k": "", "w": 150, "h": "<p>Your vagus nerve — the main cable carrying calm signals between your brain and body — runs past your throat, your ears, and your face. Which gives you several unusual back doors.<\/p><p><strong>Hum, sing, or gargle.<\/strong> The vagus nerve passes right by your vocal cords, and the vibration stimulates it. This is part of why singing in the car feels good, and why humming settles people. It’s not sentimental. It’s mechanical.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Cold water on your face<\/h4><div class=\"bx-body\"><p><strong>Cold water on your face.<\/strong> Splashing cold water on your face, or holding something cold against your cheeks and the bridge of your nose, triggers a reflex that slows your heart rate. Humans share it with diving mammals. It’s remarkably fast — useful when you’re spiraling and need something in thirty seconds.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Stress hormones are meant to be burned through movement; when we sit still with them, they linger.<\/p><\/aside><p><strong>Move.<\/strong> Walking, stretching, shaking out your hands and arms. Stress hormones are meant to be burned through movement; when we sit still with them, they linger.<\/p>"}, {"t": "Coming back to the room", "g": "", "k": "", "w": 122, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Grounding brings you back to the present, which is usually the only moment in which you’re actually safe.<\/p><\/aside><p>When your system is activated, you’re not really <em>here<\/em> — you’re braced for something that isn’t happening, or replaying something that already did. Grounding brings you back to the present, which is usually the only moment in which you’re actually safe.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Look slowly around the room. Let your eyes land on things without hurrying — the window, a lamp, the door. Say to yourself what you see. Feel your feet on the floor and your weight in the chair. Notice the temperature of the air.<\/p><\/div><\/aside><p>This seems too simple to matter. What it does is give your nervous system direct sensory proof that you’re in a room, in this moment, and nothing is happening. That’s evidence it accepts.<\/p>"}, {"t": "When you’re shut down, calm is the wrong instruction", "g": "", "k": "", "w": 238, "h": "<p>If you recognized yourself in the freeze response earlier in this book, this section matters more than any other.<\/p><p>Every piece of advice about anxiety assumes you’re revved up. Slow down. Breathe. Relax. Rest. And if you’re anxious, that’s correct.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Telling a frozen person to calm down is like telling someone who’s already asleep to rest harder.<\/p><\/aside><p>But if you’re in shutdown — flat, numb, exhausted, unable to make yourself do anything — then “relax more” is exactly the wrong prescription. You are not over-activated. You are under-activated. Your system has pulled the emergency brake and left it on. Telling a frozen person to calm down is like telling someone who’s already asleep to rest harder.<\/p><p>Shutdown needs <strong>gentle activation<\/strong>. Small, careful doses of movement, warmth, light, sound, and connection — enough to bring the system back online without overwhelming it.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>What that looks like: standing up and stretching. Walking to the end of the street. Sunlight on your face. Warm water. Music with a beat. Calling someone. Anything that says <em>come back<\/em> rather than <em>stay down<\/em>.<\/p><\/div><\/aside><p>The word that matters is <strong>gentle<\/strong>. A shut-down system doesn’t respond well to being forced — pushing hard usually causes a harder crash. Small and frequent beats big and occasional, every time.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So learn to ask which state you’re in before you choose a tool. Wound up? Slow it down. Shut down? Warm it up, gently. Using the wrong tool for your state is why so much standard advice has failed you.<\/p><\/div><\/aside>"}, {"t": "Movement you actually enjoy", "g": "", "k": "", "w": 361, "h": "<p>There’s a category of medicine here that gets overlooked because it looks like fun.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>When you move because you’re enjoying it, you’re giving your nervous system the clearest possible evidence that engaging with the world is safe again.<\/p><\/aside><p>Freeze is immobilization — the body deciding that stillness is the safest option available. The physiological opposite is moving <em>by choice<\/em>, toward something you want. When you move because you’re enjoying it, you’re giving your nervous system the clearest possible evidence that engaging with the world is safe again. That’s a completely different message than dragging yourself through a workout you dread.<\/p><figure class=\"ph\" data-slot=\"ch08-l08\"><\/figure><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>eight studies<\/b><span>every single study showed improvement<\/span><\/div><div class=\"bx-body\"><p>The research on dance holds up better than most people would guess. In a review of eight studies of adults with depression, <strong>every single study showed improvement<\/strong> — with an effect size around 0.64, meaning the average person who danced ended up better off than roughly three-quarters of those who didn’t. In one of those studies, participants moved from moderate depression down to minimal symptoms. And the benefits were still there three months after the dancing stopped.<sup class=\"fn\">²<\/sup> A larger analysis of forty-one studies confirmed the pattern across depression, anxiety, and general well-being.<sup class=\"fn\">³<\/sup> It makes sense when you consider what dancing actually stacks together: movement, rhythm, music, often other people, and pleasure. Several regulation levers pulled at once.<\/p><\/div><\/aside><p>Worth noticing: dance isn’t in most clinical guidelines. The researchers themselves explain why — not because it failed, but because, in their words, expensive multi-center trials are rare in a small and underfunded field. Nobody sells dancing.<\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img alt=\"\" class=\"bx-av\"/><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>For me, this has been one of the most powerful pieces of my own recovery. Dancing especially. Hiking. Pickleball. Things I actually want to do, that involve my body and other people, and that don’t feel like a chore I’m forcing myself through.<\/p><\/div><\/aside><p><strong>One important caution:<\/strong> dose it to where your body actually is. If you’re dealing with significant fatigue or a chronic illness, pushing too hard genuinely backfires — you can lose days to it. This is not a call to exert yourself into the ground. It’s a call to move in a way that leaves you feeling <em>better<\/em> than when you started. That line is different for everyone, and it moves as you heal. Respect it.<\/p>"}, {"t": "Light", "g": "", "k": "", "w": 130, "h": "<p>One of the simplest levers you have, and one of the most neglected.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Your body genuinely doesn’t know what time it is.<\/p><\/aside><p>Your body runs on a daily clock that governs sleep, energy, hormones, and mood — and that clock is set primarily by light hitting your eyes. Most of us now live in a strange lighting environment: dim indoor light all day, bright screens all evening. Your body genuinely doesn’t know what time it is.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>Get outside within an hour of waking, for ten to twenty minutes.<\/strong> Even on a cloudy day, outdoor light is far brighter than anything indoors. Then dim things down in the evening. This one costs nothing, takes almost no time, and it’s often the single change that makes sleep start working again — which we’ll come back to in the next chapter.<\/p><\/div><\/aside>"}, {"t": "Sound", "g": "", "k": "", "w": 137, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Music you love is regulating, and you already know that.<\/p><\/aside><p>Music you love is regulating, and you already know that.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>fourteen trials<\/b><span>binaural beats produced a large reduction in anxiety compared with silence or plain audio<\/span><\/div><div class=\"bx-body\"><p>Beyond that, there’s a technique worth knowing about: binaural beats, where slightly different frequencies played in each ear produce a rhythm your brain responds to. The evidence is real — pooling fourteen trials, listening to binaural beats produced a large reduction in anxiety compared with silence or plain audio, on a scale comparable to what anti-anxiety medication achieves in similar settings.<sup class=\"fn\">⁴<\/sup> Most of that research is in medical settings, so consider it well-supported for calming acute anxiety and promising for everyday use.<\/p><\/div><\/aside><p>Practically: it needs headphones, and the frequencies studied for relaxation sit in the alpha range. There are countless free recordings. It costs nothing and does no harm, so it’s worth ten minutes to find out whether it does something for you.<\/p>"}, {"t": "Meditation for a brain that won’t hold still", "g": "", "k": "", "w": 172, "h": "<p>If you’ve tried meditation, hated it, and concluded you’re bad at it — you’re not. You were probably given instructions built for a calm nervous system while yours was in an emergency.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Two adjustments make it possible. First, <strong>shorten it dramatically.<\/strong> Two minutes counts. Twenty minutes of misery you’ll never repeat is worth less than two minutes you’ll do daily. Second, <strong>give your attention something to hold<\/strong> — your breath, a sound, the feeling of your feet — rather than trying to empty your mind, which no one can do.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>That noticing-and-returning is the entire exercise, and every repetition is the rep that builds the muscle.<\/p><\/aside><p>And the point isn’t to stop thinking. It’s noticing that you drifted and coming back. That noticing-and-returning is the entire exercise, and every repetition is the rep that builds the muscle.<\/p><p>It adds up faster than you’d expect. In one study, eight weeks of mindfulness practice produced measurable increases in gray matter in the brain regions handling memory and emotion.<sup class=\"fn\">⁵<\/sup> Eight weeks — from a practice most people do for a few minutes a day.<\/p>"}, {"t": "Now we can talk about thoughts", "g": "", "k": "", "w": 224, "h": "<p>We’ve come this far without addressing your thinking, and that was deliberate. Cognitive tools are genuinely useful — but they work poorly from a dysregulated state, which is why “challenge your negative thoughts” so often falls flat when you’re in the thick of it. Settle the body first. Then the mind is available to work with.<\/p><p>Once you’re steadier, the practice is simple to describe and takes time to master:<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>Catch it.<\/strong> Notice you’re in a loop — replaying, spiraling, rehearsing the worst. Just naming it, silently, breaks the trance a little: <em>I’m in the loop.<\/em><\/p><p><strong>Question it.<\/strong> Not with forced positivity. With accuracy. Is this actually true? Do I know that, or am I predicting? What would I say to someone I love who said this to me?<\/p><p><strong>Replace it with something truer.<\/strong> Not “everything is wonderful.” Something you actually believe: <em>This is hard, and I’ve gotten through hard things before.<\/em> <em>I don’t know how this ends yet.<\/em><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Every time you catch a harsh one and choose a truer one, you’re laying a little more of a new path.<\/p><\/aside><p>Remember what you learned about how your brain works: the thoughts you run most often become the deepest grooves. Every time you catch a harsh one and choose a truer one, you’re laying a little more of a new path. It feels ineffective at first because the old road is still faster. Keep going. Paths are worn by repetition.<\/p>"}, {"t": "The old beliefs underneath", "g": "", "k": "", "w": 286, "h": "<p>Some of what runs you isn’t a thought you’re having today. It’s a conclusion you reached long ago — <em>I’m not important, I’m too much, I have to earn love, I’m on my own<\/em> — and it’s been operating quietly ever since.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Those old conclusions can change.<\/p><\/aside><p>Those old conclusions can change. This is where that research on memory comes back: when an old memory is brought to mind, it becomes briefly editable before it settles again. Which means the belief that formed alongside it isn’t fixed either. It can be revisited and updated with what you know now.<\/p><figure class=\"ph\" data-slot=\"ch08-l13\"><\/figure><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img alt=\"\" class=\"bx-av\"/><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>Reshaping those old memories and beliefs has been one of the most powerful things I’ve done for my own healing. Nothing else moved the needle the same way.<\/p><\/div><\/aside><p>You can do some of this on your own — noticing the old belief when it surfaces, tracing where it came from, deliberately offering yourself the truer version. But it tends to go further with someone guiding you, and the reason goes beyond technique. A depressed, anxious brain is not good at generating belief that things could be different. That’s not a personal failing; it’s a symptom. When you’re in it, you often cannot summon conviction that change is possible — and a skilled, caring practitioner holds that belief steadily for you until you’re able to hold it yourself. That borrowed certainty does real work. The quality of that relationship turns out to be one of the strongest predictors of whether people get better.<sup class=\"fn\">⁶<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>If you’ve been trying to do all of this alone and it hasn’t moved, that may be the missing piece rather than evidence that you’re beyond help.<\/p><\/div><\/aside>"}, {"t": "Small and often beats big and rare", "g": "", "k": "", "w": 185, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Two minutes of breathing every day will change your nervous system more than an hour of effort once a month.<\/p><\/aside><p>You are building new pathways, and pathways are built by repetition, not intensity. Two minutes of breathing every day will change your nervous system more than an hour of effort once a month. Which is good news if you have very little to give — because <em>very little, done often, is exactly what works.<\/em><\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>So pick one thing. One. Do it daily for a week before adding anything else. Attach it to something you already do — the kettle, the car, the moment before bed.<\/p><\/div><\/aside><p>And expect this to feel unremarkable at first. You will not have a breakthrough on day three. What happens instead is quieter: a few weeks in, you notice you recovered from something faster than you would have. That’s the window widening. That’s the whole thing working.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Your nervous system learned to live in survival over years. It will not step down in an afternoon. But it <em>can<\/em> step down — and every time you send it evidence of safety, you’re teaching it something new.<\/p><\/div><\/aside><p class=\"closing\">Next, we build the foundation all of this rests on: how you eat, move, and sleep.<\/p>"}, {"t": "The research", "g": "", "k": "refs", "w": 336, "h": "<ul class='refs'><li>Balban, M. Y., Neri, E., Kogon, M. M., et al. (2023). Brief structured respiration practices enhance mood and reduce physiological arousal. <em>Cell Reports Medicine, 4<\/em>(1), 100895. <em>(Five minutes daily of cyclic sighing — emphasizing extended exhalation — produced greater mood improvement and reduction in respiratory rate than mindfulness meditation.)<\/em><\/li><li>Karkou, V., Aithal, S., Zubala, A., &amp; Meekums, B. (2019). Effectiveness of dance movement therapy in the treatment of adults with depression: a systematic review with meta-analyses. <em>Frontiers in Psychology, 10,<\/em> 936. <em>(Eight studies, 351 participants; all showed decreased depression scores, effect size 0.64, with benefits maintained at three-month follow-up. The authors note that multi-center trials are rare in this field because it is small and underfunded.)<\/em><\/li><li>Koch, S. C., Riege, R. F. F., Tisborn, K., et al. (2019). Effects of dance movement therapy and dance on health-related psychological outcomes: a meta-analysis update. <em>Frontiers in Psychology, 10,<\/em> 1806. <em>(41 controlled studies, n = 2,374; significant positive effects on well-being, depression, and anxiety.)<\/em><\/li><li>Binaural beats for perioperative anxiety and pain: a systematic review and meta-analysis (2025). <em>(14 trials, n = 1,047; significant reduction in anxiety versus blank audio control. Note: high heterogeneity between studies, and most research is in procedural or clinical settings rather than everyday use.)<\/em><\/li><li>Hölzel, B. K., Carmody, J., Vangel, M., et al. (2011). Mindfulness practice leads to increases in regional brain gray matter density. <em>Psychiatry Research: Neuroimaging, 191<\/em>(1), 36–43. <em>(Eight weeks of mindfulness practice produced measurable structural change in brain regions involved in memory and emotion.)<\/em><\/li><li>Flückiger, C., Del Re, A. C., Wampold, B. E., &amp; Horvath, A. O. (2018). The alliance in adult psychotherapy: a meta-analytic synthesis. <em>Psychotherapy, 55<\/em>(4), 316–340. <em>(The quality of the therapeutic relationship is one of the most consistently replicated predictors of treatment outcome.)<\/em><\/li><li>Nader, K., Schafe, G. E., &amp; LeDoux, J. E. (2000). Fear memories require protein synthesis in the amygdala for reconsolidation after retrieval. <em>Nature, 406<\/em>(6797), 722–726. <em>(Memory reconsolidation — the basis for updating old emotional learning.)<\/em><\/li><\/ul>"}]}, {"n": 9, "t": "Food, Movement, and Sleep", "s": "The three things that change your brain fastest", "p": 2, "l": [{"t": "Opening", "g": "", "k": "", "w": 73, "h": "<p>These three get treated as generic wellness advice — the things you already know you should do, mentioned briefly before the real treatment begins. That framing has it backwards. In head-to-head trials against medication, these interventions have held their own. They belong in the treatment conversation, not the footnotes.<\/p><p>What follows is what the research actually shows, with the numbers, so you can decide for yourself whether it’s worth your energy.<\/p>"}, {"t": "The trial that surprised everyone", "g": "Food", "k": "", "w": 196, "h": "<p>For years the idea that diet affects depression was dismissed as soft. Then Australian researchers ran a proper randomized trial.<\/p><p>They took sixty-seven adults with <strong>moderate to severe<\/strong> depression — most already on medication, in therapy, or both — and split them in two. One group received seven sessions with a dietitian to shift them toward whole foods: vegetables, fruit, whole grains, legumes, fish, olive oil, nuts, some meat and dairy. The other group got the same amount of attention and social support, but no dietary help. Twelve weeks later they measured depression in both groups.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>32%<\/b><span>of the diet group had gone into full remission<\/span><\/div><div class=\"bx-body\"><p><strong>32% of the diet group had gone into full remission. In the control group, 8% had.<\/strong><sup class=\"fn\">¹<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>One in three, versus one in twelve.<\/p><\/aside><p>One in three, versus one in twelve. Their depression scores dropped about eleven points on average, compared with four points in the control group. Statisticians measure this kind of result by asking how many people need to try something for one additional person to recover — and for this diet, the answer was about <strong>four<\/strong>. For antidepressants in their own trials, that number is usually somewhere between seven and nine.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Nobody lost weight. Calories weren’t restricted. Whatever happened, it wasn’t about the scale.<\/p><\/div><\/aside>"}, {"t": "The strangest evidence of all", "g": "Food", "k": "", "w": 209, "h": "<p>If a change in diet can shift depression, how far does that go? There’s a set of studies that answers this in an unexpected place.<\/p><p>British researchers ran a randomized, double-blind, placebo-controlled trial inside a prison. Young inmates were given either a supplement containing vitamins, minerals, and essential fatty acids, or an identical-looking placebo. Nobody — not the prisoners, not the staff, not the researchers — knew who was getting which. Then they counted disciplinary incidents.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>26%<\/b><span>fewer offences than the placebo group<\/span><\/div><div class=\"bx-body\"><p>The supplemented group committed <strong class=\"num\">about 26% fewer offences<\/strong> than the placebo group. Among those who took the supplements for at least two weeks, offences dropped by roughly <strong class=\"num\">35%<\/strong> compared with their own previous behavior.<sup class=\"fn\">⁴<\/sup> A Dutch research team later ran a similar study and found the same direction of effect.<sup class=\"fn\">⁵<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>The only thing that changed was what their brains had to work with — and their behavior changed measurably.<\/p><\/aside><p>Nothing about these young men’s circumstances changed. Not their sentences, their housing, their relationships, or their histories. The only thing that changed was what their brains had to work with — and their behavior changed measurably.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>That’s a striking demonstration of something this book keeps returning to: <strong>your brain is an organ, and it performs differently depending on what you feed it.<\/strong> Not as a metaphor. As something that showed up in the disciplinary records of a prison.<\/p><\/div><\/aside>"}, {"t": "Why food reaches your mood", "g": "Food", "k": "", "w": 235, "h": "<p>You’ve already met most of the mechanisms in earlier chapters. Food is the raw material your brain uses to build neurotransmitters. It shapes the bacteria in your gut, which signal directly to your brain. It drives inflammation up or down, and inflammation reads to your brain as danger. And it determines whether your blood sugar stays steady or swings, which your body experiences as calm or as crisis.<\/p><p>There’s no single magic food. What the evidence supports is a <em>pattern<\/em>: mostly whole foods, plenty of plants, adequate protein, real fats, minimal ultra-processed products.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>52% higher<\/b><span>The risk of becoming depressed climbed at every level<\/span><\/div><div class=\"bx-body\"><p>The other side of that has been measured carefully. Researchers followed nearly thirty-two thousand women for fourteen years, none of them depressed at the start, and tracked how much ultra-processed food they ate. The risk of becoming depressed climbed at every level: those eating four to five servings a day had <strong class=\"num\">11% higher risk<\/strong> than those eating under four. Five to seven servings, <strong class=\"num\">22% higher<\/strong>. Nearly nine or more servings a day, <strong class=\"num\">52% higher<\/strong>.<sup class=\"fn\">²<\/sup> It kept climbing with every step, and it held even after accounting for exercise, smoking, weight, and overall diet quality.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>If more is worse at every level, then less is better at every level — you don’t have to arrive at a perfect diet to move down a rung.<\/p><\/aside><p>That pattern matters more than any single number, because it cuts both ways. If more is worse at every level, then <em>less is better at every level<\/em> — you don’t have to arrive at a perfect diet to move down a rung.<\/p>"}, {"t": "Where to actually start", "g": "Food", "k": "", "w": 101, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>If you’re exhausted, don’t overhaul anything.<\/p><\/aside><p>If you’re exhausted, don’t overhaul anything. Pick one:<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Eat protein at breakfast<\/h4><div class=\"bx-body\"><p><strong>Eat protein at breakfast.<\/strong> This may be the highest-return change in this chapter. A breakfast of refined carbohydrates sets up a blood sugar spike and crash, and the crash releases adrenaline and cortisol — which feels exactly like anxiety, several hours after you’ve forgotten what you ate. Protein and fat flatten that curve.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>Add before you subtract.<\/h4><p>Adding vegetables, olive oil, nuts, or fish is easier than removing things, and it moves the same direction.<\/p><\/div><div class=\"point\"><h4>Cut the worst offender.<\/h4><p>Not everything. The one thing you already know isn’t helping — the soda, the nightly wine, the drive-through.<\/p><\/div><\/div>"}, {"t": "Finding your own trigger foods", "g": "Food", "k": "", "w": 440, "h": "<p>Everything above is about the overall pattern. But for some people there’s something more specific going on — a particular food that is actively driving their symptoms.<\/p><p>You met the mechanism in an earlier chapter: a compromised gut barrier lets food particles reach the bloodstream, the immune system reacts, and the resulting inflammation lands in the brain as anxiety, fog, or heaviness. When that’s happening, no amount of general healthy eating fixes it. You have to find the specific food.<\/p><figure class=\"ph\" data-slot=\"ch09-l06\"><\/figure><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>Sixty-four percent<\/b><span>of the children on the elimination diet had a significant reduction in symptoms<\/span><\/div><div class=\"bx-body\"><p>There’s a well-documented example in children with ADHD. Researchers put one group on a strict elimination diet and left the other on their usual food. <strong>Sixty-four percent of the children on the elimination diet had a significant reduction in symptoms.<\/strong><sup class=\"fn\">³<\/sup> Then came the part that makes this convincing: when the researchers reintroduced the removed foods, the symptoms came back. Something in the food had been driving the behavior.<\/p><\/div><\/aside><p>That same pattern shows up in accounts from people with serious, long-standing mental health symptoms that nobody had been able to resolve. They remove a wide range of foods, the symptoms lift, and then a single food reintroduced sends them straight back down. These are individual reports rather than trials — but the disappear-and-return pattern is hard to explain any other way, and it’s how food reactions have always been identified.<\/p><h3 id=\"how-to-actually-test-it\">How to actually test it<\/h3><p>The principle is simple: remove, wait, then add back one at a time and watch.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg ari
