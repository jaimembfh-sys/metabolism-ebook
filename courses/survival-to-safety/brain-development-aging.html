a-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>Remove the usual suspects for three to four weeks.<\/strong> Most commonly gluten, dairy, corn, soy, eggs, and sugar. Long enough for inflammation to settle — a few days won’t tell you anything.<\/p><p><strong>Track how you feel,<\/strong> not just physically. Mood, anxiety, energy, sleep, clarity. Write it down; memory rewrites itself.<\/p><p><strong>Then reintroduce one food at a time.<\/strong> One food, several days, then wait before the next. If you add everything back at once you’ll learn nothing.<\/p><\/div><\/aside><p><strong>Watch for the return.<\/strong> Reactions may take a day or two and may not be digestive at all — a mood crash, a sleepless night, a fog rolling in, a wave of anxiety with no cause.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>You’re running an experiment where you are both the subject and the control group, and the answer is specific to you.<\/p><\/aside><p>What makes this powerful is that you’re not guessing and you’re not trusting anyone’s list, including mine. You’re running an experiment where you are both the subject and the control group, and the answer is specific to you.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 3l9.5 17h-19z\"><\/path><path d=\"M12 10v4M12 17.5v.5\"><\/path><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p><strong>Two cautions.<\/strong> Don’t do this while you’re at your most depleted, since it takes some capacity. And if you have any history of disordered eating, restriction can be genuinely risky — work with a practitioner rather than alone.<\/p><\/div><\/aside>"}, {"t": "About the cost", "g": "Food", "k": "", "w": 163, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>The trial diet described above actually cost participants 19% less than what they’d been eating.<\/p><\/aside><p>The belief that eating well is more expensive comes from one specific way of measuring: price per calorie. By that measure it’s true — a dollar buys far more calories in chips than in vegetables. But that measure only matters if your goal is buying calories, and most of us aren’t short on those. Measured per <em>portion<\/em>, government analysis of over four thousand foods found grains, vegetables, fruit, and dairy generally <strong>cost less<\/strong> than meats and than foods high in sugar, salt, and saturated fat.<sup class=\"fn\">⁶<\/sup> Bananas, carrots, and beans come in under French fries and ice cream. The trial diet described above actually cost participants <strong class=\"num\">19% less<\/strong> than what they’d been eating.<\/p><p>And there’s the other side of the ledger. Managing a single chronic condition like diabetes runs somewhere around three to four thousand dollars a year out of pocket — <em>with<\/em> insurance. That’s several hundred a month, which almost certainly exceeds whatever a better grocery run costs you.<\/p>"}, {"t": "What it actually does for depression", "g": "Movement", "k": "", "w": 189, "h": "<p>Researchers at Duke ran the study that should have changed everything. Adults with major depressive disorder were randomly assigned to one of four groups for four months: supervised exercise, exercise at home, sertraline (a standard antidepressant), or a placebo pill.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>46%<\/b><span>Supervised exercise: 46% in remission - Sertraline: 44% in remission<\/span><\/div><div class=\"bx-body\"><p>At four months: - <strong class=\"num\">Supervised exercise: 46% in remission<\/strong> - <strong class=\"num\">Sertraline: 44% in remission<\/strong> - <strong class=\"num\">Placebo: 26% in remission<\/strong><\/p><\/div><\/aside><p>Exercise matched the medication.<sup class=\"fn\">⁷<\/sup> Being in either active group cut the odds of still being depressed roughly in half.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Then they followed everyone for a year. And here the two diverged: <strong>the people who kept exercising had lower relapse rates.<\/strong><sup class=\"fn\">⁸<\/sup> Medication works while you take it. Exercise appears to build something that stays.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>It works best for the people who need it most.<\/p><\/aside><p>This isn’t one hopeful study. When researchers pooled the entire literature — nearly a thousand trials — physical activity produced consistent, moderate improvements in depression, anxiety, and psychological distress, with <strong>the largest benefits in people who actually had a diagnosis.<\/strong><sup class=\"fn\">⁹<\/sup> It works best for the people who need it most.<\/p><p>Two honest notes. The medication worked <em>faster<\/em> in the first weeks. And people with severe anxiety alongside their depression benefited less from exercise and may need more support.<\/p>"}, {"t": "Different kinds do different things", "g": "Movement", "k": "", "w": 648, "h": "<p>Walking, jogging, strength training, and yoga all show benefit.<sup class=\"fn\">¹⁰<\/sup> But they don’t all work the same way, and knowing the difference helps you choose.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Your muscles, it turns out, are an endocrine organ that talks to your brain every time you use them.<\/p><\/aside><div class=\"points\"><div class=\"point\"><h4>Lifting weights does more than build muscle.<\/h4><p>When a muscle contracts, it releases proteins called myokines directly into your bloodstream — and some of them reach your brain. One of them is a form of interleukin-6 that acts as an <em>anti-inflammatory<\/em> signal, the opposite of the inflammation we’ve spent this book tracking. Resistance training also raises IGF-1, a growth factor that crosses into the brain and supports the birth of new brain cells. And most studies find it raises BDNF, the brain fertilizer from an earlier chapter.<sup class=\"fn\">¹¹<\/sup> Your muscles, it turns out, are an endocrine organ that talks to your brain every time you use them.<\/p><\/div><div class=\"point\"><h4>Steady aerobic exercise is the best-established for the brain itself.<\/h4><p>Roughly thirty to forty minutes, three or four times a week, at a moderate effort where you can talk but not sing — that’s the dose that most reliably raises BDNF and supports the hippocampus, the memory and mood structure that shrinks under chronic stress. Trials in older adults have found this kind of training increases hippocampal volume by one to two percent, when the expectation at that age is shrinkage.<sup class=\"fn\">¹²<\/sup><\/p><\/div><\/div><p><strong>High-intensity intervals<\/strong> — short hard bursts with recovery between — raise IGF-1 and increase dopamine receptor availability, which matters for motivation and the ability to feel reward. That’s directly relevant if you recognize the flat, nothing-feels-worth-doing state. This one requires a working baseline, though; it’s not where you start from empty.<\/p><figure class=\"ph\" data-slot=\"ch09-l09\"><\/figure><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>tennis, 9.7 years<\/b><span>Compared with sedentary people, the gains were:<\/span><\/div><div class=\"bx-body\"><p><strong>And the type nobody expects to top the list.<\/strong> Danish researchers followed 8,577 people for up to 25 years, comparing how long people lived depending on which sport they played. Compared with sedentary people, the gains were: <strong>tennis, 9.7 years. Badminton, 6.2. Soccer, 4.7. Cycling, 3.7. Swimming, 3.4. Jogging, 3.2. Calisthenics, 3.1. And gym or health club activities — treadmills, weights, machines — 1.5 years.<\/strong><sup class=\"fn\">¹³<\/sup><\/p><\/div><\/aside><p>Read that list again and notice what the top three have in common. You cannot play tennis, badminton, or soccer by yourself. The researchers reached the same conclusion: the activities that inherently involve <strong>other people<\/strong> were associated with the longest lives. It wasn’t the calories burned or the hours logged — the differences weren’t explained by how long people exercised. Something about doing it <em>with<\/em> someone mattered more.<\/p><p>This is an observational study, so it can’t prove the connection causes the longevity. But it points at something the rest of this book keeps circling: your nervous system is profoundly social, and the things that combine movement with other people give you two medicines at once.<\/p><p>Which is also why dancing keeps coming up. It stacks movement, rhythm, music, pleasure, and often other people into one activity — and, as we saw earlier, it holds up well in depression trials.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>What to actually take from this:<\/strong> a mix beats any single type. Something steady and aerobic for your brain, something with resistance for your muscles and inflammation, and something social and enjoyable for the rest of you. If you only pick one, pick the one involving other people.<\/p><\/div><\/aside><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>roughly half<\/b><span>Among the least active, cardiovascular risk dropped by<\/span><\/div><div class=\"bx-body\"><p>On dose, there’s a useful finding. Researchers followed more than thirty thousand adults who were <strong>not<\/strong> particularly active — under eight thousand steps a day — and looked at how they accumulated their steps. People who got most of their steps in <strong>continuous bouts of ten to fifteen minutes<\/strong> had substantially lower rates of death and heart disease than people taking the same steps scattered in bursts under five minutes.<sup class=\"fn\">¹⁴<\/sup> Among the least active, cardiovascular risk dropped by roughly half.<\/p><\/div><\/aside><p>Only eight percent of people walk in sustained stretches like that. Forty-three percent accumulate their steps in bursts under five minutes.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So the instruction isn’t ten thousand steps. It’s <strong>one real walk<\/strong>. Ten to fifteen unbroken minutes.<\/p><\/div><\/aside>"}, {"t": "Starting from empty", "g": "Movement", "k": "", "w": 143, "h": "<p>If you’re in the state this book was written for, the barrier isn’t knowing exercise helps. It’s that you can’t make yourself do it.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Start smaller than feels worth doing. Five minutes. To the end of the street and back. The point isn’t fitness, it’s the signal to your nervous system that moving is safe.<\/p><\/div><\/aside><p>Attach it to something you already do. After coffee, before the shower, when the dog needs out.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Enjoyable movement gives your body a different message than dread does.<\/p><\/aside><p>And go for what you <em>enjoy<\/em>, not what burns most — dancing, walking with a friend, a class, being outside. Enjoyable movement gives your body a different message than dread does.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p><strong>One caution:<\/strong> if you have significant fatigue or a chronic illness, pushing too hard genuinely backfires and can cost you days. Aim to finish feeling better than you started. That line moves as you heal.<\/p><\/div><\/aside>"}, {"t": "Repair, not downtime", "g": "Sleep", "k": "", "w": 164, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>But your brain isn’t idle at night — it’s running maintenance it cannot run while you’re awake.<\/p><\/aside><p>We treat sleep as the thing we cut to make room for everything else. But your brain isn’t idle at night — it’s running maintenance it cannot run while you’re awake.<\/p><p>The most striking discovery: while you sleep, <strong>your brain washes itself out.<\/strong> All day, working brain cells produce waste. During deep sleep, fluid moves through the brain and flushes that waste away.<sup class=\"fn\">¹⁵<\/sup> Skip the deep sleep and the debris accumulates — feeding exactly the inflammation we’ve spent this book discussing. Emerging research finds this clean-up impaired across a striking range of conditions, including ADHD, autism, and Alzheimer’s.<\/p><p>Sleep also consolidates memory, regulates the hormones governing hunger and stress, and restores the emotional control that lets you handle an ordinary bad day. Lose it and your window of tolerance narrows overnight.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>The relationship runs both directions: poor sleep worsens depression and anxiety, and depression and anxiety wreck sleep. Which makes it one of the most efficient places to intervene.<\/p><\/div><\/aside>"}, {"t": "Fixing it without pills", "g": "Sleep", "k": "", "w": 224, "h": "<p>The most effective treatment for insomnia isn’t a sedative — it’s a behavioral approach, and it outperforms sleeping pills over the long term while medication stops working once you stop taking it. The core of it:<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>Get up at the same time every day.<\/strong> Even after a bad night. Especially after a bad night. Your wake time anchors the whole rhythm; sleeping in to catch up keeps you permanently jet-lagged.<\/p><\/div><\/aside><p><strong>Get light in your eyes within an hour of waking<\/strong> — ten to twenty minutes outdoors, even on a grey day. Outdoor light is many times brighter than indoor lighting, and this is what tells your body clock when the day starts. It’s the single most underrated sleep intervention there is.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Don’t lie in bed awake.<\/h4><div class=\"bx-body\"><p><strong>Don’t lie in bed awake.<\/strong> If you’ve been awake twenty minutes and you’re getting frustrated, get up, sit somewhere dim and dull, and go back when you feel sleepy. Lying in bed frustrated teaches your brain that bed is where you lie awake worrying.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>Dim the evening.<\/h4><p>Lower the lights, reduce screens in the last hour, keep the room cool and dark.<\/p><\/div><div class=\"point\"><h4>Stop caffeine by early afternoon.<\/h4><p>It has a longer half-life than most people realize, and it blocks the chemical that builds sleep pressure through the day.<\/p><\/div><\/div><aside class=\"margin-quote\"><span>Key idea<\/span><p>You’re resetting a rhythm, not flipping a switch.<\/p><\/aside><p>And expect this to take a few weeks. You’re resetting a rhythm, not flipping a switch.<\/p>"}, {"t": "Where this leaves you", "g": "Sleep", "k": "", "w": 152, "h": "<p>Three things, each with real evidence behind it, each free, each within your control:<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Movement — matched an antidepressant head-to-head, and beat it on relapse a year later.<\/p><\/aside><p><strong>Food<\/strong> — a whole-food pattern put one in three people with moderate-to-severe depression into remission, versus one in twelve on the control diet. <strong>Movement<\/strong> — matched an antidepressant head-to-head, and beat it on relapse a year later. <strong>Sleep<\/strong> — the maintenance window your brain can’t skip, and the amplifier of everything else.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>None of this is a replacement for treatment you may need, and nobody should stop medication on the strength of a chapter in a book. But if you’ve been told these were nice extras alongside the real treatment, the numbers say otherwise.<\/p><\/div><\/aside><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Pick one. Just one. Do it for two weeks before adding anything.<\/p><\/div><\/aside><p class=\"closing\">Next, we look honestly at the treatments you’ve probably already tried — what the research really says about medication and therapy, and which supplements are worth your money.<\/p>"}, {"t": "The research", "g": "Sleep", "k": "refs", "w": 682, "h": "<ul class='refs'><li>Jacka, F. N., O’Neil, A., Opie, R., et al. (2017). A randomised controlled trial of dietary improvement for adults with major depression (the ‘SMILES’ trial). <em>BMC Medicine, 15,<\/em> 23. <em>(32.3% remission versus 8.0% in controls; number needed to treat 4.1; the diet cost 19% less than participants’ usual diet.)<\/em><\/li><li>Samuthpongtorn, C., Nguyen, L. H., Okereke, O. I., et al. (2023). Consumption of ultraprocessed food and risk of depression. <em>JAMA Network Open, 6<\/em>(9), e2334770. <em>(31,712 women followed up to 14 years; depression risk rose stepwise with intake, roughly 50% higher in the highest fifth.)<\/em> See also Mazloomi, S. N., et al. (2022), <em>European Journal of Nutrition, 61,<\/em> 2485–2498, and Lane, M. M., et al. (2024), <em>BMJ, 384,<\/em> e077310.<\/li><li>Pelsser, L. M., Frankena, K., Toorman, J., et al. (2011). Effects of a restricted elimination diet on the behaviour of children with attention-deficit hyperactivity disorder (INCA study). <em>The Lancet, 377<\/em>(9764), 494–503. <em>(64% showed significant symptom reduction; symptoms returned on reintroduction. Small trial; outcome ratings not fully blinded.)<\/em><\/li><li>Gesch, C. B., Hammond, S. M., Hampson, S. E., Eves, A., &amp; Crowder, M. J. (2002). Influence of supplementary vitamins, minerals and essential fatty acids on the antisocial behaviour of young adult prisoners: randomised, placebo-controlled trial. <em>British Journal of Psychiatry, 181,<\/em> 22–28. <em>(~26% fewer offences than placebo; ~35% fewer among those supplemented at least two weeks. The study measured disciplinary incidents and antisocial behaviour, not suicide.)<\/em><\/li><li>Zaalberg, A., Nijman, H., Bulten, E., Stroosma, L., &amp; van der Staak, C. (2010). Effects of nutritional supplements on aggression, rule-breaking, and psychopathology among young adult prisoners. <em>Aggressive Behavior, 36<\/em>(2), 117–126.<\/li><li>Carlson, A., &amp; Frazão, E. (2012). <em>Are Healthy Foods Really More Expensive? It Depends on How You Measure the Price.<\/em> USDA Economic Research Service, EIB-96.<\/li><li>Blumenthal, J. A., Babyak, M. A., Doraiswamy, P. M., et al. (2007). Exercise and pharmacotherapy in the treatment of major depressive disorder. <em>Psychosomatic Medicine, 69<\/em>(7), 587–596. <em>(46% supervised exercise, 44% sertraline, 38% home-based exercise, 26% placebo.)<\/em><\/li><li>Hoffman, B. M., Babyak, M. A., Craighead, W. E., et al. (2011). One-year follow-up of the SMILE study. <em>Psychosomatic Medicine, 73<\/em>(2), 127–133.<\/li><li>Singh, B., Olds, T., Curtis, R., et al. (2023). Effectiveness of physical activity interventions for improving depression, anxiety and distress. <em>British Journal of Sports Medicine, 57<\/em>(18), 1203–1209. <em>(97 reviews, 1,039 trials.)<\/em><\/li><li>Noetel, M., Sanders, T., Gallardo-Gómez, D., et al. (2024). Effect of exercise for depression: systematic review and network meta-analysis. <em>BMJ, 384,<\/em> e075847. <em>(Overall confidence rated low.)<\/em><\/li><li>Gordon, B. R., McDowell, C. P., Hallgren, M., et al. (2018). Association of efficacy of resistance exercise training with depressive symptoms. <em>JAMA Psychiatry, 75<\/em>(6), 566–576. See also Kirk, B., et al. (2022), Myokines and resistance training: a narrative review, <em>International Journal of Molecular Sciences, 23<\/em>(7), 3501 <em>(muscle contraction releases myokines including anti-inflammatory IL-6 and IGF-1; most studies find resistance training raises BDNF, though some report no change).<\/em><\/li><li>Erickson, K. I., Voss, M. W., Prakash, R. S., et al. (2011). Exercise training increases size of hippocampus and improves memory. <em>PNAS, 108<\/em>(7), 3017–3022. <em>(Moderate aerobic training increased hippocampal volume by 1–2% in older adults, reversing age-related loss.)<\/em><\/li><li>Schnohr, P., O’Keefe, J. H., Holtermann, A., et al. (2018). Various leisure-time physical activities associated with widely divergent life expectancies: the Copenhagen City Heart Study. <em>Mayo Clinic Proceedings, 93<\/em>(12), 1775–1785. <em>(8,577 participants followed up to 25 years. Life expectancy gains versus sedentary: tennis 9.7 years, badminton 6.2, soccer 4.7, cycling 3.7, swimming 3.4, jogging 3.2, calisthenics 3.1, health club 1.5. The authors note the sports involving more social interaction were associated with the greatest longevity. Observational — causation not established.)<\/em><\/li><li>Del Pozo Cruz, B., et al. (2025). Walking bout duration, cardiovascular disease and mortality. <em>Annals of Internal Medicine.<\/em> <em>(Observational; outcomes were cardiovascular and mortality, not mental health.)<\/em><\/li><li>Xie, L., Kang, H., Xu, Q., et al. (2013). Sleep drives metabolite clearance from the adult brain. <em>Science, 342<\/em>(6156), 373–377.<\/li><\/ul>"}]}, {"n": 10, "t": "The Truth About Treatment", "s": "What the research actually says about the help you were offered", "p": 2, "l": [{"t": "Opening", "g": "", "k": "", "w": 130, "h": "<p>You probably already did this part.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>You did what you were told, and you waited to feel like yourself again.<\/p><\/aside><p>You went to the doctor. You answered the questionnaire, got the diagnosis, filled the prescription. Maybe you sat through months of weekly therapy appointments too. You did what you were told, and you waited to feel like yourself again.<\/p><p>And then, for a lot of people reading this, it didn’t happen. Or it helped a little, but not the way you’d been led to expect. And somewhere in there, a quiet thought took hold: <em>if this works for everyone else, and it isn’t working for me, I must be worse off than I thought.<\/em><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>That thought is the reason for this chapter. Because when you look at what the research actually found, you weren’t the exception. You were the majority.<\/p><\/div><\/aside>"}, {"t": "Before anything else", "g": "", "k": "start", "w": 130, "h": "<p>Medication saves lives. For some people it isn’t optional, and nothing in this chapter is an argument against it.<\/p><p>In severe depression, in bipolar disorder, in psychosis, medication can be the difference between a life and a catastrophe. If you’re somewhere you can’t keep yourself safe, it can be what holds you steady while everything else has time to work.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>So please don’t stop taking anything because of what you read here. Coming off psychiatric medication suddenly can be genuinely dangerous, and stopping badly is one of the most common ways people end up worse than when they started. If you ever come off, it’s slowly, and with your prescriber.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>This chapter is here to inform you, not to talk you out of your treatment.<\/p><\/aside><p>This chapter is here to inform you, not to talk you out of your treatment.<\/p>"}, {"t": "What the FDA’s own records show", "g": "", "k": "", "w": 386, "h": "<p>Here is something most people don’t know: when a drug company runs a trial, it has to send the results to the FDA whether they’re good or not. So somewhere in a government filing cabinet sits every antidepressant trial ever run in this country — including the ones nobody ever published.<\/p><p>In 2022, a team went back and looked at all of them. Every trial from 1979 to 2016. Not the summaries, but the results of each of the <strong class=\"num\">73,388 individual people<\/strong> who took part. And the man leading the analysis wasn’t an outside critic — he was the FDA’s own deputy director for safety in its psychiatry division.<sup class=\"fn\">¹<\/sup><\/p><figure class=\"ph\" data-slot=\"ch10-l03\"><\/figure><p>What they found is that people didn’t respond in one uniform way. They fell into three groups.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>So most of that dramatic improvement was real, but only some of it belonged to the medication.<\/p><\/aside><p><strong>A quarter of the people on the drug improved dramatically<\/strong> — the difference between seriously depressed and not depressed at all. But so did <strong>one in ten of the people taking a sugar pill.<\/strong> So most of that dramatic improvement was real, but only some of it belonged to the medication.<\/p><p><strong>Most people had a middling improvement<\/strong> — some relief, not transformation. And this group looked nearly identical whether they’d taken the drug or the placebo.<\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>A final group barely improved on anything.<\/p><\/aside><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>Roughly one in seven<\/b><span>get a substantial benefit that the medication itself provided<\/span><\/div><div class=\"bx-body\"><p>Now subtract the placebo column from the drug column, and you get the researchers’ own conclusion. Out of every hundred people who take an antidepressant, <strong>about fifteen get a substantial benefit that the medication itself provided.<\/strong> Roughly one in seven.<\/p><\/div><\/aside><p>To be clear about what that means, picture seven people who all start taking an antidepressant today.<\/p><p><strong>One<\/strong> of them will get a real, substantial benefit from the drug itself.<\/p><p>Of the remaining six, most will feel somewhat better — but by about as much as they would have felt on a sugar pill, meaning the improvement came from something other than the chemistry: time, hope, the appointment, the sense of finally doing something. And one or two won’t improve much at all.<\/p><p>So it isn’t that six out of seven get nothing. It’s that six out of seven get nothing <em>from the drug<\/em>.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>If you were one of those six, that isn’t a statement about how broken you are. It’s a statement about how narrow the tool is.<\/p><\/div><\/aside>"}, {"t": "Why nobody told you this", "g": "", "k": "", "w": 476, "h": "<p>If most people aren’t dramatically helped, why does everyone believe these drugs are transformative?<\/p><p>Because the results were cherry picked.<\/p><figure class=\"ph\" data-slot=\"ch10-l04\"><\/figure><p>A drug company doesn’t test a new medication once. It runs the same drug through the same kind of trial again and again, each time against a placebo. And the results come back mixed. Sometimes the drug beats the sugar pill. Sometimes it doesn’t.<\/p><p>Approval doesn’t require the drug to win every time. It generally requires two trials where it worked. So a medication can reach your pharmacy on the strength of two successes even if it also failed three or four times along the way.<\/p><p>The FDA receives all of it — every trial, the wins and the losses. That part is required, and it happens.<\/p><p>What happens next is where it goes wrong. When it comes time to publish in medical journals, the successful trials get written up and sent out. The failures largely don’t. Some are never submitted anywhere at all. Others are written up in a way that dresses a disappointing result as a promising one.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>So the doctor writing your prescription didn’t see the same picture the FDA saw.<\/p><\/aside><p>So the doctor writing your prescription didn’t see the same picture the FDA saw. They saw the selection.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>94%<\/b><span>of the trials looked positive. In the FDA’s actual records, 51% were.<\/span><\/div><div class=\"bx-body\"><p>In 2008, researchers finally laid the two versions side by side — the trials that had appeared in medical journals against the FDA’s complete internal files for the same drugs. In the published literature, <strong>94% of the trials looked positive. In the FDA’s actual records, 51% were.<\/strong><sup class=\"fn\">²<\/sup><\/p><\/div><\/aside><p>Same drugs. Same trials. Roughly half the failures had simply never reached the outside world.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Think of a student who sits the same exam six times, passes three, and hands you only the passing scores. Nothing about those three is forged. But you would walk away believing that student passes far more reliably than they actually do.<\/p><\/div><\/aside><p>That’s the impression your doctor was trained on, and it made these medications look about a third more effective than the complete data supported. This isn’t a fringe accusation. It was published in the <em>New England Journal of Medicine.<\/em><\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>69%<\/b><span>of the task force reported industry ties<\/span><\/div><div class=\"bx-body\"><p>And it fits a pattern. The manual that defines mental illness in this country, the DSM, is written by panels of experts — and those experts have deep financial relationships with the companies selling treatments. On the most recent edition, 69% of the task force reported industry ties. On the previous edition, <strong>every single member<\/strong> of the panels covering mood disorders and psychosis did.<sup class=\"fn\">³<\/sup><\/p><\/div><\/aside><p>None of this means the diagnoses are invented or the drugs are useless. The largest analysis ever conducted, covering more than 116,000 people, found that all twenty-one antidepressants studied did outperform placebo.<sup class=\"fn\">⁴<\/sup> They do something.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>The question was never whether they work. It’s <em>how much<\/em>, and <em>for whom<\/em> — and whether the answer you were given matched the evidence.<\/p><\/div><\/aside>"}, {"t": "Therapy, honestly", "g": "", "k": "", "w": 220, "h": "<p>Talk therapy comes off better, but not as much better as you’d hope.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>a third of people<\/b><span>reach remission with therapy, against about one in eight who receive nothing<\/span><\/div><div class=\"bx-body\"><p>Compared with getting no help at all, it clearly works: roughly <strong>a third of people reach remission with therapy, against about one in eight who receive nothing.<\/strong><sup class=\"fn\">⁵<\/sup> If the choice is therapy or nothing, take therapy.<\/p><\/div><\/aside><p>But researchers also compared therapy against a convincing placebo — not nothing, but something that came with the same hope, structure, and attention. Once you correct for the same publication problem that affects the drug research, therapy’s advantage over that shrinks to almost nothing. In the highest-quality studies, you’d have to put around <strong>twenty-four people<\/strong> through therapy for one extra person to do better than the placebo would have managed.<sup class=\"fn\">⁵<\/sup><\/p><p>And it isn’t quick. A standard course runs <strong>sixteen to twenty-eight weekly sessions<\/strong> — four to seven months of appointments before you find out whether it worked for you.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>You had the experience the research predicts.<\/p><\/aside><p>None of that means therapy is worthless. The right therapist doing the right kind of work can change everything, and we’ve already seen that the approaches which engage the body and the memory outperform ordinary talking. But if you sat through months of sessions and came out still yourself, still stuck — you didn’t fail at therapy. You had the experience the research predicts.<\/p>"}, {"t": "What this actually means for you", "g": "", "k": "", "w": 87, "h": "<p>Three things.<\/p><p><strong>If medication helped you, that’s real.<\/strong> You may be one of the people it does a great deal for. Keep working with your prescriber.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>If it didn’t, you’re not unusual.<\/strong> You’re in the larger group. That’s information about the treatment, not a verdict on you.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>And if you were told this was your only option, that wasn’t true.<\/p><\/aside><p><strong>And if you were told this was your only option, that wasn’t true.<\/strong> There are other levers — most of this book is about them — and a lot of them were never offered to you.<\/p>"}, {"t": "What helps almost everyone", "g": "", "k": "", "w": 240, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>They’re the raw material your brain needs to work at all.<\/p><\/aside><p>Beyond food, movement, and sleep, a few basics have broad enough evidence to be worth most people’s attention. These aren’t treatments for a diagnosis. They’re the raw material your brain needs to work at all.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>60% EPA<\/b><span>perform well; DHA-heavy ones mostly don’t<\/span><\/div><div class=\"bx-body\"><p><strong class=\"num\">Omega-3 fats.<\/strong> Your brain is roughly 60% fat, and these fats build the walls of every brain cell. Most of us eat far too few of them and far too many of the inflammatory kind. One detail matters enormously: the benefit in depression comes almost entirely from <strong>EPA<\/strong>, not DHA. Products with at least 60% EPA perform well; DHA-heavy ones mostly don’t.<sup class=\"fn\">⁶<\/sup> Check the ratio on the bottle, because most people are taking the version that doesn’t work.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>Magnesium.<\/h4><p>Involved in hundreds of processes, including the ones that calm your nervous system. Commonly low, and depleted further by stress. And, as you saw earlier, a normal blood test doesn’t rule out a shortage.<\/p><\/div><div class=\"point\"><h4>Vitamin D.<\/h4><p>Deficiency is everywhere, and it tracks with depression. Your skin makes it from sunlight most of us no longer get.<\/p><\/div><\/div><p><strong class=\"num\">B vitamins, especially B12 and folate.<\/strong> Your body builds neurotransmitters out of these. When they run low, the result can look exactly like serious mental illness.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>The principle behind all four: <strong>fixing a real deficiency helps the person who’s actually deficient.<\/strong> Piling nutrients onto someone who has plenty does very little. Which is an argument for testing, not for buying the whole shelf.<\/p><\/div><\/aside>"}, {"t": "The territory nobody shows you", "g": "", "k": "", "w": 371, "h": "<p>Everything above applies to almost everyone. Past that is a whole landscape that most people never learn exists, and if standard care has already failed you, you deserve to at least know it’s there.<\/p><p>Practitioners working at the root level look at things like <strong>the toxic load your body is carrying and how well it clears it. Liver and detoxification pathways. Thyroid function beyond a single lab number. Sex hormones and the windows where their swings destabilize mood. Repairing the gut lining and rebalancing what lives in it. And targeted herbs, adaptogens, and medicinal mushrooms<\/strong> that act on the nervous system.<\/p><figure class=\"ph\" data-slot=\"ch10-l08\"><\/figure><aside class=\"margin-quote\"><span>Key idea<\/span><p>Two people with identical symptoms can need opposite things.<\/p><\/aside><p>I’m not going to give you protocols for any of that, and it isn’t because I’m holding back. It’s because these are genuinely individual. Two people with identical symptoms can need opposite things.<\/p><p>The herbs make the point best. Some <strong>stimulate<\/strong> the nervous system and some <strong>calm<\/strong> it. If you’re already wired and sleepless and you take something marketed for energy, you’ll feel worse. If you’re shut down and flat and you take something sedating, you’ll sink further. And the right thing at the wrong dose can flip from helping to harming.<\/p><p>Which means finding what works for you takes some trial and error. That gets held against natural approaches constantly — and it’s worth noticing that nobody holds it against medication. The famous STAR*D study was, in practice, cycling people through one drug after another to see what stuck. In psychiatry that’s called finding the right fit. When a functional practitioner does the same thing with nutrients, it gets called unscientific.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>The difference that actually matters isn’t whether an approach needs adjusting. It’s whether the person guiding you is <strong>testing rather than guessing<\/strong>, and whether they change course when something isn’t working.<\/p><\/div><\/aside><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 3l9.5 17h-19z\"><\/path><path d=\"M12 10v4M12 17.5v.5\"><\/path><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>One real caution: this territory carries risk if you go it alone. Aggressive detox protocols can make people considerably worse. Herbs interact with medications — St John’s Wort in particular can cause a dangerous reaction with antidepressants and interferes with several other drugs, including birth control. If you take anything prescribed, whatever you add belongs in a conversation with someone who understands both.<\/p><\/div><\/aside>"}, {"t": "How to weigh anything you’re told", "g": "", "k": "", "w": 145, "h": "<p>You’re going to meet a lot of confident advice. Four questions cut through most of it:<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Ask for the number.<\/h4><div class=\"bx-body\"><p><strong>How many people got better, and by how much?<\/strong> “Clinically proven” means nothing on its own. Ask for the number.<\/p><\/div><\/aside><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>Who paid for the research, and who profits from the answer?<\/p><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Cheap, safe, reversible things deserve a low bar.<\/p><\/aside><div class=\"points\"><div class=\"point\"><h4>What happens if it doesn’t work?<\/h4><p>Cheap, safe, reversible things deserve a low bar. Expensive or hard-to-undo things deserve a high one.<\/p><\/div><div class=\"point\"><h4>Does the person telling you this sell the solution?<\/h4><p>That includes me. Weigh it accordingly, and check the references at the back of every chapter.<\/p><\/div><\/div><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>None of this is a case for walking away from conventional care. It’s a case for walking back in with your eyes open — knowing the real numbers, asking better questions, and understanding that if the first thing you were handed didn’t fix you, that’s one of the most well-documented outcomes in medicine.<\/p><\/div><\/aside><p class=\"closing\">Next, the medicine nobody can sell you.<\/p>"}, {"t": "The research", "g": "", "k": "refs", "w": 394, "h": "<ul class='refs'><li>Stone, M. B., Yaseen, Z. S., Miller, B. J., Richardville, K., Kalaria, S. N., &amp; Kirsch, I. (2022). Response to acute monotherapy for major depressive disorder in randomized, placebo controlled trials submitted to the US Food and Drug Administration: individual participant data analysis. <em>BMJ, 378,<\/em> e067606. <em>(232 trials, 73,388 participants. Large response: 24.5% on drug vs 9.6% on placebo; moderate response: 63% vs 69%; minimal response: 12.2% vs 21.5%. The authors conclude approximately 15% of participants experience a substantial antidepressant effect beyond placebo. A 2025 reanalysis has disputed the grouping method.)<\/em><\/li><li>Turner, E. H., Matthews, A. M., Linardatos, E., Tell, R. A., &amp; Rosenthal, R. (2008). Selective publication of antidepressant trials and its influence on apparent efficacy. <em>New England Journal of Medicine, 358,<\/em> 252–260. <em>(94% of published trials appeared positive versus 51% in the FDA’s complete records; apparent effectiveness inflated by roughly 32%.)<\/em><\/li><li>Cosgrove, L., &amp; Krimsky, S. (2012). A comparison of DSM-IV and DSM-5 panel members’ financial associations with industry. <em>PLoS Medicine, 9<\/em>(3), e1001190. See also Cosgrove, L., et al. (2006). <em>Psychotherapy and Psychosomatics, 75<\/em>(3), 154–160. <em>(69% of DSM-5 task force members reported industry ties; 100% of the DSM-IV mood disorders and schizophrenia panels. The American Psychiatric Association has disputed aspects of the methodology.)<\/em><\/li><li>Cipriani, A., Furukawa, T. A., Salanti, G., et al. (2018). Comparative efficacy and acceptability of 21 antidepressant drugs for the acute treatment of adults with major depressive disorder. <em>The Lancet, 391<\/em>(10128), 1357–1366. <em>(522 trials, 116,477 participants; all 21 outperformed placebo, with modest effect sizes. Most trials were short and industry-funded.)<\/em><\/li><li>Cuijpers, P., Karyotaki, E., Ciharova, M., et al. (2021). The effects of psychotherapies for depression on response, remission, reliable change, and deterioration: a meta-analysis. <em>Acta Psychiatrica Scandinavica, 144<\/em>(3), 288–299. <em>(Remission 26–34% with psychotherapy versus 9–17% in controls. Against pill placebo, adjusted for publication bias, the number needed to treat rose to 14.3 and lost statistical significance; among low risk of bias studies, 24.5.)<\/em> On session frequency: Cuijpers, P., et al. (2013). <em>Journal of Affective Disorders, 149<\/em>(1–3), 1–13.<\/li><li>Liao, Y., Xie, B., Zhang, H., et al. (2019). Efficacy of omega-3 PUFAs in depression: a meta-analysis. <em>Translational Psychiatry, 9<\/em>(1), 190. <em>(Benefit concentrated in EPA-predominant formulations; DHA-dominant preparations showed no significant effect.)<\/em><\/li><\/ul>"}]}, {"n": 11, "t": "What Can’t Be Prescribed", "s": "Connection, autonomy, worth, and something bigger than yourself", "p": 2, "l": [{"t": "Opening", "g": "", "k": "", "w": 60, "h": "<p>There’s a reason this chapter comes near the end, and it isn’t because it matters least.<\/p><p>Everything we’ve covered so far can be bought, measured, or prescribed. Food, supplements, sleep, movement, testing, treatment. This chapter is about the things that can’t — and they turn out to carry some of the largest numbers in this entire book.<\/p>"}, {"t": "The town that shouldn’t have been healthy", "g": "", "k": "", "w": 252, "h": "<p>In the 1950s, a physician noticed something odd about a small town in Pennsylvania called Roseto, settled decades earlier by immigrants from a single village in southern Italy.<\/p><p>The people of Roseto were not living what anyone would call a healthy lifestyle. They smoked. They worked in slate quarries. They cooked with lard, ate plenty of meat and cheese, and were, by the standards of the day, heavier than their neighbors. By every measure doctors cared about, they should have been dying of heart disease at the same rate as everyone around them.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>less than half<\/b><span>Their death rate from heart attacks was<\/span><\/div><div class=\"bx-body\"><p>They weren’t. Their death rate from heart attacks was <strong>less than half<\/strong> that of the neighboring towns — towns with the same water supply, the same doctors, the same hospitals.<\/p><\/div><\/aside><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>What Roseto had was each other. Three generations lived under one roof. Nobody ate alone. There were festivals, clubs, and churches, and a strong social norm against displaying wealth in a way that would make a neighbor feel small. When someone struggled, the town closed around them.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>And as the community loosened, the protection disappeared.<\/p><\/aside><p>Then, over the following decades, the younger generation moved to the suburbs, took separate houses, joined the wider American way of living. And as the community loosened, the protection disappeared. Roseto’s heart disease rate rose to match everyone else’s.<sup class=\"fn\">¹<\/sup><\/p><p>The Roseto study has been criticized over the years, and it can’t prove that community was what protected them. But the finding was striking enough to send other researchers looking — and what they found has held up considerably better.<\/p>"}, {"t": "Being alone is a physical risk", "g": "", "k": "", "w": 125, "h": "<p>When researchers pooled the studies measuring social connection and how long people live, the results were sobering. Being socially isolated raised the risk of dying early by <strong class=\"num\">29%<\/strong>. Loneliness — which is different, because you can feel it in a crowded room — raised it by <strong class=\"num\">26%<\/strong>. Living alone, by <strong class=\"num\">32%<\/strong>.<sup class=\"fn\">²<\/sup><\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>50%<\/b><span>greater likelihood of survival than people without them<\/span><\/div><div class=\"bx-body\"><p>Looked at from the other direction: across 148 studies, people with strong social connections had <strong class=\"num\">a 50% greater likelihood of survival<\/strong> than people without them.<sup class=\"fn\">³<\/sup><\/p><\/div><\/aside><p>The researchers put that in perspective in a way that’s worth sitting with. The mortality risk from social isolation is comparable to well-established medical risk factors — and greater than the risk from obesity.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Physically, it behaves like a health condition.<\/p><\/aside><p>We treat loneliness as a sad feeling. Physically, it behaves like a health condition.<\/p>"}, {"t": "Why other people calm you down", "g": "", "k": "", "w": 205, "h": "<p>This isn’t sentiment. It’s the nervous system doing exactly what Chapter 3 described.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>A warm face and a steady voice tell your body the danger has passed.<\/p><\/aside><p>Your nervous system evolved reading other people for safety. It’s constantly scanning faces, voices, and body language — not consciously, but continuously — for signals about whether it’s safe here. A warm face and a steady voice tell your body the danger has passed. That’s why being truly heard by someone can settle you faster than an hour of effort alone, and why isolation keeps the alarm humming.<\/p><aside class=\"bx bx-define\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 21V5M8 7h7\"/><\/svg><span>What it means<\/span><\/div><h4 class=\"bx-term\">co-regulation<\/h4><div class=\"bx-body\"><p>Researchers call this co-regulation. You already know it in practice: it’s why a frightened child calms when a calm adult holds them, and why sitting with a friend who isn’t panicking makes your own panic smaller.<\/p><\/div><\/aside><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Which means connection isn’t a nice addition to nervous-system work. It’s one of the most direct forms of it. If you’ve been trying to regulate entirely on your own, you’ve been attempting the hardest possible version.<\/p><\/div><\/aside><p>It also explains a finding from the last chapter on movement. In that Danish study of which activities predicted the longest lives, the top three — tennis, badminton, soccer — were the three you cannot do alone. Solo gym work came last.<sup class=\"fn\">⁴<\/sup><\/p>"}, {"t": "Having a say in your own life", "g": "", "k": "", "w": 166, "h": "<p>There’s a second thread the research keeps turning up, and it’s easy to miss because it sounds abstract: how much control you feel over your own life predicts your mental health.<\/p><p>Not control over outcomes. Nobody has that. Control over choices — whether your days are shaped by you or entirely by other people and circumstances. In the research on this, people with less say over their own lives report significantly more depressive symptoms, and interventions that deliberately restore autonomy — offering genuine choices, respecting someone’s perspective — reduce depression measurably.<sup class=\"fn\">⁵<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The patterns most of us learned in childhood were patterns of surrendering autonomy.<\/p><\/aside><p>Read that alongside Chapter 3 and something clicks. The patterns most of us learned in childhood were patterns of <em>surrendering<\/em> autonomy. Keep the peace. Don’t need anything. Be what they want so they don’t leave. The child who learned that grows into an adult whose life is organized entirely around everyone else — and then wonders why they feel hollow.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Reclaiming small choices is not selfishness. It’s a documented mental health intervention.<\/p><\/div><\/aside>"}, {"t": "Your worth was never the question", "g": "", "k": "", "w": 186, "h": "<p>This is the part I most want you to take seriously, because it’s where my own healing turned.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>It produces a life spent proving something that was never in question.<\/p><\/aside><p>The nervous system that learned early <em>I don’t matter, my needs are a burden, I have to earn my place<\/em> doesn’t just produce anxiety. It produces a life spent proving something that was never in question. And the exhaustion that comes from that is bone-deep, because there’s no finish line — you can never be useful enough to finally rest.<\/p><p>The research on the alternative is consistent. People who respond to their own failures and pain with harshness fare worse: self-criticism is consistently associated with more depression and anxiety. People who respond with the same steadiness they’d offer a friend fare better, and interventions that teach that response reduce depressive symptoms measurably.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You do not have to earn the right to take up space. Your worth isn’t a score you’re keeping. And if you learned otherwise as a child, you learned something that wasn’t true — which means it can be unlearned, exactly like every other pattern in this book.<\/p><\/div><\/aside>"}, {"t": "Gratitude, which is smaller and stranger than it sounds", "g": "", "k": "", "w": 153, "h": "<p>Gratitude has been researched more seriously than its reputation suggests. Across 64 randomized trials, people who practiced it reported better mental health and fewer symptoms of anxiety and depression.<sup class=\"fn\">⁶<\/sup><\/p><p>One trial makes the point especially well. Researchers gave university students a simple gratitude practice and measured their symptoms. In the students who started out fine, it did essentially nothing. In the students who started out <strong>moderately or severely distressed<\/strong>, symptoms of depression, anxiety, and stress dropped meaningfully.<sup class=\"fn\">⁷<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>It did the most for the people who were struggling most.<\/p><\/aside><p>Which is the opposite of how gratitude is usually sold. It isn’t a nicety for people whose lives are already good. It did the most for the people who were struggling most.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">The practice is unremarkable<\/h4><div class=\"bx-body\"><p>The practice is unremarkable: name a few specific things, regularly. Not “I’m grateful for my health” but the particular ones — the way the light came through the window, someone who texted you back. Specific beats general, and consistent beats intense.<\/p><\/div><\/aside>"}, {"t": "Something bigger than yourself", "g": "", "k": "", "w": 484, "h": "<p>The last thread runs through everything above, and it’s the one modern medicine is least comfortable with.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>about 15%<\/b><span>of those with the strongest sense of purpose died<\/span><\/div><div class=\"bx-body\"><p>Start with purpose, because the numbers are hard to argue with. Researchers followed thousands of adults over fifty and measured how strongly they felt their lives had direction and meaning. Over the next eight years, <strong>about 15% of those with the strongest sense of purpose died. Among those with the weakest, it was roughly 36%.<\/strong><sup class=\"fn\">⁸<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>It changes how your body handles being alive.<\/p><\/aside><p>Part of why appears to be stress. People with a strong sense of purpose react less intensely to stressful events — their bodies don’t escalate as hard, or stay escalated as long.<sup class=\"fn\">⁹<\/sup> Which puts meaning squarely inside the nervous-system story rather than beside it. Having a reason for your life is not a philosophical luxury on top of the biological work. It changes how your body handles being alive.<\/p><figure class=\"ph\" data-slot=\"ch11-l08\"><\/figure><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Alongside purpose sits hope — the belief that things can be different — and it is not naive optimism. It’s the thing that makes anyone do the difficult work in this book, because nobody changes their diet, faces old memories, or gets out of bed at six for a walk unless some part of them believes it might matter.<\/p><\/div><\/aside><p>And then there’s the broader finding, which the research supports more strongly than most people expect: people with spiritual wellbeing — a felt connection to something larger than themselves — have measurably lower rates of depression and lower rates of suicidal thinking.<sup class=\"fn\">¹⁰<\/sup> In one randomized trial, an eight-week program built around connection to the divine, forgiveness, meaning in suffering, hope, and gratitude produced significant improvements in depression, anxiety, hope, self-esteem, and social support compared with controls.<sup class=\"fn\">¹¹<\/sup><\/p><p>There’s an important detail in this research, and it’s worth naming honestly. The benefit doesn’t come from religious identity as a label. It tracks with the <em>quality<\/em> of the relationship. People who feel connected, held, and part of something do better. People whose spiritual life is dominated by feeling abandoned, punished, or blamed by God do measurably <strong>worse<\/strong>.<sup class=\"fn\">¹⁰<\/sup> Guilt and fear are not the active ingredient. Belonging, meaning, and being loved are.<\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img alt=\"\" class=\"bx-av\"/><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>For me, that larger thing is God. Reconnecting with him, and with the sense that my life has a purpose beyond being useful to people who took more than they gave, was inseparable from my healing. I won’t pretend otherwise, and I won’t pretend it was optional for me.<\/p><\/div><\/aside><p>For you it may be God, or it may be something you’d name differently — the sense that there’s truth and love in the universe that doesn’t depend on your performance, that you belong to something you didn’t have to earn your way into. What the research keeps finding is that human beings do badly when they believe they are alone in a meaningless place, and do well when they believe otherwise.<\/p>"}, {"t": "Where to start", "g": "", "k": "", "w": 161, "h": "<p>You can’t schedule your way into any of this, but you can begin:<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>One real conversation.<\/strong> Not a text. Someone who knows you, where you say something true.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>One thing you do with other people.<\/h4><p>A class, a walk, a game, a group. Combining it with movement gives you two medicines at once.<\/p><\/div><div class=\"point\"><h4>One choice that’s yours.<\/h4><p>Something small you decide because you want it, not because someone expects it.<\/p><\/div><div class=\"point\"><h4>One thing you do for someone else.<\/h4><p>Contribution is one of the fastest routes back to feeling that your existence matters.<\/p><\/div><\/div><aside class=\"margin-quote\"><span>Key idea<\/span><p>Purpose usually isn’t discovered in a flash — it’s assembled from noticing.<\/p><\/aside><p><strong>Name what matters to you.<\/strong> Not what should. What actually does. Purpose usually isn’t discovered in a flash — it’s assembled from noticing.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>None of this costs anything. All of it is harder than taking a pill, which is precisely why it gets left out of the conversation.<\/p><\/div><\/aside><p class=\"closing\">We’ve now been through all of it — what’s happening in your nervous system, what’s driving it in your body, and what actually helps. One chapter left: putting it together into something you can actually do.<\/p>"}, {"t": "The research", "g": "", "k": "refs", "w": 477, "h": "<ul class='refs'><li>Wolf, S., &amp; Bruhn, J. G. (1993). <em>The Power of Clan: The Influence of Human Relationships on Heart Disease.<\/em> New Brunswick: Transaction Publishers. <em>(The Roseto studies, conducted from the 1950s onward, documented markedly lower heart-attack mortality despite comparable risk factors, and its erosion as community cohesion declined. The findings have been debated on methodological grounds and are best treated as suggestive rather than conclusive.)<\/em><\/li><li>Holt-Lunstad, J., Smith, T. B., Baker, M., Harris, T., &amp; Stephenson, D. (2015). Loneliness and social isolation as risk factors for mortality: a meta-analytic review. <em>Perspectives on Psychological Science, 10<\/em>(2), 227–237. <em>(After controlling for confounds: social isolation 29%, loneliness 26%, living alone 32% increased likelihood of mortality. Note: substantial heterogeneity between studies.)<\/em><\/li><li>Holt-Lunstad, J., Smith, T. B., &amp; Layton, J. B. (2010). Social relationships and mortality risk: a meta-analytic review. <em>PLoS Medicine, 7<\/em>(7), e1000316. <em>(148 studies; a 50% greater likelihood of survival for those with stronger social relationships.)<\/em><\/li><li>Schnohr, P., O’Keefe, J. H., Holtermann, A., et al. (2018). Various leisure-time physical activities associated with widely divergent life expectancies. <em>Mayo Clinic Proceedings, 93<\/em>(12), 1775–1785.<\/li><li>Research on self-determination theory and mental health, including Ryan, R. M., &amp; Deci, E. L. (2000), <em>American Psychologist, 55<\/em>(1), 68–78, and randomized intervention work showing that autonomy-supportive care reduces depressive symptoms in institutional settings (e.g., <em>Geriatric Nursing<\/em>, 2024).<\/li><li>Diniz, G., Korkes, L., Tristão, L. S., et al. (2023). The effects of gratitude interventions: a systematic review and meta-analysis. <em>Einstein (São Paulo), 21,<\/em> eRW0371. <em>(64 randomized clinical trials; improved mental health and reduced anxiety and depressive symptoms.)<\/em><\/li><li>Mobile app–based gratitude intervention randomized controlled trial (2025), <em>JMIR Formative Research.<\/em> <em>(Participants with at least moderate baseline symptoms showed significantly reduced depression, anxiety, and stress, Cohen’s d = −0.68; no significant effect in those with low baseline symptoms.)<\/em><\/li><li>Alimujiang, A., Wiensch, A., Boss, J., et al. (2019). Association between life purpose and mortality among US adults older than 50 years. <em>JAMA Network Open, 2<\/em>(5), e194270.<\/li><li>Research on purpose in life and reduced physiological stress reactivity, including Hill, P. L., et al. (2018), <em>Journal of Research in Personality.<\/em><\/li><li>Dew, R. E., et al., and the systematic review by Ho, R., et al. (2023). Religiosity and spirituality in the prevention and management of depression and anxiety in young people: a systematic review and meta-analysis. <em>BMC Psychiatry, 23,<\/em> 604. <em>(Spiritual wellbeing protective against depression, r = −0.153; negative religious coping — feeling abandoned by or blaming God — associated with greater depressive symptoms over time.)<\/em> See also systematic reviews finding higher religiosity and spirituality associated with lower rates of suicidal ideation and behaviour.<\/li><li>Spiritual connectivity intervention for individuals with depressive symptoms: a randomized controlled trial (2024). <em>(Eight weekly sessions; significant improvements in depression, anxiety, spiritual experience, hope, self-esteem, and perceived social support, with effect sizes ranging from small to large.)<\/em><\/li><\/ul>"}]}, {"n": 12, "t": "Your Way Forward", "s": "", "p": 2, "l": [{"t": "Opening", "g": "", "k": "", "w": 124, "h": "<p>If you’re feeling overwhelmed right now, that’s the right response to what you’ve just read.<\/p><p>Eleven chapters of nervous systems and gut linings and hormones and inflammation and sleep and food and connection. Any one of them could be a project. Together they can land as one more impossible list — which, for someone already running on empty, becomes one more thing to fail at.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Somewhere in there are two or three things that are actually driving your situation, and the work is finding those, not doing everything.<\/p><\/aside><p>So before anything else: you are not supposed to do all of it. Most of what’s in this book will never apply to you. Somewhere in there are two or three things that are actually driving your situation, and the work is finding those, not doing everything.<\/p><p>This chapter is about how to start without drowning.<\/p>"}, {"t": "Understanding is not the same as changing", "g": "", "k": "", "w": 140, "h": "<p>There’s a particular trap waiting at the end of a book like this, and it’s worth seeing clearly.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Nothing about your inflammation, your sleep, or your nervous system is different because you now know how they work.<\/p><\/aside><p>Understanding feels like progress. You finish the last page knowing more than you did, and something has genuinely shifted — you’re no longer a person with an inexplicable problem. That relief is real. But it isn’t change. Nothing about your inflammation, your sleep, or your nervous system is different because you now know how they work.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>The gap between knowing and doing is where most people stop. And for someone in shutdown it’s worse than that: they read something hopeful, feel a lift, can’t act on it, and quietly file it as further proof that they’re the problem.<\/p><\/div><\/aside><p>You are not the problem. What follows is how the research says people actually get across that gap.<\/p>"}, {"t": "What the research says about starting", "g": "", "k": "", "w": 386, "h": "<p>Almost everything you’ve been told about building a new habit is wrong, and the corrections are all in your favour.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>66 days<\/b><span>the median time for something to feel automatic was<\/span><\/div><div class=\"bx-body\"><p><strong>It takes far longer than three weeks.<\/strong> The “21 days” figure comes from a 1960 book by a plastic surgeon, observing how long patients took to adjust to their new appearance. It was never about habits. When researchers actually studied it — following people forming new daily behaviours — the median time for something to feel automatic was <strong class=\"num\">66 days<\/strong>, with a range from <strong class=\"num\">18 to 254 days<\/strong>, depending on the behaviour and the person.<sup class=\"fn\">¹<\/sup><\/p><\/div><\/aside><p>So if you’ve been giving things two or three weeks and concluding they don’t work for you, you’ve been quitting during the part where it’s supposed to feel hard.<\/p><figure class=\"ph\" data-slot=\"ch12-l03\"><\/figure><aside class=\"margin-quote\"><span>Key idea<\/span><p>Missing a day does not undo it.<\/p><\/aside><p><strong>Missing a day does not undo it.<\/strong> This is the finding that matters most. In that same research, missing a single day had almost no effect on the underlying progress — automaticity dropped by a fraction of a point and recovered quickly.<sup class=\"fn\">¹<\/sup> The habit was not broken. The curve carried on.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Which means the real danger has never been the missed day. It’s the story you tell yourself about the missed day — <em>I knew I couldn’t do this<\/em> — and the stopping that follows.<\/p><\/div><\/aside><p><strong>The first month is the cliff.<\/strong> When researchers tracked people who’d committed to a change, <strong>77% were still going after one week. By one month, 55%. By three months, 43%.<\/strong><sup class=\"fn\">²<\/sup> After about six months the curve flattens out — the people still going mostly keep going. So the
