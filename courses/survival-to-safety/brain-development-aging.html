fragile stretch is the first four to six weeks, and knowing that in advance changes what a bad week means.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>46%<\/b><span>of the deciders had succeeded. Among those who merely wanted it, 4%.<\/span><\/div><div class=\"bx-body\"><p><strong>Deciding is different from wanting.<\/strong> Researchers followed one group who made an explicit commitment to change, and another group who wanted exactly the same change but never formalised it. Six months later: <strong>46% of the deciders had succeeded. Among those who merely wanted it, 4%.<\/strong><sup class=\"fn\">³<\/sup><\/p><\/div><\/aside><p>More than a tenfold difference — between choosing something and hoping for it.<\/p><p><strong>And say what you’ll do, not what you’ll stop.<\/strong> People whose goals were framed as <em>adding<\/em> something — eat more vegetables, walk each morning — succeeded <strong class=\"num\">59%<\/strong> of the time. People whose goals were framed as <em>stopping<\/em> something succeeded <strong class=\"num\">47%<\/strong>.<sup class=\"fn\">⁴<\/sup> Twelve points, from wording alone.<\/p>"}, {"t": "Finding your roots", "g": "", "k": "", "w": 172, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Before choosing anything, work out where your own loop is strongest.<\/p><\/aside><p>Before choosing anything, work out where your own loop is strongest. Sit with these:<\/p><div class=\"points\"><div class=\"point\"><h4>Your history.<\/h4><p>Do the patterns in Chapter 3 sound like your childhood — becoming small, becoming useful, needing nothing? Do you recognise yourself in shutdown more than in anxiety?<\/p><\/div><div class=\"point\"><h4>Your gut.<\/h4><p>Digestive trouble, bloating, food that doesn’t sit right? Do certain foods reliably precede a bad mental day?<\/p><\/div><div class=\"point\"><h4>Your labs and hormones.<\/h4><p>Have you actually been tested properly — full thyroid panel, B12 with functional markers, vitamin D, ferritin with an inflammatory marker? Do your symptoms track with your cycle, or did they arrive in your forties?<\/p><\/div><div class=\"point\"><h4>Your blood sugar.<\/h4><p>Do you get anxious, shaky, or irrationally irritable a few hours after eating? Does it lift when you eat?<\/p><\/div><div class=\"point\"><h4>Your sleep.<\/h4><p>Are you getting genuine deep sleep, or six broken hours you’ve stopped questioning?<\/p><\/div><div class=\"point\"><h4>Your connection.<\/h4><p>How many people actually know how you’re doing? When did you last do something with other people that you enjoyed?<\/p><\/div><\/div><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Whichever two or three of those produced the strongest reaction — that’s where your work is. Go back to those chapters. Ignore the rest for now.<\/p><\/div><\/aside>"}, {"t": "An order that works", "g": "", "k": "", "w": 173, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>The sequence matters more than most people are told, and it’s the reason so many attempts stall.<\/p><\/aside><p>The sequence matters more than most people are told, and it’s the reason so many attempts stall.<\/p><div class=\"points\"><div class=\"point\"><h4>Start with your nervous system.<\/h4><p>Not because it’s the deepest issue, but because a system stuck in survival can’t sustain anything else. It’s hard to change how you eat, keep a new routine, or face old memories while your body believes it’s in danger. One regulation practice, daily, small — that’s the foundation everything else rests on.<\/p><\/div><div class=\"point\"><h4>Then the physical basics.<\/h4><p>Sleep and blood sugar first, because they’re fast and they change how everything else feels. Then food. Then movement, at whatever size you can actually repeat.<\/p><\/div><div class=\"point\"><h4>Then the deeper work.<\/h4><p>Trauma, old patterns, the beliefs underneath. This comes later on purpose — it goes better from a steadier baseline, and attempting it while completely dysregulated is how people get flooded and stop.<\/p><\/div><\/div><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>And connection and meaning run through all of it.<\/strong> Not a final step. The thing that makes the rest survivable.<\/p><\/div><\/aside><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>If that still feels like too much: pick one thing from the first section. Do it for two weeks. Add nothing.<\/p><\/div><\/aside>"}, {"t": "You’ll do better with someone", "g": "", "k": "", "w": 296, "h": "<p>There’s a finding here worth taking seriously, and it isn’t the one that sells programmes.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>155 trials<\/b><span>compared how people did across every format of psychological support<\/span><\/div><div class=\"bx-body\"><p>Researchers compared how people did across every format of psychological support — one-to-one, group, telephone, and guided self-help — across 155 trials and roughly eleven thousand people. <strong>There was no meaningful difference between them.<\/strong> What separated all of those from going it entirely alone wasn’t the format. It was the presence of another human being.<sup class=\"fn\">⁵<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>It’s to make sure someone is in it with you.<\/p><\/aside><p>Doing this by yourself still works. Self-directed change produces real, measurable effects — just consistently smaller ones.<sup class=\"fn\">⁶<\/sup> But the honest recommendation isn’t to buy the most expensive help available. It’s to make sure someone is in it with you.<\/p><figure class=\"ph\" data-slot=\"ch12-l06\"><\/figure><p>There are three reasons that helps, and only one of them is accountability.<\/p><p>The first is straightforward: someone expecting you to show up changes what you do. Even a single monthly check-in raised year-end success rates in one study.<sup class=\"fn\">⁴<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>The second is physiological, and we covered it in the last chapter. Your nervous system reads other people for safety. Doing this alongside someone calm is not just encouragement — it’s regulation.<\/p><\/div><\/aside><p>The third is the one nobody names. Working this out by yourself is genuinely hard. Deciding what to try, in what order, tracking whether it’s helping, second-guessing every result — that’s a real cognitive load, and it falls hardest on the person with the least capacity to carry it. Having someone say <em>start here, we’ll look at that in six weeks<\/em> removes a weight that has nothing to do with willpower.<\/p><p>That someone might be a friend doing it alongside you, a group, a good practitioner, or one person who checks in on Sundays. It matters far less than you’d think.<\/p>"}, {"t": "What healing actually looks like", "g": "", "k": "", "w": 207, "h": "<p>It won’t feel like the movie version.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The trend is what matters, and trends are only visible looking backwards — which is a good reason to write down where you’re starting from.<\/p><\/aside><p>It isn’t linear. You’ll have a good fortnight and then a bad week, and the bad week will feel like proof that nothing worked. It won’t be. The trend is what matters, and trends are only visible looking backwards — which is a good reason to write down where you’re starting from.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>It’s rarely dramatic. Almost nobody wakes up transformed. What actually happens is quieter: something knocks you sideways and you notice you recovered in two days instead of two weeks. Your window widened while you weren’t watching.<\/p><\/div><\/aside><p>And it takes longer than you want. Your nervous system spent years learning that the world isn’t safe, and it doesn’t unlearn that in a fortnight of deep breathing.<\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img class=\"bx-av\" alt=\"\"><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>Two years ago I was still in it. Today I love my life. I still have pain and fatigue and patterns I’m working on — I’m not cured, and I’m not going to pretend otherwise. But the distance between that woman gripping the steering wheel and the one writing this is not small, and it wasn’t one miraculous thing. It was a great many small things, done imperfectly, for a long time.<\/p><\/div><\/aside>"}, {"t": "When to get help now", "g": "", "k": "", "w": 141, "h": "<p>Some things shouldn’t wait for a plan.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>If you’re having thoughts of ending your life, tell someone today — a doctor, a crisis line, someone who loves you. That is not a failure of this approach; it’s an emergency, and it deserves emergency care.<\/p><\/div><\/aside><p>If you can’t function — not struggling, but genuinely unable to work or care for yourself or your children — you need more support than a book.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>If you’re on medication and want to change anything about it, that’s a conversation with your prescriber, never a decision you make alone.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>It usually means there’s a root you haven’t found yet, and finding it may need someone with testing and training.<\/p><\/aside><p>And if you’ve worked steadily at this for a few months with nothing shifting, that’s not a verdict on you. It usually means there’s a root you haven’t found yet, and finding it may need someone with testing and training.<\/p>"}, {"t": "The last thing", "g": "", "k": "", "w": 188, "h": "<p>You picked up this book because something was wrong and nobody could tell you what.<\/p><p>You now know that your exhaustion has a mechanism. That anxiety and shutdown are the same system doing the same job. That your gut, your hormones, your blood sugar, your history, and your loneliness are all feeding into how your mind feels. That the standard answers failed a great many people, and that wasn’t your fault either.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Most of all, I hope you know this: <strong>you were never broken.<\/strong><\/p><\/div><\/aside><p>You were shaped — by what happened to you, by what you had to become to belong, by a body doing its best with what it was given. Every symptom you’ve been carrying was your system protecting you as well as it knew how.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>And what was learned can be unlearned.<\/p><\/aside><p>That protection served its purpose. And what was learned can be unlearned. What was shaped can be reshaped. Your brain will keep changing for the rest of your life, in whichever direction you keep walking.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You do not have to earn your way back. You just have to start — small, imperfectly, and preferably not alone.<\/p><\/div><\/aside><p class=\"closing\">From survival, to safety.<\/p>"}, {"t": "The research", "g": "", "k": "refs", "w": 396, "h": "<ul class='refs'><li>Lally, P., van Jaarsveld, C. H. M., Potts, H. W. W., &amp; Wardle, J. (2010). How are habits formed: modelling habit formation in the real world. <em>European Journal of Social Psychology, 40<\/em>(6), 998–1009. <em>(96 participants forming new daily behaviours; median 66 days to reach automaticity, range 18–254 days. Missing a single day reduced automaticity by less than half a point, with rapid recovery. Roughly half of participants had not reached automaticity by day 84.)<\/em> See also Singh, B., et al. (2024), systematic review of 20 studies and 2,601 participants, finding durable habits typically consolidate over two to five months.<\/li><li>Norcross, J. C., &amp; Vangarelli, D. J. (1988–89), and subsequent follow-up work summarised in Oscarsson et al. (2020). <em>(Maintenance rates: 77% at one week, 55% at one month, 43% at three months, 40% at six months, 19% at two years.)<\/em><\/li><li>Norcross, J. C., Mrykalo, M. S., &amp; Blagys, M. D. (2002). Auld lang syne: success predictors, change processes, and self-reported outcomes of New Year’s resolvers and nonresolvers. <em>Journal of Clinical Psychology, 58<\/em>(4), 397–405. <em>(At six months, 46% success among those who made an explicit commitment versus 4% among comparable people who wanted the same change without formalising it.)<\/em><\/li><li>Oscarsson, M., Carlbring, P., Andersson, G., &amp; Rozental, A. (2020). A large-scale experiment on New Year’s resolutions: approach-oriented goals are more successful than avoidance-oriented goals. <em>PLOS ONE, 15<\/em>(12), e0234097. <em>(N = 1,066. Approach-oriented goals 58.9% success at one year versus 47.1% for avoidance-oriented. Participants receiving some support outperformed both unsupported and extensively supported groups; a monthly check-in raised year-end success from 56% to 62%.)<\/em><\/li><li>Cuijpers, P., Noma, H., Karyotaki, E., Cipriani, A., &amp; Furukawa, T. A. (2019). Effectiveness and acceptability of cognitive behavior therapy delivery formats in adults with depression: a network meta-analysis. <em>JAMA Psychiatry, 76<\/em>(7), 700–707. <em>(155 trials, approximately 11,000 participants; no significant differences between individual, group, telephone-delivered, and guided self-help formats.)<\/em><\/li><li>Cuijpers, P., Donker, T., Johansson, R., Mohr, D. C., van Straten, A., &amp; Andersson, G. (2011). Self-guided psychological treatment for depressive symptoms: a meta-analysis. <em>PLOS ONE, 6<\/em>(6), e21274. <em>(Overall effect size d = 0.28 for self-guided treatment versus control — small but genuine.)<\/em> See also Karyotaki, E., et al. (2017, 2021), finding unguided interventions effective but consistently less so than guided ones.<\/li><\/ul>"}]}, {"n": 16, "t": "Interest, Not Importance", "s": "ADHD in adults, why it goes missed for decades, and what actually helps", "p": 3, "l": [{"t": "Opening", "g": "", "k": "", "w": 148, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>There’s a particular kind of exhaustion that comes from being capable.<\/p><\/aside><p>There’s a particular kind of exhaustion that comes from being capable.<\/p><p>You are not failing. That’s the strange part. You hold down the job, you got the degree, people would describe you as bright — and underneath it you are running a covert operation to stay afloat that nobody can see. The lists. The alarms. The permanent low hum of being slightly behind. The email you have opened eleven times and not answered, which would take four minutes.<\/p><p>And the thing nobody can explain, including you: you cannot start the small task that matters enormously, and last Tuesday you lost six hours to something that did not matter at all.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>If you have concluded from that pattern that you are lazy, or self-sabotaging, or wasting your potential — you had good reason to. It’s exactly what it looks like from the outside. It’s also wrong.<\/p><\/div><\/aside>"}, {"t": "The wrong fuel", "g": "", "k": "", "w": 236, "h": "<p>Here’s the reframe, and it does more work than anything else in this chapter.<\/p><p>Most people’s brains can run on <strong>importance<\/strong>. The task matters, so the system supplies the energy to start it. Boring, unpleasant, difficult — doesn’t matter much. Importance is enough.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Some brains can’t use importance as fuel at all.<\/p><\/aside><p>Some brains can’t use importance as fuel at all. They run on <strong>interest, novelty, urgency and challenge<\/strong> — and if none of those are present, no amount of knowing the task matters will start it.<\/p><p>That is not a metaphor for weak willpower. It’s a description of a nervous system with different reward machinery. Which explains the contradiction that has made you feel like a fraud for thirty years: the four-minute email has no interest, no novelty, no urgency and no challenge, so it is physically hard to begin. And the six-hour rabbit hole had all four.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You have never been unable to focus. You have been unable to choose what to focus on — which is a completely different problem, and one that gets misnamed as a character flaw about four thousand times over a childhood.<\/p><\/div><\/aside><aside class=\"bx bx-define\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 21V5M8 7h7\"/><\/svg><span>What it means<\/span><\/div><h4 class=\"bx-term\">interest-based nervous system<\/h4><div class=\"bx-body\"><p><em>(A note on where this comes from: “interest-based nervous system” is a clinical description rather than a formal diagnostic construct. What sits underneath it — differences in reward processing, in tolerating delay, in dopamine signalling — is well established in the research. Think of it as a useful translation, not a technical term.)<\/em><\/p><\/div><\/aside>"}, {"t": "Why nobody caught it", "g": "", "k": "", "w": 355, "h": "<p>The picture in everyone’s head is a nine-year-old boy who won’t sit down. That presentation gets diagnosed. The rest don’t.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>three or four to one<\/b><span>in childhood diagnoses. By adulthood the ratio is close to one to one.<\/span><\/div><div class=\"bx-body\"><p><strong>Boys outnumber girls roughly three or four to one in childhood diagnoses. By adulthood the ratio is close to one to one.<\/strong><sup class=\"fn\">¹<\/sup> Those two facts together tell you something plainly: a very large number of girls were not identified, and arrived at adulthood carrying it undiagnosed.<\/p><\/div><\/aside><p>The inattentive presentation doesn’t disrupt anything. A child who is quiet, dreamy, disorganised and struggling privately is not a problem for a classroom, so nobody looks. And by adolescence, most have built compensations sophisticated enough to hide it — which is precisely why the diagnosis gets missed for another twenty years.<\/p><figure class=\"ph\" data-slot=\"ch16-l03\"><\/figure><p><strong>And it gets treated as something else.<\/strong> Adults later diagnosed with inattentive ADHD had frequently received a prior diagnosis of depression (13–18%) or anxiety (17–26%) — noticeably higher than for the hyperactive-impulsive presentation.<sup class=\"fn\">²<\/sup> A population study in Wales found that <strong>females with ADHD were significantly more likely than males to have been diagnosed with anxiety or depression, and prescribed antidepressants, before their ADHD was recognised at all.<\/strong><sup class=\"fn\">³<\/sup> Women are diagnosed roughly four to five years later than men on average.<sup class=\"fn\">²<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Now, the anxiety and depression are usually real. That’s what makes this so hard to catch. But they’re often <strong>downstream<\/strong>: the anxiety is what thirty years of nearly-missed deadlines produces, and the depression is what happens when you repeatedly conclude that your failures are moral rather than mechanical.<\/p><\/div><\/aside><p>Treat the downstream problem and you get a partial response, which is exactly what a great many people in this book’s audience have had.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>That grief is a normal response to accurate information arriving thirty years late.<\/p><\/aside><p>When women who were diagnosed late describe the experience, the same themes come up: internalised criticism, low self-esteem, guilt and shame from years of being told to try harder — and then, at diagnosis, a sense of their whole life suddenly making sense, alongside genuine grief for the life they might have had.<sup class=\"fn\">⁴<\/sup> That grief is a normal response to accurate information arriving thirty years late. It is not ingratitude.<\/p>"}, {"t": "The hormone connection nobody mentions", "g": "", "k": "", "w": 236, "h": "<p>This is the piece that connects directly to Chapter 7, and it’s barely known outside specialist practice.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Estrogen modulates dopamine signalling and prefrontal function.<\/p><\/aside><p><strong>Estrogen modulates dopamine signalling and prefrontal function.<\/strong> In a brain where dopamine signalling is already atypical, falling estrogen compounds the problem — one researcher describes the combination as a double blow to cognitive symptoms.<sup class=\"fn\">⁵<\/sup><\/p><p>What follows from that is specific and useful:<\/p><aside class=\"bx bx-checklist\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"3\"/><path d=\"M8 12l3 3 5-6\"/><\/svg><span>Does this sound familiar?<\/span><\/div><div class=\"bx-body\"><ul>\n<li><strong>Symptoms fluctuate across the menstrual cycle<\/strong>, and many women report that <strong>stimulant medication works less well in the late luteal phase<\/strong> — the week before a period.<sup class=\"fn\">⁶<\/sup> Almost nobody is told this, and it gets experienced as the medication failing.<\/li>\n<li><strong>Postpartum risk of depression and anxiety runs around five times higher<\/strong> in women with ADHD.<sup class=\"fn\">⁵<\/sup><\/li>\n<li><strong>Perimenopause makes it worse.<\/strong> Women with ADHD report more severe perimenopausal symptoms, with the difference between groups peaking between ages 35 and 39 — suggesting the transition may begin as much as a decade earlier than usual.<sup class=\"fn\">⁷<\/sup><\/li>\n<\/ul><\/div><\/aside><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Which produces a pattern worth naming directly: <strong>for a great many women, the “brain fog” of perimenopause is ADHD that estrogen had been partially buffering for years.<\/strong> When estrogen becomes erratic, the compensations stop working, everything falls apart at once — and they are told it’s stress, or handed an antidepressant.<\/p><\/div><\/aside><p>If you are in your forties, have never coped less well in your life, and Chapter 7’s perimenopause section also sounded like you, those two chapters may be describing one situation.<\/p>"}, {"t": "The part that hurts most", "g": "", "k": "", "w": 436, "h": "<p>There’s a feature of this that isn’t in the diagnostic criteria, and for a lot of people it is the worst part.<\/p><p><strong>Emotional dysregulation.<\/strong> It was in the earliest clinical descriptions of ADHD and was removed from the formal criteria decades ago — but estimates put it at <strong>25 to 45% of children and 30 to 70% of adults<\/strong> with ADHD.<sup class=\"fn\">⁸<\/sup> And it has been found to affect quality of life <strong>more than the inattention and hyperactivity do.<\/strong><sup class=\"fn\">⁹<\/sup><\/p><figure class=\"ph\" data-slot=\"ch16-l05\"><\/figure><aside class=\"bx bx-define\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"><\/path><path d=\"M4 21V5M8 7h7\"><\/path><\/svg><span>What it means<\/span><\/div><h4 class=\"bx-term\">rejection sensitivity<\/h4><div class=\"bx-body\"><p>The sharpest version of it is <strong>rejection sensitivity<\/strong>: perceived criticism or rejection producing pain out of all proportion to what caused it. A remark. A tone. Someone not replying. A face that looked like disappointment. And then hours or days of misery from something another person would have shrugged off by lunchtime.<\/p><\/div><\/aside><p>Here’s the part that connects to Chapter 3, and it’s the most likely explanation.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>ADHD traits get met with criticism from childhood.<\/p><\/aside><p><strong>ADHD traits get met with criticism from childhood.<\/strong> You were told to sit still, focus, try harder, stop interrupting, apply yourself, be less. Thousands of times, from people who mostly meant well. So one reasonable account is <strong>sensitisation<\/strong> — the response to frequent, early experiences of criticism grows larger and more intense over the years rather than smaller.<sup class=\"fn\">⁹<\/sup><\/p><p>Which produces something specific, and if you recognise it you’ll recognise it immediately: in interviews, people described <strong>the anticipation of rejection as more painful than the rejection itself<\/strong> — because past experience frames what you expect next.<sup class=\"fn\">⁹<\/sup> And then a chain: masking to hide the reaction, which leads to feeling disconnected from yourself, and withdrawal, which leads to loneliness.<sup class=\"fn\">⁹<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So the shape of it is a lifetime of being corrected, producing a nervous system braced for the next correction, producing concealment that costs you the connection that would have helped.<\/p><\/div><\/aside><p><strong>A note on the term.<\/strong> You’ll see this called “rejection sensitive dysphoria” or RSD online, often as though it were a diagnosis. It isn’t in the DSM, there are no standard criteria, and the studies using that specific term are few and small.<sup class=\"fn\">¹⁰<\/sup> The underlying emotional dysregulation is much better established than the branded name. So the experience is real and well documented; the label is a clinical shorthand rather than a diagnosis.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">What helps<\/h4><div class=\"bx-body\"><p><strong>What helps:<\/strong> the regulation work in Chapter 8, and naming the pattern in the moment — <em>this is the rejection thing, not information about what just happened.<\/em> Also worth knowing that emotional regulation was added to the adult ADHD criteria in the EU,<sup class=\"fn\">¹⁰<\/sup> so if a clinician tells you this isn’t part of the condition, that’s out of date.<\/p><\/div><\/aside>"}, {"t": "Is this being overdiagnosed?", "g": "", "k": "", "w": 602, "h": "<p>You will have seen the argument, probably repeatedly. And I think it’s the wrong question, or at least the wrong one to start with.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The better question is: is this making your life difficult?<\/p><\/aside><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>The better question is: is this making your life difficult?<\/p><\/aside><p>Are you struggling to focus, to start things, to finish them, to keep track of your own life — enough that it’s costing you work, relationships, money, or your sense of yourself? Because if the answer is yes, that is worth addressing whether or not you would tick enough boxes on a diagnostic form.<\/p><figure class=\"ph\" data-slot=\"ch16-l06\"><\/figure><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>And here’s the thing that dissolves most of the argument: <strong>almost nothing in this chapter requires a diagnosis.<\/strong><\/p><\/div><\/aside><p>Getting your ferritin tested doesn’t. Shifting your body clock with morning light doesn’t. Checking your thyroid, steadying your blood sugar, building structure outside your head, using exercise as a state-changer, checking the EPA on a fish oil label — none of that needs anyone’s permission or a label on your file. All of it is worth doing if concentration is a problem in your life, regardless of what’s causing the problem.<\/p><p>The diagnosis matters for one thing in particular: <strong>access to stimulant medication.<\/strong> That’s what the argument is really about, and it’s where genuine care is needed.<\/p><h3 id=\"where-the-caution-belongs\">Where the caution belongs<\/h3><p>Stimulants are effective — the effect sizes below are among the largest in psychiatry. They are also not a low-stakes thing to try casually, and four things matter before you go looking for them.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>4%<\/b><span>higher risk of cardiovascular disease — mostly hypertension and arterial disease<\/span><\/div><div class=\"bx-body\"><p><strong>They carry a real cardiovascular signal.<\/strong> A Swedish study following 278,027 people with ADHD over 14 years found that <strong>each additional year of medication use was associated with about a 4% higher risk of cardiovascular disease<\/strong> — mostly hypertension and arterial disease — with the sharpest rise over the first three years before levelling off.<sup class=\"fn\">¹¹<\/sup> In trials, amphetamine salts raised systolic blood pressure by around 5 mmHg, with similar effects for methylphenidate.<sup class=\"fn\">¹²<\/sup> Reviews of hard cardiovascular outcomes are mixed, with the safety signal more evident in adults than in children.<sup class=\"fn\">¹³<\/sup> The absolute risk is low and this is not an argument against taking them — it’s an argument for having your blood pressure monitored rather than assuming it’s nothing.<\/p><\/div><\/aside><p><strong>They suppress sleep and appetite.<\/strong> Which matters especially here, because this chapter has just spent several pages establishing that sleep is probably your single biggest lever. A medication that helps you focus while quietly eroding your sleep can leave you worse off overall, and it can take months to notice.<\/p><p><strong>They are controlled substances<\/strong>, with the tolerance, supply and discontinuation issues that go with that.<\/p><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"><\/path><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p><strong>And this is the one that matters most for this book: a stimulant will improve your concentration whether or not ADHD is what’s wrong with you.<\/strong> These drugs sharpen focus in almost everyone. So “it worked, therefore I have ADHD” is not sound reasoning — and if your difficulty concentrating is actually untreated sleep apnoea, low ferritin, an underactive thyroid, perimenopause, or depression, the medication will make you feel better while the real driver goes on unaddressed, possibly for years.<\/p><\/div><\/aside><p>Which is the argument for the order of this chapter. <strong>Check the physical causes first, because they’re cheap and they’re reversible.<\/strong> Then, if the pattern is still there — and for many people it will be, because ADHD is real and common — have the medication conversation properly, with someone who assessed you rather than someone who took your word for it.<\/p><p>That isn’t gatekeeping. It’s making sure that if you do take a controlled medication for years, it’s for the right reason.<\/p>"}, {"t": "What actually helps", "g": "What actually helps", "k": "", "w": 52, "h": "<p>Two things before the list.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>First: medication works here better than almost anywhere else in this book, and I’m not going to soft-pedal that.<\/p><\/aside><div class=\"points\"><div class=\"point\"><h4>First: medication works here better than almost anywhere else in this book, and I’m not going to soft-pedal that.<\/h4><p>The details are below. If you have ADHD and medication is helping you, nothing in this chapter is an argument against it.<\/p><\/div><div class=\"point\"><h4>Second: medication does nothing about your ferritin, your sleep phase, your blood sugar or your hormones.<\/h4><p>That’s what the rest of this is for.<\/p><\/div><\/div><p>As always, ranked strongest evidence first, and you are not meant to do all of it.<\/p>"}, {"t": "Your body clock is running late", "g": "What actually helps", "k": "", "w": 424, "h": "<p>This is the most underused finding in the chapter and it’s the one I’d start with.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>78%<\/b><span>of adults with ADHD have an objectively delayed circadian rhythm<\/span><\/div><div class=\"bx-body\"><p><strong>As many as 78% of adults with ADHD have an objectively delayed circadian rhythm<\/strong> — measured not by self-report but by when melatonin actually begins rising in saliva.<sup class=\"fn\">¹⁴<\/sup> In adults with ADHD that release is delayed by roughly <strong class=\"num\">90 minutes<\/strong> compared with everyone else. Sleep disturbance affects up to 80% of adults with the condition, and the sleep-onset and efficiency problems persist even after controlling for anxiety and depression.<sup class=\"fn\">¹⁴<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>You are not a night owl because you’re undisciplined.<\/p><\/aside><p>Sit with that, because it reframes something you’ve been blamed for your whole life. <strong>You are not a night owl because you’re undisciplined. Your internal clock is running about an hour and a half behind everyone else’s<\/strong> — and you have been getting up for a world calibrated to a rhythm that isn’t yours, accumulating a sleep debt that then looks exactly like worse ADHD.<\/p><figure class=\"ph\" data-slot=\"ch16-l08\"><\/figure><p><strong>And it’s shiftable.<\/strong> In a randomised trial in adults with ADHD and delayed sleep phase, <strong>melatonin advanced the internal clock by 1.5 hours and reduced ADHD symptoms by 14%.<\/strong><sup class=\"fn\">¹⁵<\/sup> A separate pilot using <strong>30 minutes of 10,000-lux bright light in the morning<\/strong> advanced the clock, and — this is the important part — <strong>the size of the phase shift correlated with the drop in ADHD symptom scores.<\/strong><sup class=\"fn\">¹⁶<\/sup><\/p><p>An honest complication: in that same trial, melatonin <em>combined<\/em> with bright light shifted the clock further (two hours) but <strong>did not<\/strong> improve ADHD symptoms. So the relationship between phase advance and symptoms isn’t as simple as “shift the clock, feel better.” The direction is promising; the mechanism isn’t settled.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">What to actually do<\/h4><div class=\"bx-body\"><p><strong>What to actually do:<\/strong> - <strong>Bright light in the morning<\/strong>, close to waking. 10,000-lux box for 30 minutes, or get outside. This is the same intervention as Chapter 13’s, doing a different job. - <strong>Melatonin at a physiologic dose — around 0.5 mg<\/strong>, not the 5 or 10 mg sold in shops. It’s being used here to shift a clock, not to sedate you, and higher doses don’t shift it better. - <strong>Timing matters more than dose.<\/strong> Trials individualised it to measured melatonin onset; a practical approximation is roughly five hours before your target bedtime. Worth doing with a doctor if you can. - <strong>Dim the overhead lights after about 4pm<\/strong>, which was part of the light-therapy protocol.<\/p><\/div><\/aside><p>If you do one thing from this chapter, do this. It’s cheap, it targets something measurable, and a shifted clock improves everything downstream.<\/p>"}, {"t": "Supplements", "g": "What actually helps", "k": "", "w": 773, "h": "<p>Ranked strongest evidence first. Two of these have more behind them than most people expect, and the first one is almost never mentioned.<\/p><p><strong class=\"steplead\">1. Broad-spectrum micronutrients.<\/strong> Not a single nutrient — a formulation containing most vitamins and minerals together, at doses above what a standard multivitamin provides.<\/p><figure class=\"ph\" data-slot=\"ch16-l09\"><\/figure><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>47%<\/b><span>of the micronutrient group were rated much or very much improved by clinicians<\/span><\/div><div class=\"bx-body\"><p>In the first fully blinded randomised trial of this approach, <strong>93 medication-free children aged 7–12 were assigned to micronutrients or placebo for ten weeks. 47% of the micronutrient group were rated much or very much improved by clinicians, against 28% on placebo<\/strong>, with effect sizes across functional domains ranging from 0.35 to 0.66.<sup class=\"fn\">¹⁷<\/sup> Improvements showed up in inattention, overall functioning, emotional regulation and aggression. Side effects were minimal.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>So the effect appears to build with time rather than arriving at once.<\/p><\/aside><p>Two further details worth having. In the open-label extension, children who had been on placebo and then switched to micronutrients went from <strong class=\"num\">32% responders to 65%<\/strong> — and those who stayed on micronutrients for twenty weeks rather than ten improved further still.<sup class=\"fn\">¹⁸<\/sup> So the effect appears to build with time rather than arriving at once. And there are separate randomised trials in <strong>adults<\/strong>, which is unusual in this field — most nutritional ADHD research stops at childhood.<sup class=\"fn\">¹⁹<\/sup><\/p><p>The honest limits: this is largely one research group, in New Zealand, and the formulations tested are specific commercial products rather than a generic multivitamin off a shelf. That’s the same pattern flagged for saffron in Chapter 13 — a caveat, not a disqualification. The trials are well designed and the researchers declared no conflicts.<\/p><p><strong class=\"steplead\">2. Omega-3 — and check the label.<\/strong> More trials behind it than micronutrients, with a smaller effect.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>500 to 750 mg of EPA daily<\/b><span>was the effective range<\/span><\/div><div class=\"bx-body\"><p>Pooling 10 randomised trials in 699 children, omega-3 produced a <strong>small-to-moderate benefit (SMD 0.31)<\/strong> with no evidence of publication bias and a clear dose relationship — <strong>500 to 750 mg of EPA daily was the effective range.<\/strong><sup class=\"fn\">²⁰<\/sup> A second meta-analysis found <strong class=\"num\">g = 0.38<\/strong> on symptoms and a larger <strong class=\"num\">g = 1.09<\/strong> on attention-specific cognitive measures.<sup class=\"fn\">²¹<\/sup> People with ADHD have measurably lower EPA and DHA than controls.<sup class=\"fn\">²¹<\/sup><\/p><\/div><\/aside><p>Two things to carry with it. <strong>Stimulant medication produces two to three times the effect<\/strong><sup class=\"fn\">²⁰<\/sup> — this is an addition, not a replacement. And there’s a stratification finding that should be familiar by now: high-dose EPA improved attention specifically in those with <strong>low EPA levels to begin with.<\/strong><sup class=\"fn\">²²<\/sup> Same shape as the inflammation findings in Chapter 13 — the biology predicts who responds.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Check the label and make sure EPA is the larger of the two numbers.<\/p><\/div><\/aside><p><strong class=\"steplead\">3. Iron — but test first.<\/strong> Iron is a required cofactor for making dopamine, which is how it ended up in this literature.<\/p><div class=\"points\"><div class=\"point\"><h4>What holds up:<\/h4><p>ferritin is on average lower in children with ADHD (a small effect — Hedges’ g = −0.246), most studies find an association between iron deficiency and symptom severity, and every treatment study to date, including two randomised trials, found benefit in children who were actually deficient.<sup class=\"fn\">²³<\/sup><\/p><\/div><div class=\"point\"><h4>What doesn’t:<\/h4><p>the effect is small, large population studies looking at ferritin across everyone find nothing, and almost all of it is in children. Iron deficiency is not a hidden cause of ADHD.<\/p><\/div><\/div><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>What that leaves, and it’s worth having:<\/strong> in people with ADHD <em>and<\/em> documented low ferritin, correcting it helped — with the clearest signal of all in <strong>restless, disturbed sleep.<\/strong> So this is a test to ask for, particularly if your nights are broken and particularly if you menstruate. Trials used a threshold around 30 ng/mL, well above where most labs stop flagging. Don’t supplement iron without testing; too much is its own problem.<\/p><\/div><\/aside><p><strong class=\"steplead\">4. Magnesium.<\/strong> Thinner evidence here than in the depression chapter, and a good rationale. It dampens the brain’s main excitatory system, it’s depleted by stress, and it helps sleep — which by everything above is your biggest lever. Around 250–500 mg of glycinate in the evening. Cheap, well tolerated, and it does a second job while it’s there.<\/p><p><strong class=\"steplead\">5. Zinc.<\/strong> Lower zinc has been reported in ADHD, and it’s involved in dopamine metabolism. The supplementation trials are mixed and mostly in children, with the clearer results in people who were deficient — the same pattern as iron. Around 25 mg with food, as a defined trial of two or three months rather than an open-ended addition, since sustained high-dose zinc depletes copper.<\/p><p><strong>One that isn’t on this list:<\/strong> anything sold as a “focus stack” or nootropic blend. Undisclosed doses, no trials, and often just caffeine with extra steps — which, given what caffeine does to the sleep you’re already short of, is the opposite of what this chapter recommends.<\/p>"}, {"t": "Movement as a tool, not a virtue", "g": "What actually helps", "k": "", "w": 115, "h": "<p>Exercise helps here, and there’s a specific way to use it that most advice misses.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Use it as a state-changer<\/h4><div class=\"bx-body\"><p><strong>Use it as a state-changer rather than a fitness project.<\/strong> Ten minutes of something vigorous before the task you’ve been avoiding is doing pharmacology, not exercise: it raises the dopamine and noradrenaline availability the task requires. That’s a completely different proposition from “start going to the gym,” which requires the exact executive function you’re short of.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>If you have abandoned six gym memberships, that is information about the format, not about you.<\/p><\/aside><p><strong>Anything with other people, novelty or an element of play will be one you keep doing.<\/strong> A team sport, a class, a dog. If you have abandoned six gym memberships, that is information about the format, not about you.<\/p>"}, {"t": "Build the scaffold outside your head", "g": "What actually helps", "k": "", "w": 188, "h": "<p>The single most useful reframe for daily function: <strong>stop trying to remember and start building external structure.<\/strong> Not because you’re incapable, but because working memory is the specific thing that’s expensive for you, and every item you’re holding in your head is running a background process.<\/p><aside class=\"bx bx-steps\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6h11M9 12h11M9 18h11\"/><circle cx=\"4.5\" cy=\"6\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"12\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"18\" r=\"1.2\"/><\/svg><span>Your checklist<\/span><\/div><div class=\"bx-body\"><ul>\n<li><strong>Get it out of your head immediately<\/strong> — one capture place, whatever you’ll actually use.<\/li>\n<li><strong>Make things visible.<\/strong> Out of sight really is out of mind here. Clear containers, open shelves, things left where you’ll trip over them.<\/li>\n<li><strong>Body doubling<\/strong> — working alongside someone, in person or on a video call. Sounds absurd; works remarkably well, because it manufactures the mild accountability and urgency your system runs on.<\/li>\n<li><strong>Shrink the starting step until it’s stupid.<\/strong> Not “do the taxes.” Open the folder. Starting is the expensive part, not continuing.<\/li>\n<li><strong>Borrow urgency deliberately<\/strong> — a timer, a deadline you tell someone about, a booked appointment. You’re not cheating. You’re supplying the fuel your brain actually uses.<\/li>\n<\/ul><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>It’s arranging the world so it requires less of the thing you’re short of.<\/p><\/aside><p>None of this is trying harder. It’s arranging the world so it requires less of the thing you’re short of.<\/p>"}, {"t": "What makes it worse", "g": "What actually helps", "k": "worse", "w": 346, "h": "<p>The framing on this one matters more than usual, so let me be exact about it.<\/p><p><strong>These probably didn’t cause your ADHD, and the arrows likely run both ways.<\/strong> You’re drawn to screens <em>because<\/em> they supply the novelty and instant feedback your system runs on. You’re sedentary <em>because<\/em> starting exercise needs the executive function you’re short of. You sleep badly <em>because<\/em> your body clock is delayed. None of that is a moral failing, and it’s the reason a list like this can feel like one more accusation.<\/p><figure class=\"ph\" data-slot=\"ch16-l12\"><\/figure><aside class=\"margin-quote\"><span>Key idea<\/span><p>Read it instead as: your system is more sensitive to these than most people’s, so they cost you more.<\/p><\/aside><p>Read it instead as: <strong>your system is more sensitive to these than most people’s, so they cost you more.<\/strong><\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>nearly 4,000 adolescents<\/b><span>increases in screen time in a given year tracked with worsening ADHD symptoms<\/span><\/div><div class=\"bx-body\"><p><strong>Screens.<\/strong> Longitudinal research finds the relationship is <strong>bidirectional<\/strong> rather than one-way, and a review of longitudinal studies found effects ranging from absent to bidirectional.<sup class=\"fn\">²⁴<\/sup> The strongest evidence is within-person: in a five-year study of nearly 4,000 adolescents, <strong>increases in screen time in a given year tracked with worsening ADHD symptoms in that same year.<\/strong><sup class=\"fn\">²⁵<\/sup> Sleep disruption appears to be a main route by which it happens.<sup class=\"fn\">²⁴<\/sup><\/p><\/div><\/aside><p>And as with television in Chapter 13, it isn’t screens as such — some interactive or cognitively demanding digital activity appears neutral or even useful.<sup class=\"fn\">²⁴<\/sup> What costs you is the endless, effortless, high-novelty kind, especially at night, especially when it’s eating the sleep you already can’t afford.<\/p><p><strong>Sleep debt<\/strong>, which is where all of this lands, and which is upstream of everything else on this page.<\/p><div class=\"points\"><div class=\"point\"><h4>Unstable blood sugar.<\/h4><p>The prefrontal cortex is the first thing to go offline when fuel is unstable, and it’s the region already working hardest.<\/p><\/div><div class=\"point\"><h4>Alcohol and cannabis.<\/h4><p>Both are extremely common self-medication in undiagnosed ADHD — they quiet the noise. Both worsen the core problem, and both wreck the sleep architecture you need.<\/p><\/div><div class=\"point\"><h4>Chronic stress with no recovery.<\/h4><p>Chapter 2 covered the mechanism: sustained stress hormones impair prefrontal function directly. A system already stretched has less to spare.<\/p><\/div><\/div><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>Unstructured time.<\/strong> The one nobody names. An empty week with no anchors is harder for you than a full one with a shape.<\/p><\/div><\/aside>"}, {"t": "Something from your history", "g": "What actually helps", "k": "", "w": 214, "h": "<p>Of all the conditions in this book, ADHD is the one with the most consistently replicated link to early lead exposure. If you were a child before the late 1970s, or grew up around older housing, industry or busy roads, some of what you’ve lived with may have started there.<\/p><p>I’m telling you this for one reason, and it isn’t the reason you might expect. <strong>It is not something to undo.<\/strong> The large randomised trial of chelation in lead-exposed children lowered blood lead markedly and produced <strong>no improvement<\/strong> in cognition or behaviour — at three years, and again at ages seven and seven and a half.<sup class=\"fn\">²⁶<\/sup> The investigators’ own conclusion was that what matters is finding and stopping the exposure, not treating it afterwards.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So this is context, not a treatment target. Its value is that it moves an explanation out of your character and into your history — which is where it belongs, and which is worth something even when nothing can be done about it.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>What is actionable is current exposure, and the nutrient status that governs how much of it your body takes up.<\/p><\/aside><p>What <em>is<\/em> actionable is current exposure, and the nutrient status that governs how much of it your body takes up. Chapter 7 covers both: low iron in particular increases lead absorption, which is one more reason the ferritin test above is worth asking for.<\/p>"}, {"t": "What to ask to be tested for", "g": "What actually helps", "k": "tests", "w": 94, "h": "<p>Everything in Chapter 13’s panel applies. Four things matter especially here:<\/p><aside class=\"bx bx-steps\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6h11M9 12h11M9 18h11\"/><circle cx=\"4.5\" cy=\"6\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"12\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"18\" r=\"1.2\"/><\/svg><span>Your checklist<\/span><\/div><div class=\"bx-body\"><ul>\n<li><strong>Ferritin<\/strong> — with an inflammatory marker alongside it, since ferritin rises with inflammation and can read falsely normal. Ask for the number, not “normal.”<\/li>\n<li><strong>Full thyroid panel<\/strong> — an underactive thyroid produces textbook inattention and is routinely missed.<\/li>\n<li><strong class=\"num\">B12 with functional markers<\/strong>, plus folate.<\/li>\n<li><strong class=\"num\">HbA1c and fasting insulin.<\/strong><\/li>\n<\/ul><\/div><\/aside><p>And if you are a woman over about thirty-five whose symptoms have worsened without explanation, ask about <strong>perimenopause<\/strong> — and mention the ADHD question in the same appointment, because as this chapter has covered, they interact.<\/p>"}, {"t": "Medication", "g": "What actually helps", "k": "", "w": 189, "h": "<p><strong>The effect sizes are among the largest in psychiatry, and that deserves to be said plainly.<\/strong> Long-acting stimulants show an effect size around <strong class=\"num\">0.73<\/strong> in adults; short-acting come in higher at 0.96, dropping to <strong>0.86 once publication bias is accounted for.<\/strong><sup class=\"fn\">²⁷<\/sup> Non-stimulants such as atomoxetine are meaningfully weaker at around <strong class=\"num\">0.39.<\/strong><sup class=\"fn\">²⁸<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Long-term follow-up associates treatment with better academic and occupational outcomes and lower rates of substance misuse — which is the opposite of the popular fear.<\/p><\/aside><p>Long-term follow-up associates treatment with better academic and occupational outcomes and <strong>lower rates of substance misuse<\/strong> — which is the opposite of the popular fear.<sup class=\"fn\">²⁹<\/sup><\/p><p><strong>The other half, equally plainly:<\/strong> side effects and dropout rates are significant, many people get only a partial response, and <strong>combining medication with psychological or skills-based treatment works better than medication alone.<\/strong><sup class=\"fn\">²⁸<\/sup> Stimulants also affect sleep and appetite, which matters in a chapter that has just told you sleep is your biggest lever — so timing is a real conversation to have with your prescriber, not an afterthought.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>And the thing this whole chapter exists for: <strong>no medication corrects your ferritin, your circadian phase, your blood sugar, or your hormones.<\/strong> It makes the day possible. It doesn’t fix the foundation.<\/p><\/div><\/aside>"}, {"t": "Relapsing", "g": "What actually helps", "k": "", "w": 264, "h": "<p>You will have a stretch where it all falls apart again, usually after months of doing well. Some specifics for this condition:<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>The system you built stopped being novel.<\/strong> This one is different from the other chapters. Any structure that worked partly <em>because<\/em> it was new will lose potency once it isn’t. That’s not failure — it’s the same mechanism that makes the first week of anything easy. Expect to refresh your systems periodically rather than concluding they don’t work. Changing the app, the notebook or the room is a legitimate intervention here, not procrastination.<\/p><\/div><\/aside><p><strong>Something physical shifted.<\/strong> Run the same checks as Chapter 15 — sleep drift, illness or antibiotics, eating, alcohol. Plus two specific to this chapter: <strong>where you are in your cycle<\/strong>, and <strong>whether your sleep phase has slipped back<\/strong> after a run of late nights or a holiday. Both are recoverable and neither is a verdict.<\/p><p>Also worth a look: anything new in your environment — a move, a renovation, a change of job, new water. Chapter 7 explains what’s worth pursuing there and what isn’t.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Executive function is a resource, and demand rose.<\/p><\/aside><p><strong>Your load changed.<\/strong> New job, new baby, house move, a term with no structure. Executive function is a resource, and demand rose. The strategies didn’t stop working — there’s less left to run them with.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>And what you got done during the good months was real.<\/strong> It wasn’t the medication or the system performing while you sat there. You did that, with support in place. Support isn’t cheating; it’s what made the capacity you already had usable.<\/p><\/div><\/aside>"}, {"t": "You were never lazy", "g": "What actually helps", "k": "", "w": 224, "h": "<p>If you have recognised yourself here, hear this properly, because you have almost certainly heard the opposite for a very long time.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>You were not lazy.<\/p><\/aside><p>You were not lazy. You were running a brain that cannot use importance as fuel, in a world built entirely around the assumption that it can — and you got as far as you did by burning enormous amounts of energy on compensations nobody could see and nobody gave you credit for. The exhaustion is not weakness. It’s the cost of that hidden work.<\/p><p>Every conclusion you drew about your own character along the way — that you were careless, unreliable, not trying, wasting yourself — was drawn from evidence that looked convincing and was pointing at the wrong thing. Those weren’t accurate assessments. They were the only available explanation at the time.<\/p><p>If you’re grieving what might have been had someone noticed earlier, that grief is legitimate and you’re allowed it. And it belongs alongside this: <strong>the pattern is now visible, and everything visible is workable.<\/strong> Light in the morning. A test for something your body might be short of. A structure outside your head. Possibly a medication that will feel, as many people describe it, like the volume finally coming down.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p class=\"closing\">You never needed to try harder. You needed the right conditions — and unlike character, those can be arranged.<\/p><\/div><\/aside>"}, {"t": "The research", "g": "What actually helps", "k": "refs", "w": 2066, "h": "<ul class='refs'><li><p>Data on ADHD prevalence and sex ratios. <em>(Global prevalence estimated at 2–6%. The male-to-female ratio in childhood diagnosis is approximately 3:1 to 4:1, narrowing to close to 1:1 in adulthood — a pattern generally interpreted as evidence of substantial delayed diagnosis in females.)<\/em><\/p><\/li><li><p>Study of diagnostic complexity and prior diagnoses in ADHD, published in the <em>Journal of Attention Disorders<\/em> (2024). <em>(Adults with inattentive-presentation ADHD had prior depression diagnoses in 13–18% of cases and prior anxiety diagnoses in 17–26%, versus 5–12% and 9–20% for the hyperactive-impulsive presentation. Females were diagnosed on average around five years later than males. Females were more likely than males to have pre-existing depression or anxiety diagnoses whose symptoms did not continue after ADHD diagnosis, which the authors interpret as possible earlier misdiagnosis.)<\/em><\/p><\/li><li><p>Population-level study from Wales (2024) on sex differences in the diagnostic pathway to ADHD. <em>(Females with ADHD were significantly more likely than males to have received diagnoses of anxiety and depression, and to have been prescribed antidepressants, prior to ADHD recognition.)<\/em> See also the 2024 <em>Lancet Psychiatry<\/em> review on why females are less likely to receive a childhood ADHD diagnosis, identifying diagnostic criteria less sensitive to female presentations, diagnostic overshadowing, and compensatory strategies.<\/p><\/li><li><p>Mixed-methods study of women with late-diagnosed ADHD (n = 28). <em>(Participants reported internalised criticism, low self-esteem, guilt and shame attributed to delayed diagnosis, and described diagnosis as revelatory alongside grief for the life they might have led. Small qualitative sample — indicative of experience rather than prevalence.)<\/em><\/p><\/li><li><p>Reviews of hormonal fluctuation and ADHD in women. <em>(Estrogen modulates dopaminergic signalling and prefrontal function; the combination of atypical dopamine signalling and falling estrogen is associated with worse cognitive symptoms. Postpartum depression and anxiety risk is reported at around five times higher in women with ADHD. Higher rates of premenstrual dysphoric disorder are also reported.)<\/em><\/p><\/li><li><p>Practical reviews of female-specific ADHD and hormonal fluctuation. <em>(Many women report cyclical variation in symptom intensity and reduced psychostimulant efficacy during the late luteal phase. Largely based on clinical observation and self-report rather than controlled trials — the authors identify this as a significant research gap.)<\/em><\/p><\/li><li><p>Study of perimenopausal symptoms in women with and without ADHD, <em>Frontiers in Global Women’s Health.<\/em> <em>(Women with ADHD reported more severe perimenopausal symptoms, with the between-group difference peaking between ages 35 and 39. The authors note that around 8% of women aged 35–44 without an ADHD diagnosis reported severe ADHD symptoms, and that it could not be determined whether these represented undiagnosed ADHD.)<\/em><\/p><\/li><li><p>Reviews of emotional dysregulation in ADHD, including Shaw, P., et al. <em>American Journal of Psychiatry<\/em> estimates. <em>(Emotional dysregulation was part of the earliest clinical descriptions of ADHD but was removed from the formal diagnostic criteria decades ago. Estimates place difficulties with emotion regulation at 25–45% of children and 30–70% of adults with ADHD.)<\/em><\/p><\/li><li><p>Lived experience of rejection sensitivity in ADHD: a qualitative exploration (2025). <em>PLOS ONE.<\/em> <em>(Thematic analysis of focus-group interviews identifying withdrawal, masking and bodily sensations as the core themes. Participants reported that anticipation of rejection was often more painful than the rejection itself, and described masking leading to dissociation from themselves and withdrawal from others, resulting in loneliness. The authors propose sensitisation — that responses to frequent early criticism grow larger over time — noting that ADHD traits are met with criticism from a young age. Also notes emotional dysregulation has been found more negatively influential on quality of life than inattentive and hyperactivity traits. Five participants: a qualitative study, indicative of experience rather than prevalence.)<\/em><\/p><\/li><li><p>Commentary on the evidence base for rejection sensitive dysphoria. <em>(RSD is not listed in the DSM-5; there are no standardised diagnostic criteria and only a small number of studies use the specific term, all qualitative with samples ranging from 4 to 43 participants. The underlying emotional dysregulation is far better evidenced than the label. Note that emotional self-regulation has been added to adult ADHD diagnostic criteria in the EU.)<\/em><\/p><\/li><li><p>Zhang, L., et al. (2024). Attention-deficit/hyperactivity disorder medications and long-term risk of cardiovascular diseases. <em>JAMA Psychiatry.<\/em> <em>(Nested case-control study of 278,027 individuals with ADHD followed over 14 years. Each additional year of medication use was associated with approximately 4% higher risk of incident cardiovascular disease, driven primarily by hypertension and arterial disease, with the steepest increase over the first three years. Observational — treated and untreated groups differ in ways randomisation would be needed to resolve, and absolute risk remained low.)<\/em><\/p><\/li><li><p>Nissen, S. E. (2006). ADHD drugs and cardiovascular risk. <em>New England Journal of Medicine, 354<\/em>(14), 1445–1448. <em>(Mixed amphetamine salts raised systolic blood pressure by around 5 mmHg in adults in placebo-controlled trials, with similar effects for methylphenidate formulations. Describes the 2006 FDA advisory committee vote — eight to seven — to recommend a cardiovascular black-box warning. Note that other analyses find changes of this size were often also observed in placebo groups.)<\/em><\/p><\/li><li><p>Westover, A. N., &amp; Halm, E. A. (2012). Do prescription stimulants increase the risk of adverse cardiovascular events? A systematic review. <em>BMC Cardiovascular Disorders, 12,<\/em> 41. <em>(Ten population-based observational studies. Six of seven studies in children and adolescents found no association with adverse cardiovascular outcomes; two of three studies in adults did, with increased risk of transient ischaemic attack and sudden death or ventricular arrhythmia. The authors describe findings as mixed and note significant concerns about confounding and selection bias.)<\/em><\/p><\/li><li><p>Reviews of circadian rhythm disturbance in ADHD. <em>(Delayed sleep-wake timing occurs in up to 78% of adults and children with ADHD; insomnia and sleep disturbance affect up to 80% of adults. Dim-light melatonin onset is delayed by approximately 45 minutes in children and 90 minutes in adults. Sleep-onset latency and sleep-efficiency problems remain significantly associated with ADHD after controlling for anxiety and depression.)<\/em><\/p><\/li><li><p>Van Andel, E., Bijlenga, D., Vogel, S. W. N., Beekman, A. T. F., &amp; Kooij, J. J. S. Randomised controlled trial of chronotherapy in adults with ADHD and delayed sleep phase syndrome (n = 49). <em>(Melatonin advanced dim-light melatonin onset by 1.5 hours and reduced ADHD symptoms by 14%. Melatonin combined with bright light therapy advanced the phase by 2 hours but did not reduce ADHD symptoms — so the relationship between phase advance and symptom improvement is not straightforward. Small sample.)<\/em><\/p><\/li><li><p>Correcting delayed circadian phase with bright light therapy predicts improvement in ADHD symptoms: a pilot study. <em>Journal of Psychiatric Research<\/em> (2017), 91:105–110. <em>(Two weeks of 30-minute morning 10,000-lux light advanced melatonin onset by 31 minutes and mid-sleep time by 57 minutes; the magnitude of phase advance correlated with reduction in ADHD rating scale scores. Pilot study, no control group.)<\/em><\/p><\/li><li><p>Rucklidge, J. J., Eggleston, M. J. F., Johnstone, J. M., Darling, K., &amp; Frampton, C. M. (2018). Vitamin-mineral treatment improves aggression and emotional regulation in children with ADHD: a fully blinded, randomized, placebo-controlled trial. <em>Journal of Child Psychology and Psychiatry, 59<\/em>(3), 232–246. <em>(93 medication-free children aged 7–12, randomised 1:1 to broad-spectrum micronutrients or placebo for ten weeks. 47% rated much or very much improved on clinician-rated Clinical Global Impression versus 28% on placebo, effect size 0.46; effect sizes across functional domains ranged 0.35–0.66. Minimal side effects. No conflicts of interest declared. Note the formulations tested are specific commercial products, and this research group has produced most of the trials in this area.)<\/em><\/p><\/li><li><p>Open-label extension of the above. <em>(Of 93 children, 78 completed the extension phase. Those initially randomised to placebo increased from 32.4% responders during the trial to 64.9% after switching to micronutrients; those on micronutrients for twenty weeks rose from 46.3% to 63.4%. Open-label — expectation effects cannot be excluded — but the pattern suggests benefit accumulating with duration.)<\/em><\/p><\/li><li><p>Rucklidge, J. J., Frampton, C. M., Gorman, B., &amp; Boggis, A. (2014). Vitamin-mineral treatment of attention-deficit hyperactivity disorder in adults: double-blind randomised placebo-controlled trial. <em>British Journal of Psychiatry, 204<\/em>(4), 306–315. <em>(Adult trial, with a one-year naturalistic follow-up published separately. Three randomised trials now exist across children and adults, which is unusual in nutritional ADHD research.)<\/em><\/p><\/li><li><p>Bloch, M. H., &amp; Qawasmi, A. (2011). Omega-3 fatty acid supplementation for the treatment of children with attention-deficit/hyperactivity disorder symptomatology: systematic review and meta-analysis. <em>Journal of the American Academy of Child and Adolescent Psychiatry, 50<\/em>(10), 991–1000. <em>(10 RCTs, 699 children aged 7–12; SMD 0.31 with no evidence of publication bias and significant dose dependency, with 500–750 mg EPA daily most effective. The authors note stimulant medication effect sizes are two to three times larger.)<\/em><\/p><\/li><li><p>Chang, J. P.-C., Su, K.-P., Mondelli, V., &amp; Pariante, C. M. (2018). Omega-3 polyunsaturated fatty acids in youths with attention deficit hyperactivity disorder: a systematic review and meta-analysis. <em>Neuropsychopharmacology, 43<\/em>(3), 534–545. <em>(7 RCTs, n = 534, g = 0.38 on clinical symptoms; 3 RCTs, n = 214, g = 1.09 on attention-related cognitive measures. Children with ADHD had lower DHA (g = −0.76) and EPA (g = −0.38) than controls.)<\/em><\/p><\/li><li><p>Chang, J. P.-C., et al. (2019). High-dose eicosapentaenoic acid improves attention and vigilance in children and adolescents with ADHD and low endogenous EPA levels. <em>Translational Psychiatry, 9,<\/em> 303. <em>(Benefit concentrated in those with low baseline EPA — a stratification finding requiring replication.)<\/em><\/p><\/li><li><p>Meta-analyses of peripheral iron status in ADHD. <em>(Serum ferritin significantly lower in children with ADHD — 1,560 cases versus 4,691 controls, Hedges’ g = −0.246 — with no difference in serum iron or transferrin. A scoping review found 22 of 30 studies showed an association between ADHD occurrence or severity and iron deficiency, and all six treatment studies including two RCTs found benefit. Note the counterweight: large observational stud
