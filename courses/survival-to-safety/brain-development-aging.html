ckenpox. When it reactivates it drives inflammation, amyloid deposition and blood vessel damage — and it may reactivate herpes simplex in the brain alongside it.<sup class=\"fn\">⁶<\/sup> HSV-1 DNA has been found in post-mortem brain tissue sitting directly alongside amyloid plaques.<sup class=\"fn\">⁹<\/sup><\/p><p><strong>None of this is in standard prevention advice yet.<\/strong> One published critique of the major dementia risk report points out that it omits viral infection entirely.<sup class=\"fn\">¹⁰<\/sup><\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>If you are over fifty, the shingles vaccine is a conversation to have at your next appointment.<\/p><\/div><\/aside>"}, {"t": "Your genes are not your sentence", "g": "", "k": "", "w": 83, "h": "<p>If a parent has this, you have probably wondered about your own odds, and possibly about testing.<\/p><p>The gene that comes up is APOE4. Carrying it raises your risk substantially. It determines nothing.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>When researchers modelled all the known risk factors together against biomarkers and cognitive impairment, APOE turned out to be the least important contributor of everything they measured.<\/p><\/aside><p>When researchers modelled all the known risk factors together against biomarkers and cognitive impairment, <strong>APOE turned out to be the least important contributor<\/strong> of everything they measured.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Read that against what you’re afraid of. A gene you cannot change was outweighed by a long list of things you can.<\/p><\/div><\/aside>"}, {"t": "Almost half of it is not fixed", "g": "", "k": "", "w": 202, "h": "<p>The 2024 Lancet Commission — the major international review of dementia prevention — concluded that <strong>around 45% of dementia cases could potentially be prevented or delayed by addressing 14 modifiable risk factors.<\/strong><sup class=\"fn\">¹¹<\/sup> The 2024 update added vision loss and high cholesterol to the previous twelve.<sup class=\"fn\">¹²<\/sup><\/p><p>The fourteen: education, hearing loss, vision loss, depression, social isolation, physical inactivity, head injury, diabetes, LDL cholesterol, obesity, high blood pressure, smoking, alcohol, air pollution.<\/p><p>Now the part that keeps me honest with you.<\/p><p>When one research group tried to replicate that model in a single long-term cohort, testing all fourteen factors at once, <strong>only hearing loss, diabetes and high blood pressure remained statistically significant.<\/strong><sup class=\"fn\">¹³<\/sup> Several of the others showed no effect at all. Mid-life high blood pressure came out associated with <em>lower<\/em> odds, which nobody expected.<sup class=\"fn\">¹³<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So the 45% is a population estimate, not a personal forecast. It means that across a whole society, addressing these things would prevent a great deal of dementia. It does not mean anyone can calculate your individual odds, and anyone who offers to is selling something.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>What it does give you is a list of things worth doing — most of which are good for you regardless.<\/p><\/aside><p>What it does give you is a list of things worth doing — most of which are good for you regardless.<\/p>"}, {"t": "Start with your mouth", "g": "What actually helps", "k": "", "w": 219, "h": "<p>This is the most surprising item on the page and one of the cheapest.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>six- to tenfold<\/b><span>higher Alzheimer’s risk<\/span><\/div><div class=\"bx-body\"><p><strong>Oral bacteria have been found inside the brains of people with Alzheimer’s.<\/strong> A meta-analysis found that the presence of oral bacteria in brain tissue — particularly <em>Porphyromonas gingivalis<\/em>, the bacterium behind gum disease — was <strong>associated with six- to tenfold higher Alzheimer’s risk.<\/strong><sup class=\"fn\">¹⁴<\/sup><\/p><\/div><\/aside><p>And a systematic review found that <strong>periodontitis in adults over 65 was associated with a six-fold increase in the rate of cognitive decline<\/strong> over six months.<sup class=\"fn\">¹⁵<\/sup><\/p><p>The route is not exotic. These bacteria enter your bloodstream during ordinary brushing, flossing and chewing whenever your gums bleed.<sup class=\"fn\">¹⁵<\/sup> Once circulating, the enzymes they produce promote amyloid aggregation, drive inflammation, and damage the barrier protecting your brain.<sup class=\"fn\">¹⁴<\/sup> They travel by the gut as well — we swallow something like <strong>1.5 trillion oral bacteria a day<\/strong>, and gum disease measurably changes the gut microbiome.<sup class=\"fn\">¹⁶<\/sup> Chapter 6’s territory again, arriving somewhere nobody expects it.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">What to do<\/h4><div class=\"bx-body\"><p><strong>What to do:<\/strong> see a dentist and a hygienist. Floss. Stop treating bleeding gums as normal.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>But the intervention costs almost nothing, and you were meant to be doing it anyway.<\/p><\/aside><p>Being straight about the evidence: this is association plus mechanism plus animal work. No trial has yet shown that treating gum disease prevents dementia. But the intervention costs almost nothing, and you were meant to be doing it anyway.<\/p>"}, {"t": "Sleep is when the brain cleans itself", "g": "What actually helps", "k": "", "w": 223, "h": "<p>Your brain has no lymphatic drainage that anatomists could ever find, which raised an obvious question about where its waste goes.<\/p><p>The answer is a network of channels running alongside blood vessels — the glymphatic system — and it does most of its work while you sleep. During deep sleep, <strong>the space between brain cells expands by roughly 60%<\/strong>, dramatically increasing the flow that flushes waste out.<sup class=\"fn\">¹⁷<\/sup> Amyloid and tau are among the things carried away.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>39 people<\/b><span>were studied after a normal night’s sleep and after a night without it<\/span><\/div><div class=\"bx-body\"><p>For years this was mouse research. It isn’t now. In a randomised crossover trial, <strong>39 people were studied after a normal night’s sleep and after a night without it.<\/strong> After normal sleep, morning blood levels of amyloid and tau were <em>higher<\/em> — consistent with the brain having cleared more of it overnight.<sup class=\"fn\">¹⁸<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Deep sleep specifically is the part that matters — not just hours in bed.<\/p><\/aside><p>Two things follow. <strong>Deep sleep specifically is the part that matters<\/strong> — not just hours in bed. And <strong>glymphatic clearance falls by around 40% between young adulthood and your seventies<\/strong>,<sup class=\"fn\">¹⁹<\/sup> which is precisely when protecting it counts most.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">The short version<\/h4><div class=\"bx-body\"><p>Chapter 9 has the practical detail. The short version: consistent wake time, morning light, cool dark room, and take alcohol seriously, because it suppresses exactly the sleep stage doing this work.<\/p><\/div><\/aside><p><em>One caveat, since the field is still arguing: the glymphatic model is actively debated.<sup class=\"fn\">²⁰<\/sup> The link between poor sleep and dementia risk is not.<\/em><\/p>"}, {"t": "Get your hearing tested", "g": "What actually helps", "k": "", "w": 97, "h": "<p>Hearing loss is the most under-rated item on that list of fourteen, and one of only three that survived the replication above.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Get tested<\/h4><div class=\"bx-body\"><p>Get tested. Wear the aids if you need them. People resist this for reasons of vanity that I understand and that cost them a great deal.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>One untreated problem generates three, and the first one is fixable in an afternoon.<\/p><\/aside><p>And note the second mechanism, because it is the loop this chapter most needs to name: <strong>hearing loss makes conversation exhausting, so people withdraw. Withdrawal produces isolation. Isolation is independently on the risk list.<\/strong> One untreated problem generates three, and the first one is fixable in an afternoon.<\/p>"}, {"t": "Look after the metabolic picture", "g": "What actually helps", "k": "", "w": 83, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Between them they are probably the best-evidenced modifiable risk factors in existence.<\/p><\/aside><p>Diabetes survived every replication. So did high blood pressure. Between them they are probably the best-evidenced modifiable risk factors in existence.<\/p><aside class=\"bx bx-define\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 21V5M8 7h7\"/><\/svg><span>What it means<\/span><\/div><h4 class=\"bx-term\">type 3 diabetes<\/h4><div class=\"bx-body\"><p>Alzheimer’s is sometimes called type 3 diabetes, because the brains of people with it show insulin resistance — cells unable to use the fuel available to them. Chapter 7’s blood sugar material is directly relevant, and this is where it pays off longest.<\/p><\/div><\/aside><p>Blood pressure, HbA1c, fasting insulin, weight, movement. Nothing novel. It simply matters more here than almost anywhere.<\/p>"}, {"t": "Feed the brain a different fuel", "g": "What actually helps", "k": "", "w": 225, "h": "<p>If the brain is struggling to use glucose, an alternative fuel is an obvious thought — and ketones are that alternative.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>30 g a day<\/b><span>improved cognition in people with mild cognitive impairment<\/span><\/div><div class=\"bx-body\"><p>Ten randomised trials have tested ketogenic approaches in mild cognitive impairment and Alzheimer’s, using diets, drinks, powders and capsules over periods from six weeks to six months.<sup class=\"fn\">²¹<\/sup> A six-month trial of a ketogenic MCT drink at <strong>30 g a day improved cognition in people with mild cognitive impairment.<\/strong><sup class=\"fn\">²²<\/sup> A modified Mediterranean-ketogenic diet improved cerebrospinal fluid markers, brain perfusion and ketone uptake.<sup class=\"fn\">²³<\/sup><\/p><\/div><\/aside><p>Two honest observations. The trials are small — sixteen to fifty-three participants is typical.<sup class=\"fn\">²⁴<\/sup> And recruitment is brutal: one feasibility study <strong class=\"num\">screened 839 people to randomise 38.<\/strong><sup class=\"fn\">²⁵<\/sup><\/p><p>Then the finding that should be familiar by now. <strong>The benefit appears concentrated in people who don’t carry APOE4.<\/strong> A crossover trial suggested ketone metabolism helps carriers less; a caprylic acid trial found improved brain blood flow <strong>only in non-carriers<\/strong>; and the original trial of a ketogenic agent found rapid cognitive improvement specifically in people lacking the gene.<sup class=\"fn\">²⁴<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The biology predicts who responds.<\/p><\/aside><p>Same shape as the inflammation findings in Chapter 13 and the omega-3 findings in Chapter 16. The biology predicts who responds.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>Practically:<\/strong> MCT oil or a ketogenic drink is a low-risk thing to try. A full ketogenic diet is demanding, and doing it well takes support.<\/p><\/div><\/aside>"}, {"t": "Move, and keep learning", "g": "What actually helps", "k": "", "w": 67, "h": "<p>Physical inactivity is on the list, and the multidomain trials — diet, exercise, cognitive training and vascular monitoring together — are the most encouraging intervention evidence available.<sup class=\"fn\">²⁶<\/sup> A recent trial adapted the approach for a different population and again found cognitive benefit.<sup class=\"fn\">²⁷<\/sup><\/p><p>On cognitive activity: novelty and difficulty matter more than repetition. Crosswords you find easy are not doing much. Learning something you’re bad at is.<\/p>"}, {"t": "If you’re a woman in your forties or fifties", "g": "What actually helps", "k": "", "w": 270, "h": "<p>Two thirds of Alzheimer’s patients are women, and part of the reason may sit in a transition that gets dismissed as an inconvenience.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>60%<\/b><span>of midlife women report difficulties with memory, attention and word-finding during perimenopause<\/span><\/div><div class=\"bx-body\"><p><strong>Up to 60% of midlife women report difficulties with memory, attention and word-finding during perimenopause<\/strong> — and objective testing confirms measurable declines in verbal memory, working memory and executive function that track estradiol fluctuation.<sup class=\"fn\">²⁸<\/sup> Chapter 7 covered this and Chapter 16 met it again in ADHD. Same hormone, third appearance.<\/p><\/div><\/aside><p>Whether hormone therapy protects the brain long-term is unsettled, and you deserve the actual state of it rather than a recommendation:<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>20–32%<\/b><span>lower Alzheimer’s risk — and starting at 65 or later with 38% higher risk<\/span><\/div><div class=\"bx-body\"><ul>\n<li>A meta-analysis of more than fifty trials and observational studies found starting hormone therapy <strong>within five years of menopause associated with 20–32% lower Alzheimer’s risk<\/strong> — and starting at 65 or later with <strong class=\"num\">38% higher<\/strong> risk.<sup class=\"fn\">²⁹<\/sup><\/li>\n<li>The Women’s Health Initiative, which tested oral estrogen in women over 65, found <strong>substantially increased<\/strong> dementia risk.<sup class=\"fn\">³⁰<\/sup><\/li>\n<li>A prospective cohort found early initiation protective — <strong class=\"num\">but only in women without APOE4.<\/strong><sup class=\"fn\">²⁸<\/sup><\/li>\n<li>A 2025 systematic review in <em>Lancet Healthy Longevity<\/em> concluded there is <strong>no evidence that hormone therapy either increases or decreases dementia risk<\/strong>, and that it should be prescribed on other grounds.<sup class=\"fn\">³¹<\/sup><\/li>\n<li>Route may matter: one national cohort found oral estrogen associated with raised dementia risk while <strong>transdermal estrogen was not.<\/strong><sup class=\"fn\">³²<\/sup><\/li>\n<\/ul><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>What is not in dispute is that the cognitive symptoms of perimenopause are real, and that women are routinely told otherwise.<\/p><\/aside><p>So: timing may matter, route may matter, your genes may matter, and the evidence conflicts. That is a conversation with a doctor, not a conclusion from a book. What is <em>not<\/em> in dispute is that the cognitive symptoms of perimenopause are real, and that women are routinely told otherwise.<\/p>"}, {"t": "Supplements", "g": "What actually helps", "k": "", "w": 180, "h": "<aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>Homocysteine and B vitamins first, because there’s a live argument about it and the practical answer is clean.<\/p><\/aside><p>One side: raised homocysteine is a modifiable risk factor, and B-vitamin trials in people with mild cognitive impairment slowed brain shrinkage and cognitive decline markedly. The other side: that finding rests on a subgroup analysis done after the fact, such analyses throw up false positives, and no benefit appeared in people who already had enough B vitamins.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Get homocysteine and B12 tested<\/h4><div class=\"bx-body\"><p>Both are right about something, and the resolution is simple. <strong class=\"num\">Get homocysteine and B12 tested.<\/strong> If homocysteine is high, correcting it is cheap and safe. If you’re already replete, expect little.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Omega-3, vitamin D and magnesium belong here as general brain support — correct what’s low rather than expecting prevention from a capsule.<\/p><\/aside><p><strong class=\"num\">Omega-3, vitamin D and magnesium<\/strong> belong here as general brain support — correct what’s low rather than expecting prevention from a capsule.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>What I’d skip:<\/strong> anything marketed as a memory supplement with a proprietary blend and a testimonial. The gap between what’s sold for this and what’s evidenced for it is wider than in any other area of this book, and it is sold to frightened people.<\/p><\/div><\/aside>"}, {"t": "What makes it worse", "g": "What actually helps", "k": "worse", "w": 48, "h": "<p>Untreated hearing loss. Untreated gum disease. Unmanaged blood sugar and blood pressure. Sedentary living. Social isolation. Short or broken sleep. Head injury. Heavy alcohol. Smoking. Untreated depression. Untreated vision loss.<\/p><p>Read that list again and notice how many are things nobody would think to describe as brain problems.<\/p>"}, {"t": "What to ask to be tested for", "g": "What actually helps", "k": "tests", "w": 111, "h": "<p>Chapter 13’s panel applies. Add:<\/p><aside class=\"bx bx-steps\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6h11M9 12h11M9 18h11\"/><circle cx=\"4.5\" cy=\"6\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"12\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"18\" r=\"1.2\"/><\/svg><span>Your checklist<\/span><\/div><div class=\"bx-body\"><ul>\n<li><strong>Homocysteine<\/strong>, with B12 and folate<\/li>\n<li><strong class=\"num\">HbA1c and fasting insulin<\/strong><\/li>\n<li><strong>Lipids and blood pressure<\/strong><\/li>\n<li><strong>Full thyroid panel<\/strong><\/li>\n<li><strong>A hearing test<\/strong>, which nobody thinks of as a medical test and which belongs on this list more than most of the bloods<\/li>\n<\/ul><\/div><\/aside><p><strong>On APOE testing.<\/strong> You can find out. Before you do, consider what you’d do differently — because for most of this chapter the answer is nothing, since you’d be doing the same things either way. It does affect two decisions covered above: whether ketones are likely to help you, and how the hormone therapy question looks. And it is information that cannot be given back.<\/p>"}, {"t": "If it has already started", "g": "What actually helps", "k": "", "w": 74, "h": "<p>If you’re reading this about yourself, or about someone at an early stage, most of the above still applies. Blood sugar, sleep, hearing, gum disease, movement and connection are worth addressing at any point, and several of them affect how well someone functions now rather than only what happens later.<\/p><p>What changes is the goal. It stops being prevention and becomes function, comfort and time — and those are real goals, not consolation prizes.<\/p>"}, {"t": "The fear itself", "g": "What actually helps", "k": "", "w": 185, "h": "<p>There’s something this chapter should say directly, because it’s probably been running underneath the whole thing.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>You are keeping score of your own mind, and it’s making things worse.<\/strong><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>So the checking produces exactly the lapses it’s watching for, and each lapse feeds the checking.<\/p><\/aside><p>Anxiety impairs memory. So does poor sleep. So does the constant background monitoring of whether you just forgot something significant. So the checking produces exactly the lapses it’s watching for, and each lapse feeds the checking.<\/p><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"/><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p>Losing a word is not early dementia. Walking into a room and forgetting why is not early dementia. Those things happen to tired, busy, stressed people at every age, and they happened to you at thirty without you noticing.<\/p><\/div><\/aside><p>If you’re worried enough that it’s affecting your life, get assessed properly — not so you can be reassured, but so you can stop doing the assessing yourself at three in the morning.<\/p><p>And if you’re grieving a parent who is still alive: that’s a real form of grief, it doesn’t get the recognition that other kinds do, and it deserves the same support. Chapter 11 is not an optional chapter for you.<\/p>"}, {"t": "You are not powerless", "g": "What actually helps", "k": "", "w": 219, "h": "<p>If you came to this chapter frightened, hold on to a few things.<\/p><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"/><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p>The story you were told — that this is an inevitable protein accumulation that medicine will eventually clear — has not survived contact with the evidence. Clearing the protein didn’t fix it. Something else is going on, and some of that something is infection, inflammation, metabolic health, sleep and the state of your gums.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Your genes raise your risk and do not decide it.<\/p><\/aside><p>Your genes raise your risk and do not decide it. In one analysis testing everything at once, the gene mattered less than the modifiable factors.<\/p><p>And almost half the risk across a population sits in things you can act on — imperfectly, without certainty, and starting now rather than at sixty-five.<\/p><p>None of that is a guarantee. I’m not going to give you one, and you should be suspicious of anyone who does. What I can tell you is that the useful things are ordinary and available: a dentist, a hearing test, a decent night’s sleep, a walk, a blood test that costs very little, and the people you already know.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p class=\"closing\">You watched someone disappear and concluded it was coming for you. What the evidence actually says is that a great deal of it was never fixed — and that the work starts a long time before anyone would think to look.<\/p><\/div><\/aside>"}, {"t": "The research", "g": "What actually helps", "k": "refs", "w": 1965, "h": "<ul class='refs'><li><p>Systematic review and meta-analysis of 17 placebo-controlled phase 3 trials covering seven anti-amyloid monoclonal antibodies (2026). <em>(The reviewers concluded that even successful removal of amyloid from the brain does not appear to translate into clinically meaningful benefits for patients with mild cognitive impairment or mild dementia due to Alzheimer’s. Effects on ADAS-Cog and CDR-SB fell below the thresholds considered clinically meaningful; absolute differences were under 2 points on scales spanning 50 or more. ARIA-E occurred in approximately 119 per 1,000 treated versus 12 per 1,000 on placebo, with symptomatic swelling in roughly 30 versus 1 per 1,000. Aducanumab was approved in 2021 and withdrawn by its manufacturer in 2024. Note that whether these drugs produce clinically meaningful benefit remains actively debated and will take years to settle.)<\/em><\/p><\/li><li><p>European Medicines Agency assessment of lecanemab and donanemab. <em>Lancet Regional Health – Europe<\/em> (2026). <em>(Both antibodies demonstrated statistically significant effects on cognitive and functional outcomes in early Alzheimer’s disease, though clinical meaningfulness remains debated, alongside significant safety concerns regarding ARIA — producing a difficult benefit-risk assessment. Presented here to show that reasonable regulators reached a different conclusion from the reviewers above.)<\/em><\/p><\/li><li><p>Eimer, W. A., et al. (2018). Alzheimer’s disease-associated β-amyloid is rapidly seeded by herpesviridae to protect against brain infection. <em>Neuron, 99,<\/em> 56–63; and Hyde, V. R., et al. (2025). Phosphorylated tau exhibits antimicrobial activity capable of neutralizing herpes simplex virus 1 infectivity in human neurons. <em>Nature Neuroscience.<\/em> <em>(Mechanistic work in cell and animal models supporting an antimicrobial role for both amyloid beta and tau. This is a hypothesis with growing support, not an established replacement for the amyloid cascade model.)<\/em><\/p><\/li><li><p>Eyting, M., Xie, M., Michalik, F., et al. (2025). A natural experiment on the effect of herpes zoster vaccination on dementia. <em>Nature, 641.<\/em> <em>(Regression discontinuity design exploiting date-of-birth eligibility cutoffs in Wales. Vaccination uptake rose from 0.01% among those one week too old to 47.2% among those one week younger. Eligibility reduced new dementia diagnoses by approximately 3.5 percentage points over seven years — a 20% relative reduction. Findings confirmed with a difference-in-differences instrumental variable approach. The design is unusually resistant to confounding; the outcome is diagnosis rather than pathology.)<\/em><\/p><\/li><li><p>Reporting and secondary analysis of the above. <em>(The protective effect was stronger in women, reaching statistical significance, while findings in men were inconclusive owing to wider confidence intervals. A separate analysis of death certificate data found eligibility reduced dementia-related deaths by approximately 5% over nine years.)<\/em><\/p><\/li><li><p>Herpes zoster vaccination and incident dementia in Canada: an analysis of natural experiments. <em>Lancet Neurology<\/em> (2026). <em>(The authors state this analysis provides evidence more likely to reflect a causal relationship than previous standard observational analyses. Also reviews proposed mechanisms: neuroinflammation, amyloid deposition, tau aggregation, cerebrovascular disease and vasculopathy, and the possibility that varicella zoster reactivation triggers herpes simplex reactivation in the brain.)<\/em><\/p><\/li><li><p>Harris, K., et al. (2024). The recombinant shingles vaccine is associated with lower risk of dementia. <em>Nature Medicine, 30.<\/em> <em>(Natural experiment created by the rapid transition from live to recombinant vaccine, in more than 200,000 people. The recombinant vaccine was associated with a 17% increase in diagnosis-free time — approximately 164 additional days — over six years, and with lower dementia risk than influenza and tetanus–diphtheria–pertussis vaccines.)<\/em><\/p><\/li><li><p>Propensity-score matched cohort study of AS01-adjuvanted vaccines (2025). <em>(436,788 individuals. Both the AS01-adjuvanted shingles and RSV vaccines, individually and combined, were associated with reduced 18-month dementia risk, with no difference between them — suggesting the adjuvant itself may contribute. Observational despite matching; 18 months is a short follow-up for a dementia outcome.)<\/em><\/p><\/li><li><p>Itzhaki, R. F., et al. (1997). Herpes simplex virus type 1 in brain and risk of Alzheimer’s disease. <em>Lancet, 349,<\/em> 241–244, and subsequent literature. <em>(HSV-1 DNA detected in post-mortem brain tissue and co-localised with amyloid plaques, with evidence suggesting a contribution particularly in APOE4 carriers.)<\/em><\/p><\/li><li><p>Mostert, C. M. (2025). Reassessing dementia risk: expanding the 2024 Lancet Commission report. <em>(Argues the Commission’s 14 factors omit viral infections, poverty, wealth shocks and income inequality, and that including them could raise the theoretically preventable fraction. A policy argument rather than new epidemiological data.)<\/em><\/p><\/li><li><p>Livingston, G., Huntley, J., Liu, K. Y., et al. (2024). Dementia prevention, intervention, and care: 2024 report of the Lancet standing Commission. <em>Lancet, 404.<\/em> <em>(Around 45% of dementia cases are potentially preventable by addressing 14 modifiable risk factors across the life course. This is a population attributable fraction — a theoretical maximum assuming causality and complete elimination of exposure — not an individual prediction.)<\/em><\/p><\/li><li><p>Summary of the 2024 Commission update. <em>(The 2024 report added untreated vision loss and high LDL cholesterol to the twelve factors identified in 2020, which had accounted for approximately 40%.)<\/em><\/p><\/li><li><p>Life course modifiable risk factors of dementia: replicating the 2024 Lancet Commission model in a single longitudinal cohort (2025). <em>(When all risk factors were modelled simultaneously, only hearing loss, diabetes and hypertension remained statistically significant. Evaluated independently, less early-life education, mid-life hearing loss and diabetes, and late-life social isolation and visual loss were associated with increased odds — while mid-life hypertension was associated with decreased odds. Null effects were observed for depression, physical inactivity, excessive alcohol, obesity, high cholesterol, smoking and air pollution. A single cohort, so this does not refute the Commission; it does show the model is not robust at the individual level.)<\/em><\/p><\/li><li><p>Rozenblum, L., et al. (2025). Unraveling the oral microbiome’s role in Alzheimer’s disease. <em>Alzheimer’s &amp; Dementia.<\/em> <em>(A meta-analysis found the presence of oral bacteria in brain tissue, particularly P. gingivalis, linked to 6- to 10-fold increased Alzheimer’s risk. Gingipains promote amyloid beta aggregation, systemic inflammation and blood-brain barrier disruption. Association and mechanism; no interventional trial has shown that treating periodontitis prevents dementia.)<\/em><\/p><\/li><li><p>Systematic review of periodontitis and cognitive decline in older adults. <em>(Baseline periodontitis in adults over 65 was associated with a six-fold increase in the rate of cognitive decline over a six-month follow-up. Bacteria including P. gingivalis enter the bloodstream during ordinary brushing, flossing, chewing and gingival bleeding. Short follow-up and a small evidence base.)<\/em><\/p><\/li><li><p>Studies of oral-to-gut microbial translocation. <em>(Humans ingest an estimated 1.5 × 10¹² oral bacteria daily from swallowed saliva; patients with periodontitis show altered gut microbiota compared with healthy individuals, including increased Firmicutes, Proteobacteria, Euryarchaeota and Verrucomicrobia.)<\/em><\/p><\/li><li><p>Xie, L., Kang, H., Xu, Q., et al. (2013). Sleep drives metabolite clearance from the adult brain. <em>Science, 342,<\/em> 373–377. <em>(Interstitial space volume increased by approximately 60% during natural sleep or anaesthesia, markedly increasing CSF–interstitial fluid exchange and clearance of amyloid beta. Mouse study, using two-photon imaging.)<\/em><\/p><\/li><li><p>The glymphatic system clears amyloid beta and tau from brain to plasma in humans. <em>Nature Communications<\/em> (2026). <em>(Randomised crossover trial in 39 participants. Glymphatic clearance during normal sleep increased morning plasma levels of Alzheimer’s biomarkers compared with sleep deprivation, consistent with greater overnight brain-to-blood clearance. Observed changes matched predictions from a multicompartment model. Small sample, and the measurement relies on an investigational device.)<\/em><\/p><\/li><li><p>Nedergaard group analysis of glymphatic clearance across the lifespan. <em>Nature Aging<\/em> (2024). <em>(Approximately 40% decline in glymphatic clearance between young adulthood and the seventh decade, driven by changes in aquaporin-4 polarisation and reduced perivascular flow.)<\/em><\/p><\/li><li><p>Note that the glymphatic hypothesis of brain metabolite clearance is actively debated in the literature; several groups have raised methodological objections to the mechanism as originally described. The association between disrupted sleep and increased dementia risk is not in dispute.<\/p><\/li><li><p>Grammatikopoulou, M. G., et al. (2020). To keto or not to keto? A systematic review of randomized controlled trials assessing the effects of ketogenic therapy on Alzheimer disease. <em>Advances in Nutrition, 11<\/em>(6), 1583–1602. <em>(Ten RCTs, highly heterogeneous — ketogenic diets, ready-to-drink formulations, MCT powders, yoghurts, capsules and formulas, lasting 45–180 days.)<\/em><\/p><\/li><li><p>Fortier, M., et al. (2021). A ketogenic drink improves cognition in mild cognitive impairment: results of a 6-month RCT. <em>Alzheimer’s &amp; Dementia, 17.<\/em> <em>(30 g/day of ketogenic MCT emulsion versus a calorie-matched long-chain fatty acid placebo.)<\/em><\/p><\/li><li><p>Neth, B. J., et al. (2019). Modified ketogenic diet is associated with improved cerebrospinal fluid biomarker profile, cerebral perfusion, and cerebral ketone body uptake in older adults at risk for Alzheimer’s disease. <em>Neurobiology of Aging, 86,<\/em> 54–63. <em>(Pilot study: 11 cognitively normal older adults and 9 with amnestic MCI. Increased CSF Aβ42, decreased tau, increased cerebral perfusion and ketone uptake. Very small.)<\/em><\/p><\/li><li><p>Reviews of ketogenic interventions in MCI, Alzheimer’s and Parkinson’s disease, including APOE4 subgroup findings. <em>(A crossover study in 26 individuals with Alzheimer’s suggested ketone metabolism may be less beneficial for APOE4 carriers. A double-blind trial of caprylidene in 16 subjects found increased regional cerebral blood flow only among APOE4-negative participants. The original AC-1202 pilot found cognitive improvement in subjects lacking the APOE4 allele. All small; the stratification finding requires replication in adequately powered trials.)<\/em><\/p><\/li><li><p>Buchholz, A., et al. (2024). A randomized feasibility trial of the modified Atkins diet in older adults with mild cognitive impairment due to Alzheimer’s disease. <em>Frontiers in Endocrinology.<\/em> <em>(839 individuals screened to yield 38 randomised participants — a useful indication of how demanding this intervention is to implement.)<\/em><\/p><\/li><li><p>Ngandu, T., Lehtisalo, J., Solomon, A., et al. (2015). A 2-year multidomain intervention of diet, exercise, cognitive training, and vascular risk monitoring versus control to prevent cognitive decline in at-risk elderly people (FINGER): a randomised controlled trial. <em>Lancet, 385,<\/em> 2255–2263.<\/p><\/li><li><p>Crivelli, L., Suemoto, C. K., Sosa, A. L., et al. (2026). Multidomain lifestyle intervention for the prevention of cognitive decline in at-risk older adults in Latin America (LatAm-FINGERS): a single-blind, multicentre, randomised controlled trial. <em>Lancet.<\/em><\/p><\/li><li><p>Reviews of estrogen, menopause and cognitive decline in women. <em>(Up to 60% of midlife women report difficulties with memory, attention and verbal fluency during perimenopause, with objective testing confirming declines in verbal memory, working memory and executive function correlating with estradiol and FSH fluctuation. A prospective cohort found early hormone therapy initiation associated with reduced risk of cognitive impairment and dementia, with the protective association strongest in APOE4 non-carriers — carriers showed no benefit and in some cases potential harm.)<\/em><\/p><\/li><li><p>Meta-analysis of hormone replacement therapy timing and Alzheimer’s risk, presented at the American Neurological Association annual meeting (2025). <em>(More than 50 clinical trials and observational studies. Initiation within five years of menopause associated with 20–32% lower Alzheimer’s risk; initiation at 65 or later associated with 38% higher risk, with the increase particularly noticeable where therapy included progestin. Conference presentation — treat as preliminary pending full publication.)<\/em><\/p><\/li><li><p>Shumaker, S. A., et al. (2004). Conjugated equine estrogens and incidence of probable dementia and mild cognitive impairment in postmenopausal women: Women’s Health Initiative Memory Study. <em>JAMA, 291,<\/em> 2947–2958. <em>(Oral estrogen alone or with medroxyprogesterone acetate in women over 65 was associated with substantially increased dementia risk. The trial was stopped early for cardiovascular harm, and follow-up analyses were underpowered.)<\/em><\/p><\/li><li><p>Menopause hormone therapy and risk of mild cognitive impairment or dementia: a systematic review and meta-analysis. <em>Lancet Healthy Longevity<\/em> (2025). <em>(Found no evidence that menopausal hormone therapy either increases or decreases dementia risk, reinforcing guidance that prescription should be based on other perceived benefits and risks. Note that large observational studies have suggested combined therapy increases risk, especially with long-term use — the literature genuinely conflicts.)<\/em><\/p><\/li><li><p>Menopausal hormone therapy and risk of dementia: Korean health insurance database retrospective cohort study. <em>(Tibolone, combined preparations and oral estrogen alone were associated with increased risk of non-Alzheimer’s dementia, while transdermal estrogen was not associated with dementia risk. Observational; route of administration may be a proxy for other differences between users.)<\/em><\/p><\/li><\/ul>"}]}, {"n": 22, "t": "One Answer to a Question With Several", "s": "What all of this has been pointing at", "p": 4, "l": [{"t": "Opening", "g": "", "k": "", "w": 99, "h": "<p>If you have read straight through, you have just been given a great deal.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>And underneath all of it, a quiet suggestion that what you were told about your own mind may have been incomplete.<\/p><\/aside><p>Nine conditions. Blood tests you had never heard of. Interventions ranging from a lamp to a diet to a conversation you have been avoiding for eleven years. And underneath all of it, a quiet suggestion that what you were told about your own mind may have been incomplete.<\/p><p>So before you close the book, I want to draw one line through everything, because there is a single finding sitting underneath all nine chapters — and I did not go looking for it. It kept turning up.<\/p>"}, {"t": "The same shape, over and over", "g": "", "k": "", "w": 276, "h": "<p>This is what happened as I worked through the research for each condition.<\/p><p><strong>In depression<\/strong>, a powerful anti-inflammatory drug failed. Across everyone in the trial, it did nothing. But split the group by a cheap blood test measuring inflammation, and the picture reversed: it worked in the inflamed group and did <em>worse than placebo<\/em> in the rest.<\/p><p><strong>In depression again<\/strong>, zinc added to an antidepressant looked modest across the board — and large, specifically, in the people whose antidepressant hadn’t worked.<\/p><p><strong>In ADHD<\/strong>, high-dose EPA improved attention. Mostly in the children who had low EPA to begin with.<\/p><p><strong>In autism<\/strong>, high-dose folinic acid improved language and attention — concentrated in the children carrying a particular antibody, which a blood test can find.<\/p><p><strong>In Alzheimer’s<\/strong>, ketogenic approaches helped cognition. Look closer and the benefit clusters in people who don’t carry the APOE4 gene.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>around 63%<\/b><span>Adding the imaging raised the accuracy of predicting response from around 36%<\/span><\/div><div class=\"bx-body\"><p><strong class=\"num\">And in 2024<\/strong>, researchers at Stanford scanned 801 people with depression and anxiety, sorted them into six groups by brain circuit activity, then randomly assigned them to medication or therapy. The groups predicted who responded to what. Adding the imaging raised the accuracy of predicting response from around 36% to around 63%.<sup class=\"fn\">¹<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>One shape: the average result hides two opposite results, and something measurable tells you in advance which one you are.<\/p><\/aside><p>Different conditions. Different interventions. Different research teams, countries and decades. <strong>One shape: the average result hides two opposite results, and something measurable tells you in advance which one you are.<\/strong><\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img class=\"bx-av\" alt=\"\"><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>It is the finding of this book, and it wasn’t my idea. I assembled it chapter by chapter and watched it appear again and again, until it stopped looking like a series of interesting subgroup analyses and started looking like the actual structure of the thing.<\/p><\/div><\/aside>"}, {"t": "Which means “it didn’t work” was never the whole sentence", "g": "", "k": "", "w": 140, "h": "<p>Sit with what that implies for you personally.<\/p><p>When a treatment fails in a trial, what usually happened is that it helped one group, did nothing for another, and the two cancelled out into a disappointing average. Then that average becomes the guideline, and the guideline becomes what you are offered.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>It was an average, applied to a person, in a system that had no way of knowing which side of the average you were on.<\/p><\/aside><p>So when you were told a medication was your best option and it did little — that was not a verdict on you. It was an average, applied to a person, in a system that had no way of knowing which side of the average you were on.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>And when you concluded, somewhere around the third or fourth attempt, that you were the problem — you drew a reasonable conclusion from the evidence you had. It was simply the wrong conclusion, and there was no way for you to know that.<\/p><\/div><\/aside>"}, {"t": "The man who said this thirty years ago", "g": "", "k": "", "w": 329, "h": "<p>Long before any of those studies, one psychiatrist was making this argument out loud, and taking a great deal of professional heat for it.<\/p><p><strong>Dr. Daniel Amen<\/strong> founded his first clinic in 1989. His starting objection was simple, and it is the one this whole book rests on: <strong>psychiatry is very nearly the only medical specialty that treats an organ without ever looking at it.<\/strong> A cardiologist images the heart. An endocrinologist tests before prescribing. A psychiatrist listens to a description of symptoms, matches it to a category in a manual, and prescribes — for a brain nobody has examined.<\/p><figure class=\"ph\" data-slot=\"ch22-l04\"><\/figure><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>over 250,000 brain scans<\/b><span>the largest database of its kind in the world<\/span><\/div><div class=\"bx-body\"><p>So he started looking. Using SPECT imaging, which measures blood flow and activity rather than structure, he built what is now the largest database of its kind in the world: <strong>over 250,000 brain scans, and by his clinics’ current count approaching 300,000<\/strong>, from patients in 155 countries, accumulated across more than thirty-five years.<sup class=\"fn\">²<\/sup> <sup class=\"fn\">³<\/sup><\/p><\/div><\/aside><p>What makes it a research database rather than a filing cabinet is that a great many of those patients were scanned <strong>before and after treatment.<\/strong> Which allows a question most psychiatric practice cannot ask: <em>when this person got better, what changed in the brain — and what did we do that changed it?<\/em><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>People carrying one diagnosis did not share one brain pattern.<\/p><\/aside><p><strong>What he found is the thesis of this book.<\/strong> People carrying one diagnosis did not share one brain pattern. They fell into groups. In some, a region was working too hard; in others, the same region was underactive. Two people, same label, same prescription, opposite problems — which explains something otherwise baffling, that a treatment helping one person can make another person worse.<\/p><p>Working from those patterns, he described <strong>seven types of ADD, and seven types of anxiety and depression<\/strong>, each with its own combination of symptoms and its own pattern of over- or under-activity in specific brain regions.<sup class=\"fn\">²<\/sup> <sup class=\"fn\">⁴<\/sup> And crucially, each with its own approach — because if the underlying problem is opposite, the response should be too.<\/p>"}, {"t": "The part I find most worth respecting", "g": "", "k": "", "w": 273, "h": "<p>A brain scan costs money that most people do not have.<\/p><p>Rather than leave his findings available only to people who could pay for imaging, he did something more useful: he worked backwards. Having spent decades matching symptom patterns to activity patterns across hundreds of thousands of scans, <strong>he built questionnaires that let a person identify their likely type from their symptoms alone<\/strong> — no scan required.<sup class=\"fn\">⁵<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Whatever anyone thinks of the imaging, the instinct behind that is the right one.<\/p><\/aside><p>I don’t think that’s a small thing. It takes a finding that would otherwise belong to a small number of well-off patients and makes it available to anyone with ten minutes. Whatever anyone thinks of the imaging, the instinct behind that is the right one.<\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img class=\"bx-av\" alt=\"\"><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>And his framework does not stop at description. For each type he teaches specific, targeted approaches — nutritional, supplemental and behavioural — matched to whether a given brain region needs calming or activating. <strong>That material is taught in his certification programme, which I completed<\/strong>, and it is his to teach rather than mine to reprint here. What I will say is that working through it is what convinced me of the argument I have made throughout this book: that the question was never <em>which antidepressant next<\/em>, but <em>what is actually happening, and in whom<\/em>.<\/p><\/div><\/aside><p>His methods have been argued about in his profession for as long as he has been using them. What has not been argued about, in the end, is the argument. Stanford’s biotype work, the inflammation findings, the genes that predict who responds to what — all of it points where he was pointing in the 1990s, when it was a far less comfortable thing to say.<\/p>"}, {"t": "What to do with all of this", "g": "", "k": "", "w": 222, "h": "<p>You cannot act on twenty-two chapters. So here is what I would take, if I were you and I were tired.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>A single sheet of paper handed to a doctor is the highest-yield ten minutes in this book.<\/p><\/aside><p><strong>Get the blood tests.<\/strong> Whichever chapter was yours, it listed them. They are ordinary, they are cheap, and almost nobody is offered them. A single sheet of paper handed to a doctor is the highest-yield ten minutes in this book.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Pick three things, not thirty.<\/h4><div class=\"bx-body\"><p><strong>Pick three things, not thirty.<\/strong> From the chapter that sounded like you, take the three that ask least of you. In most chapters those are the same three: <strong>get outside in the morning, protect your sleep, and eat protein before you eat anything else.<\/strong> Give them six weeks before you judge them.<\/p><\/div><\/aside><p><strong>Work out which sub-group you are.<\/strong> Not with certainty — nobody has that. But the questions run through every chapter: does fatigue dominate more than sadness? Do you sleep more or less? Did this start after an illness? Is it worse in the week before your period? Did it begin when the light changed? Those answers point somewhere, and pointing somewhere is the whole game.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Then tell someone.<\/h4><div class=\"bx-body\"><p><strong>Then tell someone.<\/strong> A doctor, a partner, a friend who will ask you about it in a month. This book cannot do the part where a person is known by another person, and Chapter 11 explained why that part is not optional.<\/p><\/div><\/aside>"}, {"t": "What I hope you take", "g": "", "k": "", "w": 154, "h": "<p>You picked this up because something was not working, and because you had begun to suspect the problem was you.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>What I hope you have instead is a different sentence: you were given one answer to a question that has several.<\/p><\/aside><p>What I hope you have instead is a different sentence: <strong>you were given one answer to a question that has several.<\/strong><\/p><p>Which is not the same as being told there is nothing wrong. There may be a great deal wrong, and some of it may take years. It is the difference between a locked door and a door where nobody has tried the other keys — and every chapter of this book is a key that exists, that is cheap, and that most people are never handed.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You are not treatment-resistant. You are not lazy, or weak, or too much, or beyond help.<\/p><p>You were averaged.<\/p><\/div><\/aside><p class=\"closing\">And you are not an average. You are a specific person, with a specific body, carrying a specific history — and the research, finally, is catching up to that.<\/p>"}, {"t": "The research", "g": "", "k": "refs", "w": 312, "h": "<ul class='refs'><li><p>Tozzi, L., Zhang, X., Pines, A., et al. (2024). Personalized brain circuit scores identify clinically distinct biotypes in depression and anxiety. <em>Nature Medicine, 30,<\/em> 2076–2087. <em>(801 treatment-free patients scanned; 250 randomised to pharmacotherapy or behavioural therapy. Six biotypes identified, differing in treatment response, with imaging raising predictive accuracy from approximately 36% to 63%. The authors have a commercial interest in the imaging system used, and independent commentators regard the findings as promising but requiring replication before clinical use.)<\/em><\/p><\/li><li><p>Amen Clinics reporting on the SPECT database and the seven-type frameworks. <em>(Over 30 years of brain-imaging work; the clinics’ published figures range from over 250,000 scans in earlier materials to approaching 300,000 currently, from patients in 155 countries. The seven types of ADD/ADHD were first outlined by Amen in a 1998 paper and developed in his subsequent books; seven types of anxiety and depression are described in parallel. Note that these are clinic-reported figures.)<\/em><\/p><\/li><li><p>Amen, D. G., et al. (2017). Classification of depression, cognitive disorders, and co-morbid depression and cognitive disorders with perfusion SPECT neuroimaging. <em>Journal of Alzheimer’s Disease, 57<\/em>(1), 253–269. <em>(Peer-reviewed study of 4,541 patients; SPECT distinguished depression from cognitive disorders with 86% accuracy. Context for readers: the use of SPECT to diagnose psychiatric conditions is not endorsed by the American Psychiatric Association, the National Institute of Mental Health, or the Society of Nuclear Medicine and Molecular Imaging, and the approach remains contested within the profession.)<\/em><\/p><\/li><li><p>Amen Clinics descriptions of the seven types of anxiety and depression, each associated with distinct symptom clusters and patterns of activity in specific brain regions — for example heightened basal ganglia activity in the pure anxiety type.<\/p><\/li><li><p>Amen Clinics and Amen University symptom questionnaires. <em>(Developed from the symptom-to-activity patterns observed across the scan database, allowing type identification without imaging. Available without cost.)<\/em><\/p><\/li><\/ul>"}]}], "key": "s2s-brain", "course": {"title": "Survival to Safety: Brain Development & Aging", "hero": "Survival to Safety<span>Brain Development &amp; Aging<\/span>", "kicker": "A root-cause guide to understanding and changing your mental health"}}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const CH = D.chapters;
const WPM = 230;
const LOGO = document.querySelector('.brand img').src;
/* Picture spots: add a picture by putting its address next to the spot's name, e.g. "ch06-cover": "https://…/gut.jpg" */
const IMAGES = {
  "home-banner": "images/home-banner.jpg",
  "ch01-cover": "images/ch01-cover.jpg", "ch01-l04": "images/ch01-l04.jpg",
  "ch02-cover": "images/ch02-cover.jpg", "ch02-l04": "images/ch02-l04.jpg", "ch02-l07": "images/ch02-l07.jpg",
  "ch03-cover": "images/ch03-cover.jpg",
  "ch04-cover": "images/ch04-cover.jpg", "ch04-l02": "images/ch04-l02.jpg", "ch04-l05": "images/ch04-l05.jpg",
  "ch05-cover": "images/ch05-cover.jpg", "ch05-l02": "images/ch05-l02.jpg", "ch05-l03": "images/ch05-l03.jpg", "ch05-l04": "images/ch05-l04.jpg",
  "ch06-cover": "images/ch06-cover.jpg", "ch06-l03": "images/ch06-l03.jpg", "ch06-l04": "images/ch06-l04.jpg", "ch06-l07": "images/ch06-l07.jpg", "ch06-l08": "images/ch06-l08.jpg", "ch06-l09": "images/ch06-l09.jpg", "ch06-l11": "images/ch06-l11.jpg",
  "ch07-cover": "images/ch07-cover.jpg", "ch07-l02": "images/ch07-l02.jpg", "ch07-l03": "images/ch07-l03.jpg", "ch07-l04": "images/ch07-l04.jpg", "ch07-l05": "images/ch07-l05.jpg", "ch07-l06": "images/ch07-l06.jpg", "ch07-l07": "images/ch07-l07.jpg",
  "ch08-cover": "images/ch08-cover.jpg", "ch08-l08": "images/ch08-l08.jpg", "ch08-l13": "images/ch08-l13.jpg",
  "ch09-cover": "images/ch09-cover.jpg", "ch09-l06": "images/ch09-l06.jpg", "ch09-l09": "images/ch09-l09.jpg",
  "ch10-cover": "images/ch10-cover.jpg", "ch10-l03": "images/ch10-l03.jpg", "ch10-l04": "images/ch10-l04.jpg", "ch10-l08": "images/ch10-l08.jpg",
  "ch11-cover": "images/ch11-cover.jpg", "ch11-l08": "images/ch11-l08.jpg",
  "ch12-cover": "images/ch12-cover.jpg", "ch12-l03": "images/ch12-l03.jpg", "ch12-l06": "images/ch12-l06.jpg",
  "ch13-cover": "images/ch13-cover.jpg", "ch13-l03": "images/ch13-l03.jpg", "ch13-l04": "images/ch13-l04.jpg", "ch13-l06": "images/ch13-l06.jpg", "ch13-l07": "images/ch13-l07.jpg", "ch13-l08": "images/ch13-l08.jpg", "ch13-l09": "images/ch13-l09.jpg", "ch13-l10": "images/ch13-l10.jpg", "ch13-l12": "images/ch13-l12.jpg",
  "ch14-cover": "images/ch14-cover.jpg", "ch14-l04": "images/ch14-l04.jpg", "ch14-l05": "images/ch14-l05.jpg", "ch14-l08": "images/ch14-l08.jpg", "ch14-l16": "images/ch14-l16.jpg", "ch14-l18": "images/ch14-l18.jpg",
  "ch15-cover": "images/ch15-cover.jpg", "ch15-l04": "images/ch15-l04.jpg", "ch15-l07": "images/ch15-l07.jpg", "ch15-l12": "images/ch15-l12.jpg", "ch15-l13": "images/ch15-l13.jpg", "ch15-l15": "images/ch15-l15.jpg",
  "ch16-cover": "images/ch16-cover.jpg", "ch16-l03": "images/ch16-l03.jpg", "ch16-l05": "images/ch16-l05.jpg", "ch16-l06": "images/ch16-l06.jpg", "ch16-l08": "images/ch16-l08.jpg", "ch16-l09": "images/ch16-l09.jpg", "ch16-l12": "images/ch16-l12.jpg",
  "ch17-cover": "images/ch17-cover.jpg", "ch17-l09": "images/ch17-l09.jpg",
  "ch18-cover": "images/ch18-cover.jpg", "ch18-l08": "images/ch18-l08.jpg", "ch18-l11": "images/ch18-l11.jpg", "ch18-l18": "images/ch18-l18.jpg",
  "ch19-cover": "images/ch19-cover.jpg", "ch19-l03": "images/ch19-l03.jpg", "ch19-l18": "images/ch19-l18.jpg",
  "ch20-cover": "images/ch20-cover.jpg", "ch20-l04": "images/ch20-l04.jpg",
  "ch21-cover": "images/ch21-cover.jpg", "ch21-l02": "images/ch21-l02.jpg", "ch21-l05": "images/ch21-l05.jpg", "ch21-l06": "images/ch21-l06.jpg", "ch21-l07": "images/ch21-l07.jpg",
  "ch22-cover": "images/ch22-cover.jpg", "ch22-l04": "images/ch22-l04.jpg"
};
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>';
const cov = c => 'ch' + String(c.n).padStart(2,'0') + '-cover';
function fig(slot, label, cls){
  if (IMAGES[slot]) return `<figure class="ph ${cls||''}"><img src="${IMAGES[slot]}" alt="${esc(label)}"></figure>`;
  return `<figure class="ph empty ${cls||''}" data-filled="1"><div class="ph-in">${ICON}<b>${esc(label)}</b><small>Image spot · ${slot}</small></div></figure>`;
}
function fillSpots(c){
  document.querySelectorAll('#prose img.bx-av').forEach(i => i.src = LOGO);
  document.querySelectorAll('#prose figure.ph[data-slot]').forEach(f => {
    const s = f.dataset.slot, m = s.match(/l(\d+)$/);
    f.outerHTML = fig(s, 'Lesson ' + (+m[1]) + ' picture');
  });
}

const mins = w => Math.max(1, Math.round(w / WPM));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let done = new Set(store.get(D.key+'-done', []));
let open = new Set(store.get(D.key+'-open', []));
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id = (c, i) => c.n + '-' + i;
const total = CH.reduce((a, c) => a + c.l.length, 0);
const chDone = c => c.l.filter((_, i) => done.has(id(c, i))).length;
const findCh = n => CH.find(c => c.n === n);
const flat = []; CH.forEach(c => c.l.forEach((l, i) => flat.push([c, i])));
const KIND = {tests:'Take to your appointment', worse:'Watch for'};

function saveDone(){ store.set(D.key+'-done', [...done]); }
function progress(){
  const n = done.size;
  document.getElementById('fill').style.width = (n / total * 100) + '%';
  document.getElementById('count').textContent = n + ' of ' + total + ' lessons complete';
}

/* ---------- navigation rail ---------- */
let route = {v:'home'};
function renderNav(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let h = '';
  D.parts.forEach((p, pi) => {
    const chs = CH.filter(c => c.p === pi);
    let block = '';
    chs.forEach(c => {
      const matches = c.l.map((l, i) => i).filter(i => !q || c.l[i].t.toLowerCase().includes(q) || c.t.toLowerCase().includes(q));
      if (q && !matches.length) return;
      const isOpen = q ? true : open.has(c.n) || route.c === c.n;
      const cd = chDone(c);
      block += `<button class="nav-ch ${route.c===c.n?'on':''} ${cd===c.l.length?'done':''}" data-ch="${c.n}" aria-expanded="${isOpen}">
        <span class="no">${String(c.n).padStart(2,'0')}</span><span>${esc(c.t)}</span><span class="chev">▶</span></button>`;
      if (isOpen){
        block += '<ul class="nav-lessons">';
        let g = '';
        matches.forEach(i => {
          const l = c.l[i];
          if (l.g && l.g !== g){ g = l.g; block += `<li class="nav-group">${esc(g)}</li>`; }
          const on = route.c === c.n && route.i === i;
          block += `<li><button class="nav-l ${on?'on':''} ${done.has(id(c,i))?'done':''}" data-go="${c.n}-${i}"><span class="dot"></span><span>${esc(l.t)}</span></button></li>`;
        });
        block += '</ul>';
      }
    });
    if (block) h += `<div class="nav-part">${p[0]}<em>${esc(p[1])}</em></div>` + block;
  });
  document.getElementById('nav').innerHTML = h || '<p class="empty">No lessons match that search.</p>';
}

/* ---------- views ---------- */
function home(){
  const words = flat.reduce((a, [c, i]) => a + c.l[i].w, 0);
  const last = store.get(D.key+'-last', null);
  const hrs = Math.max(0.5, Math.round(words/WPM/30)/2);
  let resume = '';
  if (last){ const [cn, li] = last.split('-').map(Number); const c = findCh(cn); if (c && c.l[li]) resume = `<button class="btn" data-go="${last}">Continue: ${esc(c.l[li].t)} →</button>`; }
  if (!resume) resume = `<button class="btn" data-go="${CH[0].n}-0">Begin with Chapter ${CH[0].n} →</button>`;
  let h = `<div class="col home"><section class="home-hero">
    <div class="home-brand"><img class="home-mark" src="${LOGO}" alt="Mind Body Functional Health logo"><span>Mind Body<i>Functional Health</i></span></div>
    <div class="eyebrow"><span>${D.course.kicker}</span></div>
    <h1 class="home-title">${D.course.hero}</h1>
    <div class="stats"><span><b>${CH.length}</b>chapters</span><span><b>${total}</b>lessons</span><span><b>${hrs}</b>${hrs===1?"hour":"hours"} of reading</span><span><b>${done.size}</b>lessons done</span></div>
    <div class="ch-actions" style="margin:6px 0 0">${resume}</div>
    <p class="meta">Go at your own pace. Your progress is saved in this browser.</p>
    ${fig('home-banner', 'Course banner', 'home')}
  </section>`;
  return h + '</div>';
}

function chapter(c){
  const w = c.l.reduce((a, l) => a + l.w, 0);
  const firstOpen = c.l.findIndex((_, i) => !done.has(id(c, i)));
  const start = firstOpen < 0 ? 0 : firstOpen;
  let h = `<div class="col"><div class="eyebrow"><b>${D.parts[c.p][0]}</b><span>${esc(D.parts[c.p][1])}</span></div>
    <div class="ch-hero"><div class="ch-num">${String(c.n).padStart(2,'0')}</div><h1 class="ch-title">${esc(c.t)}</h1>${c.s?`<p class="ch-sub">${esc(c.s)}</p>`:'<span></span>'}</div>
    ${fig(cov(c), 'Chapter ' + c.n + ' cover', 'cover wide')}
    <div class="ch-actions"><button class="btn" data-go="${c.n}-${start}">${firstOpen > 0 ? 'Continue chapter' : 'Begin chapter'} →</button>
    <span class="meta">${c.l.length} lessons · about ${mins(w)} minutes · ${chDone(c)} complete</span></div><ul class="lesson-list">`;
  let g = '';
  c.l.forEach((l, i) => {
    if (l.g && l.g !== g){ g = l.g; h += `<li class="grp">${esc(g)}</li>`; }
    h += `<li><button data-go="${c.n}-${i}" class="${done.has(id(c,i))?'done':''}"><span class="ln">${done.has(id(c,i))?'✓':String(i+1).padStart(2,'0')}</span>
      <span class="lt">${esc(l.t)}${KIND[l.k]?`<span class="tag ${l.k}">${KIND[l.k]}</span>`:''}</span><span class="lm">${mins(l.w)} min</span></button></li>`;
  });
  return h + '</ul></div>';
}

function lesson(c, i){
  const l = c.l[i];
  const k = flat.findIndex(([cc, ii]) => cc === c && ii === i);
  const nx = flat[k + 1], pv = flat[k - 1];
  let banner = '';
  if (l.k === 'tests') banner = `<div class="banner tests"><div><b>Take this to your appointment</b>Copy the list below to share with your doctor</div><button class="btn small" id="copyBtn" type="button">Copy list</button></div>`;
  if (l.k === 'worse') banner = `<div class="banner worse"><div><b>Watch for</b>What makes it worse</div></div>`;
  const isDone = done.has(id(c, i));
  let h = `<div class="col lesson-${l.k||'std'}"><div class="eyebrow"><b>Chapter ${c.n}</b><span>${esc(c.t)}</span>${l.g?`<span>· ${esc(l.g)}</span>`:''}</div>
    <h1 class="lesson-title">${esc(l.t)}</h1>
    <div class="meta">Lesson ${i+1} of ${c.l.length} · ${mins(l.w)} min read</div>${banner}
    <article class="prose ${i===0?'opening':''}" id="prose">${l.h}</article>
    <div class="foot"><div class="foot-row">
      <button class="check" id="doneBtn" type="button" aria-pressed="${isDone}"><span class="box"></span>${isDone?'Completed':'Mark lesson complete'}</button>
      ${pv?`<button class="btn ghost small" data-go="${pv[0].n}-${pv[1]}">← Previous</button>`:''}</div>
      ${nx?`<button class="next" data-go="${nx[0].n}-${nx[1]}" data-complete="1"><small>${nx[0]===c?'Up next':'Next chapter · Chapter '+nx[0].n}</small><span>${esc(nx[0]===c?nx[0].l[nx[1]].t:nx[0].t)} →</span></button>`
         :`<button class="next" data-home="1" data-complete="1"><small>You've reached the end</small><span>Back to the course overview →</span></button>`}
    </div></div>`;
  return h;
}

function render(){
  const v = document.getElementById('view');
  let title = D.course.title;
  if (route.v === 'home') v.innerHTML = home();
  else if (route.v === 'ch'){ const c = findCh(route.c); v.innerHTML = chapter(c); title = 'Ch ' + c.n + ' · ' + c.t; }
  else { const c = findCh(route.c); v.innerHTML = lesson(c, route.i); fillSpots(c); title = c.l[route.i].t; store.set(D.key+'-last', id(c, route.i)); }
  document.getElementById('topTitle').textContent = title;
  renderNav(); progress();
  const cur = document.querySelector('.nav-l.on, .nav-ch.on');
  if (cur) cur.scrollIntoView({block:'nearest'});
  bindLesson();
}

function bindLesson(){
  const b = document.getElementById('doneBtn');
  if (b) b.onclick = () => {
    const k = id(findCh(route.c), route.i);
    done.has(k) ? done.delete(k) : done.add(k); saveDone();
    b.setAttribute('aria-pressed', done.has(k)); b.lastChild.textContent = done.has(k) ? 'Completed' : 'Mark lesson complete';
    renderNav(); progress();
  };
  const cp = document.getElementById('copyBtn');
  if (cp) cp.onclick = () => {
    const c = findCh(route.c), text = c.l[route.i].t + '\n\n' + document.getElementById('prose').innerText;
    const ok = () => { cp.textContent = 'Copied'; setTimeout(() => cp.textContent = 'Copy list', 1800); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('prose')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent = 'Selected — press copy'; };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch(e){ fallback(); }
  };
}

function go(r, push){
  route = r;
  const hash = r.v === 'home' ? 'home' : r.v === 'ch' ? 'c' + r.c : 'c' + r.c + '-' + r.i;
  if (push !== false && location.hash.slice(1) !== hash){ try{ history.pushState(null, '', '#' + hash); }catch(e){} }
  document.body.classList.remove('menu');
  render(); window.scrollTo(0, 0);
}
function parse(){
  const h = location.hash.slice(1); let m;
  if ((m = h.match(/^c(\d+)-(\d+)$/)) && findCh(+m[1]) && findCh(+m[1]).l[+m[2]]) return {v:'l', c:+m[1], i:+m[2]};
  if ((m = h.match(/^c(\d+)$/)) && findCh(+m[1])) return {v:'ch', c:+m[1]};
  return {v:'home'};
}
window.addEventListener('popstate', () => go(parse(), false));

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-ch],[data-home],#brand');
  if (!t) return;
  if (t.id === 'brand' || t.dataset.home){ if (t.dataset.complete) markCurrent(); return go({v:'home'}); }
  if (t.dataset.go){
    if (t.dataset.complete) markCurrent();
    const [c, i] = t.dataset.go.split('-').map(Number); return go({v:'l', c, i});
  }
  if (t.dataset.ch){
    const n = +t.dataset.ch;
    if (t.classList.contains('nav-ch')){
      if (open.has(n) && route.c !== n) open.delete(n); else open.add(n);
      store.set(D.key+'-open', [...open]);
      if (route.c !== n) return go({v:'ch', c:n});
      return renderNav();
    }
    return go({v:'ch', c:n});
  }
});
function markCurrent(){ if (route.v === 'l'){ done.add(id(findCh(route.c), route.i)); saveDone(); } }
document.getElementById('search').addEventListener('input', renderNav);
document.getElementById('menuBtn').onclick = () => document.body.classList.toggle('menu');
document.getElementById('scrim').onclick = () => document.body.classList.remove('menu');

go(parse(), false);
})();
</script>

</body>
</html>
