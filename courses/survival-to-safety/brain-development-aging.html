ies modelling ferritin continuously across whole populations report null associations, and one supplementation RCT found improvement on parent-rated but not teacher-rated measures. Predominantly paediatric data.)<\/em><\/p><\/li><li><p>Narrative review of screen time and ADHD symptoms in children and adolescents (2025). <em>(Longitudinal analyses indicate bidirectional effects between ADHD symptoms and screen use rather than one-way causation; sleep disruption and altered reward processing appear to mediate the association. The review notes that some interactive or cognitively engaging digital activity may be beneficial.)<\/em> See also the systematic review of longitudinal studies finding effects ranging from absent to bidirectional.<\/p><\/li><li><p>Five-year longitudinal cohort of Canadian high-school students (n ≈ 4,000). <em>Scientific Reports<\/em> (2023). <em>(Within-person analysis: increases in screen time in a given year were associated with exacerbation of ADHD symptoms within that year, after controlling for between-person vulnerability.)<\/em><\/p><\/li><li><p>Rogan, W. J., Dietrich, K. N., Ware, J. H., et al. (2001). The effect of chelation therapy with succimer on neuropsychological development in children exposed to lead. <em>New England Journal of Medicine, 344,<\/em> 1421–1426; with long-term follow-up. <em>(780 children with blood lead 20–44 µg/dL randomised to succimer or placebo. Succimer lowered blood lead substantially faster than placebo but produced no benefit on cognition, behaviour or neuropsychological function at three years, and none again at ages 7 and 7½. The trial was powered to detect less than a 3-point IQ change, and blood lead was indistinguishable between groups at one year. The investigators concluded that the important strategy is identifying and terminating the source of exposure. A solid negative finding — cite it whenever reversal is claimed.)<\/em><\/p><\/li><li><p>Faraone, S. V., &amp; Glatt, S. J. (2010). A comparison of the efficacy of medications for adult ADHD using meta-analysis of effect sizes. <em>Journal of Clinical Psychiatry, 71<\/em>(6), 754–763. <em>(19 trials. Long-acting stimulants mean effect size 0.73; short-acting stimulants 0.96, reduced to 0.86 after correction for publication bias. Trials were short-duration and placebo-controlled, which limits inference about long-term effects.)<\/em><\/p><\/li><li><p>Comparative data on stimulant versus non-stimulant efficacy. <em>(Stimulants approximately SMD 0.72; atomoxetine and other non-stimulants approximately SMD 0.39. Combined pharmacological and psychosocial treatment outperforms medication alone and improves treatment adherence. Adverse effects and high dropout rates are consistently noted, with many patients showing only partial response.)<\/em><\/p><\/li><li><p>Long-term follow-up data on ADHD pharmacotherapy. <em>(Associated with improved academic performance and social functioning and reduced risk of substance misuse and criminal behaviour. Observational follow-up data — treated and untreated groups differ in ways randomisation would be needed to resolve.)<\/em><\/p><\/li><\/ul>"}]}, {"n": 21, "t": "The Load, Not the Wiring", "s": "Autism, what the research actually shows, and where the exhaustion comes from", "p": 3, "l": [{"t": "Opening", "g": "", "k": "", "w": 177, "h": "<p>This chapter has two readers, and I’d rather say so at the start than write something that half serves both.<\/p><p><strong>One of you is a parent.<\/strong> Possibly of a child who doesn’t speak, or who barely sleeps, or who is in distress a great deal of the time. You have read a lot of things that promised more than they delivered. You want to know what has actual evidence behind it.<\/p><p><strong>One of you is an adult<\/strong> — statistically more likely a woman — who has spent thirty or forty years exhausted without a name for it, and has recently worked out why. You are not looking for a cure. You are looking for an explanation of the tiredness.<\/p><p>The first half of this chapter is mostly for the first reader, the second half mostly for the second. Both halves are real research, and neither is about changing who anyone is.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>What this chapter is about is load — the physical and social weight an autistic nervous system carries, and how much of it can be set down.<\/p><\/aside><p>What this chapter is about is <strong>load<\/strong> — the physical and social weight an autistic nervous system carries, and how much of it can be set down.<\/p>"}, {"t": "One story, not a list of findings", "g": "", "k": "", "w": 485, "h": "<p>Most writing about autism gives you disconnected fragments. Something about the gut. Something about diet. Something about sleep. It reads like a pile of unrelated claims, and it’s easy to dismiss the whole pile.<\/p><p>But the research fits together, and the shape it makes is worth seeing whole before we get to any of the pieces.<\/p><figure class=\"ph\" data-slot=\"ch21-l02\"><\/figure><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>It starts with exposure.<\/p><\/aside><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>60%<\/b><span>Living near organophosphate application was associated with a 60% higher risk of autism<\/span><\/div><div class=\"bx-body\"><p>Where a mother lived during pregnancy turns out to predict something. In the CHARGE study, roughly a third of participating mothers had lived within a mile of a commercial pesticide application during pregnancy. <strong>Living near organophosphate application was associated with a 60% higher risk of autism<\/strong> — rising to <strong>double the risk for third-trimester exposure<\/strong>, and <strong>more than triple for one specific compound, chlorpyrifos, applied during the second trimester.<\/strong><sup class=\"fn\">¹<\/sup> Pyrethroid applications just before conception or in the third trimester carried a 1.7 to 2.3-fold risk.<sup class=\"fn\">¹<\/sup><\/p><\/div><\/aside><p>A separate population-based case-control study looking at ambient pesticide exposure within 2 km of the mother’s home found raised risk across <strong>glyphosate, chlorpyrifos, diazinon, malathion, avermectin and permethrin<\/strong><sup class=\"fn\">²<\/sup>— comparing agricultural families with other agricultural families, which controls for a great deal.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>64%<\/b><span>for each 10 μg/m³ of fine particulate air pollution in early childhood<\/span><\/div><div class=\"bx-body\"><p>And it isn’t only farmland. Pooled analysis found autism risk rose by <strong>64% for each 10 μg/m<sup class=\"fn\">³<\/sup> of fine particulate air pollution in early childhood, and 31% for the same increase during pregnancy.<\/strong><sup class=\"fn\">³<\/sup> Prenatal ozone and nitrogen dioxide show associations too.<sup class=\"fn\">⁴<\/sup> Symptom severity, not just diagnosis, has been found to increase with proximity to sprayed fields.<sup class=\"fn\">⁵<\/sup><\/p><\/div><\/aside><p>Different exposures, different countries, different research groups, same direction.<\/p><div class=\"points\"><div class=\"point\"><h4>Then what exposure does.<\/h4><p>These compounds share a signature: they drive <strong>oxidative stress and inflammation<\/strong>, particularly in a developing brain.<sup class=\"fn\">⁴<\/sup> Air pollution’s proposed route runs through inflammation reducing a protein called reelin, which governs where neurons settle as the brain forms.<sup class=\"fn\">⁴<\/sup><\/p><\/div><div class=\"point\"><h4>Then where that shows up.<\/h4><p>And this is the part that turns a history into something present-tense and workable — because inflammation and oxidative stress land in three specific places, and all three have been measured in autistic people.<\/p><\/div><div class=\"point\"><h4>The brain’s overnight cleaning system runs less efficiently.<\/h4><p><strong>The gut barrier leaks and the microbiome is disrupted.<\/strong> <strong>Cells struggle to make energy from glucose.<\/strong><\/p><\/div><\/div><p>Each of those makes the others worse. A leaking gut drives inflammation. Inflammation and poor sleep impair clearance. Impaired clearance drives more inflammation. It’s a loop, and for many people it has been running since before they can remember.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>Now the part that matters most.<\/strong> You cannot go back and change what a pregnancy was exposed to. Nobody can, and there is nothing useful in guilt about it.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>But every single point in that loop, downstream of the exposure, is something you can act on today.<\/p><\/aside><p>But every single point in that loop, downstream of the exposure, is something you can act on today. <strong>Sleep improves clearance. Food repairs the gut. Ketones bypass the energy problem. Nutrients lower the oxidative load.<\/strong> Not one of those changes who a person is. All of them take weight off.<\/p><p>The rest of this chapter is that, in detail.<\/p>"}, {"t": "What the brain does at night", "g": "", "k": "", "w": 239, "h": "<p>The brain has no lymph drainage. What it has instead is a network of channels running alongside its blood vessels that flush waste out — and that system does most of its work while you sleep. Chapter 9 introduced it; Chapter 20 covered what happens when it fails in later life.<\/p><p><strong>In autism, that clearance system measures as less efficient<\/strong>, and it has been found three separate ways.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>1.02 against 1.32<\/b><span>a large and highly significant difference<\/span><\/div><div class=\"bx-body\"><ul>\n<li>In thirty children with autism compared with twenty-five without, the imaging index of clearance was <strong class=\"num\">1.02 against 1.32<\/strong> — a large and highly significant difference<sup class=\"fn\">⁶<\/sup><\/li>\n<li>In seventy-eight children with autism and forty-eight without, clearance was reduced across both hemispheres — and <strong>the more reduced it was, the greater the difficulty with communication<\/strong><sup class=\"fn\">⁷<\/sup><\/li>\n<li>A third study, using a more sensitive method, found <strong>lower clearance tracking with higher symptom severity<\/strong>, and with lower scores for hearing, language and hand-eye coordination<sup class=\"fn\">⁸<\/sup><\/li>\n<\/ul><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Three research groups, three methods, same direction — and it tracked with severity rather than simply being present.<\/p><\/aside><p>Three research groups, three methods, same direction — and it tracked with severity rather than simply being present.<\/p><p>Then the loop closes. <strong>Poor sleep makes clearance worse. Poor clearance drives inflammation. Inflammation disrupts sleep.<\/strong><sup class=\"fn\">⁹<\/sup> Sleep problems affect the large majority of autistic children and adults, so for many people that cycle has been running for years.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Which changes what a sleep problem is. It stops being a matter of everyone being tired and short-tempered, and becomes the thing quietly making every other symptom harder to carry.<\/p><\/div><\/aside>"}, {"t": "The gut", "g": "", "k": "", "w": 205, "h": "<p>Chapter 6 built this mechanism in full, so I’ll point you back rather than repeat it.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The more disrupted the gut, the harder the behaviour tends to be.<\/p><\/aside><p>Digestive problems are common in autism, and — the part that matters — <strong>they track with behavioural severity.<\/strong> The more disrupted the gut, the harder the behaviour tends to be. Underneath sit dysbiosis, a more permeable intestinal barrier, altered short-chain fatty acids, and bacterial components crossing into circulation where they shouldn’t. That’s the same inflammatory input as the exposure above, arriving by a different door.<\/p><p>Of the approaches targeting the microbiome directly, <strong>probiotics and dietary change currently have the most behind them.<\/strong> Prebiotics, synbiotics and transplant remain experimental.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>two years later<\/b><span>those gains were still present two years later<\/span><\/div><div class=\"bx-body\"><p>The one that gets talked about most needs stating precisely. <strong>Microbiota Transfer Therapy<\/strong> — antibiotics, a bowel cleanse, then a faecal transplant — produced improvements in digestive symptoms, in autism-related symptoms, and in the microbiome itself, <strong>and those gains were still present two years later<\/strong>, with adaptive behaviour improving substantially more than expected.<\/p><\/div><\/aside><p>It was <strong>eighteen participants, open-label, with no control group<\/strong>, and twelve of the eighteen changed medications, supplements or diet during follow-up. So: interesting, preliminary, and not available outside research. If someone offers to sell you a version of it, that is not what was studied.<\/p>"}, {"t": "Sunlight", "g": "What actually helps", "k": "", "w": 1421, "h": "<p>Given everything above, this comes first — and it does two separate jobs. Almost everyone has heard about one of them.<\/p><h3 id=\"the-one-you-know-about\">The one you know about<\/h3><p>Deep in the brain sits a clock governing when you get sleepy, when hormones release, when body temperature rises and falls. It drifts on its own. What resets it daily is light hitting the eye in the morning — and roughly fourteen to sixteen hours later, the brain releases <strong>melatonin<\/strong>, the signal that starts sleep.<\/p><figure class=\"ph\" data-slot=\"ch21-l05\"><\/figure><p>So a child who gets outside soon after waking makes their own melatonin at the right time that night. A child who spends the morning under electric light does not, because indoor lighting is many times dimmer than an overcast morning outdoors — far too dim to move the clock.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Outside, within an hour of waking<\/h4><div class=\"bx-body\"><p><strong>Outside, within an hour of waking.<\/strong> Ten minutes helps, thirty is better, it doesn’t need to be sunny, and no sunglasses.<\/p><\/div><\/aside><h3 id=\"the-one-almost-nobody-has-been-told\">The one almost nobody has been told<\/h3><p>Here is the part that matters more for this chapter, because it lands on exactly the problem described at the start.<\/p><p><strong>Most of the melatonin in your body is not made by the pineal gland and has nothing to do with sleep.<\/strong> Probably <strong class=\"num\">less than 5%<\/strong> of the melatonin vertebrates produce comes from the pineal.<sup class=\"fn\">¹⁰<\/sup> The rest is made inside <strong>mitochondria<\/strong> — in nearly every cell — and it never enters the bloodstream. It’s made where it’s used.<\/p><p>What is it used for? <strong>Melatonin is one of the most powerful antioxidants your body makes.<\/strong> A single molecule may neutralise up to ten reactive oxygen or nitrogen species, where vitamin C handles one or two.<sup class=\"fn\">¹¹<\/sup> It is both water- and fat-soluble, so it works everywhere in a cell, including inside membranes.<sup class=\"fn\">¹¹<\/sup><\/p><p>Now put that beside the first section of this chapter. <strong>Oxidative stress in the mitochondria is the mechanism.<\/strong> And the body’s answer to oxidative stress in the mitochondria is a molecule the mitochondria make themselves.<\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>So what makes them make it?<\/p><\/aside><p><strong>Near-infrared light — which is sunlight.<\/strong> It’s invisible, it makes up roughly 70% of the solar photons reaching your body, and unlike visible light it penetrates deeply: through skin, into muscle, into the brain, even into bone.<sup class=\"fn\">¹²<\/sup> When those photons reach a mitochondrion, they’re absorbed by cytochrome c oxidase — part of the energy-production chain itself — and that appears to be what triggers local melatonin synthesis.<sup class=\"fn\">¹⁰<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Which turns the familiar picture inside out. Pineal melatonin is the hormone of darkness. <strong>Mitochondrial melatonin looks like the hormone of daylight<\/strong> — made in your cells, all day, while the sun is on you.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>And modern life has removed it.<\/h4><p>We are indoors. Glass filters much of the spectrum. Clothing blocks it. A generation of children spends most of daylight hours under electric lighting that contains almost no near-infrared at all — while the research above says their mitochondria are under oxidative strain.<\/p><\/div><div class=\"point\"><h4>What to do about it is free.<\/h4><p>Get outside, in daylight, with as much skin exposed as the weather and sense allow. Not through a window. Morning is good for the clock, and the near-infrared benefit runs all day — it’s actually higher at the start and end of the day, when infrared makes up a larger share of the light. Overcast still counts; near-infrared passes through cloud far better than visible light does.<\/p><\/div><\/div><h3 id=\"and-it-has-been-tested\">And it has been tested<\/h3><p>Everything above is mechanism, and mechanism alone is never enough. So the question is whether delivering near-infrared light to an autistic brain actually changes anything.<\/p><p>It has been tried, in the right kind of study.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>7.23 points<\/b><span>The difference between the groups on the Childhood Autism Rating Scale was<\/span><\/div><div class=\"bx-body\"><p><strong>Thirty children aged two to six with autism were randomised to either near-infrared light or a sham device<\/strong>, delivered to selected brain areas twice a week for eight weeks. Sham control is exactly the right design here, because a light either is or isn’t on and families can’t easily tell which.<\/p><p><strong>The difference between the groups on the Childhood Autism Rating Scale was 7.23 points<\/strong> (95% CI 2.36 to 12.11, p = 0.011).<sup class=\"fn\">¹³<\/sup> EEG recordings showed changes in brainwave patterns alongside it. <strong>No moderate or severe side effects were reported or observed.<\/strong><sup class=\"fn\">¹³<\/sup><\/p><\/div><\/aside><p>A separate study in adults with autism found significant symptom reduction on a standard social responsiveness measure after eight weeks of the same kind of stimulation.<sup class=\"fn\">¹⁴<\/sup><\/p><p>And the mechanism the researchers name is the one this chapter has been describing throughout: near-infrared light restoring mitochondrial function, and reducing inflammation and oxidative damage.<sup class=\"fn\">¹⁴<\/sup><\/p><p><strong>Two things to be clear about.<\/strong> These trials used a device delivering targeted light to the head, not sunbathing — so they demonstrate the mechanism works rather than telling you how much sun is equivalent. And thirty children is a small trial, run with an investigational device by a company with an interest in the result.<\/p><p>But it moves this out of theory. Near-infrared light reaching mitochondria produced a measurable change in autism symptoms in a sham-controlled trial. The sun is the largest near-infrared source any of us will ever stand in front of, and it’s free.<\/p><p><strong>On the melatonin part specifically<\/strong>, the mitochondrial pathway remains a hypothesis with strong mechanistic support and limited human confirmation<sup class=\"fn\">¹⁵<\/sup> — the researchers proposing it say so plainly. What isn’t in question: melatonin is a potent antioxidant, mitochondria make it, near-infrared penetrates tissue, and we get far less of it than any generation before us.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Going outside is not something to wait on another trial for.<\/p><\/aside><p>Going outside is not something to wait on another trial for.<\/p><h3 id=\"if-you-want-to-use-a-device\">If you want to use a device<\/h3><p>You don’t need one. Daylight is the original source and it costs nothing. But red and near-infrared panels are widely sold now, they’re useful when the weather or the season makes outdoors difficult, and most of what’s on the market is mislabelled or vague. So here is how to tell.<\/p><p><strong>Look for a wavelength printed in nanometres.<\/strong> A device that says “red light therapy” or “infrared” without a number should be put down. The ones used in research are specific:<\/p><ul>\n<li><strong class=\"num\">660 nm<\/strong> is visible red. Real, useful, absorbed mostly in skin and surface tissue.<\/li>\n<li><strong class=\"num\">810 to 850 nm<\/strong> is near-infrared. This is what penetrates deeply, and <strong>850 nm is what the autism trials used.<\/strong><\/li>\n<li>Good panels supply both.<\/li>\n<\/ul><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Two quick tests<\/h4><div class=\"bx-body\"><p><strong>How to check it’s actually near-infrared.<\/strong> Two quick tests.<\/p><p><strong>The eye test.<\/strong> Visible red at 660 nm looks bright red. Near-infrared at 850 nm sits right at the edge of human vision — it should look like a <strong>faint, dull red glow<\/strong>, much dimmer than the visible LEDs beside it. If a panel’s “infrared” lights look just as bright as its red ones, they aren’t near-infrared.<\/p><p><strong>The phone camera test.<\/strong> Camera sensors see infrared that your eyes can’t. Turn the device on, point a phone camera at it, and look at the screen. <strong>Genuine near-infrared LEDs show up as a pale lilac or whitish glow on the screen while looking almost dark to your eye.<\/strong> If nothing extra appears on camera, there’s no infrared coming out of it. Your phone’s selfie camera usually works better for this than the main one.<\/p><\/div><\/aside><p><strong>What isn’t the same thing.<\/strong> Far-infrared saunas and heat lamps sit at a completely different part of the spectrum — they work by warming tissue, which is a different mechanism from what’s described above. Neither is bad. Neither is what these trials tested.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 3l9.5 17h-19z\"><\/path><path d=\"M12 10v4M12 17.5v.5\"><\/path><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p><strong>And on use:<\/strong> the trials ran twice a week for eight weeks. Sessions were minutes, not hours, and more is not better — photobiomodulation has a dose curve where too much does less than the right amount. Eyes closed or shielded when pointing anything at the head.<\/p><\/div><\/aside><p>If all that feels like more than you want to take on, go back to the simplest version. Outside. No glass. As often as you can.<\/p><h3 id=\"and-supplemental-melatonin\">And supplemental melatonin<\/h3><p>Taken as a supplement, melatonin has the best evidence of anything in this chapter for improving sleep quality and the daytime benefits that follow.<sup class=\"fn\">¹⁶<\/sup> It’s most useful where the body clock is genuinely delayed, and works best alongside daylight rather than instead of it. Doses used in children are usually far smaller than what’s sold on a shelf, so ask a doctor about dose and timing.<\/p><h3 id=\"and-the-sensory-environment\">And the sensory environment<\/h3><p>Bedding texture, seam position, room temperature, the hum of electronics, a standby light. For an autistic nervous system these aren’t trivia, and one of them can cost an hour of sleep every night for years.<\/p>"}, {"t": "Food", "g": "What actually helps", "k": "", "w": 438, "h": "<p>Most dietary claims in this field rest on very small studies. There is one that doesn’t.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>If you do one thing from this section, it’s the unglamorous one: get the nutrition right first.<\/p><\/aside><p>A <strong>twelve-month randomised controlled trial<\/strong> of comprehensive nutritional and dietary intervention improved <strong>nutritional status, non-verbal IQ, and autism symptoms.<\/strong> A full year, randomised, with real outcomes. If you do one thing from this section, it’s the unglamorous one: get the nutrition right first.<\/p><figure class=\"ph\" data-slot=\"ch21-l06\"><\/figure><p>That means addressing what’s actually low — frequently iron, vitamin D and B12, often because of a severely restricted range of accepted foods. Nobody’s fault, and testable rather than guessable.<\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>On ketogenic diets — and this is better news than most parents are told.<\/p><\/aside><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"><\/path><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p>The first thing to know is that a ketogenic diet is not an experimental thing to do to a child. <strong>It has been used to treat epilepsy in children for more than a hundred years<\/strong>, it is standard care for drug-resistant childhood epilepsy, and for some conditions it works better than the medications.<sup class=\"fn\">¹⁷<\/sup> Five recognised versions exist, with established protocols.<sup class=\"fn\">¹⁷<\/sup><\/p><\/div><\/aside><p><strong>What the autism research shows.<\/strong> In one study, the eighteen children who stayed on a ketogenic diet showed improvements in <strong>social behaviour and interaction, speech, cooperation, repetitive behaviours and hyperactivity.<\/strong><sup class=\"fn\">¹⁸<\/sup><\/p><p>A four-month pilot of a modified ketogenic diet measured what was happening underneath. Behavioural scores improved — and alongside that, <strong>inflammatory markers came down, the gut’s butyrate-producing capacity went up, and microbial diversity increased.<\/strong><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Look at what that is. Diet, gut, inflammation and behaviour all moving the same direction, in the same children, over four months. It is the loop from the start of this chapter running <strong>backwards<\/strong> — the first time in this book that all four have been measured improving together.<\/p><\/div><\/aside><p>There are also case reports of children who had lost speech regaining it on the diet, alongside improvements in cognition, calmness and social skills.<sup class=\"fn\">¹⁹<\/sup> Case reports are single children and cannot tell you how often it happens. They can tell you it happens.<\/p><p>The trials are small — seven children here, eighteen there — and a large randomised trial would be enormously valuable and hasn’t been done. But consider what you’d be trialling. Food. Whole food, low in sugar and starch, higher in fat. If it helps your child you’ll know inside a couple of months, and if it doesn’t, you’ll have spent those months feeding them well.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>On elimination testing.<\/strong> Chapter 6 has the method: remove the suspects for two to three weeks, then reintroduce one at a time, several days apart, watching sleep and behaviour as closely as digestion. Most useful where there are gut symptoms alongside.<\/p><\/div><\/aside>"}, {"t": "Supplements", "g": "What actually helps", "k": "", "w": 392, "h": "<p>Ranked by what’s behind them. Two have a marker that predicts who responds, which is unusual and useful.<\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>1. Folinic acid — with a test that tells you whether it’s likely to work.<\/p><\/aside><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>1 to 2 mg per kilogram daily<\/b><span>improved language and attention in controlled studies<\/span><\/div><div class=\"bx-body\"><p>High-dose folinic acid, at 1 to 2 mg per kilogram daily, improved language and attention in controlled studies.<sup class=\"fn\">¹⁶<\/sup> And the benefit was <strong>concentrated in children who had autoantibodies against the folate receptor<\/strong><sup class=\"fn\">²⁰<\/sup> — meaning a blood test can identify, in advance, who is likely to respond.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>In this field, a supplement with a marker rather than a hope is rare.<\/p><\/aside><p>Ask about it specifically. In this field, a supplement with a marker rather than a hope is rare.<\/p><figure class=\"ph\" data-slot=\"ch21-l07\"><\/figure><p><strong class=\"steplead\">2. Methylcobalamin (B12).<\/strong> High-dose injectable methylcobalamin has shown improvements in language, cognition and social responsiveness.<sup class=\"fn\">¹⁶<\/sup> It sits alongside folinic acid — both act on methylation, measurably altered in a subset of autistic children.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>twenty-nine young men<\/b><span>significant improvement across three standard behavioural measures<\/span><\/div><div class=\"bx-body\"><p><strong class=\"steplead\">3. Sulforaphane.<\/strong> The 2014 trial gave broccoli-sprout-derived sulforaphane to twenty-nine young men with moderate to severe autism against fifteen on placebo for eighteen weeks, and produced <strong>significant improvement across three standard behavioural measures.<\/strong><sup class=\"fn\">²¹<\/sup> A 2021 trial in fifty-seven younger children did not reach significance on its primary outcome,<sup class=\"fn\">²²<\/sup> and the researchers noted they had been unable to obtain a preparation equivalent to the original.<sup class=\"fn\">²²<\/sup><\/p><\/div><\/aside><p>The mechanism fits everything in this chapter: sulforaphane crosses into the brain and raises the cell’s own antioxidant defences — which is precisely the system under strain from the exposure and inflammation described earlier.<sup class=\"fn\">²¹<\/sup><\/p><p><strong class=\"steplead\">4. Vitamin D.<\/strong> Commonly low, and directly relevant to immune regulation. Test, then correct.<\/p><p><strong class=\"steplead\">5. Probiotics, carnitine and B6<\/strong> appear in reviews as reasonable candidates with small trials behind them.<sup class=\"fn\">²³<\/sup><\/p><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"><\/path><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p><strong>And the one you’ll see recommended everywhere that doesn’t hold up.<\/strong><\/p><p><strong class=\"num\">Omega-3.<\/strong> The reviews list it favourably.<sup class=\"fn\">²³<\/sup> The trials don’t. A six-month randomised placebo-controlled trial gave 1.5 g to children aged two to five and found <strong>no significant difference on the main autism measure — while the treated group’s externalising behaviour scores got significantly worse.<\/strong><sup class=\"fn\">²⁴<\/sup> A separate trial changed the children’s blood fatty acid levels and <strong>did not change the clinical picture at all.<\/strong><sup class=\"fn\">²⁵<\/sup><\/p><\/div><\/aside><p>I’m including that because you deserve to know where the money isn’t worth spending. Omega-3 has real evidence in depression and ADHD, covered in Chapters 13 and 16. For autism, it doesn’t.<\/p>"}, {"t": "Lowering what’s still coming in", "g": "What actually helps", "k": "", "w": 175, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Ongoing exposure is a different matter, and it’s the one place where the first part of this chapter becomes something you can act on directly.<\/p><\/aside><p>The prenatal window has closed and there’s nothing useful in looking back at it. Ongoing exposure is a different matter, and it’s the one place where the first part of this chapter becomes something you can act on directly.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p><strong>Food.<\/strong> Eating organic where it matters most reduces measurable pesticide levels in the body, usually within days. If cost is a factor, prioritise the produce that carries the heaviest residues rather than trying to do everything.<\/p><p><strong>Home.<\/strong> Indoor air is often worse than outdoor. Ventilate, filter if you can, and be cautious with what gets sprayed indoors — insecticides, air fresheners, fragranced cleaning products.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>Water.<\/h4><p>Filtration is inexpensive relative to what it removes.<\/p><\/div><div class=\"point\"><h4>And the neighbourhood you can’t change.<\/h4><p>If you live near agriculture or a busy road, closing windows during spraying seasons and at peak traffic hours is small and real. So is filtration.<\/p><\/div><\/div><p>Chapter 7 covers testing and metals in full — and its rule holds unchanged here: reduce what’s coming in, correct the nutrient status that governs how much gets absorbed, and don’t expect chelation to undo anything.<\/p>"}, {"t": "The part that’s for the adult reader", "g": "The part that’s for the adult reader", "k": "", "w": 34, "h": "<p>If you found out at thirty-five, or forty-eight, or sixty, this section is the one you came for. Almost every book about autism is written for parents, and it leaves you out.<\/p>"}, {"t": "What the masking has cost you", "g": "The part that’s for the adult reader", "k": "", "w": 217, "h": "<p>You learned, very early, that being visibly yourself had consequences. So you built something else. You copied. You scripted. You held your face still and your hands quiet. You worked out the rules everyone else seemed to know and applied them manually, in real time, all day.<\/p><p>And it worked. That’s why you kept doing it. You got treated better, excluded less, questioned less.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>164 autistic adults<\/b><span>camouflaging was a risk factor for suicidality<\/span><\/div><div class=\"bx-body\"><p><strong>It also has a measured cost.<\/strong> A systematic review found a consistent relationship between camouflaging and poor mental health — depression, anxiety, burnout and suicidality.<sup class=\"fn\">²⁶<\/sup> In a study of 164 autistic adults, <strong>camouflaging was a risk factor for suicidality<\/strong>, likely through the exhaustion it produces.<sup class=\"fn\">²⁷<\/sup><\/p><\/div><\/aside><p>Now the finding I most want you to have.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Researchers examining why camouflaging predicts poor mental health found the link ran through how hard someone was working to camouflage — not how autistic they were.<\/p><\/aside><p><strong>The damage tracks the effort of hiding, not the degree of autism.<\/strong><sup class=\"fn\">²⁸<\/sup> Researchers examining why camouflaging predicts poor mental health found the link ran through <strong>how hard someone was working to camouflage<\/strong> — not how autistic they were.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Read that again if you need to. <strong>It isn’t being autistic that has been hurting you. It’s the hiding.<\/strong><\/p><\/div><\/aside><p>Which matters practically, because it means what is damaging your health is also what you can most change — not by unmasking everywhere, which isn’t safe or possible, but by finding places where you don’t have to.<\/p>"}, {"t": "Burnout is not you failing", "g": "The part that’s for the adult reader", "k": "", "w": 176, "h": "<p>If you’ve hit a point where skills you had stopped working — you couldn’t speak on the phone, couldn’t cook, couldn’t manage the commute you’d managed for a decade — you’ve probably been told, or told yourself, that you were being lazy or dramatic.<\/p><aside class=\"bx bx-define\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 21V5M8 7h7\"/><\/svg><span>What it means<\/span><\/div><h4 class=\"bx-term\">Autistic burnout<\/h4><div class=\"bx-body\"><p><strong>Autistic burnout is defined in the research, by autistic people, as a response to chronic stress and inadequate support. Not a personal failure.<\/strong><sup class=\"fn\">²⁹<\/sup> Camouflaging appears in the definition itself as a contributing cause, with the fatigue of masking named explicitly.<sup class=\"fn\">³⁰<\/sup><\/p><\/div><\/aside><p>There’s a description in the qualitative work that gives this a name: exhaustion, plus loss of function, plus continued pressure to keep the mask on, produces <strong>psychological entrapment<\/strong> — no way forward and no way out.<sup class=\"fn\">³¹<\/sup> That state is specifically recognised as dangerous, and if you’re in it, it’s a reason to get help rather than to try harder.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Recovery from burnout is not a productivity problem.<\/p><\/aside><p>Recovery from burnout is not a productivity problem. It’s a load problem. Fewer demands, more recovery, less masking, for longer than feels reasonable.<\/p>"}, {"t": "Two things that follow", "g": "The part that’s for the adult reader", "k": "", "w": 175, "h": "<p><strong>Alcohol.<\/strong> Autistic adults report drinking to manage social situations, unexpected events and sensory overload.<sup class=\"fn\">³²<\/sup> If that’s you, read Chapter 19 — not because you have a moral problem, but because it makes the case that the substance was solving something, and names what that something usually is.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>The diagnosis itself.<\/strong> Whether formal or worked out privately, it arrives as relief and grief together — relief that there’s an explanation, grief for the decades spent without one. Chapter 16 met exactly this pattern in late-diagnosed ADHD. Both are legitimate, they arrive together, and neither cancels the other.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Masking is not who you are.<\/p><\/aside><p>One line to hold on to. <strong>Masking is not who you are. It’s what you learned to do because the alternative had consequences.<\/strong> Chapter 3 described a child working out who they needed to be in order to belong, and then becoming that. This is that argument arriving in a nervous system that was different from birth — and it means putting the mask down, where it’s safe to, is not self-indulgence. It’s treatment.<\/p>"}, {"t": "What makes it worse", "g": "The part that’s for the adult reader", "k": "worse", "w": 152, "h": "<p>Read as what the system is sensitive to.<\/p><p><strong>Sleep loss and drifting timing<\/strong> — first, for the reasons at the top of this chapter.<\/p><p><strong>Sustained masking with no recovery<\/strong> — for the adult reader, this is the big one.<\/p><p><strong>Sensory load with no decompression.<\/strong> A day of noise, light and people with no quiet afterwards accumulates. Not fussiness — a load that has to be paid down.<\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>Unaddressed gut inflammation.<\/p><\/aside><p><strong>Blood sugar swings<\/strong>, per Chapter 7.<\/p><p><strong>Ongoing chemical exposure<\/strong>, per above.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Uncertainty costs an autistic nervous system more than most, and routine is a genuine intervention rather than rigidity.<\/p><\/aside><p><strong>Unpredictability.<\/strong> Not a preference. Uncertainty costs an autistic nervous system more than most, and routine is a genuine intervention rather than rigidity.<\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>Two loops to name out loud:<\/p><\/aside><p>Poor sleep worsens clearance, poor clearance worsens everything, and everything worsens sleep.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>And: masking gets you treated better, being treated better reinforces the masking, and the masking eventually produces burnout — which then gets read as the autism getting worse, rather than the hiding getting more expensive.<\/p><\/div><\/aside>"}, {"t": "What to ask to be tested for", "g": "The part that’s for the adult reader", "k": "tests", "w": 45, "h": "<p>Chapter 13’s panel applies. Add:<\/p><aside class=\"bx bx-steps\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6h11M9 12h11M9 18h11\"/><circle cx=\"4.5\" cy=\"6\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"12\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"18\" r=\"1.2\"/><\/svg><span>Your checklist<\/span><\/div><div class=\"bx-body\"><ul>\n<li><strong>Ferritin<\/strong>, with an inflammatory marker alongside<\/li>\n<li><strong>Vitamin D<\/strong><\/li>\n<li><strong class=\"num\">B12 with functional markers, plus folate<\/strong><\/li>\n<li><strong>Coeliac screening<\/strong>, given how much dietary change happens in this population<\/li>\n<li><strong>Folate receptor autoantibodies<\/strong>, if folinic acid is being considered — this one predicts who responds<\/li>\n<\/ul><\/div><\/aside>"}, {"t": "If skills go backwards", "g": "The part that’s for the adult reader", "k": "", "w": 122, "h": "<p>For this chapter, the equivalent of relapse is <strong>regression or burnout<\/strong> — a loss of capacity that can follow illness, a transition, or a long stretch of too much demand.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Check the physical things first<\/h4><div class=\"bx-body\"><p>Check the physical things first: sleep over the past fortnight, gut symptoms, whether an illness or a course of antibiotics preceded it, whether eating has narrowed.<\/p><\/div><\/aside><p>Then check the load: how much sensory input, how much change, and for an adult, how much masking the last few months required.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>What it requires is less demand rather than more effort — the opposite of what most people try first, and the opposite of what they’re usually told.<\/p><\/aside><p><strong>And the capacity that disappeared is usually not gone.<\/strong> Burnout research describes recovery as slow and real. What it requires is less demand rather than more effort — the opposite of what most people try first, and the opposite of what they’re usually told.<\/p>"}, {"t": "Nothing here is about fixing anyone", "g": "The part that’s for the adult reader", "k": "", "w": 277, "h": "<p>A list of interventions can read as a list of things wrong with a person, so let me be clear about what all of this is.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Nothing above changes who anyone is.<\/p><\/aside><p>Nothing above changes who anyone is. Iron doesn’t make someone less autistic. Neither does sleep, or a repaired gut barrier, or folinic acid. What these things do is take weight off — the weight of a system that isn’t clearing properly at night, of a gut sending inflammatory signals all day, of a brain trying to run on fuel it struggles to use.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>An autistic person carrying less of that load is not a less autistic person. They are the same person with more room to move.<\/p><\/div><\/aside><p>And there’s something in the exposure research worth sitting with, because it answers a question most parents ask themselves in the dark. <strong>Whatever happened, happened to your child. It was not something you did wrong.<\/strong> The compounds involved were approved, sprayed on food, in the air of ordinary neighbourhoods, and nobody told you. That isn’t a failure of parenting, and it doesn’t become one now.<\/p><p>What it does mean is that the same processes still running — the inflammation, the poor clearance, the disrupted gut — are still reachable. Not all of it. Enough of it to matter.<\/p><p>And for the adult reader: you spent decades being told the tiredness was a character flaw. It wasn’t. You were doing translation work, continuously, that nobody could see and nobody credited — and the research now says plainly that the cost you paid tracked the effort of hiding, not the fact of being different.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p class=\"closing\">You were never too much. You were carrying too much.<\/p><\/div><\/aside>"}, {"t": "The research", "g": "The part that’s for the adult reader", "k": "refs", "w": 2453, "h": "<ul class='refs'><li><p>Shelton, J. F., Geraghty, E. M., Tancredi, D. J., et al. (2014). Neurodevelopmental disorders and prenatal residential proximity to agricultural pesticides: the CHARGE study. <em>Environmental Health Perspectives, 122<\/em>(10), 1103–1109. <em>(970 participants; California Pesticide Use Report data linked to pregnancy addresses. Approximately one third of mothers lived within 1.5 km of an agricultural pesticide application during pregnancy. Proximity to organophosphates was associated with a 60% increased risk of ASD, rising to OR 2.0 (95% CI 1.1–3.6) for third-trimester exposure and OR 3.3 (95% CI 1.5–7.4) for second-trimester chlorpyrifos. Pyrethroid applications preconception or in the third trimester carried ORs of 1.7–2.3. Case-control design using residential proximity as a proxy for actual exposure, which is an approximation.)<\/em><\/p><\/li><li><p>von Ehrenstein, O. S., Ling, C., Cui, X., et al. (2019). Prenatal and infant exposure to ambient pesticides and autism spectrum disorder in children: population based case-control study. <em>BMJ, 364,<\/em> l962. <em>(Exposure within 2,000 m of the mother’s residence during pregnancy. Risk was associated with glyphosate (OR 1.16, 95% CI 1.06–1.27), chlorpyrifos (1.13), diazinon (1.11), malathion (1.11), avermectin (1.12) and permethrin (1.10). Comparison group was women from the same agricultural region, which controls for many rural and socioeconomic confounders. Note the background ASD rate in this cohort was high relative to national figures, which may limit generalisation beyond intensive agricultural areas.)<\/em><\/p><\/li><li><p>Association between exposure to ambient particulate matters and risks of autism spectrum disorder in children: a systematic review and exposure-response meta-analysis. <em>Environmental Research Letters<\/em> (2021). <em>(Risk of ASD increased by 64% (pooled RR 1.64, 95% CI 1.16–2.34) per 10 μg/m³ increment of PM2.5 during early childhood, and by 31% (pooled RR 1.31, 95% CI 1.08–1.58) for prenatal exposure. Observational studies throughout; residential air pollution correlates with socioeconomic factors that are difficult to fully adjust for.)<\/em><\/p><\/li><li><p>Maternal exposure to air pollution and risk of autism in children: a systematic review and meta-analysis. <em>Environmental Pollution<\/em> (2019). <em>(Prenatal exposure to PM2.5 and ozone, and postnatal exposure to PM2.5 and NO₂, were associated with ASD. Proposed mechanism: increased neuroinflammation leading to decreased expression of reelin, a protein required for proper positioning of neurons during brain development.)<\/em><\/p><\/li><li><p>Ongono, J. S., et al. (2022). Association between residential proximity to agricultural crops and adaptive behaviors in children with autism spectrum disorder from the French ELENA cohort. <em>Journal of Psychiatric Research, 145,<\/em> 197–204. <em>(Reports that severity of characteristic symptoms increases with proximity to agricultural fields and associated pesticide use. Observational; proximity remains a proxy for exposure. A related literature suggests folic acid may modify the risk associated with pesticide exposure — Schmidt et al., 2017.)<\/em><\/p><\/li><li><p>Children with autism spectrum disorder present glymphatic system dysfunction evidenced by diffusion tensor imaging along the perivascular space. <em>Medicine<\/em> (2022). <em>(30 children with ASD and 25 healthy controls, 3T MRI. Left DTI-ALPS index 1.02 ± 0.12 in ASD versus 1.32 ± 0.20 in controls, P &lt; .001. The index was positively associated with age in both groups. Retrospective, small sample, and DTI-ALPS is an indirect proxy for glymphatic function rather than a direct measure.)<\/em><\/p><\/li><li><p>Glymphatic system dysfunction in children with autism spectrum disorder as evidenced by the diffusion tensor imaging along perivascular spaces index. <em>(78 individuals with ASD and 48 typically developing children. Significantly reduced indices in left hemisphere, right hemisphere and whole-brain mean. Within the ASD group, indices correlated negatively with the ADI-R communication score and positively with visual-motor integration; mediation analysis found visual-motor integration mediated the relationship between the right-hemisphere index and communication score. Cross-sectional and correlational.)<\/em><\/p><\/li><li><p>Abnormal glymphatic system function in children with autism spectrum disorder: a diffusion kurtosis imaging study. <em>European Journal of Pediatrics<\/em> (2025). <em>(DKI-ALPS indices correlated negatively with CARS severity scores and positively with Hearing-Language and Eye-Hand Coordination scores. DKI showed greater sensitivity than DTI in detecting group differences. Described by the authors as preliminary evidence.)<\/em><\/p><\/li><li><p>Review of glymphatic system dysfunction in autism spectrum disorder (2025). <em>(Synthesises the imaging findings above with proposed mechanisms including loss of perivascular aquaporin-4 polarisation and blood-brain barrier malfunction, and notes that sleep disturbances commonly observed in ASD further compromise glymphatic clearance, creating a self-perpetuating cycle of metabolic imbalance and inflammation. A narrative review — the loop it describes is plausible and not yet demonstrated prospectively.)<\/em><\/p><\/li><li><p>Tan, D.-X., Reiter, R. J., Zimmerman, S., &amp; Hardeland, R. (2023). Melatonin: both a messenger of darkness and a participant in the cellular actions of non-visible solar radiation of near infrared light. <em>Biology, 12<\/em>(1), 89. <em>(Reviews evidence that near-infrared radiation, occupying a major portion of the solar spectrum, promotes melatonin production, and proposes that the benefits of sun exposure and photobiomodulation therapy may be partly mediated by increased local melatonin synthesis. NIR photons penetrate to mitochondria where cytochrome c oxidase acts as the primary photoreceptor. The authors note the percentage of total vertebrate melatonin originating in the pineal is likely under 5%. The cellular signalling pathway they propose is explicitly described as speculated.)<\/em><\/p><\/li><li><p>Reiter, R. J., and colleagues on melatonin’s antioxidant capacity. <em>(One melatonin molecule may scavenge up to ten reactive oxygen or nitrogen species, compared with one or two for a classic antioxidant such as vitamin C. Melatonin is both water- and lipid-soluble, allowing it to act throughout the cell including within membranes.)<\/em><\/p><\/li><li><p>Zimmerman, S., &amp; Reiter, R. J. (2019). Melatonin and the optics of the human body. <em>Melatonin Research, 2<\/em>(1). <em>(Near-infrared radiation, 650–1200 nm, penetrates skin and deeper bodily tissues far more readily than ultraviolet or visible radiation, and is proposed as a factor inducing peripheral melatonin synthesis. NIR constitutes roughly 70% of solar photons reaching the body.)<\/em><\/p><\/li><li><p>Fradkin, Y., De Taboada, L., Naeser, M., et al. (2024). Transcranial photobiomodulation in children aged 2–6 years: a randomized sham-controlled clinical trial assessing safety, efficacy, and impact on autism spectrum disorder symptoms and brain electrophysiology. <em>Frontiers in Neurology, 15,<\/em> 1221193. NCT04660552. <em>(Thirty children randomised to pulsed near-infrared light, 40 Hz at 850 nm, or sham, delivered to selected brain areas twice weekly for eight weeks. The between-group difference in change on the Childhood Autism Rating Scale, 2nd Edition, was 7.23 points (95% CI 2.357–12.107, p = 0.011). EEG showed a significant between-condition difference in theta power and trends in delta and theta over time. No moderate or severe adverse effects. Small sample, investigational device (Cognilum, JelikaLite Corp.), and the trial was industry-connected — the authors call for larger studies.)<\/em><\/p><\/li><li><p>Ceranoglu, T. A., et al. (2020). Effects of transcranial photobiomodulation on adults with autism spectrum disorder: a pilot study. <em>Journal of Autism and Developmental Disorders, 50<\/em>(4), 1182–1197. <em>(Significant reduction in symptoms on the Social Responsiveness Scale, 2nd Edition, in adults with high-functioning ASD after eight weeks of pulsed 850 nm stimulation of the forebrain. Pilot study. The mechanistic rationale given across this literature is that transcranial photobiomodulation restores or enhances mitochondrial function and reduces inflammation and oxidative damage.)<\/em><\/p><\/li><li><p>Optimizing brain biology through near-infrared-induced mitochondrial melatonin synthesis: a hypothesis paper (2026). <em>(Synthesises photobiomodulation, mitochondrial biology and melatonin biochemistry into a proposed mechanism. The authors’ own critical evaluation states the automitocrine hypothesis is mechanistically compelling but supported by limited experimental evidence, and that reports of mitochondrial MT1 receptor localisation require independent replication. Presented here as a hypothesis with strong mechanistic grounding, not as established fact — while noting that increased daylight exposure carries no meaningful downside regardless of whether this particular mechanism holds.)<\/em><\/p><\/li><li><p>Reviews of nutritional supplementation in autism spectrum disorder. <em>(Large doses of folinic acid at 1–2 mg/kg/day improved language skills and focus in controlled studies. High-dose methylcobalamin has shown advantages in language, cognition and social behaviours. Melatonin is widely used for sleep disturbance with notable benefits to sleep quality, which can indirectly improve daytime behaviour. These are review-level summaries of small individual trials; treat the direction as more reliable than any specific figure.)<\/em><\/p><\/li><li><p>Ketogenic diet therapy for the treatment of pediatric epilepsy. <em>(Reviews more than 100 years of clinical use. Five recognised forms exist: classic ketogenic, modified Atkins, medium-chain triglyceride, modified ketogenic (UK) and low glycaemic index treatment. Established indications include Glut1 deficiency, pyruvate dehydrogenase deficiency, infantile epileptic spasms, epilepsy with myoclonic-atonic seizures and formula-fed children, and for some of these it may be more advantageous than antiseizure medication. Diet therapy is started under neurologist and dietitian supervision; vitamin, calcium and mineral supplements are begun at initiation to prevent common side effects including constipation, kidney stones, growth disturbance and dyslipidaemia. Typically trialled for at least three months and often discontinued after two years.)<\/em><\/p><\/li><li><p>Evangeliou, A., et al. (2003). Application of a ketogenic diet in children with autistic behavior: pilot study. <em>Journal of Child Neurology, 18<\/em>(2), 113–118. <em>(Of the children who remained on the diet, 18 showed improvements in social behaviour and interaction, speech, cooperation, stereotypy and hyperactivity. Open-label pilot with no control group and substantial dropout — the improvements are in those who tolerated and continued the diet, which is a self-selected group.)<\/em><\/p><\/li><li><p>Case reports of ketogenic diet in autism with co-occurring epilepsy, including Herbert, M. R., &amp; Buckley, J. A. (2013), <em>Journal of Child Neurology, 28,<\/em> 975–982. <em>(Reported improvements in cognitive and language function, social skills and calmness, with resolution of stereotypies, alongside seizure improvement. Single cases: they establish that this can happen, not how often it does.)<\/em><\/p><\/li><li><p>Analysis of treatment subgroups in autism spectrum disorder. <em>(The efficacy of high-dose folinic acid was concentrated in the subgroup with folate receptor-α autoantibodies — a stratification finding that identifies likely responders in advance. Requires replication in adequately powered trials.)<\/em><\/p><\/li><li><p>Singh, K., Connors, S. L., Macklin, E. A., et al. (2014). Sulforaphane treatment of autism spectrum disorder. <em>PNAS, 111<\/em>(43), 15550–15555. <em>(Placebo-controlled double-blind randomised trial. 29 young men aged 13–27 with moderate to severe ASD received sulforaphane from broccoli sprout extract, 50–150 μmol daily for 18 weeks, versus 15 on placebo, followed by 4 weeks without treatment. Significant improvement across three caregiver-completed behavioural measures. Small sample, single site, and outcomes were caregiver-rated.)<\/em><\/p><\/li><li><p>Zimmerman, A. W., Singh, K., Connors, S. L., et al. (2021). Randomized controlled trial of sulforaphane and metabolite discovery in children with autism spectrum disorder. <em>Molecular Autism, 12.<\/em> <em>(57 children aged 3–12 randomised to sulforaphane or placebo for 15 weeks, with open-label and no-treatment extensions over 36 weeks; 45 analysed. Treatment effects on the primary outcome — the Ohio Autism Clinical Impressions Scale — were not significant. The authors note in a published correction that they were unable to obtain sulforaphane-rich preparations equivalent to those used in the 2014 trial, using commercially available broccoli seed and sprout extract tablets instead. This is the failed replication and it is cited on purpose.)<\/em><\/p><\/li><li><p>Therapeutic diets and supplementation in autism spectrum disorders in childhood: a narrative review of recent clinical trials (2024). <em>(Concludes there is a compelling case for further investigation of carnitine, folinic acid, vitamins B12 and B6, and sulforaphane, while calling for larger studies. A narrative review, and it lists omega-3 favourably — see the trial evidence in the next two entries, which is less encouraging.)<\/em><\/p><\/li><li><p>Voigt, R. G., Mellon, M. W., Katusic, S. K., et al. (2014). Dietary docosahexaenoic acid supplementation in children with autism. <em>(And: a randomized, placebo controlled trial of omega-3 fatty acids in the treatment of young children with autism — 38 participants aged 2–5, 1.5 g omega-3 versus placebo for 6 months. No significant difference on the primary autism composite measure (p = 0.5). There was a significant group-by-week interaction on externalising problem scores, with the treatment group showing worsening scores (p = 0.02). No significant effects on adaptive function or language. The authors concluded the study does not support omega-3 supplementation for these outcomes. Small sample; cited here as a deliberate null finding.)<\/em><\/p><\/li><li><p>Docosahexaenoic and eicosapentaenoic intervention modifies plasma and erythrocyte omega-3 fatty acid profiles but not the clinical course of children with autism spectrum disorder: a randomized control trial. <em>Frontiers in Nutrition.<\/em> <em>(Supplementation successfully altered blood fatty acid composition without changing clinical outcomes — a useful demonstration that a biomarker moving does not mean a symptom will.)<\/em><\/p><\/li><li><p>Systematic reviews of the consequences of social camouflaging in autistic adults, including Khudiakova et al. (2024). <em>(Consistent positive relationship between camouflaging and poor mental health outcomes including depression, anxiety, suicidality and autistic burnout across multiple studies. Predominantly cross-sectional and self-report; the reviews note that longitudinal research is needed to establish causality and long-term effects.)<\/em><\/p><\/li><li><p>Cassidy, S., Bradley, L., Shaw, R., &amp; Baron-Cohen, S. (2018). Risk markers for suicidality in autistic adults. <em>Molecular Autism, 9.<\/em> <em>(164 autistic adults. Camouflaging was identified as a risk factor for suicidality, possibly through indirect effects such as exhaustion. Cross-sectional.)<\/em><\/p><\/li><li><p>Beck, J. S., et al. (2020). Looking good but feeling bad: “camouflaging” behaviors and mental health in women with autistic traits. <em>Autism.<\/em> <em>(Suggests the relationship between camouflaging and mental health is linked primarily to the intensity of camouflaging efforts rather than to the severity of autistic traits. This is the finding the chapter’s central claim rests on; it warrants replication in larger and longitudinal samples.)<\/em><\/p><\/li><li><p>Raymaker, D. M., et al. (2020). “Having all of your internal resources exhausted beyond measure and being left with no clean-up crew”: defining autistic burnout. <em>Autism in Adulthood, 2<\/em>(2), 132–143. <em>(Lived-experience research defining autistic burnout as a response to chronic life stress and a mismatch of expectations and abilities without adequate support — explicitly not a personal failure. Suicidal behaviour was among the serious negative outcomes participants attributed directly to burnout. Qualitative, community-based.)<\/em><\/p><\/li><li><p>Mantzalas, J., Richdale, A. L., Adikari, A., Lowe, J., &amp; Dissanayake, C. (2022). What is autistic burnout? A thematic analysis of posts on two online platforms. <em>Autism in Adulthood, 4<\/em>(1), 52–65. <em>(Camouflaging identified as a key contributing factor, with a majority of participants agreeing that a definition of autistic burnout should include fatigue from camouflaging or masking autistic traits.)<\/em><\/p><\/li><li><p>Systematic review of autistic people’s experience of camouflaging and autistic burnout in relation to one another (2026). <em>(Describes the combination of exhaustion, loss of function and continued social pressure to maintain the mask as producing conditions of psychological entrapment — a state specifically identified in the suicidology literature as high-risk. Qualitative synthesis.)<\/em><\/p><\/li><li><p>Reported motivations for substance use among autistic adults, including Weir, Allison &amp; Baron-Cohen (2021). <em>(Autistic adults reported using alcohol to manage unexpected events, sensory difficulties and social interactions. Self-report survey data.)<\/em><\/p><\/li><\/ul>"}]}, {"n": 20, "t": "The Plaques May Not Be the Disease", "s": "Alzheimer’s, what actually lowers the risk, and why prevention starts decades early", "p": 3, "l": [{"t": "Opening", "g": "", "k": "", "w": 124, "h": "<p>You have watched someone disappear.<\/p><p>Maybe it was your mother, asking the same question for the fourth time in an hour. Maybe your father, who could still tell you about 1962 but not what he had for lunch. You did the visits, and the arguments about the car keys, and the moment they looked at you with polite interest instead of recognition.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>And somewhere in among all of that, you started keeping score of your own mind. The word that wouldn’t come. The reason you walked into the kitchen. Each one filed away as possible evidence.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>This chapter is written for you, and it is mostly about prevention — because prevention is where nearly everything useful sits, and because you are not too late.<\/p><\/aside><p>This chapter is written for you, and it is mostly about prevention — because prevention is where nearly everything useful sits, and because you are not too late.<\/p>"}, {"t": "The drugs that should have worked", "g": "", "k": "", "w": 245, "h": "<p>For thirty years, one idea has organised almost all Alzheimer’s research: sticky protein deposits called amyloid plaques build up in the brain, and they cause the disease. Clear the plaques, treat the illness.<\/p><p>Enormous effort went into building drugs that clear amyloid. They work — the plaques come out. Three have been approved. The first was withdrawn by its own manufacturer three years later.<sup class=\"fn\">¹<\/sup><\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>seventeen phase 3 trials<\/b><span>even successful removal of amyloid does not appear to translate into clinically meaningful benefit<\/span><\/div><div class=\"bx-body\"><p>And in 2026, a review pooling <strong>seventeen phase 3 trials across seven of these antibodies<\/strong> put the conclusion plainly: <strong>even successful removal of amyloid does not appear to translate into clinically meaningful benefit<\/strong> for people with mild cognitive impairment or early Alzheimer’s.<sup class=\"fn\">¹<\/sup><\/p><\/div><\/aside><p>The newer drugs do produce a statistically significant difference on cognitive tests. But the difference falls <strong>below the threshold at which a patient, a family member or a doctor would notice it<\/strong> — under two points on scales that run to fifty or more.<sup class=\"fn\">¹<\/sup> <sup class=\"fn\">²<\/sup><\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>30 per 1,000 versus 1 per 1,000<\/b><span>Swelling severe enough to cause symptoms<\/span><\/div><div class=\"bx-body\"><p>The side effects are not minor. Brain swelling occurred in <strong>119 of every 1,000 people treated, against 12 per 1,000 on placebo.<\/strong> Swelling severe enough to cause symptoms — headache, confusion, vision changes, seizure — occurred in about <strong>30 per 1,000 versus 1 per 1,000.<\/strong><sup class=\"fn\">¹<\/sup><\/p><\/div><\/aside><p>European regulators approved these drugs anyway, and the benefit-risk judgement was a hard one.<sup class=\"fn\">²<\/sup> I’m not telling you they’re worthless. I’m telling you what the failure means.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>If amyloid were simply the cause, clearing it should have worked.<\/p><\/aside><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>If amyloid were simply the cause, clearing it should have worked.<\/p><\/aside>"}, {"t": "What the plaques might be for", "g": "", "k": "", "w": 90, "h": "<p>So a different question has started to get attention. What if the plaque isn’t the fire? What if it’s the smoke?<\/p><p>Two findings point that way, and they are not fringe work.<\/p><div class=\"points\"><div class=\"point\"><h4>Amyloid beta is rapidly seeded by herpesviruses to protect against brain infection.<\/h4><p><sup class=\"fn\">³<\/sup> It behaves like an antimicrobial trap.<\/p><\/div><div class=\"point\"><h4>And tau — the other hallmark protein of Alzheimer’s — has been shown to neutralise herpes simplex virus in human neurons.<\/h4><p><sup class=\"fn\">³<\/sup><\/p><\/div><\/div><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Both of the proteins we have spent decades calling the disease behave like immune defences.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>If the plaque is a response, the useful question stops being how do we clear it and becomes what is it responding to — and whether that can be prevented.<\/p><\/aside><p>Which reframes everything downstream. If the plaque is a response, the useful question stops being <em>how do we clear it<\/em> and becomes <em>what is it responding to<\/em> — and whether that can be prevented.<\/p>"}, {"t": "A birthday, and what it showed", "g": "", "k": "", "w": 343, "h": "<p>Now the study that makes this practical, and it is the cleanest piece of evidence in this book.<\/p><p>In Wales, eligibility for the shingles vaccine was set by exact date of birth. Anyone born before 2 September 1933 was ineligible, permanently. Anyone born on or after that date could have it.<\/p><figure class=\"ph\" data-slot=\"ch20-l04\"><\/figure><p>So researchers compared people born a week apart. <strong>Among those one week too old, 0.01% were vaccinated. Among those one week younger, 47.2% were.<\/strong><sup class=\"fn\">⁴<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Two groups identical in every way that matters — same era, same health system, same everything — separated by a birthday.<\/p><\/aside><p>Two groups identical in every way that matters — same era, same health system, same everything — separated by a birthday. That design removes almost all of the confounding that makes ordinary observational research so hard to trust.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>20%<\/b><span>fewer new dementia diagnoses over the following seven years<\/span><\/div><div class=\"bx-body\"><p><strong>The vaccinated group had roughly 20% fewer new dementia diagnoses over the following seven years.<\/strong><sup class=\"fn\">⁴<\/sup> <sup class=\"fn\">⁵<\/sup> The effect was stronger in women.<sup class=\"fn\">⁵<\/sup><\/p><\/div><\/aside><p>Then it held up elsewhere. A Canadian team ran the same kind of natural experiment and concluded the evidence is more likely to reflect a causal relationship than standard observational data.<sup class=\"fn\">⁶<\/sup> In more than 200,000 people, the <strong>newer recombinant shingles vaccine was associated with 17% more time free of a dementia diagnosis<\/strong> than the older one — about 164 extra days.<sup class=\"fn\">⁷<\/sup> And across <strong class=\"num\">436,788 people<\/strong>, both the shingles vaccine and the RSV vaccine that shares its adjuvant were associated with lower dementia risk, with no difference between them<sup class=\"fn\">⁸<\/sup> — which suggests the immune stimulation itself may be doing some of the work.<\/p><p>The virus in question, varicella zoster, sits dormant in your nerves for life after chi
