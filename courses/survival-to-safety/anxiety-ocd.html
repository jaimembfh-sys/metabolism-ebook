preparation Silexan is effective in generalized anxiety disorder — a randomized, double-blind comparison to placebo and paroxetine. <em>International Journal of Neuropsychopharmacology, 17<\/em>(6), 859–869. <em>(539 adults with GAD; HAMA reduction of 14.1 points on Silexan 160 mg, 12.8 on Silexan 80 mg, 11.3 on paroxetine and 9.5 on placebo. The comparison with paroxetine was descriptive — the trial was not designed as a formal superiority test against the active comparator.)<\/em><\/p><\/li><li><p>Systematic review and meta-analysis of the cognitive and affective effects of L-theanine, 31 randomised trials, n = 1,168. <em>Molecular Psychiatry<\/em> (2026). <em>(Modest reduction in acute stress, SMD 0.31; improved choice reaction time with a single 200 mg dose, SMD 0.51. Predominantly healthy adult samples rather than diagnosed anxiety disorders.)<\/em> See also Hidese, S., et al. (2019), <em>Nutrients, 11<\/em>(10), 2362 — four-week crossover trial, 200 mg/day, improvements in trait anxiety and sleep quality; note that a manufacturer of theanine was involved.<\/p><\/li><li><p>Savage, K., Firth, J., Stough, C., &amp; Sarris, J. (2018). GABA-modulating phytomedicines for anxiety: a systematic review of preclinical and clinical evidence. <em>Phytotherapy Research, 32<\/em>(1), 3–18. <em>(Ten phytomedicines with both laboratory evidence of GABA-system activity and human trials: kava, valerian, pennywort, hops, chamomile, Ginkgo biloba, passionflower, ashwagandha, skullcap and lemon balm. The authors caution that conclusions must be tempered by small sample sizes, brief intervention durations and lack of replication.)<\/em><\/p><\/li><li><p>Reviews of oral GABA supplementation and blood–brain barrier penetration. <em>(GABA is highly polar and crosses the barrier poorly; the evidence on penetration is contradictory, with the weight of it against meaningful entry, and definitive spectroscopy studies have not been performed. Reviewers also note that much of the positive literature comes from researchers with commercial interests. Some small trials report effects on sleep onset, potentially via peripheral or gut–brain routes.)<\/em><\/p><\/li><li><p>Melani, C., et al. (2020). Absence of definitive scientific evidence that benzodiazepines could hinder the efficacy of exposure-based interventions in adults with anxiety or posttraumatic stress disorders: a systematic review of randomized clinical trials. <em>Depression and Anxiety, 37<\/em>(9). <em>(At post-treatment, benzodiazepines did not affect exposure outcomes in nine studies, improved them in two and reduced them in one; at follow-up, no impact in six and reduced efficacy in five. The authors conclude there is no definitive evidence of harm. Note the countervailing mechanistic evidence: benzodiazepines interfere with acquisition and retention of new information, and animal studies show impaired fear extinction.)<\/em><\/p><\/li><li><p>Crowe, S. F., &amp; Stranks, E. K. (2018). The residual medium and long-term cognitive effects of benzodiazepine use: an updated meta-analysis. <em>Archives of Clinical Neuropsychology, 33<\/em>(7), 901–911. <em>(Current long-term users showed significant impairment in working memory, processing speed, divided attention, visuoconstruction, recent memory and expressive language. Among those who had withdrawn and remained abstinent, deficits persisted across recent memory, processing speed, visuoconstruction, divided attention, working memory and sustained attention. The authors conclude these impairments are likely to persist following withdrawal. Observational data — long-term users differ from controls in ways beyond the medication, and the studies cannot fully separate drug effects from the conditions being treated.)<\/em><\/p><\/li><li><p>Barker, M. J., Greenwood, K. M., Jackson, M., &amp; Crowe, S. F. (2004). Persistence of cognitive effects after withdrawal from long-term benzodiazepine use: a meta-analysis. <em>Archives of Clinical Neuropsychology, 19<\/em>(3), 437–454. <em>(Long-term users recovered function in many domains after withdrawal, but significant impairment remained across most areas of cognition relative to controls and normative data; working memory was still impaired at an average of around eleven months post-withdrawal.)<\/em><\/p><\/li><li><p>The association between benzodiazepine use and dementia remains contested. Compare Penninkilampi, R., &amp; Eslick, G. D. (2018), <em>CNS Drugs, 32<\/em>(6), 485–497 — which concluded, after controlling for protopathic bias, that the association is not purely an artefact — with the nested case–control analysis in <em>American Journal of Epidemiology<\/em> (2019) 188(7):1228, which concluded there is no causal link and that positive associations reflect confounding or protopathic bias, and with Hayakawa et al. (2023), <em>Digital Health<\/em>, which found no significant risk with long-term use after adjustment. <em>(Anxiety and insomnia are both prodromal symptoms of neurodegenerative disease, making cause and effect exceptionally difficult to separate. Presented here as unresolved.)<\/em><\/p><\/li><\/ul>"}]}, {"n": 17, "t": "The Thought Isn’t the Problem", "s": "OCD, the forms it hides in, and what actually stops the loop", "p": 3, "l": [{"t": "Opening", "g": "", "k": "", "w": 112, "h": "<p>There is a particular kind of aloneness in this one.<\/p><p>Whatever your version is — the door you check, the thought you can’t stop answering, the feeling that something is not quite right and won’t be until you fix it — you have probably never described it fully to another person. Not to your partner. Possibly not to a doctor. You’ve described the edges of it, the socially acceptable parts, and kept the rest.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>And you have almost certainly concluded, somewhere along the way, that the reason you can’t say it out loud is that it means something about you.<\/p><\/aside><p>And you have almost certainly concluded, somewhere along the way, that the reason you can’t say it out loud is that it means something about you.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>That conclusion is the condition. Not the thought. The conclusion.<\/p><\/div><\/aside>"}, {"t": "What actually happens", "g": "", "k": "", "w": 270, "h": "<p>Start with the part nobody tells you, because it changes everything that follows.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>93.6%<\/b><span>reported at least one unwanted intrusive thought, image or impulse<\/span><\/div><div class=\"bx-body\"><p><strong>Unwanted intrusive thoughts are close to universal.<\/strong> In a study that interviewed 777 people across thirteen countries on six continents — ordinary people, no diagnosis — <strong>93.6% reported at least one unwanted intrusive thought, image or impulse in the previous three months.<\/strong><sup class=\"fn\">¹<\/sup> Violent ones. Sexual ones. Blasphemous ones. Thoughts of harming people they love.<\/p><\/div><\/aside><p>The foundational study is even more striking. Researchers gave a questionnaire about intrusive thoughts to eight patients with OCD and 124 other people, then compared the two lists. <strong>Ninety-nine of the 124 non-patients reported thoughts and images similar to those of the clinical group.<\/strong><sup class=\"fn\">²<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>So the content isn’t the difference. Almost everyone gets these. What differs is what happens next.<\/p><\/div><\/aside><p>Most people have the thought, register it as strange or unpleasant, and have forgotten it by lunchtime. Someone with OCD asks a different question: <strong>what does it mean that I thought that?<\/strong><\/p><p>And that question is where the condition begins. Because once a thought is treated as <em>meaningful<\/em> — as information about who you are, or as a warning — it demands a response. So you do something: check, wash, review it, seek reassurance, pray, avoid, mentally argue it down. And the anxiety drops. Really drops. For about twenty minutes.<\/p><p>Then your brain draws the conclusion it was always going to draw: <strong>that thought was dangerous, and I got through it because I responded.<\/strong> The thought is now marked as important. It comes back with more force. You respond again.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Every single answer makes the question louder.<\/p><\/aside><p>That loop is OCD. Every single answer makes the question louder.<\/p>"}, {"t": "Why it lands hardest on the people it would hurt most", "g": "", "k": "", "w": 194, "h": "<p>Here’s what follows from the mechanism, and it’s the part that keeps people silent for decades.<\/p><p>If the condition works by treating a thought as evidence about your character, then it will grip hardest when the thought is about the thing you would least want to be true. A person who loves children gets thoughts about harming them. A devoted partner gets thoughts about their partner being wrong for them. A gentle person gets violent images. Someone deeply religious gets blasphemous ones.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The thoughts that stick are the ones you find intolerable, because those are the ones you can’t dismiss.<\/p><\/aside><p>That isn’t cruel irony. It’s the mechanism working exactly as described. The thoughts that stick are the ones you find intolerable, because those are the ones you can’t dismiss.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Which means the thing you have been treating as proof is the opposite. <strong>Your distress about the thought is evidence against it, not for it.<\/strong> Someone who actually wanted to do a thing does not lie awake for six years horrified that they thought about it.<\/p><\/div><\/aside><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>3%<\/b><span>reported fears of hurting or killing someone they loved without wanting to<\/span><\/div><div class=\"bx-body\"><p>This is also, incidentally, not rare. In a population study of ordinary adults, <strong>3% reported fears of hurting or killing someone they loved without wanting to<\/strong> in the past year alone.<sup class=\"fn\">³<\/sup><\/p><\/div><\/aside>"}, {"t": "The versions that never get recognised", "g": "", "k": "", "w": 173, "h": "<p>Everyone knows about handwashing and checking the stove. Those get diagnosed. These often don’t:<\/p><p><strong>Harm OCD<\/strong> — intrusive thoughts or images of hurting someone, usually someone you love, sometimes yourself. Often accompanied by avoiding knives, driving, or being alone with people.<\/p><p><strong>Intrusive thoughts about children<\/strong>, which is the presentation people take to their graves.<\/p><p><strong>Sexual orientation OCD<\/strong> — relentless checking of your own responses to work out what you “really” are.<\/p><p><strong>Relationship OCD<\/strong> — <em>do I really love them, is this the right person, did I feel something just then<\/em> — checked and rechecked daily.<\/p><aside class=\"bx bx-define\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 21V5M8 7h7\"/><\/svg><span>What it means<\/span><\/div><h4 class=\"bx-term\">Scrupulosity<\/h4><div class=\"bx-body\"><p><strong>Scrupulosity<\/strong> — religious or moral obsessions. Confessing repeatedly, praying to undo thoughts, unable to stop reviewing whether you’ve done something wrong.<\/p><\/div><\/aside><p><strong>“Just right” OCD<\/strong> — no feared catastrophe at all, just an unbearable sense of incompleteness until something is done until it feels correct.<\/p><p><strong>Health anxiety<\/strong> — body-checking, symptom-googling, reassurance-seeking, the cycle restarting the moment a scan comes back clear.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>If you have been reading this book looking for yourself and haven’t found it yet, you may be here.<\/p><\/aside><p>If you have been reading this book looking for yourself and haven’t found it yet, you may be here.<\/p>"}, {"t": "The compulsions you don’t know are compulsions", "g": "", "k": "", "w": 147, "h": "<p>A compulsion is anything you do to make the discomfort go away. Most of them aren’t visible, so many people conclude they can’t have this — they don’t wash their hands.<\/p><aside class=\"bx bx-checklist\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"3\"/><path d=\"M8 12l3 3 5-6\"/><\/svg><span>Does this sound familiar?<\/span><\/div><div class=\"bx-body\"><ul>\n<li><strong>Mental reviewing<\/strong> — replaying an event to check what you did or said<\/li>\n<li><strong>Reassurance-seeking<\/strong> — asking, sometimes the same question in different words<\/li>\n<li><strong>Googling<\/strong> — symptoms, legal definitions, “how do I know if I’m…”<\/li>\n<li><strong>Checking your own feelings<\/strong> — monitoring whether the love, the attraction, the certainty is still there<\/li>\n<li><strong>Confessing<\/strong> — telling someone the thought to be told it’s fine<\/li>\n<li><strong>Mental undoing<\/strong> — praying, counting, replacing a bad thought with a good one<\/li>\n<li><strong>Avoidance<\/strong> — of people, objects, situations, words<\/li>\n<li><strong>Self-monitoring<\/strong> — scanning your own body or reactions for evidence<\/li>\n<\/ul><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>If it makes the feeling go away and you feel compelled to do it, it’s a compulsion, whether it happens in your hands or your head.<\/p><\/aside><p>If it makes the feeling go away and you feel compelled to do it, it’s a compulsion, whether it happens in your hands or your head.<\/p>"}, {"t": "The wait", "g": "", "k": "", "w": 61, "h": "<p>People wait somewhere between <strong>nine and seventeen years<\/strong> from the start of symptoms to getting treatment.<sup class=\"fn\">⁴<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>That is not because people with OCD are unusually avoidant. It’s because the condition specifically attacks the things you’d need to say out loud in order to get help. Shame is not a side effect here. It’s part of the machinery.<\/p><\/div><\/aside>"}, {"t": "The question worth asking", "g": "", "k": "", "w": 72, "h": "<p>Not whether you’d meet a threshold. <strong>Is this taking hours out of your life?<\/strong><\/p><p>If you’re losing time — real hours, most days — to checking, reviewing, avoiding, seeking reassurance or arguing with your own mind, that’s worth addressing regardless of what any assessment concludes. And if it isn’t taking hours, most of this chapter is still useful for the parts of your life where the loop shows up smaller.<\/p>"}, {"t": "The treatment, and the myth about it", "g": "What actually helps", "k": "", "w": 193, "h": "<p>The treatment for this is called <strong>exposure and response prevention<\/strong>, and it has the strongest evidence of anything in this chapter by a wide margin.<\/p><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"/><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p>The most common reason clinicians give for <em>not<\/em> offering it is that it’s too distressing and people will drop out.<\/p><p>That belief is measurably wrong, and here is the data:<\/p><\/div><\/aside><div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Dropout<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>ERP (young people)<\/strong><\/td>\n<td><strong class=\"num\">10.2%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>ERP (adults)<\/strong><\/td>\n<td><strong class=\"num\">14.7%<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Medication<\/td>\n<td>17.3%<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Other therapies (relaxation, metacognitive)<\/td>\n<td>20.6%<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Placebo pill<\/td>\n<td>23.5%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>below 0.1%<\/b><span>Serious adverse consequences run<\/span><\/div><div class=\"bx-body\"><p><strong>More people drop out of taking a placebo than out of ERP.<\/strong><sup class=\"fn\">⁵<\/sup> Serious adverse consequences run below 0.1%.<\/p><\/div><\/aside><p>And the outcomes, which are worth having in front of you if you’ve only ever been offered medication:<\/p><div class=\"table-wrap\"><table>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Response<\/th>\n<th>Remission<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Therapy<\/strong><\/td>\n<td><strong class=\"num\">70%<\/strong><\/td>\n<td><strong class=\"num\">53%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Therapy + medication<\/td>\n<td>66%<\/td>\n<td>49%<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Medication alone<\/td>\n<td>49%<\/td>\n<td>24%<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Placebo<\/td>\n<td>29%<\/td>\n<td>15%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><aside class=\"margin-quote\"><span>Key idea<\/span><p>Adding medication to therapy was not better than therapy alone, regardless of how severe things were at the start.<\/p><\/aside><p>Adding medication to therapy was <strong>not<\/strong> better than therapy alone, regardless of how severe things were at the start.<sup class=\"fn\">⁶<\/sup><\/p><p>Two things to hold alongside that. Effect estimates vary a good deal depending on what ERP is compared against. And full remission runs somewhere around half — this is a treatment that works well and does not work for everyone.<\/p>"}, {"t": "Why the last chapter’s method won’t work here", "g": "What actually helps", "k": "", "w": 314, "h": "<p>If you read Chapter 14, you were told to name a specific prediction, go and find out what actually happens, and let the surprise teach your alarm it was wrong.<\/p><p><strong>Do not apply that here.<\/strong> It will make things worse, and it’s worth understanding why.<\/p><figure class=\"ph\" data-slot=\"ch17-l09\"><\/figure><p>In anxiety, the feared outcome is usually testable. <em>I’ll faint. I’ll have to leave. They’ll notice.<\/em> You go, you don’t faint, you’ve learned something.<\/p><p>In OCD, the feared outcome is very often <strong>untestable.<\/strong> <em>Did I hit someone with my car three miles back. Am I secretly a bad person. Do I really love them. Is this thought evidence about me.<\/em> You cannot go and check. And every attempt to check <strong>is the compulsion.<\/strong><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>It’s something harder and simpler: learning to live without knowing.<\/p><\/aside><p>So the work here isn’t finding out you were wrong. It’s something harder and simpler: <strong>learning to live without knowing.<\/strong><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>That’s the shift. You are not trying to become certain. You are practising being uncertain and finding that you survive it anyway.<\/p><\/div><\/aside><h3 id=\"how-its-actually-done\">How it’s actually done<\/h3><p><strong>Response prevention is the active ingredient<\/strong>, not exposure. What matters most isn’t approaching the trigger — it’s not doing the thing afterwards.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Start where you can<\/h4><div class=\"bx-body\"><p><strong>Start where you can, not where it’s worst.<\/strong> Touch the handle and don’t wash. Send the message and don’t reread it. Have the thought and don’t review it.<\/p><p><strong>If stopping outright is impossible, delay.<\/strong> Wait ten minutes before checking. Then twenty. Delay is a legitimate step, not a failure.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>Let the discomfort be there.<\/h4><p>You’re not waiting for it to go — you’re learning it will pass whether or not you act.<\/p><\/div><div class=\"point\"><h4>Expect it to get louder before it gets quieter.<\/h4><p>A brain that has been answered for years does not stop asking immediately.<\/p><\/div><div class=\"point\"><h4>And do it with someone if you can.<\/h4><p>This is a treatment with a method, and a specialist will get you further than a book. Ask specifically whether a therapist does ERP; a great deal of talking therapy does not.<\/p><\/div><\/div>"}, {"t": "Why arguing with it makes it stronger", "g": "What actually helps", "k": "", "w": 99, "h": "<p>This is the thing almost everyone tries first, and some general therapy actively encourages it: challenge the thought, examine the evidence, reason your way to a conclusion.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Arguing with the thought is answering the thought.<\/p><\/aside><p>It doesn’t work here, for one reason. <strong>Arguing with the thought is answering the thought.<\/strong> You’ve engaged. You’ve treated it as a question that deserves a response. And your brain files it, again, as important.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>The move is not to win the argument. It’s to decline it. <em>Maybe, maybe not<\/em> — and carry on with what you were doing.<\/p><\/div><\/aside><p>That will feel like giving up. It’s the opposite.<\/p>"}, {"t": "When helping keeps it going", "g": "What actually helps", "k": "", "w": 244, "h": "<p>This section is worth reading with someone else in the room.<\/p><p><strong>Family accommodation<\/strong> means the ways people around you adjust to the condition — answering the reassurance question, doing the checking for you, avoiding the trigger word, changing household routines. It is done out of love, at real cost, by people who cannot bear to watch you suffer.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>94%<\/b><span>of relatives of adults with OCD report doing it<\/span><\/div><div class=\"bx-body\"><p>It’s also close to universal. <strong>94% of relatives of adults with OCD report doing it.<\/strong><sup class=\"fn\">⁷<\/sup> Among families of children with OCD, around <strong class=\"num\">70% of parents accommodate every day.<\/strong><sup class=\"fn\">⁸<\/sup><\/p><\/div><\/aside><p>And it feeds the loop, for exactly the reason everything else in this chapter does: it supplies the answer, so the question keeps coming. Higher accommodation tracks with more severe symptoms, and accommodation drops substantially when treatment works.<sup class=\"fn\">⁷<\/sup><\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>Two things must be said with that.<\/p><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>The family are not the problem.<\/p><\/aside><p>The family are not the problem. They have been doing something kind, repeatedly, for years, because someone they love is in pain. Nobody should read this as an accusation.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>And <strong>do not stop abruptly.<\/strong> Withdrawing accommodation suddenly is associated with significant distress and sometimes anger.<sup class=\"fn\">⁷<\/sup> This is negotiated in advance, gradually, with the person themselves — ideally with a therapist. The conversation is <em>what could we change first, together<\/em>, not a family deciding to stop overnight.<\/p><\/div><\/aside><p>On the evidence: reducing accommodation is consistently associated with better outcomes, but studies have not cleanly established that it <em>causes<\/em> them. It’s a strong association and a sensible target, not a proven mechanism.<\/p>"}, {"t": "It’s the timing, not the hours", "g": "What actually helps", "k": "", "w": 234, "h": "<p>This one surprised me, and it’s actionable.<\/p><p>People with OCD have <strong>measurably delayed body clocks.<\/strong> Compared with controls, they show later mid-sleep timing, higher rates of delayed sleep-wake phase disorder, and greater eveningness — and this shows up not just on questionnaires but on actigraphy and on melatonin timing.<sup class=\"fn\">⁹<\/sup> In treatment settings, later bedtimes are associated with more severe symptoms.<sup class=\"fn\">¹⁰<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The finding that matters: there was no relationship between OCD and total sleep time or sleep quality.<\/p><\/aside><p>The finding that matters: <strong>there was no relationship between OCD and total sleep time or sleep quality.<\/strong> It was the <em>timing<\/em> that mattered — and insomnia symptoms appeared to be the route through which a delayed clock translated into worse OCD.<sup class=\"fn\">⁹<\/sup><\/p><p>Which makes the intervention the same one as Chapter 16’s, doing a different job:<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><ul>\n<li><strong>Morning light<\/strong>, close to waking. Outside if you can, a 10,000-lux box if you can’t.<\/li>\n<li><strong>Consistent wake time<\/strong>, including weekends. This anchors the clock more than bedtime does.<\/li>\n<li><strong>Dim the lights in the evening<\/strong>, and get off the screen — which for this condition also removes the googling.<\/li>\n<li><strong>Melatonin at a low, physiologic dose<\/strong> if you want to shift the clock rather than sedate yourself — worth discussing with a doctor.<\/li>\n<\/ul><\/div><\/aside><p>This is correlational research, so a delayed clock hasn’t been proven to <em>cause<\/em> worse symptoms. But the association is robust across several measurement methods, morning light costs nothing, and it improves the capacity you need for everything else in the chapter.<\/p>"}, {"t": "Supplements", "g": "What actually helps", "k": "", "w": 231, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>There is no nutrient with good trial support for OCD.<\/p><\/aside><p>I’ll be straight: this is the thinnest supplement evidence of any chapter in this book. There is no nutrient with good trial support for OCD. What follows is honest about that.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>five randomised trials<\/b><span>found no significant effect on any dimension of OCD symptoms<\/span><\/div><div class=\"bx-body\"><p><strong>N-acetylcysteine (NAC)<\/strong> is the most studied, and the results are mixed. One meta-analysis of five randomised trials — 102 people on NAC, 100 on placebo — found <strong>no significant effect on any dimension of OCD symptoms<\/strong>, and described the trials as underpowered.<sup class=\"fn\">¹¹<\/sup> A later analysis of six trials found a <strong>borderline benefit at five to eight weeks<\/strong> and nothing at shorter or longer durations.<sup class=\"fn\">¹²<\/sup> Both found it well tolerated.<\/p><\/div><\/aside><p>The rationale is glutamate, which is implicated in OCD, and NAC is cheap and safe. A defined two-to-three month trial is reasonable. Expecting much of it isn’t.<\/p><p><strong>Inositol<\/strong> has one small positive trial from the 1990s and very little since. Thin.<\/p><p><strong class=\"num\">Magnesium, omega-3 and vitamin D<\/strong> are general support rather than OCD treatments, and should be treated as such — worth correcting a deficiency, not worth expecting them to touch the loop.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>40–60%<\/b><span>of people with OCD don’t respond adequately to first-line medication<\/span><\/div><div class=\"bx-body\"><p>Why this section is so thin matters: around <strong>40–60% of people with OCD don’t respond adequately to first-line medication<\/strong>, and that is what drives the search for alternatives.<sup class=\"fn\">¹²<\/sup> The honest answer is that the alternatives currently on offer are weak — which makes the therapy above more important, not less.<\/p><\/div><\/aside>"}, {"t": "What makes it worse", "g": "What actually helps", "k": "worse", "w": 147, "h": "<p>Read this as what your particular system is sensitive to.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>This is the big one, and it’s the hardest to give up because it works every time for twenty minutes.<\/p><\/aside><p><strong>Reassurance<\/strong> — from people, from Google, from yourself. This is the big one, and it’s the hardest to give up because it works every time for twenty minutes.<\/p><p><strong>Late nights and a drifting body clock<\/strong>, for the reasons above.<\/p><p><strong>Alcohol.<\/strong> Quietens it in the evening, and next-day anxiety makes the loop louder.<\/p><p><strong>Stress and major life change<\/strong> — new job, new baby, bereavement, moving. Symptoms very often flare here, and it isn’t a relapse into illness so much as a system under load reaching for its familiar strategy.<\/p><p><strong>Unstructured time.<\/strong> An empty afternoon is where the loop expands to fill the space.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>And the loop worth naming out loud:<\/strong> the condition generates the exact behaviour that feeds it. You’re not failing to resist something obvious. You’re being handed relief every single time you comply.<\/p><\/div><\/aside>"}, {"t": "What to ask to be tested for", "g": "What actually helps", "k": "tests", "w": 90, "h": "<p>The panel from Chapter 13 applies. Two things matter especially here:<\/p><aside class=\"bx bx-steps\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6h11M9 12h11M9 18h11\"/><circle cx=\"4.5\" cy=\"6\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"12\" r=\"1.2\"/><circle cx=\"4.5\" cy=\"18\" r=\"1.2\"/><\/svg><span>Your checklist<\/span><\/div><div class=\"bx-body\"><ul>\n<li><strong>Full thyroid panel<\/strong> — an <em>overactive<\/em> thyroid produces agitation, intrusive worry and restlessness that can amplify all of this, and it’s a cheap test.<\/li>\n<li><strong class=\"num\">Ferritin, B12 and vitamin D<\/strong> — not causes of OCD, but depletion lowers the capacity you need for the therapy above.<\/li>\n<\/ul><\/div><\/aside><p>And if your work or home involves exposure to metals — welding, foundry, firing ranges, pre-1978 renovation, well water — that isn’t on any psychiatric panel and Chapter 7 explains what to do about it.<\/p>"}, {"t": "Medication and therapy", "g": "What actually helps", "k": "", "w": 106, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Medication helps a great many people here and nothing in this chapter argues against it.<\/p><\/aside><p>Medication helps a great many people here and nothing in this chapter argues against it. If yours is working, keep taking it.<\/p><p>Two points. <strong>Therapy outperformed medication in the trials above<\/strong>, and combining the two wasn’t better than therapy alone — so if you have only ever been offered a prescription, you have not been offered the best-evidenced treatment. And OCD is generally treated differently from depression with the same medications, so if you were given a standard antidepressant approach and it did little, that’s worth raising specifically.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>Any change is a conversation with your prescriber, never something you do after reading a chapter.<\/p><\/div><\/aside>"}, {"t": "Relapsing", "g": "What actually helps", "k": "", "w": 146, "h": "<p>You’ll have a stretch where it comes back, usually under stress, and it will feel like starting over. Some things specific to this one:<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The theme changing is not a new illness.<\/p><\/aside><p><strong>The theme changing is not a new illness.<\/strong> People often panic when the content shifts — contamination becomes harm, harm becomes relationship. That’s the same mechanism finding a new target, which means the same response works. What you learned still applies.<\/p><p><strong>Check your sleep timing first<\/strong>, before concluding anything psychological. A fortnight of late nights will do this.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Look for the compulsion<\/h4><div class=\"bx-body\"><p><strong>Look for the compulsion that crept back in.<\/strong> Almost always something small and reasonable-looking — one bit of checking, one question you started asking again.<\/p><\/div><\/aside><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>And what you achieved before was real.<\/strong> You did not get better because the loop went quiet on its own. You got better because you stopped answering, and you can do that again from wherever you are now.<\/p><\/div><\/aside>"}, {"t": "You were never what the thought said", "g": "What actually helps", "k": "", "w": 205, "h": "<p>If you’ve recognised yourself here, hear this properly, because you have probably never let anyone say it to you.<\/p><p>The thought was not a message. It was not a warning, a confession, or a glimpse of some hidden truth about who you are. It was the same kind of mental noise that ninety-four out of a hundred people had last month and forgot by lunchtime. The only difference is that yours landed somewhere you couldn’t ignore, and you did the most natural thing in the world — you tried to make sure.<\/p><p>Everything since has been you trying to be safe, and to keep other people safe, using the only tool available. That isn’t illness of character. It’s a decent person’s conscience caught in a mechanism that turns every attempt at certainty into more doubt.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>You do not need to work out whether the thought is true.<\/p><\/aside><p>You do not need to work out whether the thought is true. That was never the way out. The way out is smaller and stranger than that: you let the question sit there unanswered, and you go and do something else — and each time you do, it gets a little quieter.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p class=\"closing\">You are not the thought. You are the one who was horrified by it.<\/p><\/div><\/aside>"}, {"t": "The research", "g": "What actually helps", "k": "refs", "w": 821, "h": "<ul class='refs'><li><p>Radomsky, A. S., Alcolado, G. M., Abramowitz, J. S., et al. (2014). Part 1 — You can run but you can’t hide: intrusive thoughts on six continents. <em>Journal of Obsessive-Compulsive and Related Disorders, 3<\/em>(3), 269–279. <em>(Structured interviews with 777 non-clinical participants at 15 sites across 13 countries; 93.6% reported at least one unwanted intrusion in the previous three months, across contamination, harm, doubt, religious, sexual, victimisation and miscellaneous categories. Student samples, which limits generalisation.)<\/em><\/p><\/li><li><p>Rachman, S., &amp; de Silva, P. (1978). Abnormal and normal obsessions. <em>Behaviour Research and Therapy, 16<\/em>(4), 233–248. <em>(Eight patients with OCD and 124 non-clinical participants; 99 of the 124 reported thoughts and images similar to the clinical group. Note the counterweight: a later re-analysis found psychologists could distinguish clinical from non-clinical intrusions above chance — Rassin &amp; Muris, 2007 — so clinical intrusions do tend to be more frequent and harder to dismiss.)<\/em><\/p><\/li><li><p>Fullana, M. A., et al. (2009). Obsessions and compulsions in the community: prevalence, interference, help-seeking, developmental stability, and co-occurring psychiatric conditions. <em>American Journal of Psychiatry, 166<\/em>(3), 329–336. <em>(New Zealand birth cohort assessed at age 32; 3% endorsed fears of hurting or killing someone beloved without wanting to, 3% fears of accidental harm, 5% fears of a relative being hurt, in the past year.)<\/em><\/p><\/li><li><p>Reported delay between symptom onset and treatment across several studies. <em>(Estimates range from 9 to 17 years — García-Soriano et al., 2014; Ruscio et al., 2010.)<\/em><\/p><\/li><li><p>Ong, C. W., Clyde, J. W., Bluett, E. J., Levin, M. E., &amp; Twohig, M. P. (2016). Dropout rates in exposure with response prevention for obsessive-compulsive disorder: what do the data really say? <em>Journal of Anxiety Disorders, 40,<\/em> 8–17; and Johnco, C., et al. (2020). A meta-analysis of dropout rates from exposure with response prevention and pharmacological treatment for youth with obsessive compulsive disorder. <em>Depression and Anxiety, 37<\/em>(5), 407–417. <em>(Adult ERP dropout 14.7% across 21 studies and 1,400 participants; youth ERP 10.2%, against 17.3% for pharmacotherapy, 20.6% for active controls and 23.5% for pill placebo. ERP had significantly lower attrition risk than active controls.)<\/em><\/p><\/li><li><p>Meta-analyses of CBT versus serotonin reuptake inhibitors in OCD. <em>(Response: CBT 70%, combined 66%, SRI 49%, placebo 29%, waitlist 13%. Remission: CBT 53%, combined 49%, SRI 24%, placebo 15%. Combination was not superior to CBT alone irrespective of baseline severity. Note that estimates of ERP effect size vary substantially by comparator across meta-analyses, and full remission rates sit around 45–50%.)<\/em><\/p><\/li><li><p>Systematic review and meta-analysis of family accommodation in OCD. <em>(94% of relatives of adults with OCD report accommodating; correlation with symptom severity r = 0.42; accommodation decreases with individual CBT (g = 2.00) and family-focused CBT (g = 1.17). Important limitation: baseline accommodation did not predict pre-to-post change in severity (g = −0.03), so the association is robust while the causal claim is not established. Withdrawing accommodation abruptly is associated with increased distress and sometimes aggressive responses.)<\/em><\/p><\/li><li><p>Study of family accommodation in 238 Scandinavian children with OCD. <em>(Approximately 70% of primary caregivers reported accommodating daily and 98% at least weekly.)<\/em><\/p><\/li><li><p>Cox, R. C., &amp; Olatunji, B. O. (2022). Delayed circadian rhythms and insomnia symptoms in obsessive-compulsive disorder. <em>Journal of Affective Disorders, 318,<\/em> 94–102. <em>(74 adults. Those with OCD showed later mid-sleep timing, higher eveningness and higher rates of delayed sleep-wake phase disorder than controls, with large effect sizes across multiple indicators; insomnia symptoms mediated the relationship between delayed rhythms and OCD symptoms. Notably, there was no association between OCD and total sleep time or sleep quality. Correlational, no physiological measure of circadian phase, and data collected partly during the COVID-19 pandemic.)<\/em> See also Santiago et al. (2025), <em>Journal of Sleep Research<\/em>, a systematic review finding delayed circadian rhythm in OCD across questionnaires, actigraphy and dim-light melatonin onset.<\/p><\/li><li><p>Nota, J. A., et al. Delayed bedtimes are associated with more severe obsessive-compulsive symptoms in intensive residential treatment. <em>Behavior Therapy.<\/em> <em>(Replicating the phase-delay finding in a more severe population, with implications for ERP delivery.)<\/em><\/p><\/li><li><p>Noskova, T., et al. (2019). Augmentation therapy of N-acetylcysteine for OCD: a meta-analysis of double-blind, randomized, placebo-controlled trials. <em>Journal of Obsessive-Compulsive and Related Disorders.<\/em> <em>(Five RCTs, 102 NAC versus 100 placebo. No significant effect on any dimension of OCD symptoms. NAC was well tolerated with no difference in adverse events. The authors describe the included trials as underpowered.)<\/em><\/p><\/li><li><p>Systematic review and meta-analysis of NAC augmentation in moderate to severe OCD (2024). <em>(Six RCTs, 195 patients. A positive result on total Y-BOCS at five to eight weeks (p = 0.05), but no significant difference at durations shorter than five weeks or longer than twelve, and no effect on obsession or compulsion subscales separately. Also notes that approximately 40–60% of patients do not respond adequately to first-line pharmacological treatment.)<\/em><\/p><\/li><\/ul>"}]}, {"n": 22, "t": "One Answer to a Question With Several", "s": "What all of this has been pointing at", "p": 4, "l": [{"t": "Opening", "g": "", "k": "", "w": 99, "h": "<p>If you have read straight through, you have just been given a great deal.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>And underneath all of it, a quiet suggestion that what you were told about your own mind may have been incomplete.<\/p><\/aside><p>Nine conditions. Blood tests you had never heard of. Interventions ranging from a lamp to a diet to a conversation you have been avoiding for eleven years. And underneath all of it, a quiet suggestion that what you were told about your own mind may have been incomplete.<\/p><p>So before you close the book, I want to draw one line through everything, because there is a single finding sitting underneath all nine chapters — and I did not go looking for it. It kept turning up.<\/p>"}, {"t": "The same shape, over and over", "g": "", "k": "", "w": 276, "h": "<p>This is what happened as I worked through the research for each condition.<\/p><p><strong>In depression<\/strong>, a powerful anti-inflammatory drug failed. Across everyone in the trial, it did nothing. But split the group by a cheap blood test measuring inflammation, and the picture reversed: it worked in the inflamed group and did <em>worse than placebo<\/em> in the rest.<\/p><p><strong>In depression again<\/strong>, zinc added to an antidepressant looked modest across the board — and large, specifically, in the people whose antidepressant hadn’t worked.<\/p><p><strong>In ADHD<\/strong>, high-dose EPA improved attention. Mostly in the children who had low EPA to begin with.<\/p><p><strong>In autism<\/strong>, high-dose folinic acid improved language and attention — concentrated in the children carrying a particular antibody, which a blood test can find.<\/p><p><strong>In Alzheimer’s<\/strong>, ketogenic approaches helped cognition. Look closer and the benefit clusters in people who don’t carry the APOE4 gene.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>around 63%<\/b><span>Adding the imaging raised the accuracy of predicting response from around 36%<\/span><\/div><div class=\"bx-body\"><p><strong class=\"num\">And in 2024<\/strong>, researchers at Stanford scanned 801 people with depression and anxiety, sorted them into six groups by brain circuit activity, then randomly assigned them to medication or therapy. The groups predicted who responded to what. Adding the imaging raised the accuracy of predicting response from around 36% to around 63%.<sup class=\"fn\">¹<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>One shape: the average result hides two opposite results, and something measurable tells you in advance which one you are.<\/p><\/aside><p>Different conditions. Different interventions. Different research teams, countries and decades. <strong>One shape: the average result hides two opposite results, and something measurable tells you in advance which one you are.<\/strong><\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img class=\"bx-av\" alt=\"\"><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>It is the finding of this book, and it wasn’t my idea. I assembled it chapter by chapter and watched it appear again and again, until it stopped looking like a series of interesting subgroup analyses and started looking like the actual structure of the thing.<\/p><\/div><\/aside>"}, {"t": "Which means “it didn’t work” was never the whole sentence", "g": "", "k": "", "w": 140, "h": "<p>Sit with what that implies for you personally.<\/p><p>When a treatment fails in a trial, what usually happened is that it helped one group, did nothing for another, and the two cancelled out into a disappointing average. Then that average becomes the guideline, and the guideline becomes what you are offered.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>It was an average, applied to a person, in a system that had no way of knowing which side of the average you were on.<\/p><\/aside><p>So when you were told a medication was your best option and it did little — that was not a verdict on you. It was an average, applied to a person, in a system that had no way of knowing which side of the average you were on.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>And when you concluded, somewhere around the third or fourth attempt, that you were the problem — you drew a reasonable conclusion from the evidence you had. It was simply the wrong conclusion, and there was no way for you to know that.<\/p><\/div><\/aside>"}, {"t": "The man who said this thirty years ago", "g": "", "k": "", "w": 329, "h": "<p>Long before any of those studies, one psychiatrist was making this argument out loud, and taking a great deal of professional heat for it.<\/p><p><strong>Dr. Daniel Amen<\/strong> founded his first clinic in 1989. His starting objection was simple, and it is the one this whole book rests on: <strong>psychiatry is very nearly the only medical specialty that treats an organ without ever looking at it.<\/strong> A cardiologist images the heart. An endocrinologist tests before prescribing. A psychiatrist listens to a description of symptoms, matches it to a category in a manual, and prescribes — for a brain nobody has examined.<\/p><figure class=\"ph\" data-slot=\"ch22-l04\"><\/figure><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>over 250,000 brain scans<\/b><span>the largest database of its kind in the world<\/span><\/div><div class=\"bx-body\"><p>So he started looking. Using SPECT imaging, which measures blood flow and activity rather than structure, he built what is now the largest database of its kind in the world: <strong>over 250,000 brain scans, and by his clinics’ current count approaching 300,000<\/strong>, from patients in 155 countries, accumulated across more than thirty-five years.<sup class=\"fn\">²<\/sup> <sup class=\"fn\">³<\/sup><\/p><\/div><\/aside><p>What makes it a research database rather than a filing cabinet is that a great many of those patients were scanned <strong>before and after treatment.<\/strong> Which allows a question most psychiatric practice cannot ask: <em>when this person got better, what changed in the brain — and what did we do that changed it?<\/em><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>People carrying one diagnosis did not share one brain pattern.<\/p><\/aside><p><strong>What he found is the thesis of this book.<\/strong> People carrying one diagnosis did not share one brain pattern. They fell into groups. In some, a region was working too hard; in others, the same region was underactive. Two people, same label, same prescription, opposite problems — which explains something otherwise baffling, that a treatment helping one person can make another person worse.<\/p><p>Working from those patterns, he described <strong>seven types of ADD, and seven types of anxiety and depression<\/strong>, each with its own combination of symptoms and its own pattern of over- or under-activity in specific brain regions.<sup class=\"fn\">²<\/sup> <sup class=\"fn\">⁴<\/sup> And crucially, each with its own approach — because if the underlying problem is opposite, the response should be too.<\/p>"}, {"t": "The part I find most worth respecting", "g": "", "k": "", "w": 273, "h": "<p>A brain scan costs money that most people do not have.<\/p><p>Rather than leave his findings available only to people who could pay for imaging, he did something more useful: he worked backwards. Having spent decades matching symptom patterns to activity patterns across hundreds of thousands of scans, <strong>he built questionnaires that let a person identify their likely type from their symptoms alone<\/strong> — no scan required.<sup class=\"fn\">⁵<\/sup><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Whatever anyone thinks of the imaging, the instinct behind that is the right one.<\/p><\/aside><p>I don’t think that’s a small thing. It takes a finding that would otherwise belong to a small number of well-off patients and makes it available to anyone with ten minutes. Whatever anyone thinks of the imaging, the instinct behind that is the right one.<\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img class=\"bx-av\" alt=\"\"><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>And his framework does not stop at description. For each type he teaches specific, targeted approaches — nutritional, supplemental and behavioural — matched to whether a given brain region needs calming or activating. <strong>That material is taught in his certification programme, which I completed<\/strong>, and it is his to teach rather than mine to reprint here. What I will say is that working through it is what convinced me of the argument I have made throughout this book: that the question was never <em>which antidepressant next<\/em>, but <em>what is actually happening, and in whom<\/em>.<\/p><\/div><\/aside><p>His methods have been argued about in his profession for as long as he has been using them. What has not been argued about, in the end, is the argument. Stanford’s biotype work, the inflammation findings, the genes that predict who responds to what — all of it points where he was pointing in the 1990s, when it was a far less comfortable thing to say.<\/p>"}, {"t": "What to do with all of this", "g": "", "k": "", "w": 222, "h": "<p>You cannot act on twenty-two chapters. So here is what I would take, if I were you and I were tired.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>A single sheet of paper handed to a doctor is the highest-yield ten minutes in this book.<\/p><\/aside><p><strong>Get the blood tests.<\/strong> Whichever chapter was yours, it listed them. They are ordinary, they are cheap, and almost nobody is offered them. A single sheet of paper handed to a doctor is the highest-yield ten minutes in this book.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Pick three things, not thirty.<\/h4><div class=\"bx-body\"><p><strong>Pick three things, not thirty.<\/strong> From the chapter that sounded like you, take the three that ask least of you. In most chapters those are the same three: <strong>get outside in the morning, protect your sleep, and eat protein before you eat anything else.<\/strong> Give them six weeks before you judge them.<\/p><\/div><\/aside><p><strong>Work out which sub-group you are.<\/strong> Not with certainty — nobody has that. But the questions run through every chapter: does fatigue dominate more than sadness? Do you sleep more or less? Did this start after an illness? Is it worse in the week before your period? Did it begin when the light changed? Those answers point somewhere, and pointing somewhere is the whole game.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Then tell someone.<\/h4><div class=\"bx-body\"><p><strong>Then tell someone.<\/strong> A doctor, a partner, a friend who will ask you about it in a month. This book cannot do the part where a person is known by another person, and Chapter 11 explained why that part is not optional.<\/p><\/div><\/aside>"}, {"t": "What I hope you take", "g": "", "k": "", "w": 154, "h": "<p>You picked this up because something was not working, and because you had begun to suspect the problem was you.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>What I hope you have instead is a different sentence: you were given one answer to a question that has several.<\/p><\/aside><p>What I hope you have instead is a different sentence: <strong>you were given one answer to a question that has several.<\/strong><\/p><p>Which is not the same as being told there is nothing wrong. There may be a great deal wrong, and some of it may take years. It is the difference between a locked door and a door where nobody has tried the other keys — and every chapter of this book is a key that exists, that is cheap, and that most people are never handed.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You are not treatment-resistant. You are not lazy, or weak, or too much, or beyond help.<\/p><p>You were averaged.<\/p><\/div><\/aside><p class=\"closing\">And you are not an average. You are a specific person, with a specific body, carrying a specific history — and the research, finally, is catching up to that.<\/p>"}, {"t": "The research", "g": "", "k": "refs", "w": 312, "h": "<ul class='refs'><li><p>Tozzi, L., Zhang, X., Pines, A., et al. (2024). Personalized brain circuit scores identify clinically distinct biotypes in depression and anxiety. <em>Nature Medicine, 30,<\/em> 2076–2087. <em>(801 treatment-free patients scanned; 250 randomised to pharmacotherapy or behavioural therapy. Six biotypes identified, differing in treatment response, with imaging raising predictive accuracy from approximately 36% to 63%. The authors have a commercial interest in the imaging system used, and independent commentators regard the findings as promising but requiring replication before clinical use.)<\/em><\/p><\/li><li><p>Amen Clinics reporting on the SPECT database and the seven-type frameworks. <em>(Over 30 years of brain-imaging work; the clinics’ published figures range from over 250,000 scans in earlier materials to approaching 300,000 currently, from patients in 155 countries. The seven types of ADD/ADHD were first outlined by Amen in a 1998 paper and developed in his subsequent books; seven types of anxiety and depression are described in parallel. Note that these are clinic-reported figures.)<\/em><\/p><\/li><li><p>Amen, D. G., et al. (2017). Classification of depression, cognitive disorders, and co-morbid depression and cognitive disorders with perfusion SPECT neuroimaging. <em>Journal of Alzheimer’s Disease, 57<\/em>(1), 253–269. <em>(Peer-reviewed study of 4,541 patients; SPECT distinguished depression from cognitive disorders with 86% accuracy. Context for readers: the use of SPECT to diagnose psychiatric conditions is not endorsed by the American Psychiatric Association, the National Institute of Mental Health, or the Society of Nuclear Medicine and Molecular Imaging, and the approach remains contested within the profession.)<\/em><\/p><\/li><li><p>Amen Clinics descriptions of the seven types of anxiety and depression, each associated with distinct symptom clusters and patterns of activity in specific brain regions — for example heightened basal ganglia activity in the pure anxiety type.<\/p><\/li><li><p>Amen Clinics and Amen University symptom questionnaires. <em>(Developed from the symptom-to-activity patterns observed across the scan database, allowing type identification without imaging. Available without cost.)<\/em><\/p><\/li><\/ul>"}]}], "key": "s2s-anx", "course": {"title": "Survival to Safety: Anxiety & OCD", "hero": "Survival to Safety<span>Anxiety &amp; OCD<\/span>", "kicker": "A root-cause guide to understanding and changing your mental health"}}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const CH = D.chapters;
const WPM = 230;
const LOGO = document.querySelector('.brand img').src;
/* Picture spots: add a picture by putting its address next to the spot's name, e.g. "ch06-cover": "https://…/gut.jpg" */
const IMAGES = {
  "home-banner": "images/home-banner.jpg",
  "ch01-cover": "images/ch01-cover.jpg", "ch01-l04": "images/ch01-l04.jpg",
  "ch02-cover": "images/ch02-cover.jpg", "ch02-l04": "images/ch02-l04.jpg", "ch02-l07": "images/ch02-l07.jpg",
  "ch03-cover": "images/ch03-cover.jpg",
  "ch04-cover": "images/ch04-cover.jpg", "ch04-l02": "images/ch04-l02.jpg", "ch04-l05": "images/ch04-l05.jpg",
  "ch05-cover": "images/ch05-cover.jpg", "ch05-l02": "images/ch05-l02.jpg", "ch05-l03": "images/ch05-l03.jpg", "ch05-l04": "images/ch05-l04.jpg",
  "ch06-cover": "images/ch06-cover.jpg", "ch06-l03": "images/ch06-l03.jpg", "ch06-l04": "images/ch06-l04.jpg", "ch06-l07": "images/ch06-l07.jpg", "ch06-l08": "images/ch06-l08.jpg", "ch06-l09": "images/ch06-l09.jpg", "ch06-l11": "images/ch06-l11.jpg",
  "ch07-cover": "images/ch07-cover.jpg", "ch07-l02": "images/ch07-l02.jpg", "ch07-l03": "images/ch07-l03.jpg", "ch07-l04": "images/ch07-l04.jpg", "ch07-l05": "images/ch07-l05.jpg", "ch07-l06": "images/ch07-l06.jpg", "ch07-l07": "images/ch07-l07.jpg",
  "ch08-cover": "images/ch08-cover.jpg", "ch08-l08": "images/ch08-l08.jpg", "ch08-l13": "images/ch08-l13.jpg",
  "ch09-cover": "images/ch09-cover.jpg", "ch09-l06": "images/ch09-l06.jpg", "ch09-l09": "images/ch09-l09.jpg",
  "ch10-cover": "images/ch10-cover.jpg", "ch10-l03": "images/ch10-l03.jpg", "ch10-l04": "images/ch10-l04.jpg", "ch10-l08": "images/ch10-l08.jpg",
  "ch11-cover": "images/ch11-cover.jpg", "ch11-l08": "images/ch11-l08.jpg",
  "ch12-cover": "images/ch12-cover.jpg", "ch12-l03": "images/ch12-l03.jpg", "ch12-l06": "images/ch12-l06.jpg",
  "ch13-cover": "images/ch13-cover.jpg", "ch13-l03": "images/ch13-l03.jpg", "ch13-l04": "images/ch13-l04.jpg", "ch13-l06": "images/ch13-l06.jpg", "ch13-l07": "images/ch13-l07.jpg", "ch13-l08": "images/ch13-l08.jpg", "ch13-l09": "images/ch13-l09.jpg", "ch13-l10": "images/ch13-l10.jpg", "ch13-l12": "images/ch13-l12.jpg",
  "ch14-cover": "images/ch14-cover.jpg", "ch14-l04": "images/ch14-l04.jpg", "ch14-l05": "images/ch14-l05.jpg", "ch14-l08": "images/ch14-l08.jpg", "ch14-l16": "images/ch14-l16.jpg", "ch14-l18": "images/ch14-l18.jpg",
  "ch15-cover": "images/ch15-cover.jpg", "ch15-l04": "images/ch15-l04.jpg", "ch15-l07": "images/ch15-l07.jpg", "ch15-l12": "images/ch15-l12.jpg", "ch15-l13": "images/ch15-l13.jpg", "ch15-l15": "images/ch15-l15.jpg",
  "ch16-cover": "images/ch16-cover.jpg", "ch16-l03": "images/ch16-l03.jpg", "ch16-l05": "images/ch16-l05.jpg", "ch16-l06": "images/ch16-l06.jpg", "ch16-l08": "images/ch16-l08.jpg", "ch16-l09": "images/ch16-l09.jpg", "ch16-l12": "images/ch16-l12.jpg",
  "ch17-cover": "images/ch17-cover.jpg", "ch17-l09": "images/ch17-l09.jpg",
  "ch18-cover": "images/ch18-cover.jpg", "ch18-l08": "images/ch18-l08.jpg", "ch18-l11": "images/ch18-l11.jpg", "ch18-l18": "images/ch18-l18.jpg",
  "ch19-cover": "images/ch19-cover.jpg", "ch19-l03": "images/ch19-l03.jpg", "ch19-l18": "images/ch19-l18.jpg",
  "ch20-cover": "images/ch20-cover.jpg", "ch20-l04": "images/ch20-l04.jpg",
  "ch21-cover": "images/ch21-cover.jpg", "ch21-l02": "images/ch21-l02.jpg", "ch21-l05": "images/ch21-l05.jpg", "ch21-l06": "images/ch21-l06.jpg", "ch21-l07": "images/ch21-l07.jpg",
  "ch22-cover": "images/ch22-cover.jpg", "ch22-l04": "images/ch22-l04.jpg"
};
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>';
const cov = c => 'ch' + String(c.n).padStart(2,'0') + '-cover';
function fig(slot, label, cls){
  if (IMAGES[slot]) return `<figure class="ph ${cls||''}"><img src="${IMAGES[slot]}" alt="${esc(label)}"></figure>`;
  return `<figure class="ph empty ${cls||''}" data-filled="1"><div class="ph-in">${ICON}<b>${esc(label)}</b><small>Image spot · ${slot}</small></div></figure>`;
}
function fillSpots(c){
  document.querySelectorAll('#prose img.bx-av').forEach(i => i.src = LOGO);
  document.querySelectorAll('#prose figure.ph[data-slot]').forEach(f => {
    const s = f.dataset.slot, m = s.match(/l(\d+)$/);
    f.outerHTML = fig(s, 'Lesson ' + (+m[1]) + ' picture');
  });
}

const mins = w => Math.max(1, Math.round(w / WPM));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let done = new Set(store.get(D.key+'-done', []));
let open = new Set(store.get(D.key+'-open', []));
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id = (c, i) => c.n + '-' + i;
const total = CH.reduce((a, c) => a + c.l.length, 0);
const chDone = c => c.l.filter((_, i) => done.has(id(c, i))).length;
const findCh = n => CH.find(c => c.n === n);
const flat = []; CH.forEach(c => c.l.forEach((l, i) => flat.push([c, i])));
const KIND = {tests:'Take to your appointment', worse:'Watch for'};

function saveDone(){ store.set(D.key+'-done', [...done]); }
function progress(){
  const n = done.size;
  document.getElementById('fill').style.width = (n / total * 100) + '%';
  document.getElementById('count').textContent = n + ' of ' + total + ' lessons complete';
}

/* ---------- navigation rail ---------- */
let route = {v:'home'};
function renderNav(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let h = '';
  D.parts.forEach((p, pi) => {
    const chs = CH.filter(c => c.p === pi);
    let block = '';
    chs.forEach(c => {
      const matches = c.l.map((l, i) => i).filter(i => !q || c.l[i].t.toLowerCase().includes(q) || c.t.toLowerCase().includes(q));
      if (q && !matches.length) return;
      const isOpen = q ? true : open.has(c.n) || route.c === c.n;
      const cd = chDone(c);
      block += `<button class="nav-ch ${route.c===c.n?'on':''} ${cd===c.l.length?'done':''}" data-ch="${c.n}" aria-expanded="${isOpen}">
        <span class="no">${String(c.n).padStart(2,'0')}</span><span>${esc(c.t)}</span><span class="chev">▶</span></button>`;
      if (isOpen){
        block += '<ul class="nav-lessons">';
        let g = '';
        matches.forEach(i => {
          const l = c.l[i];
          if (l.g && l.g !== g){ g = l.g; block += `<li class="nav-group">${esc(g)}</li>`; }
          const on = route.c === c.n && route.i === i;
          block += `<li><button class="nav-l ${on?'on':''} ${done.has(id(c,i))?'done':''}" data-go="${c.n}-${i}"><span class="dot"></span><span>${esc(l.t)}</span></button></li>`;
        });
        block += '</ul>';
      }
    });
    if (block) h += `<div class="nav-part">${p[0]}<em>${esc(p[1])}</em></div>` + block;
  });
  document.getElementById('nav').innerHTML = h || '<p class="empty">No lessons match that search.</p>';
}

/* ---------- views ---------- */
function home(){
  const words = flat.reduce((a, [c, i]) => a + c.l[i].w, 0);
  const last = store.get(D.key+'-last', null);
  const hrs = Math.max(0.5, Math.round(words/WPM/30)/2);
  let resume = '';
  if (last){ const [cn, li] = last.split('-').map(Number); const c = findCh(cn); if (c && c.l[li]) resume = `<button class="btn" data-go="${last}">Continue: ${esc(c.l[li].t)} →</button>`; }
  if (!resume) resume = `<button class="btn" data-go="${CH[0].n}-0">Begin with Chapter ${CH[0].n} →</button>`;
  let h = `<div class="col home"><section class="home-hero">
    <div class="home-brand"><img class="home-mark" src="${LOGO}" alt="Mind Body Functional Health logo"><span>Mind Body<i>Functional Health</i></span></div>
    <div class="eyebrow"><span>${D.course.kicker}</span></div>
    <h1 class="home-title">${D.course.hero}</h1>
    <div class="stats"><span><b>${CH.length}</b>chapters</span><span><b>${total}</b>lessons</span><span><b>${hrs}</b>${hrs===1?"hour":"hours"} of reading</span><span><b>${done.size}</b>lessons done</span></div>
    <div class="ch-actions" style="margin:6px 0 0">${resume}</div>
    <p class="meta">Go at your own pace. Your progress is saved in this browser.</p>
    ${fig('home-banner', 'Course banner', 'home')}
  </section>`;
  return h + '</div>';
}

function chapter(c){
  const w = c.l.reduce((a, l) => a + l.w, 0);
  const firstOpen = c.l.findIndex((_, i) => !done.has(id(c, i)));
  const start = firstOpen < 0 ? 0 : firstOpen;
  let h = `<div class="col"><div class="eyebrow"><b>${D.parts[c.p][0]}</b><span>${esc(D.parts[c.p][1])}</span></div>
    <div class="ch-hero"><div class="ch-num">${String(c.n).padStart(2,'0')}</div><h1 class="ch-title">${esc(c.t)}</h1>${c.s?`<p class="ch-sub">${esc(c.s)}</p>`:'<span></span>'}</div>
    ${fig(cov(c), 'Chapter ' + c.n + ' cover', 'cover wide')}
    <div class="ch-actions"><button class="btn" data-go="${c.n}-${start}">${firstOpen > 0 ? 'Continue chapter' : 'Begin chapter'} →</button>
    <span class="meta">${c.l.length} lessons · about ${mins(w)} minutes · ${chDone(c)} complete</span></div><ul class="lesson-list">`;
  let g = '';
  c.l.forEach((l, i) => {
    if (l.g && l.g !== g){ g = l.g; h += `<li class="grp">${esc(g)}</li>`; }
    h += `<li><button data-go="${c.n}-${i}" class="${done.has(id(c,i))?'done':''}"><span class="ln">${done.has(id(c,i))?'✓':String(i+1).padStart(2,'0')}</span>
      <span class="lt">${esc(l.t)}${KIND[l.k]?`<span class="tag ${l.k}">${KIND[l.k]}</span>`:''}</span><span class="lm">${mins(l.w)} min</span></button></li>`;
  });
  return h + '</ul></div>';
}

function lesson(c, i){
  const l = c.l[i];
  const k = flat.findIndex(([cc, ii]) => cc === c && ii === i);
  const nx = flat[k + 1], pv = flat[k - 1];
  let banner = '';
  if (l.k === 'tests') banner = `<div class="banner tests"><div><b>Take this to your appointment</b>Copy the list below to share with your doctor</div><button class="btn small" id="copyBtn" type="button">Copy list</button></div>`;
  if (l.k === 'worse') banner = `<div class="banner worse"><div><b>Watch for</b>What makes it worse</div></div>`;
  const isDone = done.has(id(c, i));
  let h = `<div class="col lesson-${l.k||'std'}"><div class="eyebrow"><b>Chapter ${c.n}</b><span>${esc(c.t)}</span>${l.g?`<span>· ${esc(l.g)}</span>`:''}</div>
    <h1 class="lesson-title">${esc(l.t)}</h1>
    <div class="meta">Lesson ${i+1} of ${c.l.length} · ${mins(l.w)} min read</div>${banner}
    <article class="prose ${i===0?'opening':''}" id="prose">${l.h}</article>
    <div class="foot"><div class="foot-row">
      <button class="check" id="doneBtn" type="button" aria-pressed="${isDone}"><span class="box"></span>${isDone?'Completed':'Mark lesson complete'}</button>
      ${pv?`<button class="btn ghost small" data-go="${pv[0].n}-${pv[1]}">← Previous</button>`:''}</div>
      ${nx?`<button class="next" data-go="${nx[0].n}-${nx[1]}" data-complete="1"><small>${nx[0]===c?'Up next':'Next chapter · Chapter '+nx[0].n}</small><span>${esc(nx[0]===c?nx[0].l[nx[1]].t:nx[0].t)} →</span></button>`
         :`<button class="next" data-home="1" data-complete="1"><small>You've reached the end</small><span>Back to the course overview →</span></button>`}
    </div></div>`;
  return h;
}

function render(){
  const v = document.getElementById('view');
  let title = D.course.title;
  if (route.v === 'home') v.innerHTML = home();
  else if (route.v === 'ch'){ const c = findCh(route.c); v.innerHTML = chapter(c); title = 'Ch ' + c.n + ' · ' + c.t; }
  else { const c = findCh(route.c); v.innerHTML = lesson(c, route.i); fillSpots(c); title = c.l[route.i].t; store.set(D.key+'-last', id(c, route.i)); }
  document.getElementById('topTitle').textContent = title;
  renderNav(); progress();
  const cur = document.querySelector('.nav-l.on, .nav-ch.on');
  if (cur) cur.scrollIntoView({block:'nearest'});
  bindLesson();
}

function bindLesson(){
  const b = document.getElementById('doneBtn');
  if (b) b.onclick = () => {
    const k = id(findCh(route.c), route.i);
    done.has(k) ? done.delete(k) : done.add(k); saveDone();
    b.setAttribute('aria-pressed', done.has(k)); b.lastChild.textContent = done.has(k) ? 'Completed' : 'Mark lesson complete';
    renderNav(); progress();
  };
  const cp = document.getElementById('copyBtn');
  if (cp) cp.onclick = () => {
    const c = findCh(route.c), text = c.l[route.i].t + '\n\n' + document.getElementById('prose').innerText;
    const ok = () => { cp.textContent = 'Copied'; setTimeout(() => cp.textContent = 'Copy list', 1800); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('prose')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent = 'Selected — press copy'; };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch(e){ fallback(); }
  };
}

function go(r, push){
  route = r;
  const hash = r.v === 'home' ? 'home' : r.v === 'ch' ? 'c' + r.c : 'c' + r.c + '-' + r.i;
  if (push !== false && location.hash.slice(1) !== hash){ try{ history.pushState(null, '', '#' + hash); }catch(e){} }
  document.body.classList.remove('menu');
  render(); window.scrollTo(0, 0);
}
function parse(){
  const h = location.hash.slice(1); let m;
  if ((m = h.match(/^c(\d+)-(\d+)$/)) && findCh(+m[1]) && findCh(+m[1]).l[+m[2]]) return {v:'l', c:+m[1], i:+m[2]};
  if ((m = h.match(/^c(\d+)$/)) && findCh(+m[1])) return {v:'ch', c:+m[1]};
  return {v:'home'};
}
window.addEventListener('popstate', () => go(parse(), false));

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-ch],[data-home],#brand');
  if (!t) return;
  if (t.id === 'brand' || t.dataset.home){ if (t.dataset.complete) markCurrent(); return go({v:'home'}); }
  if (t.dataset.go){
    if (t.dataset.complete) markCurrent();
    const [c, i] = t.dataset.go.split('-').map(Number); return go({v:'l', c, i});
  }
  if (t.dataset.ch){
    const n = +t.dataset.ch;
    if (t.classList.contains('nav-ch')){
      if (open.has(n) && route.c !== n) open.delete(n); else open.add(n);
      store.set(D.key+'-open', [...open]);
      if (route.c !== n) return go({v:'ch', c:n});
      return renderNav();
    }
    return go({v:'ch', c:n});
  }
});
function markCurrent(){ if (route.v === 'l'){ done.add(id(findCh(route.c), route.i)); saveDone(); } }
document.getElementById('search').addEventListener('input', renderNav);
document.getElementById('menuBtn').onclick = () => document.body.classList.toggle('menu');
document.getElementById('scrim').onclick = () => document.body.classList.remove('menu');

go(parse(), false);
})();
</script>

</body>
</html>
