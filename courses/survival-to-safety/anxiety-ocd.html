tch is the first four to six weeks, and knowing that in advance changes what a bad week means.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>46%<\/b><span>of the deciders had succeeded. Among those who merely wanted it, 4%.<\/span><\/div><div class=\"bx-body\"><p><strong>Deciding is different from wanting.<\/strong> Researchers followed one group who made an explicit commitment to change, and another group who wanted exactly the same change but never formalised it. Six months later: <strong>46% of the deciders had succeeded. Among those who merely wanted it, 4%.<\/strong><sup class=\"fn\">³<\/sup><\/p><\/div><\/aside><p>More than a tenfold difference — between choosing something and hoping for it.<\/p><p><strong>And say what you’ll do, not what you’ll stop.<\/strong> People whose goals were framed as <em>adding<\/em> something — eat more vegetables, walk each morning — succeeded <strong class=\"num\">59%<\/strong> of the time. People whose goals were framed as <em>stopping<\/em> something succeeded <strong class=\"num\">47%<\/strong>.<sup class=\"fn\">⁴<\/sup> Twelve points, from wording alone.<\/p>"}, {"t": "Finding your roots", "g": "", "k": "", "w": 172, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Before choosing anything, work out where your own loop is strongest.<\/p><\/aside><p>Before choosing anything, work out where your own loop is strongest. Sit with these:<\/p><div class=\"points\"><div class=\"point\"><h4>Your history.<\/h4><p>Do the patterns in Chapter 3 sound like your childhood — becoming small, becoming useful, needing nothing? Do you recognise yourself in shutdown more than in anxiety?<\/p><\/div><div class=\"point\"><h4>Your gut.<\/h4><p>Digestive trouble, bloating, food that doesn’t sit right? Do certain foods reliably precede a bad mental day?<\/p><\/div><div class=\"point\"><h4>Your labs and hormones.<\/h4><p>Have you actually been tested properly — full thyroid panel, B12 with functional markers, vitamin D, ferritin with an inflammatory marker? Do your symptoms track with your cycle, or did they arrive in your forties?<\/p><\/div><div class=\"point\"><h4>Your blood sugar.<\/h4><p>Do you get anxious, shaky, or irrationally irritable a few hours after eating? Does it lift when you eat?<\/p><\/div><div class=\"point\"><h4>Your sleep.<\/h4><p>Are you getting genuine deep sleep, or six broken hours you’ve stopped questioning?<\/p><\/div><div class=\"point\"><h4>Your connection.<\/h4><p>How many people actually know how you’re doing? When did you last do something with other people that you enjoyed?<\/p><\/div><\/div><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>Whichever two or three of those produced the strongest reaction — that’s where your work is. Go back to those chapters. Ignore the rest for now.<\/p><\/div><\/aside>"}, {"t": "An order that works", "g": "", "k": "", "w": 173, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>The sequence matters more than most people are told, and it’s the reason so many attempts stall.<\/p><\/aside><p>The sequence matters more than most people are told, and it’s the reason so many attempts stall.<\/p><div class=\"points\"><div class=\"point\"><h4>Start with your nervous system.<\/h4><p>Not because it’s the deepest issue, but because a system stuck in survival can’t sustain anything else. It’s hard to change how you eat, keep a new routine, or face old memories while your body believes it’s in danger. One regulation practice, daily, small — that’s the foundation everything else rests on.<\/p><\/div><div class=\"point\"><h4>Then the physical basics.<\/h4><p>Sleep and blood sugar first, because they’re fast and they change how everything else feels. Then food. Then movement, at whatever size you can actually repeat.<\/p><\/div><div class=\"point\"><h4>Then the deeper work.<\/h4><p>Trauma, old patterns, the beliefs underneath. This comes later on purpose — it goes better from a steadier baseline, and attempting it while completely dysregulated is how people get flooded and stop.<\/p><\/div><\/div><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>And connection and meaning run through all of it.<\/strong> Not a final step. The thing that makes the rest survivable.<\/p><\/div><\/aside><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>If that still feels like too much: pick one thing from the first section. Do it for two weeks. Add nothing.<\/p><\/div><\/aside>"}, {"t": "You’ll do better with someone", "g": "", "k": "", "w": 296, "h": "<p>There’s a finding here worth taking seriously, and it isn’t the one that sells programmes.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>155 trials<\/b><span>compared how people did across every format of psychological support<\/span><\/div><div class=\"bx-body\"><p>Researchers compared how people did across every format of psychological support — one-to-one, group, telephone, and guided self-help — across 155 trials and roughly eleven thousand people. <strong>There was no meaningful difference between them.<\/strong> What separated all of those from going it entirely alone wasn’t the format. It was the presence of another human being.<sup class=\"fn\">⁵<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>It’s to make sure someone is in it with you.<\/p><\/aside><p>Doing this by yourself still works. Self-directed change produces real, measurable effects — just consistently smaller ones.<sup class=\"fn\">⁶<\/sup> But the honest recommendation isn’t to buy the most expensive help available. It’s to make sure someone is in it with you.<\/p><figure class=\"ph\" data-slot=\"ch12-l06\"><\/figure><p>There are three reasons that helps, and only one of them is accountability.<\/p><p>The first is straightforward: someone expecting you to show up changes what you do. Even a single monthly check-in raised year-end success rates in one study.<sup class=\"fn\">⁴<\/sup><\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>The second is physiological, and we covered it in the last chapter. Your nervous system reads other people for safety. Doing this alongside someone calm is not just encouragement — it’s regulation.<\/p><\/div><\/aside><p>The third is the one nobody names. Working this out by yourself is genuinely hard. Deciding what to try, in what order, tracking whether it’s helping, second-guessing every result — that’s a real cognitive load, and it falls hardest on the person with the least capacity to carry it. Having someone say <em>start here, we’ll look at that in six weeks<\/em> removes a weight that has nothing to do with willpower.<\/p><p>That someone might be a friend doing it alongside you, a group, a good practitioner, or one person who checks in on Sundays. It matters far less than you’d think.<\/p>"}, {"t": "What healing actually looks like", "g": "", "k": "", "w": 207, "h": "<p>It won’t feel like the movie version.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The trend is what matters, and trends are only visible looking backwards — which is a good reason to write down where you’re starting from.<\/p><\/aside><p>It isn’t linear. You’ll have a good fortnight and then a bad week, and the bad week will feel like proof that nothing worked. It won’t be. The trend is what matters, and trends are only visible looking backwards — which is a good reason to write down where you’re starting from.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>It’s rarely dramatic. Almost nobody wakes up transformed. What actually happens is quieter: something knocks you sideways and you notice you recovered in two days instead of two weeks. Your window widened while you weren’t watching.<\/p><\/div><\/aside><p>And it takes longer than you want. Your nervous system spent years learning that the world isn’t safe, and it doesn’t unlearn that in a fortnight of deep breathing.<\/p><aside class=\"bx bx-personal\"><div class=\"bx-head\"><img class=\"bx-av\" alt=\"\"><span>From Jaime<\/span><\/div><div class=\"bx-body\"><p>Two years ago I was still in it. Today I love my life. I still have pain and fatigue and patterns I’m working on — I’m not cured, and I’m not going to pretend otherwise. But the distance between that woman gripping the steering wheel and the one writing this is not small, and it wasn’t one miraculous thing. It was a great many small things, done imperfectly, for a long time.<\/p><\/div><\/aside>"}, {"t": "When to get help now", "g": "", "k": "", "w": 141, "h": "<p>Some things shouldn’t wait for a plan.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>If you’re having thoughts of ending your life, tell someone today — a doctor, a crisis line, someone who loves you. That is not a failure of this approach; it’s an emergency, and it deserves emergency care.<\/p><\/div><\/aside><p>If you can’t function — not struggling, but genuinely unable to work or care for yourself or your children — you need more support than a book.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>If you’re on medication and want to change anything about it, that’s a conversation with your prescriber, never a decision you make alone.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>It usually means there’s a root you haven’t found yet, and finding it may need someone with testing and training.<\/p><\/aside><p>And if you’ve worked steadily at this for a few months with nothing shifting, that’s not a verdict on you. It usually means there’s a root you haven’t found yet, and finding it may need someone with testing and training.<\/p>"}, {"t": "The last thing", "g": "", "k": "", "w": 188, "h": "<p>You picked up this book because something was wrong and nobody could tell you what.<\/p><p>You now know that your exhaustion has a mechanism. That anxiety and shutdown are the same system doing the same job. That your gut, your hormones, your blood sugar, your history, and your loneliness are all feeding into how your mind feels. That the standard answers failed a great many people, and that wasn’t your fault either.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Most of all, I hope you know this: <strong>you were never broken.<\/strong><\/p><\/div><\/aside><p>You were shaped — by what happened to you, by what you had to become to belong, by a body doing its best with what it was given. Every symptom you’ve been carrying was your system protecting you as well as it knew how.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>And what was learned can be unlearned.<\/p><\/aside><p>That protection served its purpose. And what was learned can be unlearned. What was shaped can be reshaped. Your brain will keep changing for the rest of your life, in whichever direction you keep walking.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You do not have to earn your way back. You just have to start — small, imperfectly, and preferably not alone.<\/p><\/div><\/aside><p class=\"closing\">From survival, to safety.<\/p>"}, {"t": "The research", "g": "", "k": "refs", "w": 396, "h": "<ul class='refs'><li>Lally, P., van Jaarsveld, C. H. M., Potts, H. W. W., &amp; Wardle, J. (2010). How are habits formed: modelling habit formation in the real world. <em>European Journal of Social Psychology, 40<\/em>(6), 998–1009. <em>(96 participants forming new daily behaviours; median 66 days to reach automaticity, range 18–254 days. Missing a single day reduced automaticity by less than half a point, with rapid recovery. Roughly half of participants had not reached automaticity by day 84.)<\/em> See also Singh, B., et al. (2024), systematic review of 20 studies and 2,601 participants, finding durable habits typically consolidate over two to five months.<\/li><li>Norcross, J. C., &amp; Vangarelli, D. J. (1988–89), and subsequent follow-up work summarised in Oscarsson et al. (2020). <em>(Maintenance rates: 77% at one week, 55% at one month, 43% at three months, 40% at six months, 19% at two years.)<\/em><\/li><li>Norcross, J. C., Mrykalo, M. S., &amp; Blagys, M. D. (2002). Auld lang syne: success predictors, change processes, and self-reported outcomes of New Year’s resolvers and nonresolvers. <em>Journal of Clinical Psychology, 58<\/em>(4), 397–405. <em>(At six months, 46% success among those who made an explicit commitment versus 4% among comparable people who wanted the same change without formalising it.)<\/em><\/li><li>Oscarsson, M., Carlbring, P., Andersson, G., &amp; Rozental, A. (2020). A large-scale experiment on New Year’s resolutions: approach-oriented goals are more successful than avoidance-oriented goals. <em>PLOS ONE, 15<\/em>(12), e0234097. <em>(N = 1,066. Approach-oriented goals 58.9% success at one year versus 47.1% for avoidance-oriented. Participants receiving some support outperformed both unsupported and extensively supported groups; a monthly check-in raised year-end success from 56% to 62%.)<\/em><\/li><li>Cuijpers, P., Noma, H., Karyotaki, E., Cipriani, A., &amp; Furukawa, T. A. (2019). Effectiveness and acceptability of cognitive behavior therapy delivery formats in adults with depression: a network meta-analysis. <em>JAMA Psychiatry, 76<\/em>(7), 700–707. <em>(155 trials, approximately 11,000 participants; no significant differences between individual, group, telephone-delivered, and guided self-help formats.)<\/em><\/li><li>Cuijpers, P., Donker, T., Johansson, R., Mohr, D. C., van Straten, A., &amp; Andersson, G. (2011). Self-guided psychological treatment for depressive symptoms: a meta-analysis. <em>PLOS ONE, 6<\/em>(6), e21274. <em>(Overall effect size d = 0.28 for self-guided treatment versus control — small but genuine.)<\/em> See also Karyotaki, E., et al. (2017, 2021), finding unguided interventions effective but consistently less so than guided ones.<\/li><\/ul>"}]}, {"n": 14, "t": "Anxiety Is a Learning Problem", "s": "Why careful management makes it worse — and what actually retrains the alarm", "p": 3, "l": [{"t": "Opening", "g": "", "k": "", "w": 151, "h": "<p>You have been very careful.<\/p><p>You take the seat near the door. You check the route before you go. You bring someone with you, or you find a reason not to go at all. You carry the tablet in your bag whether or not you swallow it. You ask, one more time, whether it’s definitely fine — and the relief lasts about forty minutes before you need to ask again.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>None of that is weakness. Every one of those is an intelligent response to feeling unsafe, and every one of them works. That’s the problem.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>The world has quietly narrowed, one sensible precaution at a time, and you can’t work out why doing everything right has left you worse off.<\/p><\/aside><p>Because after years of managing your anxiety carefully, it hasn’t shrunk. It’s grown. The list of things you avoid is longer than it was. The world has quietly narrowed, one sensible precaution at a time, and you can’t work out why doing everything right has left you worse off.<\/p><p>Here’s why.<\/p>"}, {"t": "Relief and recovery point in opposite directions", "g": "", "k": "", "w": 191, "h": "<p>Your alarm system makes predictions. <em>If I go in there, something terrible will happen.<\/em> Then you take a precaution, nothing terrible happens, and you come home safe.<\/p><p>And your nervous system draws exactly the wrong conclusion. Not <em>the prediction was wrong.<\/em> Instead: <em>the prediction was right, and I survived because I was careful.<\/em><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The precaution gets the credit.<\/p><\/aside><p>The precaution gets the credit. The fear stays completely intact — reinforced, in fact, because now it has evidence. Do this a few hundred times over a few years and you have a system convinced that an enormous number of ordinary things are dangerous and that only constant vigilance is keeping you alive.<\/p><aside class=\"bx bx-define\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/><path d=\"M4 21V5M8 7h7\"/><\/svg><span>What it means<\/span><\/div><h4 class=\"bx-term\">safety behaviours<\/h4><div class=\"bx-body\"><p>Researchers call these precautions <strong>safety behaviours<\/strong>, and the research consistently implicates them in the <em>maintenance<\/em> of anxiety — not just as symptoms of it, but as part of what keeps it running.<sup class=\"fn\">¹<\/sup><\/p><\/div><\/aside><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>This is the single most important thing in this chapter, so let me say it plainly: <strong>the things that make anxiety feel better in the moment are, very often, the things preventing it from getting better.<\/strong> Not because you’ve been doing it wrong. Because nobody told you what the alarm actually learns from.<\/p><\/div><\/aside>"}, {"t": "You cannot talk it out of this", "g": "", "k": "", "w": 100, "h": "<p>Chapter 2 described what happens when the alarm fires — the thinking brain gets turned down, on purpose, because in an emergency you need to react rather than reflect.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>So reasoning with anxiety fails, reliably.<\/p><\/aside><p>So reasoning with anxiety fails, reliably. You already know the plane is statistically safe. You know your heart isn’t stopping. You’ve read the statistics, possibly many times, and none of it touches the feeling, because the part of you that processes statistics is not the part sounding the alarm.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>The alarm doesn’t learn from arguments. It learns from experience — and specifically, as we’ll come to, from being <em>surprised.<\/em><\/p><\/div><\/aside>"}, {"t": "Why your alarm is set so high", "g": "", "k": "", "w": 327, "h": "<p>Before the physical drivers, a question this chapter should answer rather than skip: why does your alarm fire at things other people walk past?<\/p><p>Some of it is inborn. Chapter 3 described temperament being present from the very start, and some nervous systems arrive more reactive than others. That isn’t a fault and you didn’t choose it.<\/p><figure class=\"ph\" data-slot=\"ch14-l04\"><\/figure><p>The rest was learned, mostly early. A child works out what keeps them safe and acceptable, and then keeps doing it. If what kept you safe was reading the room, anticipating moods, getting things right, or being no trouble, then you have spent decades running a threat-detection system trained on other people’s faces — and it became very good at its job.<\/p><p>Which is why anxiety takes such different shapes in different people:<\/p><p><strong>If mistakes used to cost you something<\/strong>, you get perfectionism, and a body that treats an unfinished task as danger.<\/p><p><strong>If other people’s moods were your responsibility<\/strong>, you get the scanning, the over-apologising, and the bracing when someone goes quiet.<\/p><p><strong>If needing things made you a burden<\/strong>, you get the anxiety that arrives whenever you have to ask for something.<\/p><p><strong>And if things happened that you couldn’t predict or stop<\/strong>, you get the need to control whatever can be controlled — which works until it doesn’t.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>It’s an accurate solution to the world you were actually in, still running in a world you have since left.<\/p><\/aside><p>None of that is neurosis. It’s an accurate solution to the world you were actually in, still running in a world you have since left. Chapter 3 covers where it came from, Chapter 8 covers settling the system that carries it, and the exposure work later in this chapter is how you teach it that the old rules no longer apply.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>It also explains something about the physical drivers below. A system already braced has less room to absorb a blood sugar crash or a bad night — so the same physiology another person barely registers can tip you into something that feels like catastrophe.<\/p><\/div><\/aside>"}, {"t": "The things that feel exactly like this", "g": "", "k": "", "w": 454, "h": "<p>Before any of that, though, there’s a question worth asking: is this anxiety at all?<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Several ordinary physical states produce them precisely, and if one of those is driving you, no amount of psychological work will resolve it.<\/p><\/aside><p>Because a racing heart, shakiness, a tight chest, sudden dread and difficulty concentrating are not exclusively psychological events. Several ordinary physical states produce them precisely, and if one of those is driving you, no amount of psychological work will resolve it. Chapter 7 covers each of these in full; here’s what they look like when anxiety is the presenting complaint.<\/p><figure class=\"ph\" data-slot=\"ch14-l05\"><\/figure><div class=\"points\"><div class=\"point\"><h4>Blood sugar.<\/h4><p>When glucose falls, your body treats it as an emergency and releases adrenaline and cortisol to correct it. That release <em>is<\/em> the racing heart, the shaking, the irritability, the sudden inexplicable dread. If your anxiety arrives a few hours after eating and lifts once you eat again, that’s not a coincidence and it isn’t really anxiety. It’s your kitchen.<\/p><\/div><div class=\"point\"><h4>Thyroid, read the other way.<\/h4><p>Chapter 7 looked at a thyroid running slow, which mimics depression. Running fast does the opposite: racing heart, tremor, heat intolerance, weight loss, insomnia and a persistent wired feeling. An overactive thyroid is routinely mistaken for an anxiety disorder, sometimes for years.<\/p><\/div><div class=\"point\"><h4>Hormones in your forties.<\/h4><p>Chapter 7 covered perimenopause as a driver of low mood. The anxiety version is even more commonly missed: newly anxious, sleeping badly, more emotionally reactive than you have ever been, in your mid-forties, with no life event to explain it. Progesterone supports the brain’s main calming system, and as it declines and destabilises, anxiety and insomnia tend to arrive together.<\/p><\/div><\/div><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>17%<\/b><span>higher after a single course of penicillin and 44% higher after more than five<\/span><\/div><div class=\"bx-body\"><p><strong>Your gut, and recent antibiotics.<\/strong> Chapter 6 covered how a disrupted gut sends inflammatory signals the brain reads as danger. There’s a specific version of this. In a large primary-care study, antibiotic exposure was associated with a raised risk of later anxiety, and the risk climbed with the number of courses — around 17% higher after a single course of penicillin and 44% higher after more than five.<sup class=\"fn\">²<\/sup> Depression followed the same dose-response, and there was no increase in psychosis risk with any antibiotic class.<\/p><p>This is observational, and people who need repeated antibiotics differ from people who don’t in ways no statistical adjustment fully removes. But the suspected mechanism is straightforward — antibiotics disturb the gut microbiome, and that disturbance can persist long after the tablets stop. If your anxiety arrived or worsened after a period of repeated infections and treatment, that’s a sequence worth mentioning to your doctor rather than dismissing.<\/p><\/div><\/aside><p><strong>Caffeine, alcohol and sleep debt<\/strong> each deserve their own treatment, and they get it below — they’re not just aggravators here, they’re often the main event.<\/p><p>If several of those sound like you, start there. The rest of this chapter will work far better on a body that isn’t manufacturing the sensations.<\/p>"}, {"t": "What actually helps", "g": "What actually helps", "k": "", "w": 123, "h": "<p>Same as the last chapter: this is a menu, not a to-do list, and <strong>you are not meant to do all of it.<\/strong> Where evidence is strong I say so; where it’s thin I say that too.<\/p><p>One structural note before you start. Everything in this chapter falls into two categories, and it matters enormously that you can tell them apart:<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>This is the only category that changes the underlying prediction.<\/p><\/aside><ul>\n<li><strong>Things that turn the volume down<\/strong> — breathing, magnesium, sleep, cutting caffeine. These make anxiety more bearable.<\/li>\n<li><strong>Things that retrain the alarm<\/strong> — exposure. This is the only category that changes the underlying prediction.<\/li>\n<\/ul><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You need both. But if you only do the first kind, you will feel better and stay stuck — which may be exactly what has already happened to you.<\/p><\/div><\/aside>"}, {"t": "Start here — three things", "g": "What actually helps", "k": "start", "w": 159, "h": "<p><strong class=\"steplead\">1. Cyclic sighing, five minutes a day.<\/strong> Two inhales through the nose — a full one, then a short second one on top — followed by a long, slow exhale through the mouth. Repeat for five minutes.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>110 adults<\/b><span>practised five minutes daily of a breathing exercise or mindfulness meditation for a month<\/span><\/div><div class=\"bx-body\"><p>In a randomised trial, around 110 adults practised five minutes daily of a breathing exercise or mindfulness meditation for a month. Cyclic sighing came out best for mood and produced the biggest drop in resting breathing rate.<sup class=\"fn\">³<\/sup><\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Five minutes, free, no equipment, works in a car park or a bathroom or halfway through a meeting.<\/p><\/aside><p>Five minutes, free, no equipment, works in a car park or a bathroom or halfway through a meeting.<\/p><p><strong class=\"steplead\">2. Audit your caffeine — but don’t panic about one coffee.<\/strong> This deserves more nuance than it usually gets, and the numbers are striking in both directions. See below.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Protein at breakfast.<\/h4><div class=\"bx-body\"><p><strong class=\"steplead\">3. Protein at breakfast.<\/strong> If your mornings are coffee and something sweet, you are launching the adrenaline cycle described above before 9am. This is the single easiest physical change in the chapter and some people notice within a week.<\/p><\/div><\/aside>"}, {"t": "The thing that actually changes it", "g": "What actually helps", "k": "", "w": 438, "h": "<p>Everything above lowers the volume. This is the part that turns the alarm off.<\/p><p><strong>Exposure<\/strong> — deliberately, deliberately approaching the thing you’ve been avoiding — is the first-line treatment for anxiety disorders according to international clinical guidelines.<sup class=\"fn\">⁴<\/sup> It is the most effective psychological intervention in the entire field. And almost nobody who hasn’t been through a clinic has been taught how it actually works.<\/p><figure class=\"ph\" data-slot=\"ch14-l08\"><\/figure><p>Here’s the part that has changed, and it changes everything about how you’d do it.<\/p><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"><\/path><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p><strong>The old understanding was habituation:<\/strong> stay in the feared situation until your anxiety comes down, and eventually it stops firing. That’s the version in most self-help books, and it’s why so many people conclude exposure doesn’t work for them — they wait to feel calm, don’t, and leave.<\/p><p><strong>The current understanding is inhibitory learning:<\/strong> what rewires the alarm is <em>discovering that your prediction was wrong.<\/em> The greater the gap between what you expected and what happened — the greater the surprise — the more learning occurs.<sup class=\"fn\">⁵<\/sup><\/p><\/div><\/aside><p>Sit with that, because it reverses the instruction.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You are not there to feel calmer. You are there to find out what actually happens.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>Which means you can leave a situation still shaking and have learned something enormous, if what you predicted didn’t come true.<\/p><\/aside><p>Which means you can leave a situation still shaking and have learned something enormous, if what you predicted didn’t come true. And you can sit somewhere for two hours feeling perfectly fine and learn nothing at all, if you spent the whole time gripping a precaution.<\/p><h3 id=\"how-to-do-it\">How to do it<\/h3><div class=\"points\"><div class=\"point\"><h4>Name the prediction first, specifically.<\/h4><p>Not “I’ll feel anxious” — you will, that’s not a prediction, that’s a certainty. Something falsifiable: <em>I will faint. I’ll have to leave within five minutes. They’ll be able to tell. I’ll lose control.<\/em><\/p><\/div><div class=\"point\"><h4>Go and find out.<\/h4><p>Start with something difficult but possible — not the worst thing on your list. Difficulty is the point; impossibility isn’t.<\/p><\/div><\/div><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"><\/path><path d=\"M12 8v6M9 11h6\"><\/path><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Drop the safety behaviours.<\/h4><div class=\"bx-body\"><p><strong>Drop the safety behaviours.<\/strong> This is the step everyone skips and it’s the one that determines whether any of it works. If you go in holding the precaution, your alarm can still credit the precaution. The surprise never lands.<\/p><\/div><\/aside><div class=\"points\"><div class=\"point\"><h4>Afterwards, check the prediction against what happened.<\/h4><p>Out loud or on paper. <em>I predicted I’d faint. I didn’t faint.<\/em> This step feels childish and it’s doing the actual work — you are handing your nervous system evidence in a form it can use.<\/p><\/div><div class=\"point\"><h4>Repeat, in different places.<\/h4><p>Learning in one context doesn’t automatically transfer to others. The car park where it went fine doesn’t teach your brain about the supermarket.<\/p><\/div><\/div><p>You don’t have to drop all of them at once. Fade them as you’re able — the point is that they go, not that they go today.<sup class=\"fn\">¹<\/sup><\/p>"}, {"t": "If your fear is your own body", "g": "What actually helps", "k": "", "w": 176, "h": "<p>There’s a specific version of this for panic, and it’s almost unknown outside clinics.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>And you can’t avoid your body, and that is what makes panic feel inescapable.<\/p><\/aside><p>If what frightens you is the sensations themselves — the pounding heart, the breathlessness, the dizziness, the unreality — then the feared thing isn’t a place. It’s your body. And you can’t avoid your body, and that is what makes panic feel inescapable.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Interoceptive exposure<\/h4><div class=\"bx-body\"><p><strong>Interoceptive exposure<\/strong> means deliberately producing those sensations so your alarm can learn they’re survivable. Spinning in a chair for dizziness. Breathing through a thin straw for air hunger. Running up stairs for a pounding heart. Holding your breath. Staring at a light and then reading, for visual strangeness.<\/p><\/div><\/aside><p>It sounds perverse and it is one of the more powerful things in this chapter, because it targets the prediction directly: <em>this sensation means something catastrophic is starting.<\/em> Producing it on purpose, repeatedly, and having nothing catastrophic happen is exactly the surprise the system needs.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4M12 17.5v.5\"/><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>Do this with a clinician if you can, and check with a doctor first if you have a heart or lung condition.<\/p><\/div><\/aside>"}, {"t": "What to stop doing", "g": "What actually helps", "k": "", "w": 210, "h": "<p>These are the safety behaviours in their most common forms. Each one works. That’s the problem.<\/p><p><strong>Reassurance-seeking.<\/strong> Asking whether it’s definitely fine. The relief is real and it lasts about as long as it takes to think of the next scenario. Every time you ask, you teach your brain that the question was worth asking and that you can’t settle it yourself. If you live with someone, they can help by warmly declining to answer the fourth time — <em>I love you, and I’m not going to answer that one again.<\/em><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Checking converts a manageable doubt into a permanent job.<\/p><\/aside><div class=\"points\"><div class=\"point\"><h4>Checking.<\/h4><p>The lock, the pulse, the lump, the email you already sent. Checking converts a manageable doubt into a permanent job.<\/p><\/div><div class=\"point\"><h4>Googling symptoms.<\/h4><p>A specialised form of checking with a search engine optimised to show you the worst possibilities. It has never once resolved health anxiety and reliably escalates it.<\/p><\/div><div class=\"point\"><h4>Avoidance in its socially acceptable forms.<\/h4><p>Cancelling with a good reason. Being too busy. Arriving late so there’s no time to talk. Only going with a specific person. These count, and they’re harder to spot precisely because they look like ordinary life.<\/p><\/div><\/div><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">Pick one.<\/h4><div class=\"bx-body\"><p>You don’t have to stop all of these at once. Pick one. The one you’d least like to give up is usually the one doing the most damage.<\/p><\/div><\/aside>"}, {"t": "Sleep comes first", "g": "What actually helps", "k": "", "w": 232, "h": "<p>If you take only one physical intervention from this chapter, this is a strong candidate.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>around 30%<\/b><span>After the sleepless night, anxiety rose by<\/span><\/div><div class=\"bx-body\"><p>Researchers scanned 18 adults after a normal night’s sleep and again after a night without sleep. After the sleepless night, anxiety rose by around <strong class=\"num\">30%.<\/strong> The scans showed the medial prefrontal cortex — the region that regulates emotional response — had effectively shut down, while the deeper emotional centres were overactive.<sup class=\"fn\">⁶<\/sup><\/p><\/div><\/aside><p>That should sound familiar. It’s the same mechanism Chapter 2 described when the alarm fires: the thinking brain goes offline and the emotional brain takes over. <strong>Sleep loss produces that state directly, without any threat being present.<\/strong><\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The researchers describe it as a natural anxiolytic, provided you get it nightly.<\/p><\/aside><p>The other half of the finding is the hopeful one. After a full night’s sleep, anxiety dropped significantly — and it dropped most in the people who got the most <strong>deep, slow-wave NREM sleep<\/strong>. Deep sleep restored the prefrontal regulation. The researchers describe it as a natural anxiolytic, provided you get it nightly.<\/p><p>The study also found that ordinary, unremarkable night-to-night variation in sleep across a population predicted day-to-day changes in anxiety. Not clinical insomnia — normal bad nights.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">What to do with this<\/h4><div class=\"bx-body\"><p><strong>What to do with this:<\/strong> protect deep sleep specifically. That means alcohol (which suppresses it), a consistent wake time, morning light, and a cool dark room. Chapter 9 has the full picture. For anxiety, treat sleep as a first-line intervention rather than an afterthought.<\/p><\/div><\/aside>"}, {"t": "Coffee, and how much is too much", "g": "What actually helps", "k": "", "w": 235, "h": "<p>The evidence here is more interesting than the standard advice.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"/><path d=\"M7.5 15h9\"/><\/svg><span>The research<\/span><\/div><div class=\"bx-stat\"><b>51%<\/b><span>had a panic attack after caffeine and none after placebo<\/span><\/div><div class=\"bx-body\"><p><strong>At high doses, caffeine reliably provokes panic.<\/strong> Across nine studies of 237 people with panic disorder, <strong>51% had a panic attack after caffeine and none after placebo.<\/strong> Comparing patients directly with healthy controls: <strong class=\"num\">53.9% versus 1.7%.<\/strong><sup class=\"fn\">⁷<\/sup> Caffeine is used as a laboratory panic trigger precisely because it works so consistently.<\/p><\/div><\/aside><aside class=\"margin-quote\"><span>Key idea<\/span><p>But those studies used 400–750 mg — four to seven cups of coffee.<\/p><\/aside><p><strong>But those studies used 400–750 mg<\/strong> — four to seven cups of coffee.<\/p><p><strong>At an ordinary dose, a recent trial found nothing.<\/strong> Researchers gave <strong class=\"num\">150 mg<\/strong> — about a cup and a half — to 29 people with panic disorder and 53 controls, expecting anxiety to rise. It didn’t. Subjective anxiety didn’t increase, and there was a single panic attack across the whole study.<sup class=\"fn\">⁸<\/sup><\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><div class=\"bx-body\"><p>So the advice isn’t “never drink coffee.” It’s this: if you have panic attacks and you’re drinking four or more cups a day, that is a real and highly testable target. One morning coffee may be entirely fine for you. Try cutting down rather than cutting out, and find out which you are.<\/p><\/div><\/aside><p>One more finding. In a caffeine challenge, <strong>40.7% of healthy first-degree relatives of panic patients had a panic attack, versus none of the unrelated controls.<\/strong><sup class=\"fn\">⁷<\/sup> The sensitivity appears to run in families. If caffeine has always hit you harder than it hits your friends, that’s probably real.<\/p>"}, {"t": "Why tomorrow is always worse", "g": "What actually helps", "k": "", "w": 112, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Alcohol is the most common self-medication for anxiety, and it works beautifully for about four hours.<\/p><\/aside><p>Alcohol is the most common self-medication for anxiety, and it works beautifully for about four hours.<\/p><p>Then your nervous system, having been artificially sedated, compensates by swinging in the other direction. The rebound arrives in the early hours or the next morning as heightened anxiety, a racing heart, and a sense of dread often disproportionate to how much you drank. Alcohol also specifically suppresses deep sleep — the exact stage the research above identifies as anxiety-protective.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>Which sets up a loop: drink to manage anxiety, sleep badly, wake more anxious, drink again. If you recognise it, the drinking is not a moral failure. It’s the most available tool you had.<\/p><\/div><\/aside>"}, {"t": "What makes it worse", "g": "What actually helps", "k": "worse", "w": 262, "h": "<p>The behavioural maintainers are above — avoidance, checking, reassurance-seeking. These are the physical ones, and they matter because they’re the difference between a system that’s stretched and one that’s overwhelmed by an ordinary Tuesday.<\/p><p><strong>Caffeine and alcohol<\/strong> have their own sections above, because for anxiety they’re often not aggravators but the main event.<\/p><p><strong>Sleep debt<\/strong>, per the research above — a 30% rise in anxiety after one bad night, and the regulatory part of your brain going offline. This is the biggest single lever on this page.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>A body that never discharges anything stays braced.<\/p><\/aside><p><strong>Sitting still.<\/strong> The inverse of the movement finding below. A body that never discharges anything stays braced.<\/p><p><strong>Blood sugar swings<\/strong>, which manufacture the sensations directly.<\/p><div class=\"points\"><div class=\"point\"><h4>Scrolling, particularly in bed and particularly the endless kind.<\/h4><p>Randomised trials in which people cut down their social media use found reductions in depressive symptoms, so this isn’t only correlation.<sup class=\"fn\">⁹<\/sup> For anxiety specifically the mechanism is more obvious than any statistic: an infinite feed of things to be alarmed about, delivered to a nervous system whose entire problem is scanning for threat. And it displaces the sleep that would otherwise be protecting you. Cutting down beats cutting out — the evidence doesn’t support zero, and an all-or-nothing rule is one you’ll break by Thursday.<\/p><\/div><div class=\"point\"><h4>Chronic stress with no recovery.<\/h4><p>Chapter 2 explained why: sustained stress hormones impair the prefrontal region that would otherwise regulate the alarm. A system never allowed to stand down loses its own brake.<\/p><\/div><\/div><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>None of this is a list of things you’re doing wrong. It’s a list of what your system is currently sensitive to — and each one is adjustable.<\/p><\/div><\/aside>"}, {"t": "Moving helps, less than you’d hope", "g": "What actually helps", "k": "", "w": 130, "h": "<p>Chapter 13’s numbers don’t transfer, so here are the anxiety ones.<\/p><p>Aerobic exercise for diagnosed anxiety disorders produces a <strong>moderate effect<\/strong> across trials.<sup class=\"fn\">¹⁰<\/sup> Resistance training produces a <strong>small-to-moderate<\/strong> one, larger in otherwise healthy people than in people who are unwell.<sup class=\"fn\">¹¹<\/sup> In older adults, the effect is moderate.<sup class=\"fn\">¹²<\/sup> Single sessions produce small, short-lived effects.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>That’s a real benefit and a smaller one than exercise delivers for depression.<\/p><\/aside><p>That’s a real benefit and a smaller one than exercise delivers for depression. Do it — and if it doesn’t dissolve your anxiety, that isn’t a failure on your part. It was never going to be the whole answer here.<\/p><aside class=\"bx bx-try\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z\"/><path d=\"M12 8v6M9 11h6\"/><\/svg><span>Try this<\/span><\/div><h4 class=\"bx-title\">One specific tip<\/h4><div class=\"bx-body\"><p>One specific tip: for people whose anxiety is body-focused, exercise doubles as informal interoceptive exposure. You get your heart pounding on purpose and nothing bad happens.<\/p><\/div><\/aside>"}, {"t": "Supplements, strongest evidence first", "g": "What actually helps", "k": "", "w": 869, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>And note again that the biggest claims cluster near the bottom.<\/p><\/aside><p>Same rule as the last chapter — ordered by strength of evidence, so if you try two or three, take them from the top. And note again that the biggest claims cluster near the bottom.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>1,213 patients<\/b><span>Significantly better than placebo on clinician-rated anxiety.<\/span><\/div><div class=\"bx-body\"><p><strong class=\"steplead\">1. Lavender oil preparation (Silexan), 80 mg daily.<\/strong> The best-evidenced supplement for anxiety by a clear margin. Five double-blind randomised placebo-controlled trials, <strong class=\"num\">1,213 patients<\/strong>, covering generalised anxiety disorder, subthreshold anxiety, and mixed anxiety-depression. Significantly better than placebo on clinician-rated anxiety.<sup class=\"fn\">¹³<\/sup><\/p><\/div><\/aside><p>In one 539-patient trial that included an active comparator, Hamilton anxiety scores fell <strong>14.1 points on Silexan 160 mg, 12.8 on Silexan 80 mg, 11.3 on paroxetine, and 9.5 on placebo.<\/strong><sup class=\"fn\">¹⁴<\/sup> It numerically outperformed the antidepressant, though the trial wasn’t designed to test that formally. Side effects were comparable to placebo, with no sedation and no dependence.<\/p><figure class=\"ph\" data-slot=\"ch14-l16\"><\/figure><p><strong>The caveat you need:<\/strong> every one of those trials was initiated by the manufacturer and conducted in Germany. That’s the same pattern as saffron in the last chapter, and the authors state it themselves. It doesn’t erase the result — the trials are well designed and the sample is large — but independent replication elsewhere would settle it.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>31 randomised trials<\/b><span>found a modest reduction in acute stress<\/span><\/div><div class=\"bx-body\"><p><strong class=\"steplead\">2. L-theanine, 200–400 mg.<\/strong> An amino acid from green tea. A recent meta-analysis of <strong class=\"num\">31 randomised trials, 1,168 people<\/strong>, found a modest reduction in acute stress (<strong class=\"num\">SMD 0.31<\/strong>) and improved attention.<sup class=\"fn\">¹⁵<\/sup> A four-week trial also improved sleep quality and sleep latency.<\/p><\/div><\/aside><p>In practice: most trials are in healthy adults under stress rather than people with diagnosed anxiety disorders, and much of the research involves manufacturers of the ingredient. It’s useful for situational stress — before a presentation, in the evening — and it doesn’t sedate. It isn’t a treatment for an anxiety disorder.<\/p><p><strong class=\"steplead\">3. Magnesium, 250–500 mg glycinate in the evening.<\/strong> The evidence I can point to is stronger for depression than for anxiety, and I’d rather say that than imply otherwise. The mechanism is plausible — magnesium dampens the brain’s main excitatory system — and it reliably helps sleep, which by the research above is doing real anxiety work regardless.<\/p><p>On <strong>magnesium threonate<\/strong>: it’s marketed on brain penetration, the supporting research is largely animal and cognition-focused, and it’s a branded, licensed form at several times the price. Glycinate is the better-tolerated default.<\/p><p><strong class=\"steplead\">4. Probiotics.<\/strong> In diagnosed patients, the anxiety effect was <strong class=\"num\">moderate (around SMD −0.59)<\/strong> — noticeably smaller than the same reviews found for depression. Multi-strain, four to eight weeks, best as an addition rather than a replacement. Most worth trying if you have digestive symptoms alongside.<\/p><p><strong class=\"steplead\">5. Ashwagandha, 300–600 mg.<\/strong> Lowers cortisol — around a 28% reduction in the best-known trial, in chronically stressed adults rather than diagnosed anxiety patients. Cortisol is a biomarker, not a mood outcome, and the gap between the two matters.<\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 3l9.5 17h-19z\"><\/path><path d=\"M12 10v4M12 17.5v.5\"><\/path><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p>Use it for a few months rather than indefinitely; three months is about as long as anyone has studied it. Rarely it irritates the liver, including in healthy young people, so stop and see a doctor if your skin or eyes look yellow, your urine darkens, or you feel sick and sore under your right ribs. Don’t take it if you’re pregnant, and mention it before thyroid tests, because it can shift the results.<\/p><\/div><\/aside><p><strong class=\"steplead\">6. The calming herbs — passionflower, chamomile, lemon balm, valerian.<\/strong> A systematic review identified ten plant medicines with both laboratory evidence of acting on the GABA system and human trials behind them.<sup class=\"fn\">¹⁶<\/sup> The reviewers’ own conclusion is the right one to quote: the findings need tempering because of <strong>small sample sizes, brief interventions and lack of replication.<\/strong><\/p><p>They’re gentle, cheap and largely safe, and passionflower and chamomile have the most consistent signals. Treat them as mild and worth trying, not as alternatives to the things above.<\/p><p><strong>A note on kava:<\/strong> it has genuine trial evidence for anxiety, and it also has a documented history of severe liver injury that led several countries to restrict it. If you’re considering it, that’s a conversation with a doctor, not a decision from a book.<\/p><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>And two things to skip:<\/p><\/aside><aside class=\"bx bx-myth\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .8-1 1.5V14M12 17.5v.5\"><\/path><\/svg><span>What people think vs. what’s true<\/span><\/div><div class=\"bx-body\"><p><strong>Oral GABA supplements.<\/strong> The pitch is that taking GABA directly calms an overactive brain. The problem is that <strong>oral GABA doesn’t reliably get into the brain<\/strong> — the barrier that protects your brain largely excludes it, and the evidence for meaningful penetration is contradictory at best.<sup class=\"fn\">¹⁷<\/sup> Some people report benefit, possibly through the gut or peripheral nerves, and a few small trials show sleep effects. But it isn’t doing what the label implies.<\/p><\/div><\/aside><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 3l9.5 17h-19z\"><\/path><path d=\"M12 10v4M12 17.5v.5\"><\/path><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p><strong class=\"num\">High-dose vitamin B6.<\/strong> You’ll see this recommended because B6 really is required to convert the brain’s excitatory chemical into its calming one. That biochemistry is correct. What doesn’t follow is that extra B6 helps someone who isn’t short of it — and this one has a real ceiling: <strong>sustained high-dose B6 causes nerve damage<\/strong>, producing tingling, numbness and unsteadiness that isn’t always fully reversible. If you take a B-complex, check the B6 content, and don’t take standalone high-dose B6 without a reason and a doctor.<\/p><\/div><\/aside>"}, {"t": "What to ask to be tested for", "g": "What actually helps", "k": "tests", "w": 213, "h": "<p>Start with the panel in the last chapter — CRP, full thyroid, B12 with functional markers, full iron panel, HbA1c and fasting insulin, vitamin D. All of it applies. Three additions specific to anxiety:<\/p><div class=\"points\"><div class=\"point\"><h4>Read the thyroid panel for fast, not slow.<\/h4><p>In Chapter 13 we were looking for an underactive thyroid. Here, look for the opposite: a <strong>suppressed TSH<\/strong> with <strong class=\"num\">raised free T4 or free T3<\/strong>. Ask also for <strong>TRAb or thyroid-stimulating immunoglobulin<\/strong>, the antibodies of Graves’ disease, which is the most common cause of an overactive thyroid and produces textbook anxiety symptoms.<\/p><\/div><div class=\"point\"><h4>Blood sugar, read for lows.<\/h4><p>If your symptoms come a few hours after eating, ask about reactive hypoglycaemia. A continuous glucose monitor for a fortnight will often show the pattern more clearly than any single blood draw.<\/p><\/div><\/div><p><strong>If your history includes exposure<\/strong> — welding, smelting, firing ranges, pre-1978 renovation, well water, imported remedies — that’s worth raising, and Chapter 7 explains what to ask for and who does it. Not on any standard panel.<\/p><p><strong>If your main symptom is palpitations<\/strong>, mention it explicitly and ask whether a heart trace or a wearable monitor is worth doing. Most palpitations in anxious people are benign — and having that confirmed properly is worth a great deal, because “probably nothing” from a doctor who didn’t check tends to become one more thing to worry about.<\/p>"}, {"t": "Medication and therapy", "g": "What actually helps", "k": "", "w": 645, "h": "<aside class=\"margin-quote\"><span>Key idea<\/span><p>Therapy that includes exposure is the treatment with the strongest evidence here.<\/p><\/aside><p><strong>Therapy that includes exposure is the treatment with the strongest evidence here.<\/strong> If you’re choosing, ask specifically whether the therapist does exposure work. Not all talking therapy does, and for anxiety it’s the active ingredient.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"><\/path><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p><strong>SSRIs and SNRIs are first-line here<\/strong>, and they do not appear to interfere with exposure. If medication is helping you, this chapter is not an argument for stopping it.<\/p><\/div><\/aside><p><strong>Benzodiazepines deserve a longer answer<\/strong>, because they’re the most effective thing in this chapter for a bad hour and the most complicated thing in it over years.<\/p><figure class=\"ph\" data-slot=\"ch14-l18\"><\/figure><p>They work by boosting your brain’s main calming signal, which quietens activity broadly. That’s the point of them, and it’s why they work within twenty minutes when nothing else does. Used briefly — a flight, a scan, a funeral, a crisis — they do a job nothing else does as well, and there’s no virtue in white-knuckling something a tablet would carry you through.<\/p><p><strong>The first concern is what they do to the learning.<\/strong> A systematic review of randomised trials found that at the end of treatment they mostly didn’t affect exposure outcomes; at follow-up, about half the studies showed reduced benefit and half showed none.<sup class=\"fn\">¹⁸<\/sup> The reviewers concluded there’s no definitive evidence of harm — but the mechanism gives real reason for caution, because benzodiazepines interfere with forming and retaining new memories, and forming a new memory is precisely what exposure is.<\/p><p>The practical version isn’t “benzodiazepines are bad.” It’s: <strong>watch what your brain gives the credit to.<\/strong> If the lesson your nervous system takes is <em>I was safe because I took it<\/em>, rather than <em>the thing I feared didn’t happen<\/em>, the learning hasn’t landed. And that applies just as much to the tablet you carry everywhere and never actually swallow.<\/p><p><strong>The second concern is what years of them do.<\/strong> Chapter 4 described the rule your brain runs on: the circuits you use get stronger, and the ones you don’t get pruned back. Use it or lose it — that’s why recovery is possible at all, and it’s a fair reason to think carefully about anything that dampens brain activity for years rather than weeks.<\/p><p>What’s clearly established is this. Long-term users show measurable impairments in memory, processing speed and attention.<sup class=\"fn\">¹⁹<\/sup> Much of that recovers after stopping — but meta-analyses find some of it doesn’t fully return, with deficits still present in working memory, processing speed and divided attention around a year after successful withdrawal.<sup class=\"fn\">²⁰<\/sup> And the receptors themselves adapt: with sustained use they become fewer and less responsive — so the same dose gradually stops working, and why coming off is so much harder than getting on.<\/p><aside class=\"bx bx-research\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><span>The research<\/span><\/div><div class=\"bx-stat long\"><b>close to ten years<\/b><span>the average patient had been taking them for<\/span><\/div><div class=\"bx-body\"><p>These medications are labelled for two to four weeks of use. In one review, the average patient had been taking them for close to ten years, and some for over thirty.<sup class=\"fn\">¹⁹<\/sup><\/p><\/div><\/aside><p>You may also come across claims linking benzodiazepines to dementia. That one is unsettled: careful studies disagree with each other, and the confound is severe — anxiety and disturbed sleep are themselves early signs of dementia, which makes it very hard to tell whether the drug contributed or was prescribed for the earliest symptoms.<sup class=\"fn\">²¹<\/sup><\/p><aside class=\"bx bx-warning\"><div class=\"bx-head\"><svg aria-hidden=\"true\" class=\"bx-ic\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewbox=\"0 0 24 24\"><path d=\"M12 3l9.5 17h-19z\"><\/path><path d=\"M12 10v4M12 17.5v.5\"><\/path><\/svg><span>Important<\/span><\/div><div class=\"bx-body\"><p><strong>And the most important sentence on this page: never stop a benzodiazepine abruptly.<\/strong><\/p><p>Stopping suddenly after regular use can cause seizures, and is dangerous in a way that stopping most medications simply is not. If you want off them — and if you’ve been on them for years, that may well be the right goal — that is a slow, planned taper with your prescriber, often over many months. Please do not act on this section by yourself. Take it to an appointment instead.<\/p><p>Any change to medication is a conversation with your prescriber, never a decision you make alone.<\/p><\/div><\/aside>"}, {"t": "One thing to be careful about", "g": "What actually helps", "k": "", "w": 162, "h": "<p>Chapter 8 taught you to regulate your nervous system — breathing, grounding, somatic practices. Everything there is real and this chapter doesn’t undo it.<\/p><p>But there’s a trap, and it’s worth naming clearly, because it catches thoughtful people who are doing everything right.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>The same practice can do opposite jobs depending on why you’re doing it.<\/p><\/aside><aside class=\"callout key\"><span class=\"callout-label\">Key point<\/span><p>The same practice can do opposite jobs depending on why you’re doing it.<\/p><\/aside><p>Breathing to widen your capacity — in the morning, at the end of a hard day, as a daily practice — builds the window Chapter 2 described. That’s regulation, and it helps.<\/p><p>Breathing to make the anxiety go away <em>so that you can enter a situation<\/em> is a safety behaviour. Your alarm learns: <em>I got through that because I did the breathing.<\/em> The prediction survives untouched. The technique has quietly joined the list with the exit seat and the tablet in your bag.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>The test is simple. Ask yourself: <strong>am I doing this to steady myself, or to escape?<\/strong> Same breath, entirely different lesson.<\/p><\/div><\/aside>"}, {"t": "This was never carefulness gone wrong", "g": "What actually helps", "k": "", "w": 186, "h": "<p>If you’ve recognised yourself in this chapter, hear this properly.<\/p><p>Everything you did made sense. A system that believes it’s in danger and finds a way to feel safer is doing exactly what it evolved to do. The avoiding, the checking, the asking, the planning — those weren’t neurotic. They were competent responses to a false alarm, and they worked every single time, which is the whole reason you kept doing them.<\/p><aside class=\"margin-quote\"><span>Key idea<\/span><p>Nobody told you the alarm was learning the wrong lesson from your success.<\/p><\/aside><p>Nobody told you the alarm was learning the wrong lesson from your success. That isn’t something you could have worked out from inside it.<\/p><p>And here’s what the research actually offers: this is a <strong>learning problem<\/strong>, which means it is a <em>solvable<\/em> problem. Your alarm learned this, in ordinary ways, through ordinary experience. It can learn something else the same way. Not by arguing with it. Not by feeling calm enough first. By going and finding out what actually happens, one prediction at a time.<\/p><aside class=\"bx bx-insight\"><div class=\"bx-head\"><svg class=\"bx-ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg><span>Key point<\/span><\/div><div class=\"bx-body\"><p>You’ve spent years proving to yourself that you can survive things carefully.<\/p><p class=\"closing\">The work now is finding out that you can survive them anyway.<\/p><\/div><\/aside>"}, {"t": "The research", "g": "What actually helps", "k": "refs", "w": 1705, "h": "<ul class='refs'><li><p>Blakey, S. M., &amp; Abramowitz, J. S. (2016). The effects of safety behaviors during exposure therapy for anxiety: critical analysis from an inhibitory learning perspective. <em>Clinical Psychology Review, 49,<\/em> 1–15. <em>(Safety behaviours are consistently implicated in the development and maintenance of anxiety disorders and generally interfere with the learning exposure depends on. The review notes that findings on brief, judicious use during exposure are limited, mixed and controversial, and advises fading them as soon as the patient is willing.)<\/em><\/p><\/li><li><p>Lurie, I., Yang, Y.-X., Haynes, K., Mamtani, R., &amp; Boursi, B. (2015). Antibiotic exposure and the risk for depression, anxiety, or psychosis: a nested case-control study. <em>Journal of Clinical Psychiatry, 76<\/em>(11), 1522–1528. <em>(UK primary-care database. For anxiety, a single course of penicillin carried an adjusted odds ratio of 1.17, rising to 1.44 after more than five courses; depression showed the same dose-response, from 1.23 to 1.56. No increased risk of psychosis with any antibiotic class, and no dose-response for antifungals — both of which argue against the association being purely an artefact of being unwell. Adjusted for obesity, smoking, alcohol, socioeconomic status and number of prior infections. Observational: people prescribed more antibiotics differ from those prescribed fewer in ways no adjustment fully captures. A 2022 systematic review in the Journal of Psychosomatic Research pooled nine such studies, finding risk raised by at least 20% with a dose-response pattern persisting for years, while describing the underlying studies as relatively low quality.)<\/em><\/p><\/li><li><p>Balban, M. Y., Neri, E., Kogon, M. M., et al. (2023). Brief structured respiration practices enhance mood and reduce physiological arousal. <em>Cell Reports Medicine, 4<\/em>(1), 100895. <em>(Around 110 adults randomised to five minutes daily of cyclic sighing, box breathing, cyclic hyperventilation or mindfulness meditation for 28 days. Breathwork — especially cyclic sighing — improved mood and reduced respiratory rate more than meditation. Note: on state anxiety specifically the meditation group showed a slightly larger daily reduction, and no significant changes in heart rate variability or resting heart rate were found in any group. Healthy participants, not a clinical sample.)<\/em><\/p><\/li><li><p>Exposure-based interventions are identified as first-line treatment for anxiety disorders and PTSD by international clinical guidelines. See Abramowitz, J. S., Deacon, B. J., &amp; Whiteside, S. P. H. (2011). <em>Exposure Therapy for Anxiety: Principles and Practice.<\/em> New York: Guilford Press.<\/p><\/li><li><p>Craske, M. G., Treanor, M., Conway, C. C., Zbozinek, T., &amp; Vervliet, B. (2014). Maximizing exposure therapy: an inhibitory learning approach. <em>Behaviour Research and Therapy, 58,<\/em> 10–23. <em>(The inhibitory learning model: what drives change is violation of expectancy — the discrepancy between the predicted and actual outcome — rather than reduction of anxiety within a session. See also Baker et al. (2010) on the relationship between magnitude of expectancy violation and strength of learning.)<\/em><\/p><\/li><li><p>Ben Simon, E., Rossi, A., Harvey, A. G., &amp; Walker, M. P. (2020). Overanxious and underslept. <em>Nature Human Behaviour, 4,<\/em> 100–110. <em>(18 adults scanned after normal sleep and after a night of sleep deprivation; anxiety rose approximately 30% after sleep loss, with reduced medial prefrontal activity and overactive limbic regions. Deep NREM slow-wave sleep predicted the greatest overnight reduction in anxiety. Modest night-to-night sleep reductions across a wider sample predicted day-to-day anxiety changes. Small imaging sample.)<\/em><\/p><\/li><li><p>Klevebrant, L., &amp; Frick, A. (2022). Effects of caffeine on anxiety and panic attacks in patients with panic disorder: a systematic review and meta-analysis. <em>General Hospital Psychiatry, 74,<\/em> 22–31. <em>(Nine studies, 237 patients: 51.1% experienced a panic attack after caffeine and none after placebo; across six studies comparing patients with controls, 53.9% versus 1.7%. Doses used were 400–750 mg — well above ordinary consumption. Related challenge studies found around 40% of healthy first-degree relatives of patients also panicked, versus none of the unrelated controls.)<\/em><\/p><\/li><li><p>Hoppe, J. M., Björkstrand, J., Vegelius, J., et al. (2025). Acute effects of 150 mg caffeine on subjective, physiological, and behavioral components of anxiety in panic disorder and healthy controls. <em>Journal of Psychopharmacology, 39<\/em>(8), 836–846. <em>(Contrary to the authors’ hypothesis, an ordinary dose did not increase subjective anxiety in panic disorder patients; one panic attack occurred. Skin conductance responses did increase. A negative finding, reported as such.)<\/em><\/p><\/li><li><p>Meta-analysis of randomised controlled trials of reducing social media use. <em>(Ten RCTs, N = 1,491; limiting or abstaining from social media significantly reduced depressive symptoms, g = 0.25, 95% CI 0.10–0.41 after adjustment for publication bias. Anxiety outcomes were less consistently reported across these trials; the reasoning applied here is partly mechanistic rather than directly evidenced for anxiety.)<\/em><\/p><\/li><li><p>Bartley, C. A., Hay, M., &amp; Bloch, M. H. (2013). Meta-analysis: aerobic exercise for the treatment of anxiety disorders. <em>Progress in Neuro-Psychopharmacology and Biological Psychiatry, 45,<\/em> 34–39. <em>(Seven trials, 407 participants; moderate effect. See also Stubbs et al. (2017), six RCTs, 262 adults, SMD −0.582.)<\/em><\/p><\/li><li><p>Gordon, B. R., McDowell, C. P., Lyons, M., &amp; Herring, M. P. (2017). The effects of resistance exercise training on anxiety: a meta-analysis and meta-regression analysis of randomized controlled trials. <em>Sports Medicine, 47<\/em>(12), 2521–2532. <em>(16 articles, 922 participants; Δ = 0.31 overall, with larger effects among healthy participants (0.50) than among those with a physical or mental illness (0.19).)<\/em><\/p><\/li><li><p>Meta-analysis of physical activity for anxiety symptoms in older adults. <em>(770 participants; SMD −0.60, 95% CI −0.88 to −0.32.)<\/em><\/p><\/li><li><p>Möller, H.-J., Volz, H.-P., Dienel, A., Schläfke, S., &amp; Kasper, S. (2019/2023). Efficacy of Silexan in patients with anxiety disorders: a meta-analysis of randomized, placebo-controlled trials. <em>European Archives of Psychiatry and Clinical Neuroscience.<\/em> <em>(Five double-blind randomised placebo-controlled trials, n = 1,213, across subthreshold anxiety, mixed anxiety-depressive disorder and generalised anxiety disorder; Silexan 80 mg/day significantly superior to placebo on the Hamilton Anxiety Rating Scale and on self-rated anxiety. The authors note as a limitation that all trials were initiated by the manufacturer and conducted in a single country.)<\/em><\/p><\/li><li><p>Kasper, S., Gastpar, M., Müller, W. E., et al. (2014). Lavender oil
