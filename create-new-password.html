<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Password | Mind-Body Functional Health</title>
    <link rel="icon" type="image/png" href="logos/favicon-mind-body.png" />
    <style>
        :root {
            --brand-dark: #34657a;
            --brand-accent: #c19a6b;
            --ink: #2c3e50;
            --muted: #61717e;
            --line: #d9e4ea;
            --bg: #f7fafb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Montserrat", "Segoe UI", sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at top right, #eef4f7 0%, var(--bg) 55%);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
        }

        .card {
            width: min(540px, 100%);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(52, 101, 122, 0.12);
            padding: 1.2rem;
        }

        h1 {
            margin: 0 0 0.4rem;
            font-family: "Cormorant Garamond", Georgia, serif;
            color: var(--brand-dark);
            font-size: 2rem;
        }

        p {
            margin: 0 0 0.8rem;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 0.55rem 0 0.3rem;
            font-size: 0.77rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--muted);
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.58rem 0.65rem;
            font-size: 0.92rem;
        }

        button {
            margin-top: 0.95rem;
            width: 100%;
            border: 1px solid var(--brand-dark);
            background: var(--brand-dark);
            color: #fff;
            border-radius: 8px;
            padding: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
        }

        .msg {
            margin-top: 0.8rem;
            font-size: 0.86rem;
            min-height: 1.05rem;
        }

        .success { color: #2b6f50; }
        .error { color: #b42318; }

        a {
            color: var(--brand-dark);
            text-decoration: none;
            font-size: 0.86rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create New Password</h1>
        <p id="emailMsg"></p>

        <label for="newPass">New Password</label>
        <input id="newPass" type="password" autocomplete="new-password" />

        <label for="confirmPass">Confirm New Password</label>
        <input id="confirmPass" type="password" autocomplete="new-password" />

        <button id="savePassBtn" type="button">Save New Password</button>
        <p id="status" class="msg"></p>
        <a href="account-info.html">Back to Account Info</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email') || 'your account email';
        document.getElementById('emailMsg').textContent = 'Creating a new password for: ' + email;

        document.getElementById('savePassBtn').addEventListener('click', () => {
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            const status = document.getElementById('status');

            if (p1.length < 8) {
                status.className = 'msg error';
                status.textContent = 'Password must be at least 8 characters.';
                return;
            }

            if (p1 !== p2) {
                status.className = 'msg error';
                status.textContent = 'Passwords do not match.';
                return;
            }

            // Test-mode persistence only (do not store real plaintext passwords in production).
            localStorage.setItem('mbfhPasswordUpdatedAt', new Date().toISOString());

            status.className = 'msg success';
            status.textContent = 'Password updated successfully. You can now sign in with your new password.';
        });
    </script>
</body>
</html>
