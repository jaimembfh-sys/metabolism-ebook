<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Password | Mind-Body Functional Health</title>
    <link rel="icon" type="image/png" href="logos/favicon-mind-body.png" />
    <link rel="stylesheet" href="styles/brand.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="scripts/a11y.js" defer></script>
    <style>
        :root {
            --ink: #1B2A2D;
            --muted: #56676A;
            --line: #D3DDDA;
            --bg: #EEF2F0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Figtree", "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .card {
            width: min(540px, calc(100% - 2rem));
            margin: 2.5rem auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(27, 42, 45, 0.05);
            padding: 1.5rem;
        }

        h1 {
            margin: 0 0 0.4rem;
            font-family: "Gloock", Georgia, serif;
            font-weight: 400;
            color: var(--brand-dark);
            font-size: 2rem;
        }

        p {
            margin: 0 0 0.8rem;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 0.55rem 0 0.3rem;
            font-size: 0.77rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--brand-dark);
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0.58rem 0.65rem;
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--ink);
        }

        input:focus { outline: 2px solid var(--brand-dark); }

        button {
            margin-top: 0.95rem;
            width: 100%;
            border: 1px solid #B9873A;
            background: #B9873A;
            color: #1A150C;
            border-radius: 6px;
            padding: 16px 26px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #A37630;
            border-color: #A37630;
            transform: translateY(-2px);
        }

        .msg {
            margin-top: 0.8rem;
            font-size: 0.86rem;
            min-height: 1.05rem;
        }

        .success { color: #2b6f50; }
        .error { color: #b42318; }

        a {
            color: var(--brand-dark);
            text-decoration: none;
            font-size: 0.86rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="mb-site-header">
        <div class="mb-site-header-inner">
            <span class="mb-site-brand"><img src="images/foundations/mbfh-mark.webp" alt="" width="42" height="42"><span><b>Mind Body</b><small>Functional Health</small></span></span>
        </div>
    </header>
    <div class="card">
        <h1>Create New Password</h1>
        <p id="emailMsg"></p>

        <label for="newPass">New Password</label>
        <input id="newPass" type="password" autocomplete="new-password" />

        <label for="confirmPass">Confirm New Password</label>
        <input id="confirmPass" type="password" autocomplete="new-password" />

        <button id="savePassBtn" type="button">Save New Password</button>
        <p id="status" class="msg"></p>
        <a href="account-info.html">Back to Account Info</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email') || 'your account email';
        document.getElementById('emailMsg').textContent = 'Creating a new password for: ' + email;

        document.getElementById('savePassBtn').addEventListener('click', () => {
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            const status = document.getElementById('status');

            if (p1.length < 8) {
                status.className = 'msg error';
                status.textContent = 'Password must be at least 8 characters.';
                return;
            }

            if (p1 !== p2) {
                status.className = 'msg error';
                status.textContent = 'Passwords do not match.';
                return;
            }

            // Test-mode persistence only (do not store real plaintext passwords in production).
            localStorage.setItem('mbfhPasswordUpdatedAt', new Date().toISOString());

            status.className = 'msg success';
            status.textContent = 'Password updated successfully. You can now sign in with your new password.';
        });
    </script>
</body>
</html>
